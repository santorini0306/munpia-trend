        // ==========================================
        // 2. 상태 관리 (LocalStorage)
        // ==========================================
        const STORAGE_KEY = 'munpia_trend_app_v1';

        let appState = {
            novels: [],
            tagPool: [],
            todayDate: '',
            todayIds: [],
            currentTab: 'today', // 'today' | 'vault' | 'archive' | 'data'
            expandedSynopsis: {},
            archiveFilters: {
                rating: 'ALL',
                flag: 'ALL',
                tag: 'ALL',
                search: ''
            },
            vaultTagFilter: 'ALL'
        };

        let activeModalNovelId = null;
        let confirmCallback = null;

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function loadState() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    appState.novels = parsed.novels || [];
                    appState.tagPool = parsed.tagPool || [];
                    appState.todayDate = parsed.todayDate || '';
                    appState.todayIds = parsed.todayIds || [];
                } catch (e) {
                    console.error('데이터 파싱 오류, 초기화 진행', e);
                    initDefaultState();
                }
            } else {
                initDefaultState();
            }

            // 날짜가 바뀌었거나 오늘의 추천 목록이 비어있으면 자동 생성
            const today = getTodayString();
            if (appState.todayDate !== today || !appState.todayIds || appState.todayIds.length === 0) {
                refreshTodayTen(true);
            }
            syncTagPool();
        }

        function initDefaultState() {
            appState.novels = JSON.parse(JSON.stringify(INITIAL_NOVELS));
            appState.tagPool = [];
            syncTagPool();
            refreshTodayTen(true);
        }

        function saveState() {
            const payload = {
                novels: appState.novels,
                tagPool: appState.tagPool,
                todayDate: appState.todayDate,
                todayIds: appState.todayIds
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            updateGlobalBadges();
        }

        function syncTagPool() {
            const set = new Set(appState.tagPool);
            appState.novels.forEach(n => {
                if (Array.isArray(n.tags)) {
                    n.tags.forEach(t => set.add(t.trim()));
                }
            });
            appState.tagPool = Array.from(set).filter(Boolean);
        }

        // 오늘의 10선 무작위 추출 (아직 별점을 주지 않은 작품 대상)
        function refreshTodayTen(silent = false) {
            const unrated = appState.novels.filter(n => !n.rating);
            // Fisher-Yates 셔플
            const shuffled = [...unrated];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            appState.todayIds = shuffled.slice(0, 10).map(n => n.id);
            appState.todayDate = getTodayString();
            saveState();
            if (!silent) {
                showToast(`미평가 작품 중 ${appState.todayIds.length}편을 새로 뽑았습니다!`);
                render();
            }
        }

        // ==========================================
        // 3. 사용자 액션 핸들러 (별점, 분류, 태그)
        // ==========================================
        const RATING_OPTIONS = [
            { value: 1, stars: '★', label: '1~5화 하차', short: '★ 1~5화' },
            { value: 2, stars: '★★', label: '6~10화 하차', short: '★★ 6~10화' },
            { value: 3, stars: '★★★', label: '11~15화 하차', short: '★★★ 11~15화' },
            { value: 4, stars: '★★★★', label: '16화 이상 정독', short: '★★★★ 정독' }
        ];

        const FLAG_OPTIONS = [
            { key: 'legend', label: '레전드 (작가뽕)', icon: 'crown', color: 'purple' },
            { key: 'supernormal', label: '슈퍼노멀 (일반연재)', icon: 'zap', color: 'emerald' },
            { key: 'vault', label: '보관함 (좋은소스)', icon: 'gem', color: 'amber' }
        ];

        function setNovelRating(id, ratingVal) {
            const novel = appState.novels.find(n => n.id === id);
            if (!novel) return;
            // 같은 별점 재클릭 시 취소 가능
            if (novel.rating === ratingVal) {
                novel.rating = null;
                novel.updatedAt = null;
                showToast('별점이 해제되었습니다.');
            } else {
                novel.rating = ratingVal;
                novel.updatedAt = new Date().toISOString();
                const opt = RATING_OPTIONS.find(r => r.value === ratingVal);
                showToast(`평가 저장: ${opt.stars} ${opt.label}`);
            }
            saveState();
            render();
        }

        function toggleNovelFlag(id, flagKey) {
            const novel = appState.novels.find(n => n.id === id);
            if (!novel) return;
            if (!Array.isArray(novel.flags)) novel.flags = [];
            const idx = novel.flags.indexOf(flagKey);
            if (idx > -1) {
                novel.flags.splice(idx, 1);
                showToast('분류 표시가 해제되었습니다.');
            } else {
                novel.flags.push(flagKey);
                const opt = FLAG_OPTIONS.find(f => f.key === flagKey);
                showToast(`${opt.label}에 추가되었습니다!`);
            }
            saveState();
            render();
        }

        function toggleSynopsis(id) {
            appState.expandedSynopsis[id] = !appState.expandedSynopsis[id];
            render();
        }

        // 태그 모달 관련
        function openTagModal(id) {
            activeModalNovelId = id;
            const novel = appState.novels.find(n => n.id === id);
            if (!novel) return;
            document.getElementById('modal-novel-title').textContent = novel.title;
            document.getElementById('new-tag-input').value = '';
            renderTagModalContent();
            const modal = document.getElementById('tag-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeTagModal() {
            activeModalNovelId = null;
            const modal = document.getElementById('tag-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            render();
        }

        function renderTagModalContent() {
            const novel = appState.novels.find(n => n.id === activeModalNovelId);
            if (!novel) return;
            const tags = novel.tags || [];
            document.getElementById('modal-tag-count').textContent = `${tags.length} / 5`;

            const activeContainer = document.getElementById('modal-active-tags');
            if (tags.length === 0) {
                activeContainer.innerHTML = `<span class="text-xs text-slate-500 px-1">등록된 태그가 없습니다. 아래에서 추가하세요.</span>`;
            } else {
                activeContainer.innerHTML = tags.map(t => `
                    <span class="inline-flex items-center gap-1 bg-blue-600/25 border border-blue-500/50 text-blue-200 text-xs font-medium px-2.5 py-1 rounded-lg">
                        #${escapeHtml(t)}
                        <button onclick="removeTagFromNovel('${escapeHtml(t)}')" class="text-blue-300 hover:text-white ml-0.5">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </span>
                `).join('');
            }

            const poolContainer = document.getElementById('modal-tag-pool');
            if (appState.tagPool.length === 0) {
                poolContainer.innerHTML = `<span class="text-xs text-slate-500">아직 저장된 태그 풀이 없습니다.</span>`;
            } else {
                poolContainer.innerHTML = appState.tagPool.map(t => {
                    const isSelected = tags.includes(t);
                    return `
                        <button onclick="toggleTagFromPool('${escapeHtml(t)}')" 
                            class="text-xs px-2.5 py-1 rounded-lg border transition ${
                                isSelected 
                                ? 'bg-blue-600 border-blue-500 text-white font-semibold' 
                                : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-500'
                            }">
                            #${escapeHtml(t)}
                        </button>
                    `;
                }).join('');
            }
            lucide.createIcons();
        }

        function addCustomTag() {
            const input = document.getElementById('new-tag-input');
            const rawVal = input.value.trim().replace(/^#/, '');
            if (!rawVal) return;

            const novel = appState.novels.find(n => n.id === activeModalNovelId);
            if (!novel) return;
            if (!novel.tags) novel.tags = [];

            if (novel.tags.includes(rawVal)) {
                showToast('이미 적용된 태그입니다.');
                input.value = '';
                return;
            }
            if (novel.tags.length >= 5) {
                showToast('작품당 태그는 최대 5개까지 등록 가능합니다.');
                return;
            }

            novel.tags.push(rawVal);
            if (!appState.tagPool.includes(rawVal)) {
                appState.tagPool.push(rawVal);
            }
            input.value = '';
            saveState();
            renderTagModalContent();
            showToast(`#${rawVal} 태그 추가됨`);
        }

        function toggleTagFromPool(tag) {
            const novel = appState.novels.find(n => n.id === activeModalNovelId);
            if (!novel) return;
            if (!novel.tags) novel.tags = [];

            const idx = novel.tags.indexOf(tag);
            if (idx > -1) {
                novel.tags.splice(idx, 1);
            } else {
                if (novel.tags.length >= 5) {
                    showToast('작품당 태그는 최대 5개까지 가능합니다.');
                    return;
                }
                novel.tags.push(tag);
            }
            saveState();
            renderTagModalContent();
        }

        function removeTagFromNovel(tag) {
            const novel = appState.novels.find(n => n.id === activeModalNovelId);
            if (!novel || !novel.tags) return;
            novel.tags = novel.tags.filter(t => t !== tag);
            saveState();
            renderTagModalContent();
        }

        // ==========================================
        // 4. UI 렌더링 컴포넌트
        // ==========================================
        function switchTab(tab) {
            appState.currentTab = tab;
            render();
            document.getElementById('main-content').scrollTop = 0;
        }

        function updateGlobalBadges() {
            const unratedCount = appState.novels.filter(n => !n.rating).length;
            const vaultCount = appState.novels.filter(n => (n.flags || []).includes('vault')).length;

            document.getElementById('unrated-count-badge').textContent = unratedCount;
            document.getElementById('vault-badge-count').textContent = vaultCount;

            // 하단 탭 활성화 스타일
            ['today', 'vault', 'archive', 'data'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (!btn) return;
                if (t === 'vault') {
                    if (appState.currentTab === 'vault') {
                        btn.classList.add('vault-tab-glow', 'from-amber-500/35', 'to-amber-600/20', 'border-amber-400');
                    } else {
                        btn.classList.remove('vault-tab-glow', 'from-amber-500/35', 'to-amber-600/20', 'border-amber-400');
                    }
                } else {
                    if (appState.currentTab === t) {
                        btn.classList.add('bg-slate-800', 'text-blue-400');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('bg-slate-800', 'text-blue-400');
                        btn.classList.add('text-slate-400');
                    }
                }
            });
        }

        function renderNovelCard(novel, isTodayView = false) {
            const isVault = (novel.flags || []).includes('vault');
            const isLegend = (novel.flags || []).includes('legend');
            const isSupernormal = (novel.flags || []).includes('supernormal');
            const isExpanded = !!appState.expandedSynopsis[novel.id];
            const isRated = novel.rating !== null && novel.rating !== undefined;

            const catBadgeClass = novel.category === '투데이 베스트'
                ? 'bg-rose-500/15 text-rose-300 border-rose-500/30'
                : 'bg-sky-500/15 text-sky-300 border-sky-500/30';

            return `
            <article class="rounded-2xl p-4 mb-4 transition-all duration-200 border ${
                isVault 
                ? 'bg-gradient-to-b from-amber-950/35 via-slate-850 to-slate-850 vault-glow' 
                : isRated && isTodayView
                    ? 'bg-slate-850/60 border-slate-800 opacity-85'
                    : 'bg-slate-850 border-slate-800'
            }">
                <!-- 상단 뱃지 및 상태 -->
                <div class="flex items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${catBadgeClass}">
                            ${escapeHtml(novel.category)}
                        </span>
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700">
                            ${escapeHtml(novel.genre)}
                        </span>
                        ${isVault ? `
                            <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-md bg-amber-500 text-slate-950 flex items-center gap-1 shadow-sm">
                                <i data-lucide="gem" class="w-3 h-3"></i> 보관함
                            </span>
                        ` : ''}
                    </div>
                    ${isRated && isTodayView ? `
                        <span class="text-[11px] font-bold text-emerald-400 flex items-center gap-1 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/30">
                            <i data-lucide="check-circle-2" class="w-3 h-3"></i> 평가완료
                        </span>
                    ` : ''}
                </div>

                <!-- 제목 및 작가 -->
                <h2 class="text-[16px] font-bold text-white leading-snug mb-1">
                    ${escapeHtml(novel.title)}
                </h2>
                <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                    <span class="font-medium text-slate-300 flex items-center gap-1">
                        <i data-lucide="pen-tool" class="w-3 h-3 text-slate-500"></i> ${escapeHtml(novel.author)}
                    </span>
                    <div class="flex items-center gap-2.5">
                        <span class="flex items-center gap-1">
                            <i data-lucide="layers" class="w-3 h-3 text-blue-400"></i> 총 <strong class="text-slate-200">${Number(novel.episodes).toLocaleString()}</strong>화
                        </span>
                        <span class="text-slate-600">|</span>
                        <span class="flex items-center gap-1">
                            <i data-lucide="eye" class="w-3 h-3 text-emerald-400"></i> 최근 <strong class="text-slate-200">${Number(novel.recentViews).toLocaleString()}</strong>
                        </span>
                    </div>
                </div>

                <!-- 작품소개 (접기/펼치기) -->
                <div onclick="toggleSynopsis('${novel.id}')" class="bg-slate-900/80 rounded-xl p-3 mb-3.5 border border-slate-800/90 cursor-pointer active:bg-slate-900">
                    <p class="text-xs text-slate-300 leading-relaxed ${isExpanded ? '' : 'line-clamp-2'}">
                        ${escapeHtml(novel.synopsis)}
                    </p>
                    <div class="text-[10px] text-slate-500 mt-1 text-right font-medium">
                        ${isExpanded ? '접기 ▲' : '소개 더보기 ▼'}
                    </div>
                </div>

                <!-- 별점 선택 (4가지 라디오 스타일 버튼) -->
                <div class="mb-3">
                    <div class="text-[11px] font-semibold text-slate-400 mb-1.5 flex items-center justify-between">
                        <span>완독도 별점 평가</span>
                        ${novel.rating ? `<span class="text-blue-400">선택됨</span>` : `<span class="text-slate-500">터치하여 평가</span>`}
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        ${RATING_OPTIONS.map(opt => {
                            const active = novel.rating === opt.value;
                            return `
                                <button onclick="setNovelRating('${novel.id}', ${opt.value})" 
                                    class="py-2 px-2.5 rounded-xl border text-left transition active:scale-[0.98] flex flex-col justify-center ${
                                        active 
                                        ? 'bg-blue-600/25 border-blue-500 text-white shadow-inner' 
                                        : 'bg-slate-900/70 border-slate-800 text-slate-400 hover:border-slate-700'
                                    }">
                                    <span class="text-xs font-extrabold ${active ? 'text-amber-400' : 'text-slate-500'}">${opt.stars}</span>
                                    <span class="text-[11px] font-medium mt-0.5 ${active ? 'text-blue-100' : 'text-slate-300'}">${opt.label}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- 추가 분류 토글 (3가지 중복 선택) -->
                <div class="mb-3">
                    <div class="text-[11px] font-semibold text-slate-400 mb-1.5">특이사항 및 보관 (중복 선택)</div>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="toggleNovelFlag('${novel.id}', 'legend')" 
                            class="py-2 px-1.5 rounded-xl border text-[11px] font-bold transition flex flex-col items-center justify-center gap-1 ${
                                isLegend 
                                ? 'bg-purple-600/25 border-purple-500 text-purple-200' 
                                : 'bg-slate-900/60 border-slate-800 text-slate-400'
                            }">
                            <i data-lucide="crown" class="w-3.5 h-3.5 ${isLegend ? 'text-purple-400' : 'text-slate-500'}"></i>
                            <span>레전드(작가뽕)</span>
                        </button>

                        <button onclick="toggleNovelFlag('${novel.id}', 'supernormal')" 
                            class="py-2 px-1.5 rounded-xl border text-[11px] font-bold transition flex flex-col items-center justify-center gap-1 ${
                                isSupernormal 
                                ? 'bg-emerald-600/25 border-emerald-500 text-emerald-200' 
                                : 'bg-slate-900/60 border-slate-800 text-slate-400'
                            }">
                            <i data-lucide="zap" class="w-3.5 h-3.5 ${isSupernormal ? 'text-emerald-400' : 'text-slate-500'}"></i>
                            <span>슈퍼노멀(일반)</span>
                        </button>

                        <button onclick="toggleNovelFlag('${novel.id}', 'vault')" 
                            class="py-2 px-1.5 rounded-xl border text-[11px] font-extrabold transition flex flex-col items-center justify-center gap-1 ${
                                isVault 
                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20' 
                                : 'bg-slate-900/60 border-amber-500/30 text-amber-300/80 hover:border-amber-500/60'
                            }">
                            <i data-lucide="gem" class="w-3.5 h-3.5 ${isVault ? 'text-slate-950' : 'text-amber-400'}"></i>
                            <span>보관함(좋은소스)</span>
                        </button>
                    </div>
                </div>

                <!-- 키워드 태그 영역 -->
                <div class="pt-2.5 border-t border-slate-800/80 flex items-center justify-between gap-2">
                    <div class="flex flex-wrap gap-1.5 flex-1">
                        ${(novel.tags && novel.tags.length > 0) 
                            ? novel.tags.map(t => `<span class="text-[11px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700/80">#${escapeHtml(t)}</span>`).join('')
                            : `<span class="text-[11px] text-slate-500">태그 없음</span>`
                        }
                    </div>
                    <button onclick="openTagModal('${novel.id}')" class="shrink-0 text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-blue-300 px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 transition">
                        <i data-lucide="plus" class="w-3 h-3"></i> 태그 (${(novel.tags || []).length}/5)
                    </button>
                </div>
            </article>
            `;
        }

        // ==========================================
        // 5. 각 탭 뷰 렌더링 함수
        // ==========================================
        function renderTodayView() {
            const todayNovels = appState.todayIds
                .map(id => appState.novels.find(n => n.id === id))
                .filter(Boolean);

            const unratedTotal = appState.novels.filter(n => !n.rating).length;
            const completedToday = todayNovels.filter(n => n.rating !== null).length;

            return `
            <div class="animate-fade-in">
                <!-- 오늘의 추천 요약 배너 -->
                <div class="bg-gradient-to-r from-blue-950/80 to-indigo-950/80 border border-blue-800/50 rounded-2xl p-4 mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <span class="text-[11px] font-bold text-blue-300 uppercase tracking-wider">${appState.todayDate} 추천</span>
                            <h2 class="text-base font-extrabold text-white">오늘의 랜덤 10선</h2>
                        </div>
                        <button onclick="refreshTodayTen(false)" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-lg shadow-blue-600/20 flex items-center gap-1.5 transition">
                            <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> 새로 뽑기
                        </button>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-300 mt-3 pt-2.5 border-t border-blue-800/40">
                        <span>진행률: <strong class="text-white">${completedToday}</strong> / ${todayNovels.length}편 평가됨</span>
                        <span>전체 미평가 풀: <strong class="text-blue-300">${unratedTotal}</strong>편</span>
                    </div>
                </div>

                ${todayNovels.length === 0 ? `
                    <div class="text-center py-12 bg-slate-850 rounded-2xl border border-slate-800 p-6">
                        <i data-lucide="party-popper" class="w-10 h-10 text-amber-400 mx-auto mb-3"></i>
                        <h3 class="text-base font-bold text-white mb-1">모든 작품을 평가했습니다!</h3>
                        <p class="text-xs text-slate-400 mb-4">데이터 관리 탭에서 새로운 문피아 작품 JSON을 추가하거나, 기존 작품의 별점을 초기화할 수 있습니다.</p>
                        <button onclick="switchTab('data')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">데이터 관리로 이동</button>
                    </div>
                ` : todayNovels.map(n => renderNovelCard(n, true)).join('')}
            </div>
            `;
        }

        function renderVaultView() {
            const vaultNovels = appState.novels.filter(n => (n.flags || []).includes('vault'));
            
            // 보관함 작품들이 가진 태그 추출
            const vaultTagsSet = new Set();
            vaultNovels.forEach(n => (n.tags || []).forEach(t => vaultTagsSet.add(t)));
            const vaultTags = Array.from(vaultTagsSet);

            const filtered = appState.vaultTagFilter === 'ALL'
                ? vaultNovels
                : vaultNovels.filter(n => (n.tags || []).includes(appState.vaultTagFilter));

            return `
            <div class="animate-fade-in">
                <!-- 보관함 전용 골드 하이라이트 헤더 -->
                <div class="bg-gradient-to-br from-amber-500/20 via-amber-600/10 to-slate-850 border border-amber-500/50 rounded-2xl p-4 mb-4 vault-glow">
                    <div class="flex items-center gap-2.5 mb-1.5">
                        <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center shadow-md">
                            <i data-lucide="gem" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-black text-amber-300">보관함 (좋은소스 아카이브)</h2>
                            <p class="text-xs text-amber-100/80">차기작 기획에 활용할 핵심 레퍼런스 <strong class="text-amber-300">${vaultNovels.length}편</strong></p>
                        </div>
                    </div>

                    <!-- 보관함 내 태그 필터 -->
                    ${vaultTags.length > 0 ? `
                        <div class="mt-3 pt-3 border-t border-amber-500/20">
                            <div class="text-[11px] text-amber-200/70 mb-1.5 font-medium">보관함 키워드 필터</div>
                            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                                <button onclick="setVaultTagFilter('ALL')" 
                                    class="shrink-0 text-xs px-3 py-1 rounded-full font-bold transition ${
                                        appState.vaultTagFilter === 'ALL' 
                                        ? 'bg-amber-500 text-slate-950' 
                                        : 'bg-slate-900/80 text-amber-200 border border-amber-500/30'
                                    }">전체 (${vaultNovels.length})</button>
                                ${vaultTags.map(t => `
                                    <button onclick="setVaultTagFilter('${escapeHtml(t)}')" 
                                        class="shrink-0 text-xs px-3 py-1 rounded-full font-semibold transition ${
                                            appState.vaultTagFilter === t 
                                            ? 'bg-amber-500 text-slate-950' 
                                            : 'bg-slate-900/80 text-amber-200 border border-amber-500/30'
                                        }">#${escapeHtml(t)}</button>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>

                ${filtered.length === 0 ? `
                    <div class="text-center py-12 bg-slate-850 rounded-2xl border border-slate-800 p-6">
                        <i data-lucide="sparkles" class="w-10 h-10 text-amber-400/60 mx-auto mb-3"></i>
                        <h3 class="text-sm font-bold text-white mb-1">보관함에 담긴 작품이 없습니다</h3>
                        <p class="text-xs text-slate-400">작품 카드 하단의 <strong class="text-amber-300">[보관함(좋은소스)]</strong> 버튼을 눌러 영감을 준 작품을 모아보세요.</p>
                    </div>
                ` : filtered.map(n => renderNovelCard(n, false)).join('')}
            </div>
            `;
        }

        function setVaultTagFilter(tag) {
            appState.vaultTagFilter = tag;
            render();
        }

        function renderArchiveView() {
            const ratedNovels = appState.novels.filter(n => n.rating !== null);
            
            // 트렌드 통계 계산: 인기 태그 TOP 5
            const tagCounts = {};
            ratedNovels.forEach(n => {
                (n.tags || []).forEach(t => {
                    tagCounts[t] = (tagCounts[t] || 0) + 1;
                });
            });
            const topTags = Object.entries(tagCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            // 장르별 평균 별점 & 정독률(4점 비율)
            const genreStats = {};
            ratedNovels.forEach(n => {
                if (!genreStats[n.genre]) genreStats[n.genre] = { count: 0, sum: 0, high: 0 };
                genreStats[n.genre].count++;
                genreStats[n.genre].sum += n.rating;
                if (n.rating === 4) genreStats[n.genre].high++;
            });

            // 필터 적용
            let filtered = [...appState.novels];
            const f = appState.archiveFilters;

            if (f.rating !== 'ALL') {
                if (f.rating === 'UNRATED') {
                    filtered = filtered.filter(n => !n.rating);
                } else {
                    filtered = filtered.filter(n => n.rating === Number(f.rating));
                }
            }
            if (f.flag !== 'ALL') {
                filtered = filtered.filter(n => (n.flags || []).includes(f.flag));
            }
            if (f.tag !== 'ALL') {
                filtered = filtered.filter(n => (n.tags || []).includes(f.tag));
            }
            if (f.search.trim() !== '') {
                const q = f.search.trim().toLowerCase();
                filtered = filtered.filter(n => 
                    n.title.toLowerCase().includes(q) || 
                    n.author.toLowerCase().includes(q) ||
                    (n.tags || []).some(t => t.toLowerCase().includes(q))
                );
            }

            return `
            <div class="animate-fade-in">
                <!-- 트렌드 분석 요약 카드 -->
                <div class="bg-slate-850 border border-slate-800 rounded-2xl p-4 mb-4">
                    <h2 class="text-sm font-extrabold text-white flex items-center gap-1.5 mb-3">
                        <i data-lucide="trending-up" class="w-4 h-4 text-blue-400"></i> 내 독서 트렌드 인사이트
                    </h2>

                    <div class="grid grid-cols-3 gap-2 mb-3">
                        <div class="bg-slate-900 rounded-xl p-2.5 text-center border border-slate-800">
                            <div class="text-[11px] text-slate-400">평가 완료</div>
                            <div class="text-base font-black text-white mt-0.5">${ratedNovels.length}<span class="text-xs font-normal text-slate-500">/${appState.novels.length}</span></div>
                        </div>
                        <div class="bg-slate-900 rounded-xl p-2.5 text-center border border-slate-800">
                            <div class="text-[11px] text-slate-400">16화+ 정독</div>
                            <div class="text-base font-black text-blue-400 mt-0.5">${appState.novels.filter(n => n.rating === 4).length}편</div>
                        </div>
                        <div class="bg-slate-900 rounded-xl p-2.5 text-center border border-amber-500/30">
                            <div class="text-[11px] text-amber-300/80">보관함 소스</div>
                            <div class="text-base font-black text-amber-400 mt-0.5">${appState.novels.filter(n => (n.flags || []).includes('vault')).length}편</div>
                        </div>
                    </div>

                    <!-- 인기 태그 TOP 5 -->
                    <div class="mb-3">
                        <div class="text-[11px] font-semibold text-slate-400 mb-1.5">평가 작품 인기 키워드 TOP 5</div>
                        ${topTags.length > 0 ? `
                            <div class="flex flex-wrap gap-1.5">
                                ${topTags.map(([tag, cnt], idx) => `
                                    <button onclick="setArchiveFilter('tag', '${escapeHtml(tag)}')" class="text-xs bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-200 flex items-center gap-1">
                                        <span class="text-blue-400 font-bold">${idx + 1}.</span> #${escapeHtml(tag)} <span class="text-[10px] text-slate-500">(${cnt})</span>
                                    </button>
                                `).join('')}
                            </div>
                        ` : `<p class="text-xs text-slate-500">작품에 별점을 매기면 선호 태그 통계가 표시됩니다.</p>`}
                    </div>

                    <!-- 장르별 정독 통계 -->
                    ${Object.keys(genreStats).length > 0 ? `
                        <div>
                            <div class="text-[11px] font-semibold text-slate-400 mb-1.5">장르별 평균 별점</div>
                            <div class="space-y-1.5">
                                ${Object.entries(genreStats).map(([g, st]) => {
                                    const avg = (st.sum / st.count).toFixed(1);
                                    const pct = Math.round((st.sum / (st.count * 4)) * 100);
                                    return `
                                    <div class="flex items-center gap-2 text-xs">
                                        <span class="w-20 truncate text-slate-300 font-medium">${escapeHtml(g)}</span>
                                        <div class="flex-1 h-2 bg-slate-900 rounded-full overflow-hidden">
                                            <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-400 rounded-full" style="width: ${pct}%"></div>
                                        </div>
                                        <span class="w-14 text-right font-bold text-amber-400">★ ${avg} <span class="text-[10px] text-slate-500">(${st.count})</span></span>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>

                <!-- 필터 컨트롤 영역 -->
                <div class="bg-slate-850 border border-slate-800 rounded-2xl p-3.5 mb-4 space-y-2.5">
                    <!-- 검색창 -->
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="text" value="${escapeHtml(f.search)}" oninput="setArchiveFilter('search', this.value)" 
                            placeholder="제목, 작가명, 태그 검색..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>

                    <!-- 별점 필터 -->
                    <div class="flex gap-1 overflow-x-auto no-scrollbar">
                        <button onclick="setArchiveFilter('rating', 'ALL')" class="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg font-semibold ${f.rating === 'ALL' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}">전체 별점</button>
                        <button onclick="setArchiveFilter('rating', '4')" class="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg font-semibold ${f.rating === '4' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}">★★★★ 정독</button>
                        <button onclick="setArchiveFilter('rating', '3')" class="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg font-semibold ${f.rating === '3' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}">★★★ 11~15화</button>
                        <button onclick="setArchiveFilter('rating', '2')" class="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg font-semibold ${f.rating === '2' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}">★★ 6~10화</button>
                        <button onclick="setArchiveFilter('rating', '1')" class="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg font-semibold ${f.rating === '1' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}">★ 1~5화</button>
                        <button onclick="setArchiveFilter('rating', 'UNRATED')" class="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg font-semibold ${f.rating === 'UNRATED' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}">미평가</button>
                    </div>

                    <!-- 분류 & 태그 드롭다운 필터 -->
                    <div class="grid grid-cols-2 gap-2">
                        <select onchange="setArchiveFilter('flag', this.value)" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none">
                            <option value="ALL" ${f.flag === 'ALL' ? 'selected' : ''}>분류: 전체 보기</option>
                            <option value="vault" ${f.flag === 'vault' ? 'selected' : ''}>💎 보관함 (좋은소스)</option>
                            <option value="legend" ${f.flag === 'legend' ? 'selected' : ''}>👑 레전드 (작가뽕)</option>
                            <option value="supernormal" ${f.flag === 'supernormal' ? 'selected' : ''}>⚡ 슈퍼노멀 (일반연재)</option>
                        </select>

                        <select onchange="setArchiveFilter('tag', this.value)" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none">
                            <option value="ALL" ${f.tag === 'ALL' ? 'selected' : ''}>태그: 전체 보기</option>
                            ${appState.tagPool.map(t => `<option value="${escapeHtml(t)}" ${f.tag === t ? 'selected' : ''}>#${escapeHtml(t)}</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div class="text-xs text-slate-400 mb-3 px-1 flex justify-between items-center">
                    <span>검색 결과 <strong class="text-white">${filtered.length}</strong>편</span>
                    ${(f.rating !== 'ALL' || f.flag !== 'ALL' || f.tag !== 'ALL' || f.search !== '') ? `
                        <button onclick="resetArchiveFilters()" class="text-blue-400 font-semibold">필터 초기화</button>
                    ` : ''}
                </div>

                ${filtered.length === 0 ? `
                    <div class="text-center py-10 bg-slate-850 rounded-2xl border border-slate-800 text-xs text-slate-400">
                        조건에 일치하는 작품이 없습니다.
                    </div>
                ` : filtered.map(n => renderNovelCard(n, false)).join('')}
            </div>
            `;
        }

        function setArchiveFilter(key, val) {
            appState.archiveFilters[key] = val;
            render();
        }

        function resetArchiveFilters() {
            appState.archiveFilters = { rating: 'ALL', flag: 'ALL', tag: 'ALL', search: '' };
            render();
        }

        function renderDataView() {
            return `
            <div class="animate-fade-in space-y-4">
                <!-- 신규 작품 직접 등록 카드 -->
                <div class="bg-slate-850 border border-slate-800 rounded-2xl p-4">
                    <h2 class="text-sm font-extrabold text-white flex items-center gap-1.5 mb-3">
                        <i data-lucide="plus-circle" class="w-4 h-4 text-blue-400"></i> 신규 문피아 작품 수동 추가
                    </h2>
                    <div class="space-y-2.5">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="add-category" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                                <option value="투데이 베스트">투데이 베스트</option>
                                <option value="신규 베스트">신규 베스트</option>
                            </select>
                            <input type="text" id="add-genre" placeholder="장르 (예: 현대판타지)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <input type="text" id="add-title" placeholder="작품 제목" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="add-author" placeholder="작가명" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="number" id="add-episodes" placeholder="총 회차" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="number" id="add-views" placeholder="최근 조회수" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <textarea id="add-synopsis" rows="2" placeholder="작품소개 (시놉시스)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"></textarea>
                        <button onclick="addManualNovel()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition">
                            아카이브에 작품 추가
                        </button>
                    </div>
                </div>

                <!-- JSON 백업 및 복원/병합 -->
                <div class="bg-slate-850 border border-slate-800 rounded-2xl p-4">
                    <h2 class="text-sm font-extrabold text-white flex items-center gap-1.5 mb-1">
                        <i data-lucide="hard-drive-download" class="w-4 h-4 text-emerald-400"></i> JSON 데이터 백업 및 불러오기
                    </h2>
                    <p class="text-xs text-slate-400 mb-3 leading-relaxed">
                        서버 없이 브라우저(LocalStorage)에 저장되므로, 기기 변경이나 브라우저 캐시 삭제 전 JSON으로 백업해 두세요. 외부에서 수집한 작품 목록 JSON도 병합(Import)할 수 있습니다.
                    </p>

                    <div class="grid grid-cols-2 gap-2.5 mb-3">
                        <button onclick="exportJsonFile()" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition">
                            <i data-lucide="download" class="w-4 h-4"></i> JSON 파일 백업
                        </button>
                        <button onclick="copyJsonToClipboard()" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition">
                            <i data-lucide="copy" class="w-4 h-4"></i> 클립보드 복사
                        </button>
                    </div>

                    <div class="border-t border-slate-800 pt-3">
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">JSON 파일 불러오기 (기존 데이터와 병합/덮어쓰기)</label>
                        <input type="file" id="json-file-input" accept=".json" onchange="handleJsonFileUpload(event)" 
                            class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-blue-300 hover:file:bg-slate-700 cursor-pointer">
                    </div>
                </div>

                <!-- 초기화 영역 -->
                <div class="bg-slate-850 border border-rose-900/40 rounded-2xl p-4">
                    <h2 class="text-sm font-bold text-rose-400 flex items-center gap-1.5 mb-1">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 데이터 초기화
                    </h2>
                    <p class="text-xs text-slate-400 mb-3">모든 별점, 보관함, 태그 기록을 지우고 기본 샘플 데이터 25편 상태로 되돌립니다.</p>
                    <button onclick="confirmResetData()" class="w-full py-2.5 bg-rose-950/60 hover:bg-rose-900/60 border border-rose-800/60 text-rose-300 text-xs font-bold rounded-xl transition">
                        초기 샘플 데이터로 리셋
                    </button>
                </div>
            </div>
            `;
        }

        // ==========================================
        // 6. 데이터 관리 액션 (추가, 백업, 복원, 리셋)
        // ==========================================
        function addManualNovel() {
            const title = document.getElementById('add-title').value.trim();
            const genre = document.getElementById('add-genre').value.trim() || '판타지';
            const author = document.getElementById('add-author').value.trim() || '미상';
            const episodes = parseInt(document.getElementById('add-episodes').value, 10) || 1;
            const recentViews = parseInt(document.getElementById('add-views').value, 10) || 0;
            const synopsis = document.getElementById('add-synopsis').value.trim() || '작품 소개가 등록되지 않았습니다.';
            const category = document.getElementById('add-category').value;

            if (!title) {
                showToast('작품 제목을 입력해 주세요.');
                return;
            }

            const newNovel = {
                id: 'mp_' + Date.now(),
                category,
                title,
                genre,
                author,
                episodes,
                recentViews,
                synopsis,
                rating: null,
                flags: [],
                tags: [],
                updatedAt: null
            };

            appState.novels.unshift(newNovel);
            saveState();
            showToast(`'${title}' 작품이 추가되었습니다!`);
            render();
        }

        function exportJsonFile() {
            const dataStr = JSON.stringify({
                exportedAt: new Date().toISOString(),
                novels: appState.novels,
                tagPool: appState.tagPool
            }, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `munpia_trend_backup_${getTodayString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('JSON 백업 파일이 다운로드되었습니다.');
        }

        function copyJsonToClipboard() {
            const dataStr = JSON.stringify({
                novels: appState.novels,
                tagPool: appState.tagPool
            }, null, 2);
            const textarea = document.createElement('textarea');
            textarea.value = dataStr;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('전체 데이터가 클립보드에 복사되었습니다.');
        }

        function handleJsonFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    const list = Array.isArray(imported) ? imported : imported.novels;
                    if (!Array.isArray(list)) {
                        showToast('올바른 작품 JSON 형식이 아닙니다.');
                        return;
                    }

                    let addedCount = 0;
                    let updatedCount = 0;

                    list.forEach(item => {
                        if (!item.title) return;
                        const existingIdx = appState.novels.findIndex(n => n.id === item.id || (n.title === item.title && n.author === item.author));
                        if (existingIdx > -1) {
                            // 기존 작품의 회차/조회수 최신화 (사용자 평가는 보존)
                            appState.novels[existingIdx].episodes = item.episodes || appState.novels[existingIdx].episodes;
                            appState.novels[existingIdx].recentViews = item.recentViews || appState.novels[existingIdx].recentViews;
                            updatedCount++;
                        } else {
                            appState.novels.push({
                                id: item.id || 'mp_' + Math.random().toString(36).substr(2, 9),
                                category: item.category || '투데이 베스트',
                                title: item.title,
                                genre: item.genre || '판타지',
                                author: item.author || '작가미상',
                                episodes: Number(item.episodes) || 1,
                                recentViews: Number(item.recentViews) || 0,
                                synopsis: item.synopsis || '',
                                rating: item.rating ?? null,
                                flags: Array.isArray(item.flags) ? item.flags : [],
                                tags: Array.isArray(item.tags) ? item.tags : [],
                                updatedAt: item.updatedAt || null
                            });
                            addedCount++;
                        }
                    });

                    if (Array.isArray(imported.tagPool)) {
                        imported.tagPool.forEach(t => {
                            if (!appState.tagPool.includes(t)) appState.tagPool.push(t);
                        });
                    }

                    syncTagPool();
                    saveState();
                    showToast(`병합 완료: 신규 ${addedCount}편 추가, ${updatedCount}편 갱신`);
                    render();
                } catch (err) {
                    showToast('JSON 파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function confirmResetData() {
            openConfirmModal(
                '데이터 전체 초기화',
                '지금까지 기록한 모든 별점, 보관함, 커스텀 태그가 삭제되고 초기 샘플 데이터로 복구됩니다. 계속할까요?',
                () => {
                    localStorage.removeItem(STORAGE_KEY);
                    initDefaultState();
                    saveState();
                    showToast('초기 상태로 리셋되었습니다.');
                    render();
                }
            );
        }

        // ==========================================
        // 7. 유틸리티 (커스텀 모달, 토스트, 이스케이프)
        // ==========================================
        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            confirmCallback = onConfirm;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal() {
            confirmCallback = null;
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('confirm-ok-btn').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        });

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2200);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ==========================================
        // 8. 메인 렌더 루프 및 초기화
        // ==========================================
        function render() {
            const main = document.getElementById('main-content');
            if (appState.currentTab === 'today') {
                main.innerHTML = renderTodayView();
            } else if (appState.currentTab === 'vault') {
                main.innerHTML = renderVaultView();
            } else if (appState.currentTab === 'archive') {
                main.innerHTML = renderArchiveView();
            } else if (appState.currentTab === 'data') {
                main.innerHTML = renderDataView();
            }
            updateGlobalBadges();
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            render();
        });
    </script>
</body>
</html>
