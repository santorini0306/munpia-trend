<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>쉐프 노트 - 웹소설 트렌드 & 레시피 분석기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #f3efe9;
      color: #1f2421;
      overscroll-behavior-y: none;
    }
    /* 모바일 앱 프레임 스크롤바 커스텀 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes bounceSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-soft {
      animation: bounceSoft 1.8s infinite ease-in-out;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#ebe5dc]">

  <!-- 모바일 앱 컨테이너 (데스크톱에서는 중앙 정렬 모바일 프레임, 모바일에서는 100% 너비) -->
  <div id="app" class="w-full max-w-[480px] min-h-screen bg-[#faf8f5] shadow-2xl flex flex-col relative overflow-x-hidden border-x border-stone-200/80">
    
    <!-- 상단 앱 헤더 -->
    <header class="sticky top-0 z-30 bg-[#faf8f5]/95 backdrop-blur-md border-b border-stone-200/80 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white shadow-sm text-lg">
          👨‍🍳
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-extrabold tracking-tight text-stone-900">쉐프 노트</h1>
            <span id="header-badge" class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800">📝 제품 등록</span>
          </div>
          <p class="text-[11px] text-stone-500 leading-tight">문피아 베스트 미식 &amp; 레시피 아카이브</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="openSearchModal()" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 active:scale-95 transition text-stone-700" title="전체 작품 검색">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main id="main-content" class="flex-1 pb-24 px-4 pt-3 space-y-4">
      <!-- 동적 렌더링 -->
    </main>

    <!-- 하단 6대 카테고리 내비게이션 바 -->
    <nav class="fixed bottom-0 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur-md border-t border-stone-200 px-1 py-1.5 shadow-[0_-4px_16px_rgba(0,0,0,0.04)]">
      <div id="bottom-nav" class="grid grid-cols-6 gap-0.5">
        <!-- JS로 렌더링 -->
      </div>
    </nav>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-[440px] px-4"></div>

    <!-- 모달 / 바텀시트 컨테이너 -->
    <div id="modal-root" class="hidden fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-[2px]"></div>

    <!-- 확인 다이얼로그 (confirm() 대체) -->
    <div id="confirm-root" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/55 p-4"></div>
  </div>

function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.novels)) state.novels = parsed.novels;
      if (Array.isArray(parsed.tagPool)) state.tagPool = parsed.tagPool;
    }
  } catch (e) {
    console.error('Failed to load state:', e);
  }
}

function saveState() {
  try {
    const payload = {
      novels: state.novels,
      tagPool: state.tagPool,
      updatedAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    showToast('저장 공간이 부족하여 데이터를 저장하지 못했습니다.', 'error');
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const bg = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-stone-800';
  toast.className = `${bg} text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-lg flex items-center gap-2 animate-pop-in`;
  toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : '👨‍🍳'}</span><span>${escapeHtml(msg)}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.25s ease';
    setTimeout(() => toast.remove(), 260);
  }, 2200);
}

function copyTextToClipboard(text, label = '제목') {
  if (!text) return;
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  try {
    document.execCommand('copy');
    showToast(`"${text}" 복사 완료! 문피아에 붙여넣기 하세요.`, 'success');
  } catch (err) {
    showToast(`${label} 복사에 실패했습니다.`, 'error');
  }
  document.body.removeChild(textarea);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function checkDuplicateTitle(title, excludeId = null) {
  const norm = (title || '').trim().toLowerCase();
  if (!norm) return null;
  return state.novels.find(n => n.id !== excludeId && (n.title || '').trim().toLowerCase() === norm) || null;

function saveProductRegistration() {
  const f = state.regForm;
  const cleanTitle = (f.title || '').trim();
  if (!cleanTitle) {
    showToast('작품 제목을 입력해 주세요!', 'error');
    return;
  }

  const cleanGenre = (f.genre || '').trim();
  const cleanAuthor = (f.author || '').trim();
  const isLabelingComplete = Boolean(cleanGenre && cleanAuthor);
  const nextStage = isLabelingComplete ? 'kitchen' : 'temp';

  const michelinData = {
    tier: f.tier || '분석 전',
    conversionRate: f.conversionRate !== '' && f.conversionRate !== null ? Number(f.conversionRate) : null,
    freeLastEp: f.freeLastEp !== '' && f.freeLastEp !== null ? Number(f.freeLastEp) : null,
    hasEntered: (f.tier && f.tier !== '분석 전') || (f.conversionRate !== '' && f.conversionRate !== null) || (f.freeLastEp !== '' && f.freeLastEp !== null)
  };

  if (f.editingId) {
    const idx = state.novels.findIndex(n => n.id === f.editingId);
    if (idx !== -1) {
      const prev = state.novels[idx];
      state.novels[idx] = {
        ...prev,
        sources: [...f.sources],
        title: cleanTitle,
        genre: cleanGenre,
        author: cleanAuthor,
        stage: isLabelingComplete ? (prev.stage === 'temp' ? 'kitchen' : prev.stage) : 'temp',
        michelin: michelinData
      };
    }
  } else {
    const newNovel = {
      id: 'nv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      sources: [...f.sources],
      title: cleanTitle,
      genre: cleanGenre,
      author: cleanAuthor,
      stage: nextStage,
      inRecipeQueue: false,
      recipeCompleted: false,
      registeredAt: new Date().toISOString(),
      registeredDate: getTodayStr(),
      michelin: michelinData,
      rating: 0,
      flags: {
        legend: false,
        supernormal: false,
        recipe: false,
        fridge: false
      },
      tags: [],
      recipes: {}
    };
    state.novels.push(newNovel);
  }

  saveState();
  resetRegForm();

  if (isLabelingComplete) {
    showToast(`라벨링 완료! '${cleanTitle}' 작품이 🍳 조리실로 이동했습니다.`, 'success');
  } else {
    showToast(`'${cleanTitle}' 작품이 [임시등록]으로 저장되었습니다.`, 'info');
  }
}

function deleteNovelById(id, afterCallback) {
  const target = state.novels.find(n => n.id === id);
  if (!target) return;
  openConfirmDialog({
    title: '작품 삭제',
    message: `'${target.title}' 작품을 정말 삭제하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.`,
    confirmText: '삭제하기',
    isDanger: true,
    onConfirm: () => {
      state.novels = state.novels.filter(n => n.id !== id);
      if (state.regForm.editingId === id) {
        resetRegForm();
      }
      if (state.recipeSelectedNovelId === id) {
        state.recipeSelectedNovelId = null;
      }
      saveState();
      if (afterCallback) afterCallback();
      renderAll();
      showToast('작품이 삭제되었습니다.');
    }
  });
}

/**
 * ============================================================================
 * 7. [카테고리 2] 🍳 조리실 (등록순 정렬, 제목 복사, 별점, 4종 분류, 5개 태그 & 태그풀, 조리완료)
 * ============================================================================
 */
function toggleKitchenExpand(id) {
  state.kitchenExpandedId = state.kitchenExpandedId === id ? null : id;
  renderAll();
}

function setKitchenRating(id, ratingVal) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  novel.rating = ratingVal;
  saveState();
  renderAll();
}

function toggleKitchenFlag(id, flagKey) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  if (!novel.flags) novel.flags = { legend: false, supernormal: false, recipe: false, fridge: false };
  novel.flags[flagKey] = !novel.flags[flagKey];
  saveState();
  renderAll();
}

function addTagToNovel(id, rawTag) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  const tag = (rawTag || '').trim().replace(/^#/, '');
  if (!tag) return;
  if (!Array.isArray(novel.tags)) novel.tags = [];
  if (novel.tags.includes(tag)) {
    showToast('이미 추가된 태그입니다.');
    return;
  }
  if (novel.tags.length >= 5) {
    showToast('작품별 태그는 최대 5개까지 등록할 수 있습니다.', 'error');
    return;
  }
  novel.tags.push(tag);
  if (!state.tagPool.includes(tag)) {
    state.tagPool.unshift(tag);
  }
  saveState();
  renderAll();
}

function removeTagFromNovel(id, tag) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel || !Array.isArray(novel.tags)) return;
  novel.tags = novel.tags.filter(t => t !== tag);
  saveState();
  renderAll();
}

function handleTagInputKey(e, id) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addTagToNovel(id, e.target.value);
  }
}

function completeCooking(id) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  novel.stage = 'pantry';
  novel.cookedAt = new Date().toISOString();
  const sendToRecipe = Boolean(novel.flags?.recipe);
  if (sendToRecipe) {
    novel.inRecipeQueue = true;
    novel.recipeCompleted = false;
  }
  if (state.kitchenExpandedId === id) {
    state.kitchenExpandedId = null;
  }
  saveState();
  renderAll();
  if (sendToRecipe) {
    showToast(`조리 완료! 🗄️ 팬트리와 📖 레시피분석으로 이동했습니다.`, 'success');
  } else {
    showToast(`조리 완료! 🗄️ 팬트리로 이동했습니다.`, 'success');
  }
}

                    <span class="text-[10px] text-stone-500">'레시피분석' 체크 시 분석실 동시 이동</span>
                  </div>
                  <div class="grid grid-cols-2 gap-1.5">
                    ${FLAG_OPTIONS.map(fl => {
                      const checked = Boolean(novel.flags?.[fl.key]);
                      return `
                        <button type="button" onclick="toggleKitchenFlag('${novel.id}', '${fl.key}')" class="px-3 py-2.5 rounded-2xl border text-xs font-bold text-left flex items-center gap-2 transition ${checked ? 'bg-stone-800 text-white border-stone-900 shadow-xs' : 'bg-white text-stone-700 border-stone-200 hover:bg-stone-50'}">
                          <span>${checked ? '☑' : '☐'}</span>
                          <span class="truncate">${fl.label}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- 3. 작품별 태그 (최대 5개 + 저장된 태그풀 선택) -->
                <div class="bg-white rounded-2xl p-3 border border-stone-200 space-y-2.5">
                  <div class="flex items-center justify-between">
                    <label class="text-xs font-extrabold text-stone-800">3. 작품별 핵심 태그 (${(novel.tags || []).length}/5)</label>
                    <span class="text-[10px] text-stone-400">저장 후 재사용 가능</span>
                  </div>

                  <!-- 현재 적용된 태그 -->
                  <div class="flex flex-wrap gap-1.5 min-h-[26px]">
                    ${(novel.tags || []).length === 0 ? `<span class="text-[11px] text-stone-400">등록된 태그가 없습니다.</span>` : (novel.tags || []).map(t => `
                      <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-orange-100 text-orange-800 text-xs font-bold">
                        #${escapeHtml(t)}
                        <button type="button" onclick="removeTagFromNovel('${novel.id}', '${escapeHtml(t).replace(/'/g, "\\'")}')" class="text-orange-600 hover:text-orange-900 font-extrabold ml-0.5">×</button>
                      </span>
                    `).join('')}
                  </div>

                  <!-- 태그 입력창 -->
                  <div class="flex gap-1.5">
                    <input
                      id="tag-input-${novel.id}"
                      type="text"
                      onkeydown="handleTagInputKey(event, '${novel.id}')"
                      placeholder="태그 입력 (예: 회귀사이다)"
                      class="flex-1 px-3 py-2 rounded-xl bg-stone-50 border border-stone-200 text-xs font-medium focus:outline-none focus:border-orange-500"
                    />
                    <button type="button" onclick="addTagToNovel('${novel.id}', document.getElementById('tag-input-${novel.id}').value)" class="px-3 py-2 rounded-xl bg-stone-800 text-white text-xs font-bold">
                      추가
                    </button>
                  </div>

                  <!-- 기존 저장된 태그풀 빠른 선택 -->
                  ${state.tagPool.length > 0 ? `
                    <div class="pt-1 border-t border-stone-100">
                      <p class="text-[10px] font-bold text-stone-400 mb-1.5">저장된 태그 빠른 선택 (터치하여 추가)</p>
                      <div class="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
                        ${state.tagPool.map(pt => {
                          const already = (novel.tags || []).includes(pt);
                          return `
                            <button type="button" onclick="addTagToNovel('${novel.id}', '${escapeHtml(pt).replace(/'/g, "\\'")}')" class="px-2 py-0.5 rounded-full text-[11px] font-semibold border transition ${already ? 'bg-orange-500 text-white border-orange-600' : 'bg-stone-50 text-stone-600 border-stone-200 hover:bg-stone-100'}">
                              #${escapeHtml(pt)}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  ` : ''}
                </div>

                <!-- 하단 조리 완료 & 삭제 버튼 -->
                <div class="flex gap-2 pt-1">
                  <button type="button" onclick="deleteNovelById('${novel.id}')" class="px-4 py-3 rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-extrabold transition">
                    🗑️ 삭제
                  </button>
                  <button type="button" onclick="completeCooking('${novel.id}')" class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-xs font-extrabold shadow-sm transition">
                    ✅ 조리 완료 (이동하기)
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/**
 * ============================================================================
 * 8. [카테고리 3] 🏅 미슐랭 (티어별 분포 그래프 + 티어 필터링 + 메달 뱃지 + 수정/삭제)
 * ============================================================================
 */
function selectMichelinTier(tier) {
  state.michelinSelectedTier = state.michelinSelectedTier === tier ? 'ALL' : tier;
  renderAll();
}

function renderMichelinView() {
  // 미슐랭 선정이 입력된 모든 작품 (유료 도달이 분석 전이 아니거나 수치 입력된 작품 포함, 혹은 전체 티어 조회)
  const michelinNovels = state.novels.filter(n => {
    const m = n.michelin;
    if (!m) return false;
    return m.hasEntered || (m.tier && m.tier !== '분석 전') || m.conversionRate !== null || m.freeLastEp !== null;
  });

  const displayTiers = ['전환 1티어', '전환 2티어', '전환 3티어', '전환 4티어', '전환 예정', '폐사', '분석 전'];
  const tierColors = {
    '전환 1티어': 'bg-amber-500',
    '전환 2티어': 'bg-slate-500',
    '전환 3티어': 'bg-orange-500',
    '전환 4티어': 'bg-teal-500',
    '전환 예정': 'bg-blue-500',
    '폐사': 'bg-rose-500',
    '분석 전': 'bg-stone-400'
  };

  const counts = {};
  displayTiers.forEach(t => {
    counts[t] = michelinNovels.filter(n => (n.michelin?.tier || '분석 전') === t).length;
  });
  const maxCount = Math.max(1, ...Object.values(counts));

  const filteredList = state.michelinSelectedTier === 'ALL'
    ? michelinNovels
    : michelinNovels.filter(n => (n.michelin?.tier || '분석 전') === state.michelinSelectedTier);

  return `
    <div class="space-y-4">
      <!-- 상단 그래프 카드 -->
      <section class="bg-white rounded-3xl p-4 shadow-xs border border-stone-200/90 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-[11px] font-bold text-amber-700">MICHELIN TIER ANALYTICS</span>
            <h2 class="text-base font-extrabold text-stone-900">🏅 미슐랭 유료 전환 티어 분포</h2>
          </div>
          <span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">총 ${michelinNovels.length}편</span>
        </div>
        <p class="text-[11px] text-stone-500">막대 그래프를 터치하면 해당 티어 작품만 모아볼 수 있습니다.</p>

        <!-- 가로형 인터랙티브 티어 차트 -->
        <div class="space-y-2 pt-1">
          ${displayTiers.map(tier => {
            const cnt = counts[tier];
            const pct = Math.round((cnt / maxCount) * 100);
            const isSelected = state.michelinSelectedTier === tier;
            return `
              <button type="button" onclick="selectMichelinTier('${tier}')" class="w-full text-left p-2 rounded-2xl border transition ${isSelected ? 'bg-amber-50 border-amber-400 ring-1 ring-amber-300' : 'bg-stone-50/70 border-stone-100 hover:bg-stone-100'}">
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="font-extrabold text-stone-800 flex items-center gap-1.5">
                    <span>${tier}</span>
                    ${getTierMedalBadge(tier)}
                  </span>
                  <span class="font-extrabold ${isSelected ? 'text-amber-700' : 'text-stone-600'}">${cnt}편</span>
                </div>
                <div class="w-full h-2.5 bg-stone-200/80 rounded-full overflow-hidden">
                  <div class="h-full ${tierColors[tier]} rounded-full transition-all duration-300" style="width: ${cnt === 0 ? 0 : Math.max(6, pct)}%"></div>
                </div>
              </button>
            `;
          }).join('')}
        </div>

        ${state.michelinSelectedTier !== 'ALL' ? `
          <div class="flex items-center justify-between pt-1">
            <span class="text-xs font-bold text-amber-800">필터 적용: <strong>${state.michelinSelectedTier}</strong></span>
            <button onclick="selectMichelinTier('ALL')" class="text-xs font-extrabold text-stone-600 underline">전체 보기</button>
          </div>
        ` : ''}
      </section>

      <!-- 필터링된 작품 목록 -->
      <section class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h3 class="text-sm font-extrabold text-stone-800">
            ${state.michelinSelectedTier === 'ALL' ? '전체 미슐랭 선정작' : `${state.michelinSelectedTier} 작품 목록`} (${filteredList.length})
          </h3>
        </div>

        ${filteredList.length === 0 ? `
          <div class="bg-white rounded-3xl p-7 text-center border border-stone-200">
            <p class="text-xs font-bold text-stone-500">해당 조건의 미슐랭 선정 작품이 없습니다.</p>
            <p class="text-[11px] text-stone-400 mt-1">제품 등록 3단계 또는 수정하기에서 유료 도달 정보를 입력해 주세요.</p>
          </div>
        ` : filteredList.map(novel => {
          const m = novel.michelin || {};
          return `
            <div class="bg-white rounded-2xl p-3.5 border border-stone-200 shadow-2xs space-y-2">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 text-[10px] font-extrabold">${escapeHtml(m.tier || '분석 전')}</span>
                    ${novel.genre ? `<span class="px-1.5 py-0.5 rounded-md bg-stone-100 text-stone-600 text-[10px] font-semibold">${escapeHtml(novel.genre)}</span>` : ''}
                    <span class="text-[11px] text-stone-500">${escapeHtml(novel.author || '작가 미상')}</span>
                  </div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <h4 class="text-sm font-extrabold text-stone-900 truncate">${escapeHtml(novel.title)}</h4>
                    ${getTierMedalBadge(m.tier)}
                  </div>
                </div>
                <button onclick="openEditNovelModal('${novel.id}')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold transition">
                  수정하기
                </button>
              </div>
              <div class="grid grid-cols-2 gap-2 pt-2 border-t border-stone-100 text-[11px]">
                <div class="bg-stone-50 rounded-xl px-2.5 py-1.5 flex justify-between">
                  <span class="text-stone-500">전환값</span>
                  <span class="font-extrabold text-stone-800">${m.conversionRate !== null && m.conversionRate !== undefined ? m.conversionRate : '-'}</span>
                </div>
                <div class="bg-stone-50 rounded-xl px-2.5 py-1.5 flex justify-between">
                  <span class="text-stone-500">무료 최종화</span>
                  <span class="font-extrabold text-stone-800">${m.freeLastEp !== null && m.freeLastEp !== undefined ? m.freeLastEp + '화' : '-'}</span>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </section>
    </div>
  `;
}

/**
 * ============================================================================
 * 9. [카테고리 4] 🗄️ 팬트리 (최근순, 별점순, 레전드, 슈퍼노멀, 냉장고 + 세부 수정 + 레시피분석 재전송)
 * ============================================================================
 */
function setPantryFilter(filterKey) {
  state.pantryFilter = filterKey;
  renderAll();
}

function sendBackToRecipeAnalysis(id) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  novel.inRecipeQueue = true;
  novel.recipeCompleted = false;
  if (!novel.flags) novel.flags = {};
  novel.flags.recipe = true;
  state.recipeSelectedNovelId = novel.id;
  saveState();
  showToast(`'${novel.title}' 작품을 📖 레시피분석으로 다시 보냈습니다!`, 'success');
  switchTab('recipe');
}

function renderPantryView() {
  let pantryNovels = state.novels.filter(n => n.stage === 'pantry');

  if (state.pantryFilter === 'legend') {
    pantryNovels = pantryNovels.filter(n => n.flags?.legend);
  } else if (state.pantryFilter === 'supernormal') {
    pantryNovels = pantryNovels.filter(n => n.flags?.supernormal);
  } else if (state.pantryFilter === 'fridge') {
    pantryNovels = pantryNovels.filter(n => n.flags?.fridge);
  }

  if (state.pantryFilter === 'rating') {
    pantryNovels = [...pantryNovels].sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else {
    pantryNovels = [...pantryNovels].sort((a, b) => new Date(b.cookedAt || b.registeredAt) - new Date(a.cookedAt || a.registeredAt));
  }

  const tabs = [
    { id: 'recent', label: '최근순' },
    { id: 'rating', label: '별점순' },
    { id: 'legend', label: '레전드' },
    { id: 'supernormal', label: '슈퍼노멀' },
    { id: 'fridge', label: '냉장고' }
  ];

  return `
    <div class="space-y-4">
      <div class="bg-gradient-to-r from-stone-800 to-stone-700 rounded-3xl p-4 text-white shadow-md">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[11px] font-semibold opacity-80">CURATED ARCHIVE</p>
            <h2 class="text-lg font-extrabold tracking-tight mt-0.5">🗄️ 팬트리 (조리 완료 보관함)</h2>
          </div>
          <span class="px-3 py-1 rounded-full bg-white/15 text-xs font-extrabold">${pantryNovels.length}편</span>
        </div>
        <!-- 5대 카테고리 필터 버튼 -->
        <div class="grid grid-cols-5 gap-1 mt-3 bg-black/25 p-1 rounded-2xl">
          ${tabs.map(t => {
            const active = state.pantryFilter === t.id;
            return `
              <button onclick="setPantryFilter('${t.id}')" class="py-2 rounded-xl text-[11px] font-extrabold transition ${active ? 'bg-amber-400 text-stone-950 shadow-xs' : 'text-stone-300 hover:text-white'}">
                ${t.label}
              </button>
            `;
          }).join('')}
        </div>
      </div>

      ${pantryNovels.length === 0 ? `
        <div class="bg-white rounded-3xl p-8 text-center border border-stone-200 space-y-2">
          <div class="text-4xl">🥫</div>
          <p class="text-sm font-extrabold text-stone-700">조건에 맞는 작품이 없습니다</p>
          <p class="text-xs text-stone-500">조리실에서 시식 평가 후 '조리 완료'를 누르면 팬트리에 저장됩니다.</p>
        </div>
      ` : pantryNovels.map(novel => {
        const starObj = STAR_OPTIONS.find(s => s.value === (novel.rating || 0)) || STAR_OPTIONS[0];
        const activeFlags = FLAG_OPTIONS.filter(fl => novel.flags?.[fl.key]);

        return `
          <div class="bg-white rounded-3xl p-4 border border-stone-200 shadow-2xs space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">${escapeHtml(novel.genre)}</span>
                  <span class="text-[11px] font-semibold text-stone-500">${escapeHtml(novel.author)}</span>
                  ${getTierMedalBadge(novel.michelin?.tier)}
                </div>
                <h3 class="text-base font-extrabold text-stone-900 mt-1 leading-snug">${escapeHtml(novel.title)}</h3>
              </div>
              <span class="shrink-0 px-2.5 py-1 rounded-xl bg-amber-50 text-amber-800 border border-amber-200 text-[11px] font-extrabold">
                ${starObj.short}
              </span>
            </div>

            <!-- 분류 및 태그 칩 -->
            <div class="flex flex-wrap gap-1">
              ${activeFlags.map(fl => `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${fl.color}">${fl.label}</span>`).join('')}
              ${(novel.tags || []).map(t => `<span class="px-2 py-0.5 rounded-md bg-stone-100 text-stone-600 text-[10px] font-semibold">#${escapeHtml(t)}</span>`).join('')}
            </div>

            <!-- 하단 버튼: 수정하기 / 레시피분석으로 다시 보내기 -->
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-stone-100">
              <button onclick="openEditNovelModal('${novel.id}')" class="py-2.5 px-3 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-extrabold transition">
                ✏️ 수정하기
              </button>
              <button onclick="sendBackToRecipeAnalysis('${novel.id}')" class="py-2.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-extrabold transition">
                📖 레시피분석으로 다시 보내기
              </button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/**
 * ============================================================================
 * 10. [카테고리 5] 📖 레시피분석 ([메타데이터] 취향 그래프 + 7대 계층형 레시피 선택 + 분석완료)
 * ============================================================================
 */
function selectRecipeNovel(id) {
  state.recipeSelectedNovelId = id;
  renderAll();
}

function selectRecipeAxis(axisId) {
  state.recipeActiveAxis = axisId;
  state.recipeSearchQuery = '';
  renderAll();
}

function toggleRecipeGroupExpand(groupId) {
  state.recipeExpandedGroups[groupId] = !state.recipeExpandedGroups[groupId];
  renderAll();
}

function toggleRecipeMajorGroup(novelId, axisId, groupName) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;
  if (!novel.recipes) novel.recipes = {};
  if (!novel.recipes[axisId]) novel.recipes[axisId] = { majors: [], items: [] };

  const list = novel.recipes[axisId].majors;
  const idx = list.indexOf(groupName);
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.push(groupName);
  }
  saveState();
  renderAll();
}

function toggleRecipeSubItem(novelId, axisId, itemName) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;
  if (!novel.recipes) novel.recipes = {};
  if (!novel.recipes[axisId]) novel.recipes[axisId] = { majors: [], items: [] };

  const list = novel.recipes[axisId].items;
  const idx = list.indexOf(itemName);
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.push(itemName);
  }
  saveState();
  renderAll();
}

function completeRecipeAnalysis(novelId) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;
  novel.inRecipeQueue = false;
  novel.recipeCompleted = true;
  if (state.recipeSelectedNovelId === novelId) {
    state.recipeSelectedNovelId = null;
  }
  saveState();
  renderAll();
  showToast(`'${novel.title}' 레시피 분석이 완료되었습니다! 메타데이터에 반영됩니다.`, 'success');
}

function hasAnyRecipeData(novel) {
  if (!novel.recipes) return false;
  return Object.values(novel.recipes).some(ax => (ax.majors?.length || 0) > 0 || (ax.items?.length || 0) > 0);
}

function renderRecipeView() {
  // 1. 상단 [메타데이터] 취향 분석 계산
  const analyzedNovels = state.novels.filter(n => hasAnyRecipeData(n) || n.recipeCompleted);
  const genreCounts = {};
  const recipeGenreMajorCounts = {};

  analyzedNovels.forEach(n => {
    if (n.genre) {
      genreCounts[n.genre] = (genreCounts[n.genre] || 0) + 1;
    }
    const gMajors = n.recipes?.genre?.majors || [];
    gMajors.forEach(m => {
      recipeGenreMajorCounts[m] = (recipeGenreMajorCounts[m] || 0) + 1;
    });
  });

  const sortedGenres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);
  const maxGenreCnt = sortedGenres.length > 0 ? sortedGenres[0][1] : 1;

  const sortedRecipeMajors = Object.entries(recipeGenreMajorCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // 2. 레시피분석 대기열 작품 목록
  const queueNovels = state.novels.filter(n => n.inRecipeQueue);
  if (queueNovels.length > 0 && (!state.recipeSelectedNovelId || !queueNovels.some(n => n.id === state.recipeSelectedNovelId))) {
    state.recipeSelectedNovelId = queueNovels[0].id;
  }
  const activeNovel = queueNovels.find(n => n.id === state.recipeSelectedNovelId) || null;
  const activeAxisObj = RECIPE_TAXONOMY.find(a => a.id === state.recipeActiveAxis) || RECIPE_TAXONOMY[0];

  return `
    <div class="space-y-4">
      <!-- 상단 [메타데이터] 취향 분석 대시보드 -->
      <section class="bg-white rounded-3xl p-4 shadow-xs border border-emerald-200/90 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">[메타데이터]</span>
            <h2 class="text-base font-extrabold text-stone-900 mt-1">📊 나의 웹소설 취향 &amp; 장르 분석</h2>
          </div>
          <span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl">누적 ${analyzedNovels.length}편</span>
        </div>

        ${sortedGenres.length === 0 ? `
          <p class="text-xs text-stone-400 py-2">레시피가 등록된 작품이 쌓이면 선호 장르 취향이 자동으로 그래프화됩니다.</p>
        ` : `
          <div class="space-y-2">
            ${sortedGenres.slice(0, 6).map(([gName, cnt]) => {
              const pct = Math.round((cnt / analyzedNovels.length) * 100);
              const barWidth = Math.round((cnt / maxGenreCnt) * 100);
              return `
                <div>
                  <div class="flex justify-between text-xs mb-0.5">
                    <span class="font-bold text-stone-800">${escapeHtml(gName)}</span>
                    <span class="font-extrabold text-emerald-700">${cnt}편 (${pct}%)</span>
                  </div>
                  <div class="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full" style="width: ${barWidth}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}

        ${sortedRecipeMajors.length > 0 ? `
          <div class="pt-2 border-t border-stone-100">
            <p class="text-[11px] font-bold text-stone-500 mb-1.5">세부 레시피 선호 계열 TOP</p>
            <div class="flex flex-wrap gap-1.5">
              ${sortedRecipeMajors.map(([mName, cnt]) => `
                <span class="px-2.5 py-1 rounded-full bg-teal-50 text-teal-800 border border-teal-200 text-[11px] font-bold">
                  ${escapeHtml(mName)} · ${cnt}
                </span>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </section>

      <!-- 분석 대상 작품 선택 -->
      <section class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h3 class="text-sm font-extrabold text-stone-800">📖 레시피분석 대기 작품 (${queueNovels.length})</h3>
          <span class="text-[11px] text-stone-500">계열만 선택하거나 세부항목 추가</span>
        </div>

        ${queueNovels.length === 0 ? `
          <div class="bg-white rounded-3xl p-7 text-center border border-stone-200 space-y-2">
            <div class="text-4xl">🧪</div>
            <p class="text-sm font-extrabold text-stone-700">분석 대기 중인 작품이 없습니다</p>
            <p class="text-xs text-stone-500">조리실에서 '레시피분석 (좋은소스)' 체크 후 조리 완료하거나, 팬트리에서 다시 보내기를 눌러주세요.</p>
          </div>
        ` : `
          <!-- 작품 선택 가로 스크롤 탭 -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            ${queueNovels.map(n => {
              const selected = activeNovel && activeNovel.id === n.id;
              return `
                <button onclick="selectRecipeNovel('${n.id}')" class="shrink-0 px-3.5 py-2.5 rounded-2xl border text-left transition ${selected ? 'bg-stone-900 text-white border-stone-900 shadow-sm' : 'bg-white text-stone-700 border-stone-200'}">
                  <div class="text-[10px] opacity-75 font-semibold">${escapeHtml(n.genre)} · ${escapeHtml(n.author)}</div>
                  <div class="text-xs font-extrabold truncate max-w-[160px]">${escapeHtml(n.title)}</div>
                </button>
              `;
            }).join('')}
          </div>

          ${activeNovel ? renderRecipeWorkspace(activeNovel, activeAxisObj) : ''}
        `}
      </section>
    </div>
  `;
}

function renderRecipeWorkspace(novel, activeAxisObj) {
  const axisData = novel.recipes?.[activeAxisObj.id] || { majors: [], items: [] };
  const query = (state.recipeSearchQuery || '').trim().toLowerCase();

  // 전체 7개 축에 선택된 레시피 요약 배지
  const summaryBadges = [];
  RECIPE_TAXONOMY.forEach(ax => {
    const d = novel.recipes?.[ax.id];
    if (d) {
      (d.majors || []).forEach(m => summaryBadges.push({ axisId: ax.id, type: 'major', label: m }));
      (d.items || []).forEach(it => summaryBadges.push({ axisId: ax.id, type: 'item', label: it }));
    }
  });

  return `
    <div class="bg-white rounded-3xl p-4 border border-stone-200 shadow-xs space-y-4">
      <!-- 현재 분석 중인 작품 헤더 -->
      <div class="flex items-center justify-between gap-2 pb-3 border-b border-stone-100">
        <div class="min-w-0">
          <span class="text-[10px] font-extrabold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">분석 중</span>
          <h4 class="text-base font-extrabold text-stone-900 truncate mt-1">${escapeHtml(novel.title)}</h4>
        </div>
        <button onclick="completeRecipeAnalysis('${novel.id}')" class="shrink-0 px-3.5 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-xs transition">
          ✅ 분석완료
        </button>
      </div>

      <!-- 선택된 레시피 칩 요약 -->
      <div class="bg-stone-50 rounded-2xl p-3 space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-extrabold text-stone-700">선택된 레시피 요소 (${summaryBadges.length})</span>
          <span class="text-[10px] text-stone-400">터치 시 해제</span>
        </div>
        <div class="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
          ${summaryBadges.length === 0 ? `<span class="text-[11px] text-stone-400">아직 선택된 항목이 없습니다. 아래에서 큰 계열 또는 세부 항목을 선택하세요.</span>` : summaryBadges.map(b => `
            <button
              type="button"
              onclick="${b.type === 'major' ? `toggleRecipeMajorGroup('${novel.id}', '${b.axisId}', '${escapeHtml(b.label).replace(/'/g, "\\'")}')` : `toggleRecipeSubItem('${novel.id}', '${b.axisId}', '${escapeHtml(b.label).replace(/'/g, "\\'")}')`}"
              class="px-2 py-0.5 rounded-full text-[11px] font-bold border ${b.type === 'major' ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-emerald-100 text-emerald-900 border-emerald-300'}"
            >
              ${b.type === 'major' ? '★ ' : '#'}${escapeHtml(b.label)} ×
            </button>
          `).join('')}
        </div>
      </div>

      <!-- 7대 레시피 축 선택 탭 -->
      <div class="grid grid-cols-4 gap-1.5">
        ${RECIPE_TAXONOMY.map(ax => {
          const isAct = ax.id === activeAxisObj.id;
          const cnt = (novel.recipes?.[ax.id]?.majors?.length || 0) + (novel.recipes?.[ax.id]?.items?.length || 0);
          return `
            <button type="button" onclick="selectRecipeAxis('${ax.id}')" class="py-2 px-1.5 rounded-xl border text-[11px] font-extrabold transition flex items-center justify-center gap-1 ${isAct ? 'bg-amber-500 text-white border-amber-600 shadow-2xs' : 'bg-stone-50 text-stone-700 border-stone-200'}">
              <span>${ax.label}</span>
              ${cnt > 0 ? `<span class="px-1 rounded-full text-[9px] ${isAct ? 'bg-white text-amber-700' : 'bg-amber-200 text-amber-900'}">${cnt}</span>` : ''}
            </button>
          `;
        }).join('')}
      </div>

      <!-- 현재 축 내 키워드 빠른 필터 -->
      <div>
        <input
          type="text"
          value="${escapeHtml(state.recipeSearchQuery)}"
          oninput="state.recipeSearchQuery = this.value; renderAll();"
          placeholder="${activeAxisObj.label} 내 키워드 검색..."
          class="w-full px-3.5 py-2 rounded-xl bg-stone-50 border border-stone-200 text-xs focus:outline-none focus:border-amber-500"
        />
      </div>

      <!-- 큰 계열 선택 + 세부 항목 아코디언 -->
      <div class="space-y-2 max-h-[420px] overflow-y-auto pr-0.5">
        ${activeAxisObj.groups.map(grp => {
          const filteredItems = query
            ? grp.items.filter(it => it.toLowerCase().includes(query) || grp.name.toLowerCase().includes(query))
            : grp.items;
          if (query && filteredItems.length === 0 && !grp.name.toLowerCase().includes(query)) {
            return '';
          }

          const isMajorChecked = (axisData.majors || []).includes(grp.name);
          const selectedSubCount = grp.items.filter(it => (axisData.items || []).includes(it)).length;
          const isExpanded = Boolean(state.recipeExpandedGroups[grp.id]) || Boolean(query);

          return `
            <div class="rounded-2xl border ${isMajorChecked || selectedSubCount > 0 ? 'border-amber-300 bg-amber-50/30' : 'border-stone-200 bg-white'} overflow-hidden">
              <div class="p-2.5 flex items-center justify-between gap-2">
                <!-- 큰 계열 직접 선택 버튼 -->
                <button
                  type="button"
                  onclick="toggleRecipeMajorGroup('${novel.id}', '${activeAxisObj.id}', '${escapeHtml(grp.name).replace(/'/g, "\\'")}')"
                  class="flex-1 flex items-center gap-2 text-left py-1 px-1.5 rounded-xl transition ${isMajorChecked ? 'bg-amber-500 text-white font-extrabold' : 'text-stone-800 font-bold hover:bg-stone-100'}"
                >
                  <span class="text-xs">${isMajorChecked ? '☑' : '☐'}</span>
                  <span class="text-xs leading-tight">${escapeHtml(grp.name)}</span>
                </button>

                <!-- 세부 항목 펼치기/접기 버튼 -->
                <button
                  type="button"
                  onclick="toggleRecipeGroupExpand('${grp.id}')"
                  class="shrink-0 px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-[11px] font-bold text-stone-700 flex items-center gap-1"
                >
                  <span>세부${selectedSubCount > 0 ? ` (${selectedSubCount})` : ''}</span>
                  <span>${isExpanded ? '▲' : '▼'}</span>
                </button>
              </div>

              ${isExpanded ? `
                <div class="px-3 pb-3 pt-1.5 border-t border-stone-100 bg-white flex flex-wrap gap-1.5">
                  ${filteredItems.map(item => {
                    const checked = (axisData.items || []).includes(item);
                    return `
                      <button
                        type="button"
                        onclick="toggleRecipeSubItem('${novel.id}', '${activeAxisObj.id}', '${escapeHtml(item).replace(/'/g, "\\'")}')"
                        class="px-2.5 py-1.5 rounded-xl border text-[11px] font-bold transition ${checked ? 'bg-emerald-600 text-white border-emerald-700 shadow-2xs' : 'bg-stone-50 text-stone-600 border-stone-200 hover:bg-stone-100'}"
                      >
                        ${checked ? '✓ ' : ''}${escapeHtml(item)}
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/**
 * ============================================================================
 * 11. [카테고리 6] 🧼 설거지 (일별 등록 편수 캘린더 + 월별 통계 + 데이터 백업/복구)
 * ============================================================================
 */
function changeCalMonth(delta) {
  let m = state.calMonth + delta;
  let y = state.calYear;
  if (m < 0) {
    m = 11;
    y -= 1;
  } else if (m > 11) {
    m = 0;
    y += 1;
  }
  state.calMonth = m;
  state.calYear = y;
  renderAll();
}

function selectCalDate(dateStr) {
  state.calSelectedDate = dateStr;
  renderAll();
}

function exportBackupJSON() {
  try {
    const backupData = {
      appName: '쉐프 노트 (Chef Note)',
      version: '1.0',
      exportedAt: new Date().toISOString(),
      novels: state.novels,
      tagPool: state.tagPool
    };
    const jsonStr = JSON.stringify(backupData, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `chef_note_backup_${getTodayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('백업 JSON 파일이 다운로드되었습니다.', 'success');
  } catch (e) {
    showToast('백업 파일 생성 중 오류가 발생했습니다.', 'error');
  }
}

function triggerImportJSON() {
  const input = document.getElementById('backup-file-input');
  if (input) input.click();
}

function handleImportJSONFile(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed || !Array.isArray(parsed.novels)) {
        showToast('올바른 쉐프 노트 백업 파일이 아닙니다.', 'error');
        return;
      }
      openConfirmDialog({
        title: '데이터 복구',
        message: `백업 파일의 작품 ${parsed.novels.length}편으로 현재 데이터를 복구(덮어쓰기)하시겠습니까?`,
        confirmText: '복구하기',
        isDanger: false,
        onConfirm: () => {
          state.novels = parsed.novels;
          if (Array.isArray(parsed.tagPool)) {
            state.tagPool = parsed.tagPool;
          }
          saveState();
          renderAll();
          showToast('데이터가 성공적으로 복구되었습니다!', 'success');
        }
      });
    } catch (err) {
      showToast('JSON 파일을 읽는 데 실패했습니다.', 'error');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function renderDishwashView() {
  const y = state.calYear;
  const m = state.calMonth;
  const firstDay = new Date(y, m, 1).getDay(); // 0(일) ~ 6(토)
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthPrefix = `${y}-${String(m + 1).padStart(2, '0')}`;

  // 날짜별 등록(인풋) 작품 매핑
  const dateMap = {};
  state.novels.forEach(n => {
    const dStr = n.registeredDate || (n.registeredAt ? n.registeredAt.slice(0, 10) : '');
    if (dStr) {
      if (!dateMap[dStr]) dateMap[dStr] = [];
      dateMap[dStr].push(n);
    }
  });

  // 월별 통계 계산
  const monthNovels = state.novels.filter(n => {
    const dStr = n.registeredDate || (n.registeredAt ? n.registeredAt.slice(0, 10) : '');
    return dStr.startsWith(monthPrefix);
  });
  const activeDaysCount = Object.keys(dateMap).filter(k => k.startsWith(monthPrefix)).length;
  const monthTieredCount = monthNovels.filter(n => ['전환 1티어', '전환 2티어', '전환 3티어', '전환 4티어'].includes(n.michelin?.tier)).length;
  const monthHighRatedCount = monthNovels.filter(n => (n.rating || 0) >= 3).length;

  const selectedDayNovels = dateMap[state.calSelectedDate] || [];

  return `
    <div class="space-y-4">
      <!-- 월별 통계 요약 카드 -->
      <section class="bg-gradient-to-br from-sky-600 to-indigo-700 rounded-3xl p-4 text-white shadow-md space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[11px] font-semibold opacity-85">MONTHLY INPUT ANALYTICS</p>
            <h2 class="text-lg font-extrabold tracking-tight mt-0.5">🧼 설거지 &amp; 월별 등록 통계</h2>
          </div>
          <span class="px-2.5 py-1 rounded-full bg-white/20 text-xs font-extrabold">${y}년 ${m + 1}월</span>
        </div>

        <div class="grid grid-cols-4 gap-2 pt-1">
          <div class="bg-white/15 rounded-2xl p-2.5 text-center">
            <div class="text-[10px] opacity-85">월 총 등록</div>
            <div class="text-base font-extrabold mt-0.5">${monthNovels.length}편</div>
          </div>
          <div class="bg-white/15 rounded-2xl p-2.5 text-center">
            <div class="text-[10px] opacity-85">활동 일수</div>
            <div class="text-base font-extrabold mt-0.5">${activeDaysCount}일</div>
          </div>
          <div class="bg-white/15 rounded-2xl p-2.5 text-center">
            <div class="text-[10px] opacity-85">1~4티어</div>
            <div class="text-base font-extrabold mt-0.5">${monthTieredCount}편</div>
          </div>
          <div class="bg-white/15 rounded-2xl p-2.5 text-center">
            <div class="text-[10px] opacity-85">★★★ 이상</div>
            <div class="text-base font-extrabold mt-0.5">${monthHighRatedCount}편</div>
          </div>
        </div>
      </section>

      <!-- 등록 달력 -->
      <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-xs space-y-3">
        <div class="flex items-center justify-between">
          <button onclick="changeCalMonth(-1)" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-extrabold">◀ 이전달</button>
          <h3 class="text-sm font-extrabold text-stone-900">📅 ${y}년 ${m + 1}월 인풋 캘린더</h3>
          <button onclick="changeCalMonth(1)" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-extrabold">다음달 ▶</button>
        </div>

        <!-- 요일 헤더 -->
        <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-extrabold text-stone-400">
          <div class="text-rose-500">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="text-blue-500">토</div>
        </div>

        <!-- 날짜 그리드 -->
        <div class="grid grid-cols-7 gap-1">
          ${Array.from({ length: firstDay }).map(() => `<div class="h-12"></div>`).join('')}
          ${Array.from({ length: daysInMonth }).map((_, idx) => {
            const dayNum = idx + 1;
            const dStr = `${monthPrefix}-${String(dayNum).padStart(2, '0')}`;
            const count = (dateMap[dStr] || []).length;
            const isSelected = state.calSelectedDate === dStr;
            const isToday = getTodayStr() === dStr;

            return `
              <button
                type="button"
                onclick="selectCalDate('${dStr}')"
                class="h-12 rounded-2xl border flex flex-col items-center justify-between p-1 transition ${isSelected ? 'bg-indigo-600 text-white border-indigo-700 shadow-xs' : isToday ? 'bg-amber-50 border-amber-300 text-stone-900' : 'bg-stone-50/70 border-stone-100 text-stone-700 hover:bg-stone-100'}"
              >
                <span class="text-[11px] font-bold leading-none">${dayNum}</span>
                ${count > 0 ? `
                  <span class="px-1.5 py-0.5 rounded-full text-[9px] font-extrabold leading-none ${isSelected ? 'bg-white text-indigo-700' : 'bg-indigo-100 text-indigo-800'}">
                    ${count}편

        <!-- 선택한 날짜의 등록 작품 목록 -->
        <div class="pt-2 border-t border-stone-100 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-stone-800">📌 ${state.calSelectedDate} 등록 작품 (${selectedDayNovels.length}편)</span>

            <p class="text-xs text-stone-400 py-2">이 날짜에 등록된 작품이 없습니다.</p>
          ` : `
            <div class="space-y-1.5">
              ${selectedDayNovels.map(n => `
                <div class="px-3 py-2 rounded-xl bg-stone-50 border border-stone-200/80 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <p class="text-xs font-extrabold text-stone-900 truncate">${escapeHtml(n.title)}</p>
                    <p class="text-[10px] text-stone-500">${escapeHtml(n.genre || '임시등록')} · ${escapeHtml(n.author || '작가 미상')}</p>
                  </div>
                  ${getTierMedalBadge(n.michelin?.tier)}
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </section>

      <!-- 데이터 백업 및 복구 -->
      <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-xs space-y-3">
        <div>
          <h3 class="text-sm font-extrabold text-stone-900">💾 데이터 백업 및 복구</h3>
          <p class="text-[11px] text-stone-500 mt-0.5">브라우저 캐시 삭제에 대비해 전체 작품·별점·레시피 데이터를 파일로 보관하세요.</p>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" onclick="exportBackupJSON()" class="py-3 px-3 rounded-2xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-extrabold flex items-center justify-center gap-1.5 transition">
            <span>📤</span>
            <span>데이터 백업</span>
          </button>
          <button type="button" onclick="triggerImportJSON()" class="py-3 px-3 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 text-xs font-extrabold flex items-center justify-center gap-1.5 transition">
            <span>📥</span>
            <span>데이터 복구</span>
          </button>
        </div>
        <input id="backup-file-input" type="file" accept=".json,application/json" onchange="handleImportJSONFile(event)" class="hidden" />
      </section>
    </div>
  `;
}

/**
 * ============================================================================
 * 12. 공통 세부 수정 모달 (미슐랭, 팬트리 등에서 모든 항목 수정 및 삭제)
 * ============================================================================
 */
let editModalDraft = null;

function openEditNovelModal(id) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  editModalDraft = JSON.parse(JSON.stringify(novel));
  renderEditNovelModal();
}

function renderEditNovelModal() {
  const d = editModalDraft;
  if (!d) return;
  const root = document.getElementById('modal-root');
  root.classList.remove('hidden');

  root.innerHTML = `
    <div class="bg-white w-full max-w-[480px] max-h-[90vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl animate-pop-in">
      <div class="px-4 py-3.5 bg-stone-900 text-white flex items-center justify-between">
        <h3 class="text-sm font-extrabold">✏️ 작품 세부 정보 수정</h3>
        <button onclick="closeModal()" class="px-2.5 py-1 rounded-lg bg-white/15 text-xs font-bold">닫기 ✕</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 text-xs">
        <!-- 제목 -->
        <div>
          <label class="block font-extrabold text-stone-700 mb-1">작품 제목</label>
          <input type="text" value="${escapeHtml(d.title)}" oninput="editModalDraft.title = this.value" class="w-full px-3 py-2.5 rounded-xl bg-stone-50 border border-stone-200 font-bold text-sm" />
        </div>

        <!-- 출처 체크 -->
        <div>
          <label class="block font-extrabold text-stone-700 mb-1">메뉴 선정 출처</label>
          <div class="grid grid-cols-3 gap-1.5">
            ${SOURCE_OPTIONS.map(src => {
              const checked = (d.sources || []).includes(src);
              return `
                <button type="button" onclick="toggleEditModalSource('${src}')" class="py-2 rounded-xl border font-bold ${checked ? 'bg-amber-500 text-white border-amber-600' : 'bg-stone-50 text-stone-600 border-stone-200'}">
                  ${checked ? '☑' : '☐'} ${src}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 장르 & 작가명 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-extrabold text-stone-700 mb-1">장르</label>
            <select onchange="editModalDraft.genre = this.value" class="w-full px-3 py-2.5 rounded-xl bg-stone-50 border border-stone-200 font-bold">
              <option value="">미지정</option>
              ${GENRE_OPTIONS.map(g => `<option value="${g}" ${d.genre === g ? 'selected' : ''}>${g}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block font-extrabold text-stone-700 mb-1">작가명</label>
            <input type="text" value="${escapeHtml(d.author || '')}" oninput="editModalDraft.author = this.value" class="w-full px-3 py-2.5 rounded-xl bg-stone-50 border border-stone-200 font-bold" />
          </div>
        </div>

        <!-- 별점 -->
        <div>
          <label class="block font-extrabold text-stone-700 mb-1">별점 평가</label>
          <select onchange="editModalDraft.rating = Number(this.value)" class="w-full px-3 py-2.5 rounded-xl bg-stone-50 border border-stone-200 font-bold">
            ${STAR_OPTIONS.map(opt => `<option value="${opt.value}" ${(d.rating || 0) === opt.value ? 'selected' : ''}>${opt.label}</option>`).join('')}
          </select>
        </div>

        <!-- 성격 분류 -->
        <div>
          <label class="block font-extrabold text-stone-700 mb-1">추가 분류 (중복 선택)</label>
          <div class="grid grid-cols-2 gap-1.5">
            ${FLAG_OPTIONS.map(fl => {
              const checked = Boolean(d.flags?.[fl.key]);
              return `
                <button type="button" onclick="toggleEditModalFlag('${fl.key}')" class="py-2 px-2.5 rounded-xl border font-bold text-left ${checked ? 'bg-stone-800 text-white border-stone-900' : 'bg-stone-50 text-stone-700 border-stone-200'}">
                  ${checked ? '☑' : '☐'} ${fl.label}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 미슐랭 선정 -->
        <div class="p-3 rounded-2xl bg-purple-50/70 border border-purple-200 space-y-2.5">
          <label class="block font-extrabold text-purple-900">🏅 미슐랭 선정 정보</label>
          <div class="grid grid-cols-3 gap-1">
            ${TIER_OPTIONS.map(t => {
              const sel = (d.michelin?.tier || '분석 전') === t;
              return `
                <button type="button" onclick="editModalDraft.michelin.tier = '${t}'; renderEditNovelModal();" class="py-1.5 px-1 rounded-lg border text-[11px] font-bold ${sel ? 'bg-purple-600 text-white border-purple-700' : 'bg-white text-stone-700 border-stone-200'}">
                  ${t}
                </button>
              `;
            }).join('')}
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-stone-600 mb-1">전환값</label>
              <input type="number" step="any" value="${d.michelin?.conversionRate ?? ''}" oninput="editModalDraft.michelin.conversionRate = this.value === '' ? null : Number(this.value)" class="w-full px-2.5 py-2 rounded-xl bg-white border border-stone-200 font-bold" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-stone-600 mb-1">무료 최종화</label>
              <input type="number" value="${d.michelin?.freeLastEp ?? ''}" oninput="editModalDraft.michelin.freeLastEp = this.value === '' ? null : Number(this.value)" class="w-full px-2.5 py-2 rounded-xl bg-white border border-stone-200 font-bold" />
            </div>
          </div>
        </div>

        <!-- 태그 편집 -->
        <div>
          <label class="block font-extrabold text-stone-700 mb-1">작품 태그 (${(d.tags || []).length}/5)</label>
          <div class="flex flex-wrap gap-1 mb-1.5">
            ${(d.tags || []).map(t => `
              <span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 font-bold inline-flex items-center gap-1">
                #${escapeHtml(t)}
                <button type="button" onclick="editModalDraft.tags = editModalDraft.tags.filter(x => x !== '${escapeHtml(t).replace(/'/g, "\\'")}'); renderEditNovelModal();">×</button>
              </span>
            `).join('')}
          </div>
          <div class="flex gap-1.5">
            <input id="modal-tag-input" type="text" placeholder="새 태그 추가" class="flex-1 px-3 py-2 rounded-xl bg-stone-50 border border-stone-200" />
            <button type="button" onclick="addTagInEditModal()" class="px-3 py-2 rounded-xl bg-stone-800 text-white font-bold">추가</button>
          </div>
        </div>
      </div>

      <!-- 하단 저장 및 삭제 버튼 -->
      <div class="p-3.5 bg-stone-50 border-t border-stone-200 flex gap-2">
        <button type="button" onclick="deleteFromEditModal('${d.id}')" class="px-4 py-3 rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-extrabold">
          🗑️ 삭제
        </button>
        <button type="button" onclick="saveEditModal()" class="flex-1 py-3 rounded-2xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-extrabold">
          변경사항 저장
        </button>
      </div>
    </div>
  `;
}

function toggleEditModalSource(src) {
  if (!editModalDraft.sources) editModalDraft.sources = [];
  const idx = editModalDraft.sources.indexOf(src);
  if (idx >= 0) editModalDraft.sources.splice(idx, 1);
  else editModalDraft.sources.push(src);
  renderEditNovelModal();
}

function toggleEditModalFlag(key) {
  if (!editModalDraft.flags) editModalDraft.flags = {};
  editModalDraft.flags[key] = !editModalDraft.flags[key];
  renderEditNovelModal();
}

function addTagInEditModal() {
  const inp = document.getElementById('modal-tag-input');
  const val = (inp?.value || '').trim().replace(/^#/, '');
  if (!val) return;
  if (!editModalDraft.tags) editModalDraft.tags = [];
  if (editModalDraft.tags.length >= 5) {
    showToast('태그는 최대 5개까지 가능합니다.', 'error');
    return;
  }
  if (!editModalDraft.tags.includes(val)) {
    editModalDraft.tags.push(val);
    if (!state.tagPool.includes(val)) state.tagPool.unshift(val);
  }
  renderEditNovelModal();
}

function deleteFromEditModal(id) {
  deleteNovelById(id, () => closeModal());
}

function saveEditModal() {
  const d = editModalDraft;
  if (!d || !(d.title || '').trim()) {
    showToast('작품 제목은 비워둘 수 없습니다.', 'error');
    return;
  }
  d.title = d.title.trim();
  const m = d.michelin || {};
  m.hasEntered = (m.tier && m.tier !== '분석 전') || m.conversionRate !== null || m.freeLastEp !== null;
  d.michelin = m;

  const idx = state.novels.findIndex(n => n.id === d.id);
  if (idx !== -1) {
    state.novels[idx] = d;
  }
  saveState();
  closeModal();
  renderAll();
  showToast('작품 정보가 수정되었습니다.', 'success');
}

/**
 * ============================================================================
 * 13. 전체 작품 빠른 검색 모달
 * ============================================================================
 */
function openSearchModal() {
  const root = document.getElementById('modal-root');
  root.classList.remove('hidden');
  root.innerHTML = `
    <div class="bg-white w-full max-w-[480px] max-h-[85vh] rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl animate-pop-in">
      <div class="p-4 border-b border-stone-200 flex items-center gap-2">
        <input id="global-search-input" type="text" oninput="renderGlobalSearchResults(this.value)" placeholder="작품 제목, 작가명, 태그 검색..." class="flex-1 px-3.5 py-2.5 rounded-2xl bg-stone-100 text-sm font-semibold focus:outline-none" autofocus />
        <button onclick="closeModal()" class="px-3 py-2.5 rounded-2xl bg-stone-200 text-xs font-extrabold text-stone-700">닫기</button>
      </div>
      <div id="global-search-results" class="p-4 overflow-y-auto space-y-2 flex-1"></div>
    </div>
  `;
  renderGlobalSearchResults('');
}

function renderGlobalSearchResults(q) {
  const box = document.getElementById('global-search-results');
  if (!box) return;
  const query = (q || '').trim().toLowerCase();
  const matches = state.novels.filter(n => {
    if (!query) return true;
    return (
      (n.title || '').toLowerCase().includes(query) ||
      (n.author || '').toLowerCase().includes(query) ||
      (n.genre || '').toLowerCase().includes(query) ||
      (n.tags || []).some(t => t.toLowerCase().includes(query))
    );
  });

  if (matches.length === 0) {
    box.innerHTML = `<p class="text-center text-xs text-stone-400 py-8">검색 결과가 없습니다.</p>`;
    return;
  }

  const stageLabels = { temp: '📝 임시등록', kitchen: '🍳 조리실', pantry: '🗄️ 팬트리' };
  box.innerHTML = matches.map(n => `
    <div class="p-3 rounded-2xl border border-stone-200 flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-stone-100 text-stone-600">${stageLabels[n.stage] || '보관'}</span>
          <span class="text-[10px] text-stone-500">${escapeHtml(n.genre || '')} · ${escapeHtml(n.author || '')}</span>
          ${getTierMedalBadge(n.michelin?.tier)}
        </div>
        <p class="text-xs font-extrabold text-stone-900 truncate mt-1">${escapeHtml(n.title)}</p>
      </div>
      <button onclick="closeModal(); openEditNovelModal('${n.id}')" class="shrink-0 px-2.5 py-1.5 rounded-xl bg-amber-100 text-amber-900 text-[11px] font-bold">수정</button>
    </div>
  `).join('');
}

// 초기 실행
window.onload = function () {
  loadState();
  renderAll();
};
</script>
</body>
</html>
