            ${cells
              .map((c) => {
                if (c.empty) return `<div class="h-12 rounded-xl"></div>`;
                const isSelected = c.iso === selectedDate;
                const hasItems = c.count > 0;
                return `
                  <button
                    type="button"
                    onclick="selectCalendarDate('${c.iso}')"
                    class="h-12 rounded-xl border flex flex-col items-center justify-center transition active:scale-95 ${
                      isSelected
                        ? 'bg-orange-600 text-white border-orange-600 shadow-xs'
                        : hasItems
                        ? 'bg-amber-50 text-stone-900 border-amber-300'
                        : 'bg-stone-50/70 text-stone-600 border-stone-100'
                    }"
                  >
                    <span class="text-xs font-bold leading-none">${c.day}</span>
                    ${
                      hasItems
                        ? `<span class="mt-1 px-1.5 py-0.2 rounded-full text-[9px] font-extrabold ${
                            isSelected ? 'bg-white/25 text-white' : 'bg-orange-600 text-white'
                          }">${c.count}건</span>`
                        : `<span class="mt-1 text-[9px] opacity-40">-</span>`
                    }
                  </button>
                `;
              })
              .join('')}
          </div>

          <!-- 선택 일자 등록 작품 목록 -->
          <div class="pt-2.5 border-t border-stone-100 space-y-1.5">
            <div class="text-xs font-extrabold text-stone-800">
              ${escapeHTML(selectedDate)} 등록 작품 (${worksOnSelectedDate.length}편)
            </div>
            ${
              worksOnSelectedDate.length === 0
                ? `<p class="text-[11px] text-stone-400">해당 날짜에 등록된 작품이 없습니다.</p>`
                : worksOnSelectedDate
                    .map(
                      (w) => `
                      <div class="px-3 py-2 rounded-xl bg-stone-50 border border-stone-200/80 flex items-center justify-between text-xs">
                        <span class="font-bold text-stone-900 truncate">${escapeHTML(w.title)}</span>
                        <span class="text-[10px] font-semibold text-stone-500 ml-2 shrink-0">${escapeHTML(w.genre || '임시등록')}</span>
                      </div>
                    `
                    )
                    .join('')
            }
          </div>
        </section>

        <!-- 데이터 백업 및 복구 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-3">
          <div>
            <h3 class="text-sm font-extrabold text-stone-900">💾 데이터 백업 및 복구</h3>
            <p class="text-[11px] text-stone-500">전체 작품·태그·레시피·미슐랭 데이터를 JSON으로 안전하게 보관하세요.</p>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              onclick="downloadBackupJSON()"
              class="py-2.5 px-3 rounded-2xl bg-stone-900 text-white text-xs font-extrabold active:scale-95 transition"
            >
              ⬇️ JSON 파일 백업
            </button>
            <button
              type="button"
              onclick="copyBackupJSON()"
              class="py-2.5 px-3 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-extrabold active:scale-95 transition"
            >
              📋 백업 JSON 복사
            </button>
          </div>

          <div class="pt-2 border-t border-dashed border-stone-200 space-y-2">
            <label class="block text-xs font-bold text-stone-700">복구하기 (파일 선택 또는 JSON 붙여넣기)</label>
            <input
              type="file"
              accept=".json,application/json"
              onchange="handleBackupFileUpload(event)"
              class="block w-full text-[11px] text-stone-600 file:mr-2.5 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100"
            />
            <textarea
              id="restore-json-textarea"
              rows="3"
              placeholder="여기에 백업된 JSON 문자열을 붙여넣을 수 있습니다."
              class="w-full p-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-[11px] font-mono focus:outline-none focus:border-orange-500 focus:bg-white"
            ></textarea>
            <div class="flex gap-2">
              <button
                type="button"
                onclick="restoreFromTextarea()"
                class="flex-1 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-extrabold shadow-xs active:scale-95 transition"
              >
                ⬆️ 붙여넣은 JSON으로 복구
              </button>
              <button
                type="button"
                onclick="resetSampleData()"
                class="px-3 py-2.5 rounded-2xl bg-rose-50 text-rose-600 border border-rose-200 text-[11px] font-bold active:scale-95"
              >
                샘플 초기화
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function shiftDishwashMonth(delta) {
      let m = state.ui.dishwashMonth + delta;
      let y = state.ui.dishwashYear;
      if (m < 0) {
        m = 11;
        y -= 1;
      } else if (m > 11) {
        m = 0;
        y += 1;
      }
      state.ui.dishwashMonth = m;
      state.ui.dishwashYear = y;
      saveState();
      renderApp();
    }

    function selectCalendarDate(iso) {
      state.ui.selectedCalendarDate = iso;
      saveState();
      renderApp();
    }

    function buildBackupPayload() {
      return JSON.stringify(
        {
          app: '문피아 키친 (웹소설 주방)',
          exportedAt: new Date().toISOString(),
          works: state.works,
          tagPool: state.tagPool
        },
        null,
        2
      );
    }

    function downloadBackupJSON() {
      const jsonStr = buildBackupPayload();
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `munpia-kitchen-backup-${formatDateISO(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('백업 JSON 파일이 다운로드되었습니다.', 'success');
    }

    function copyBackupJSON() {
      copyToClipboard(buildBackupPayload(), '전체 백업 JSON이 클립보드에 복사되었습니다.');
    }

    function applyRestoredJSON(rawText) {
      try {
        const parsed = JSON.parse(rawText);
        const worksList = Array.isArray(parsed) ? parsed : parsed.works;
        if (!Array.isArray(worksList)) {
          showToast('유효한 작품 데이터가 포함된 JSON이 아닙니다.', 'error');
          return;
        }
        const def = getDefaultData();
        state.works = worksList;
        state.tagPool = Array.isArray(parsed.tagPool) ? parsed.tagPool : state.tagPool;
        state.ui = { ...def.ui };
        saveState();
        renderApp();
        showToast(`총 ${worksList.length}편의 작품 데이터가 성공적으로 복구되었습니다!`, 'success');
      } catch (err) {
        console.error(err);
        showToast('JSON 형식을 읽을 수 없습니다. 올바른 JSON인지 확인해 주세요.', 'error');
      }
    }

    function handleBackupFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        applyRestoredJSON(String(e.target.result || ''));
      };
      reader.onerror = () => {
        showToast('파일을 읽는 중 오류가 발생했습니다.', 'error');
      };
      reader.readAsText(file, 'utf-8');
      event.target.value = '';
    }

    function restoreFromTextarea() {
      const ta = document.getElementById('restore-json-textarea');
      if (!ta || !ta.value.trim()) {
        showToast('복구할 JSON 내용을 붙여넣어 주세요.', 'error');
        return;
      }
      applyRestoredJSON(ta.value.trim());
    }

    function resetSampleData() {
      const fresh = getDefaultData();
      state = fresh;
      saveState(state);
      renderApp();
      showToast('초기 샘플 데이터로 재설정되었습니다.', 'info');
    }

    // =========================================================================
    // 12. 앱 초기화 실행
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
