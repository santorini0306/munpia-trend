      try {
        const savedFilter = localStorage.getItem(PANTRY_FILTER_KEY);
        if (savedFilter) state.pantryFilter = savedFilter;

        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.novels = Array.isArray(parsed.novels) ? parsed.novels : buildInitialNovels();
          state.tagPool = Array.isArray(parsed.tagPool) && parsed.tagPool.length ? parsed.tagPool : [...DEFAULT_TAGS];
          return;
        }
      } catch (err) {
        console.error('로컬스토리지 로드 오류:', err);
      }
      state.novels = buildInitialNovels();
      state.tagPool = [...DEFAULT_TAGS];

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    function copyTextToClipboard(text, label = '제목') {
      if (!text) return;
      const helper = document.createElement('textarea');
      helper.value = text;
      helper.style.position = 'fixed';
      helper.style.opacity = '0';
      document.body.appendChild(helper);
      helper.select();
      try {
        document.execCommand('copy');
        showToast(`${label} 복사 완료! 문피아 검색창에 바로 붙여넣으세요.`, 'success');

      const tierId = novel?.michelin?.tier;
      const opt = MICHELIN_OPTIONS.find((m) => m.id === tierId);

      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded-lg bg-amber-100 border border-amber-300 text-amber-950 text-[11px] font-extrabold ml-1.5 align-middle">${opt.medal}</span>`;

    function isPrepCompleted(novel) {
      return novel.stage === 'pantry';
    }

    function hasCookFlag(novel) {
      return Array.isArray(novel.flags) && novel.flags.includes('cook');
    }

      return state.novels.filter((n) => isPrepCompleted(n) && hasCookFlag(n) && n.inCookQueue && !n.cookDone);
    }

      return state.novels.filter((n) => isPrepCompleted(n) && hasCookFlag(n));
    }

    function buildMutatedConceptSentence(novel, selectedDims, seed) {
      const dims = selectedDims && selectedDims.length ? selectedDims : ['genre', 'setting', 'protagonist'];
      const segments = dims.map((dimKey, idx) => {
        const dimDef = COOK_DIMENSIONS.find((d) => d.key === dimKey) || COOK_DIMENSIONS[0];
        const block = novel.cooking?.[dimKey] || { bigs: [], subs: [] };
        const baseCandidates = [...(block.subs || []), ...(block.bigs || [])];
        const allSubItems = dimDef.groups.flatMap((g) => g.items);

        const baseLabel = baseCandidates.length
          ? baseCandidates[(seed + idx) % baseCandidates.length]
          : dimDef.groups[(seed + idx) % dimDef.groups.length].name;

        const mutatedLabel = allSubItems[(seed * 7 + idx * 11 + novel.title.length) % allSubItems.length];
        const cleanDimName = dimDef.label.replace(/^\d+\)\s*/, '');
        return `${cleanDimName}: 「${baseLabel}」→「${mutatedLabel}」`;
      });

      const twistHooks = [
        '초반 15화 내 확실한 손익 역전과 사이다 전개를 배치한',
        '독자의 예상을 빗나가는 설정 충돌로 몰입도를 끌어올린',
        '연재 초반부터 회차 넘김 동력을 극대화한',
      ];
      const hook = twistHooks[seed % twistHooks.length];

      return `「${novel.title}」(${novel.genre || '웹소설'}) 기반 차기작 레시피 — ${segments.join(' / ')} 조합으로, ${hook} 아이디어입니다.`;
    }

      if (catId === 'wash') return state.novels.length;
      return 0;

      // 1) 상단 [메타데이터] 장르 그래프 계산
      const metaList = getMetadataAnalysisNovels();
      const genreMap = {};
      metaList.forEach((n) => {
        const g = n.genre || '기타';
        genreMap[g] = (genreMap[g] || 0) + 1;
      });
      const genreEntries = Object.entries(genreMap).sort((a, b) => b[1] - a[1]);
      const maxGenreCount = genreEntries.length ? Math.max(...genreEntries.map(([, c]) => c)) : 1;

      // 2) 현재 요리하기 목록 작품 선택
      const activeCookList = getActiveCookNovels();
      const currentWork =
        activeCookList.find((n) => n.id === state.selectedCookId) || activeCookList[0] || null;
      if (currentWork) state.selectedCookId = currentWork.id;

      const activeDimKey = state.cookUI.activeDim || 'genre';
      const dimObj = COOK_DIMENSIONS.find((d) => d.key === activeDimKey) || COOK_DIMENSIONS[0];
      const curDimSelection = currentWork?.cooking?.[dimObj.key] || { bigs: [], subs: [] };

      const remixDims = state.cookUI.selectedRemixDims || ['genre', 'setting', 'protagonist'];
      const remixSentence = currentWork
        ? (currentWork.recipeText || buildMutatedConceptSentence(currentWork, remixDims, state.cookUI.remixSeed || 1))
        : '';

      return `
        <section class="space-y-3.5 animate-pop-in">
          <!-- 상단 [메타데이터] 장르 취향 그래프 -->

              </div>
              <span class="px-2.5 py-0.5 rounded-full bg-slate-800 text-amber-300 text-[11px] font-extrabold">
                분석 ${metaList.length}편
              </span>
            </div>

            ${genreEntries.length ? `
              <div class="space-y-2 pt-0.5">
                ${genreEntries.map(([gName, cnt]) => {
                  const ratio = Math.round((cnt / Math.max(1, metaList.length)) * 100);
                  const barPct = Math.max(14, Math.round((cnt / maxGenreCount) * 100));
                  return `
                    <div class="space-y-1">
                      <div class="flex items-center justify-between text-xs">
                        <span class="font-bold text-slate-200">${escapeHtml(gName)}</span>
                        <span class="font-extrabold text-amber-300">${cnt}편 (${ratio}%)</span>
                      </div>
                      <div class="w-full h-2.5 rounded-full bg-slate-800 overflow-hidden">
                        <div class="h-full rounded-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all duration-300" style="width:${barPct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <p class="text-xs text-slate-400 py-2 text-center">아직 요리하기에 등록된 장르 데이터가 없습니다.</p>
            `}
          </div>

          ${currentWork ? `
            <!-- 작품 선택 & 액션 바 -->
            <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
              <div class="flex items-center justify-between gap-2">

                  <span class="text-xl">🥘</span>
                  <div class="min-w-0">
                    <h3 class="text-sm font-extrabold text-slate-900 truncate">
                      ${escapeHtml(currentWork.title)}${getMedalBadgeHtml(currentWork)}
                    </h3>
                    <p class="text-[11px] text-slate-500">${escapeHtml(currentWork.genre)} · ${escapeHtml(currentWork.author)}</p>
                  </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" data-cook-done-id="${currentWork.id}" class="cook-done-btn px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold cursor-pointer">
                    요리완료
                  </button>
                  <button type="button" data-del-id="${currentWork.id}" class="del-work-btn px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-[11px] font-bold cursor-pointer">
                    삭제
                  </button>
                </div>
              </div>

              ${activeCookList.length > 1 ? `
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
                  ${activeCookList.map((w) => `
                    <button
                      type="button"
                      data-pick-cook-id="${w.id}"
                      class="pick-cook-btn shrink-0 px-2.5 py-1 rounded-xl text-[11px] font-bold border cursor-pointer ${
                        w.id === currentWork.id ? 'bg-chef-500 text-white border-chef-500' : 'bg-slate-50 text-slate-700 border-slate-200'
                      }"
                    >
                      ${escapeHtml(w.title)}
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              <!-- 7대 항목 큰 계열 탭 (선택 사항 · 언제든 수정 가능) -->
              <div>
                <div class="text-xs font-extrabold text-slate-700 mb-1.5">7대 항목 선택 (큰 계열만 선택 또는 세부 항목 중복 선택)</div>
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                  ${COOK_DIMENSIONS.map((d) => {
                    const isAct = d.key === dimObj.key;
                    const bObj = currentWork.cooking?.[d.key] || { bigs: [], subs: [] };
                    const total = (bObj.bigs?.length || 0) + (bObj.subs?.length || 0);
                    return `
                      <button
                        type="button"
                        data-cook-dim="${d.key}"
                        class="cook-dim-tab shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer ${
                          isAct ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }"
                      >
                        ${d.icon} ${d.label}${total ? ` (${total})` : ''}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- 선택된 항목 요약 -->
              <div class="bg-slate-50 rounded-2xl p-2.5 border border-slate-200/70 space-y-1">
                <div class="text-[11px] font-extrabold text-slate-700">${dimObj.label} 선택 현황</div>
                <div class="flex flex-wrap gap-1">
                  ${[...(curDimSelection.bigs || []), ...(curDimSelection.subs || [])].length
                    ? [...(curDimSelection.bigs || []), ...(curDimSelection.subs || [])].map((tag) => `
                        <span class="px-2 py-0.5 rounded-lg bg-chef-500 text-white text-[10px] font-bold">${escapeHtml(tag)}</span>
                      `).join('')
                    : `<span class="text-[11px] text-slate-400">선택된 항목이 없습니다. (선택 사항)</span>`
                  }
                </div>
              </div>

              <!-- 큰 계열 체크 & 세부 항목 펼치기 -->
              <div class="space-y-2 max-h-[360px] overflow-y-auto pr-0.5">
                ${dimObj.groups.map((grp, idx) => {
                  const bigSelected = (curDimSelection.bigs || []).includes(grp.name);
                  const subsInGrp = (curDimSelection.subs || []).filter((s) => grp.items.includes(s));
                  const expanded = Boolean(state.cookUI.openGroups?.[`${dimObj.key}_${idx}`]);

                  return `
                    <div class="rounded-2xl border p-2.5 space-y-2 ${
                      bigSelected || subsInGrp.length ? 'border-orange-300 bg-orange-50/30' : 'border-slate-200 bg-slate-50/60'
                    }">
                      <div class="flex items-center justify-between gap-2">
                        <button
                          type="button"
                          data-toggle-big="${escapeHtml(grp.name)}"
                          class="toggle-big-btn flex-1 text-left flex items-center gap-2 text-xs font-extrabold text-slate-900 cursor-pointer"
                        >
                          <span class="w-5 h-5 rounded-md flex items-center justify-center text-xs border ${
                            bigSelected ? 'bg-chef-500 text-white border-chef-500' : 'bg-white text-slate-400 border-slate-300'
                          }">${bigSelected ? '✓' : ''}</span>
                          <span class="truncate">${escapeHtml(grp.name)}</span>
                          ${subsInGrp.length ? `<span class="px-1.5 py-0.2 rounded bg-amber-200 text-amber-950 text-[10px] shrink-0">세부 ${subsInGrp.length}</span>` : ''}
                        </button>
                        <button
                          type="button"
                          data-toggle-grp-open="${dimObj.key}_${idx}"
                          class="toggle-grp-open-btn px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-bold text-slate-700 hover:bg-slate-100 shrink-0 cursor-pointer"
                        >
                          ${expanded ? '닫기 ▲' : `세부(${grp.items.length}) ▼`}
                        </button>
                      </div>

                      ${expanded ? `
                        <div class="pt-1.5 border-t border-slate-200/70 flex flex-wrap gap-1.5">
                          ${grp.items.map((itemName) => {
                            const subSel = (curDimSelection.subs || []).includes(itemName);
                            return `
                              <button
                                type="button"
                                data-toggle-sub="${escapeHtml(itemName)}"
                                class="toggle-sub-btn px-2 py-1 rounded-lg text-[11px] font-semibold border transition cursor-pointer ${
                                  subSel ? 'bg-chef-500 text-white border-chef-500 font-bold' : 'bg-white text-slate-700 border-slate-200 hover:border-orange-300'
                                }"
                              >
                                ${subSel ? '✓ ' : ''}${escapeHtml(itemName)}
                              </button>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 하단 [레시피분석] 공간 -->
            <div class="bg-white rounded-3xl p-4 border border-violet-200 shadow-xs space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-lg">🧪</span>
                  <div>
                    <h3 class="text-sm font-extrabold text-slate-900">레시피분석 · 차기작 변형</h3>
                    <p class="text-[11px] text-slate-500">변형할 항목을 버튼으로 고른 뒤 재설정하고 문장으로 복사하세요.</p>
                  </div>
                </div>
              </div>

              <div class="flex flex-wrap gap-1.5">
                ${COOK_DIMENSIONS.map((d) => {
                  const picked = remixDims.includes(d.key);
                  return `
                    <button
                      type="button"
                      data-remix-dim="${d.key}"
                      class="remix-dim-btn px-2.5 py-1 rounded-xl text-[11px] font-bold border transition cursor-pointer ${
                        picked ? 'bg-violet-600 text-white border-violet-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                      }"
                    >
                      ${d.icon} ${d.label.replace(/^\d+\)\s*/, '')}
                    </button>
                  `;
                }).join('')}
              </div>

              <button
                id="btn-mutate-recipe"
                type="button"
                class="w-full py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold transition cursor-pointer"
              >
                🎲 선택 항목 랜덤 변형 / 재설정
              </button>

              <div class="bg-violet-50 border border-violet-200 rounded-2xl p-3 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-extrabold text-violet-950">차기작 아이디어 요약 문장</span>
                  <button
                    type="button"
                    data-copy-recipe="${escapeHtml(remixSentence)}"
                    class="copy-recipe-btn px-2.5 py-1 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-[11px] font-bold cursor-pointer"
                  >
                    복사하기
                  </button>
                </div>
                <p class="text-xs text-slate-800 leading-relaxed font-medium">${escapeHtml(remixSentence)}</p>
              </div>
            </div>
          ` : `
            <div class="bg-white rounded-3xl p-7 text-center border border-slate-200 space-y-1.5">
              <div class="text-3xl">🥘</div>
              <p class="text-sm font-bold text-slate-800">요리하기 대기 중인 작품이 없습니다.</p>
              <p class="text-xs text-slate-500">조리실에서 '요리하기 (좋은소스)'를 선택하거나 팬트리에서 '요리하기 다시 보내기'를 눌러보세요.</p>
            </div>
          `}
        </section>
      `;
    }

    // [4] 미슐랭 (🏅) — 유료 도달 / 전환값 / 무료 최종화 / 메달 뱃지 / 수정하기(내 삭제) / [미슐랭 분류 완료]
    function renderMichelinView() {
      const list = state.novels.filter((n) => isPrepCompleted(n) && !n.michelinDone);

      return `
        <section class="space-y-3 animate-pop-in">
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xl">🏅</span>
              <div>
                <h2 class="text-base font-extrabold text-slate-900">미슐랭 · 유료 전환 지표</h2>
                <p class="text-[11px] text-slate-500">전환 1~4티어 선택 시 작품명 옆에 메달 뱃지가 표시됩니다.</p>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-950 text-xs font-extrabold">${list.length}편</span>
          </div>

          ${list.length ? list.map((n) => {
            const m = n.michelin || { tier: 'unanalyzed', conversionValue: '', freeEndEpisode: '' };
            const isEditingHere = state.michelinEditingId === n.id;

            return `
              <article class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5 mb-0.5">
                      <span class="px-2 py-0.5 rounded-lg bg-slate-100 text-slate-700 text-[10px] font-bold">${escapeHtml(n.genre)}</span>
                      <span class="text-[11px] text-slate-500 truncate">${escapeHtml(n.author)}</span>
                    </div>
                    <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(n.title)}${getMedalBadgeHtml(n)}</h3>
                  </div>
                  <button
                    type="button"
                    data-toggle-mich-edit="${n.id}"
                    class="toggle-mich-edit-btn px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-bold shrink-0 cursor-pointer"
                  >
                    ${isEditingHere ? '수정 닫기' : '수정하기'}
                  </button>
                </div>

                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1.5">유료 도달</label>
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                    ${MICHELIN_OPTIONS.map((opt) => {
                      const sel = m.tier === opt.id;
                      return `
                        <button
                          type="button"
                          data-mich-tier-w="${n.id}"
                          data-mich-tier-v="${opt.id}"
                          class="mich-tier-btn py-2 px-2 rounded-xl border text-[11px] font-bold transition cursor-pointer ${
                            sel ? 'bg-amber-500 text-white border-amber-500' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                          }"
                        >
                          ${opt.medal ? `${opt.medal} ` : ''}${opt.label}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">전환값 (숫자)</label>
                    <input
                      type="number"
                      step="any"
                      data-mich-conv-w="${n.id}"
                      value="${escapeHtml(m.conversionValue)}"
                      placeholder="예: 29.5"
                      class="mich-conv-inp w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold"
                    />
                  </div>
                  <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">무료 최종화 (숫자)</label>
                    <input
                      type="number"
                      step="1"
                      data-mich-free-w="${n.id}"
                      value="${escapeHtml(m.freeEndEpisode)}"
                      placeholder="예: 25"
                      class="mich-free-inp w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold"
                    />
                  </div>
                </div>

                ${isEditingHere ? `
                  <div class="p-3 rounded-2xl bg-rose-50/70 border border-rose-200 flex items-center justify-between gap-2">
                    <span class="text-[11px] font-bold text-rose-900">작품 영구 삭제</span>
                    <button
                      type="button"
                      data-del-id="${n.id}"
                      class="del-work-btn px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer"
                    >
                      삭제
                    </button>
                  </div>
                ` : ''}

                <button
                  type="button"
                  data-mich-done-id="${n.id}"
                  class="mich-done-btn w-full py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold transition cursor-pointer"
                >
                  미슐랭 분류 완료 (목록에서 숨기기)
                </button>
              </article>
            `;
          }).join('') : `
            <div class="bg-white rounded-3xl p-7 text-center border border-slate-200 space-y-1.5">
              <div class="text-3xl">🏅</div>
              <p class="text-sm font-bold text-slate-800">미슐랭 분류 대기 작품이 없습니다.</p>
              <p class="text-xs text-slate-500">조리실 평가 완료 작품이 표시되며, 팬트리에서 언제든 다시 수정할 수 있습니다.</p>
            </div>
          `}
        </section>
      `;
    }

    // [5] 팬트리 (🗄️) — 상단 미슐랭 티어 그래프 + 필터(최근순, 별점순, 레전드, 슈퍼노멀, 냉장고) + 수정하기(내 삭제) + 요리하기 다시 보내기
    function renderPantryView() {
      const pool = state.novels.filter((n) => isPrepCompleted(n));

      // 상단 미슐랭 등급별(전환 4티어 ~ 전환 1티어) 그래프 데이터
      const tierGraphItems = [
        { id: 'tier_4', label: '전환 4티어', medal: '🏅4', count: pool.filter((n) => n.michelin?.tier === 'tier_4').length },
        { id: 'tier_3', label: '전환 3티어', medal: '🥉3', count: pool.filter((n) => n.michelin?.tier === 'tier_3').length },
        { id: 'tier_2', label: '전환 2티어', medal: '🥈2', count: pool.filter((n) => n.michelin?.tier === 'tier_2').length },
        { id: 'tier_1', label: '전환 1티어', medal: '🥇1', count: pool.filter((n) => n.michelin?.tier === 'tier_1').length },
      ];
      const maxTierCount = Math.max(1, ...tierGraphItems.map((t) => t.count));

      const filterButtons = [
        { id: 'recent', label: '최근순' },
        { id: 'rating', label: '별점순' },
        { id: 'legend', label: '레전드' },
        { id: 'supernormal', label: '슈퍼노멀' },
        { id: 'fridge', label: '냉장고' },
      ];

      let filtered = [...pool];
      if (state.pantryFilter === 'legend') {
        filtered = filtered.filter((n) => (n.flags || []).includes('legend'));
      } else if (state.pantryFilter === 'supernormal') {
        filtered = filtered.filter((n) => (n.flags || []).includes('supernormal'));
      } else if (state.pantryFilter === 'fridge') {
        filtered = filtered.filter((n) => (n.flags || []).includes('fridge'));
      } else if (state.pantryFilter === 'rating') {
        const scoreMap = Object.fromEntries(RATINGS.map((r) => [r.id, r.score]));
        filtered.sort((a, b) => (scoreMap[b.rating] || 0) - (scoreMap[a.rating] || 0));
      } else {
        filtered.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
      }

      return `
        <section class="space-y-3 animate-pop-in">
          <!-- 상단 미슐랭 등급별 그래프 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xl">🗄️</span>
                <div>
                  <h2 class="text-base font-extrabold text-slate-900">팬트리 · 미슐랭 티어 그래프</h2>
                  <p class="text-[11px] text-slate-500">전환 4티어 ~ 1티어 등급별 작품 수를 한눈에 확인하세요.</p>
                </div>
              </div>
              <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">${pool.length}편</span>
            </div>

            <div class="grid grid-cols-4 gap-2 pt-1">
              ${tierGraphItems.map((tg) => {
                const heightPct = tg.count > 0 ? Math.max(22, Math.round((tg.count / maxTierCount) * 100)) : 8;
                return `
                  <div class="bg-slate-50 rounded-2xl p-2 border border-slate-200/70 flex flex-col items-center justify-between">
                    <span class="text-[10px] font-extrabold text-amber-900">${tg.medal}</span>
                    <div class="w-full h-16 flex items-end justify-center my-1.5">
                      <div class="w-7 rounded-t-xl bg-gradient-to-t from-amber-500 to-yellow-300 transition-all duration-300" style="height:${heightPct}%"></div>
                    </div>
                    <div class="text-xs font-extrabold text-slate-900">${tg.count}편</div>
                    <div class="text-[10px] text-slate-500 truncate w-full text-center">${tg.label}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- 필터 버튼 5종 -->
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-1">
              ${filterButtons.map((fb) => {
                const active = state.pantryFilter === fb.id;
                return `
                  <button
                    type="button"
                    data-pantry-f="${fb.id}"
                    class="pantry-f-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer ${
                      active ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                    }"
                  >
                    ${escapeHtml(fb.label)}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          ${filtered.length ? filtered.map((n) => {
            const rObj = RATINGS.find((r) => r.id === n.rating) || RATINGS[4];
            const mObj = MICHELIN_OPTIONS.find((m) => m.id === n.michelin?.tier) || MICHELIN_OPTIONS[0];

            return `
              <article class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-2.5">
                <div>
                  <div class="flex flex-wrap items-center gap-1 mb-1">
                    <span class="px-2 py-0.5 rounded-lg border text-[10px] font-extrabold ${rObj.pill}">${rObj.label}</span>
                    <span class="px-2 py-0.5 rounded-lg bg-slate-100 text-slate-700 text-[10px] font-bold">${escapeHtml(n.genre)}</span>
                    <span class="text-[11px] text-slate-500">${escapeHtml(n.author)}</span>
                  </div>
                  <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(n.title)}${getMedalBadgeHtml(n)}</h3>
                </div>

                <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                  ${(n.flags || []).map((fid) => {
                    const fObj = MULTI_FLAGS.find((x) => x.id === fid);
                    return fObj ? `<span class="px-2 py-0.5 rounded-lg border font-bold ${fObj.chip}">${fObj.icon} ${fObj.short}</span>` : '';
                  }).join('')}
                  <span class="px-2 py-0.5 rounded-lg bg-amber-50 border border-amber-200 text-amber-950 font-bold">
                    ${mObj.label} · 전환값 ${escapeHtml(n.michelin?.conversionValue || '-')} · 무료 ${escapeHtml(n.michelin?.freeEndEpisode || '-')}화
                  </span>
                </div>

                ${(n.tags && n.tags.length) ? `
                  <div class="flex flex-wrap gap-1">
                    ${n.tags.map((t) => `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-semibold">#${escapeHtml(t)}</span>`).join('')}
                  </div>
                ` : ''}

                <div class="pt-2 border-t border-slate-100 grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    data-open-modal-id="${n.id}"
                    class="open-modal-btn py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer"
                  >
                    수정하기
                  </button>
                  <button
                    type="button"
                    data-send-cook-id="${n.id}"
                    class="send-cook-btn py-2 px-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold cursor-pointer"
                  >
                    요리하기 다시 보내기
                  </button>
                </div>
              </article>
            `;
          }).join('') : `
            <div class="bg-white rounded-3xl p-6 text-center border border-slate-200 text-xs text-slate-500">
              선택한 필터에 해당하는 작품이 없습니다.
            </div>
          `}
        </section>
      `;
    }

    // [6] 설거지 (🧼) — 일별 자동 등록 수 달력 + 월별 통계 + 데이터 백업/복구
    function renderWashView() {
      const { year, month, selectedDate } = state.calendar;
      const ymPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthlyWorks = state.novels.filter((n) => String(n.createdAt || '').startsWith(ymPrefix));

      const countByDay = {};
      monthlyWorks.forEach((n) => {
        countByDay[n.createdAt] = (countByDay[n.createdAt] || 0) + 1;
      });

      const genreTallies = {};
      monthlyWorks.forEach((n) => {
        if (n.genre) genreTallies[n.genre] = (genreTallies[n.genre] || 0) + 1;
      });
      const topGenreEntry = Object.entries(genreTallies).sort((a, b) => b[1] - a[1])[0];

      const firstDow = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const todayYmd = formatYMD(new Date());

      const dayCells = [];
      for (let i = 0; i < firstDow; i++) {
        dayCells.push(`<div class="h-14 rounded-2xl bg-slate-50/50"></div>`);
      }

      for (let day = 1; day <= totalDays; day++) {
        const ymd = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cnt = countByDay[ymd] || 0;
        const isSelected = ymd === selectedDate;
        const isToday = ymd === todayYmd;

        dayCells.push(`
          <button
            type="button"
            data-cal-date="${ymd}"
            class="cal-date-btn h-14 rounded-2xl border p-1 flex flex-col items-center justify-between transition cursor-pointer ${
              isSelected
                ? 'bg-sky-600 text-white border-sky-600 shadow-2xs'
                : cnt > 0
                  ? 'bg-sky-50 border-sky-200 text-slate-900 hover:bg-sky-100/70'
                  : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'
            }"
          >
            <span class="text-[11px] font-bold ${isToday && !isSelected ? 'text-sky-600 underline' : ''}">${day}</span>
            ${cnt > 0
              ? `<span class="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${isSelected ? 'bg-amber-300 text-slate-950' : 'bg-sky-600 text-white'}">${cnt}편</span>`
              : `<span class="text-[10px] ${isSelected ? 'text-sky-100' : 'text-slate-300'}">0</span>`
            }
          </button>
        `);
      }

      const dayWorks = state.novels.filter((n) => n.createdAt === selectedDate);
      const exportPayload = JSON.stringify({ novels: state.novels, tagPool: state.tagPool }, null, 2);

      return `
        <section class="space-y-3 animate-pop-in">
          <!-- 월별 통계 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xl">🧼</span>
                <h2 class="text-base font-extrabold text-slate-900">설거지 · ${year}년 ${month + 1}월 통계</h2>
              </div>
              <span class="px-2.5 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-extrabold">월 ${monthlyWorks.length}편</span>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                <div class="text-[10px] text-slate-500 font-semibold">월간 등록 수</div>
                <div class="text-base font-extrabold text-slate-900 mt-0.5">${monthlyWorks.length}편</div>
              </div>
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                <div class="text-[10px] text-slate-500 font-semibold">최다 장르</div>
                <div class="text-xs font-extrabold text-chef-700 mt-1 truncate">${topGenreEntry ? `${escapeHtml(topGenreEntry[0])} (${topGenreEntry[1]})` : '-'}</div>
              </div>
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                <div class="text-[10px] text-slate-500 font-semibold">누적 전체 작품</div>
                <div class="text-base font-extrabold text-emerald-700 mt-0.5">${state.novels.length}편</div>
              </div>
            </div>
          </div>

          <!-- 일별 자동 등록 카운트 달력 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <button id="btn-cal-prev" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">◀ 이전</button>
              <span class="text-sm font-extrabold text-slate-900">${year}년 ${month + 1}월 달력</span>
              <button id="btn-cal-next" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">다음 ▶</button>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
              <span class="text-rose-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-500">토</span>
            </div>

            <div class="grid grid-cols-7 gap-1">
              ${dayCells.join('')}
            </div>

            <div class="pt-2 border-t border-slate-100 space-y-1.5">
              <div class="text-xs font-extrabold text-slate-700">${selectedDate} 등록 작품 (${dayWorks.length}편)</div>
              ${dayWorks.length ? dayWorks.map((dw) => `
                <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200/70 flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-900 truncate">${escapeHtml(dw.title)}${getMedalBadgeHtml(dw)}</span>
                  <span class="text-[11px] text-slate-500 shrink-0 ml-2">${escapeHtml(dw.genre || '임시등록')}</span>
                </div>
              `).join('') : `<p class="text-xs text-slate-400">선택한 날짜에 등록된 작품이 없습니다.</p>`}
            </div>
          </div>

          <!-- 데이터 백업 및 복구 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <h3 class="text-sm font-extrabold text-slate-900">💾 데이터 백업 및 복구</h3>
            <div class="grid grid-cols-2 gap-2">
              <button id="btn-export-json" type="button" class="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer">
                백업 파일 저장
              </button>
              <button id="btn-copy-json" type="button" class="py-2.5 px-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold cursor-pointer">
                백업 JSON 복사
              </button>
            </div>

            <textarea
              id="restore-json-box"
              rows="3"
              class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-[11px] font-mono"
            >${escapeHtml(exportPayload)}</textarea>

            <div class="flex items-center gap-2">
              <label class="flex-1 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold text-center cursor-pointer">
                백업 파일 불러오기
                <input id="file-restore-json" type="file" accept="application/json,.json" class="hidden" />
              </label>
              <button id="btn-apply-restore" type="button" class="flex-1 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">
                복구 적용하기
              </button>
            </div>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 8. 팬트리 '수정하기' 모달 (전체 항목 수정 + 내부 '삭제' 버튼)
    // =========================================================================
    function openEditModal(workId) {
      const novel = state.novels.find((n) => n.id === workId);
      if (!novel) return;
      state.modalEditId = workId;

      const modal = document.getElementById('edit-modal');
      document.getElementById('edit-modal-title').textContent = `「${novel.title}」 수정하기`;

      const m = novel.michelin || { tier: 'unanalyzed', conversionValue: '', freeEndEpisode: '' };
      const body = document.getElementById('edit-modal-body');

      body.innerHTML = `
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">작품 제목</label>
            <input id="m-title" type="text" value="${escapeHtml(novel.title)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold" />
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">장르</label>
              <select id="m-genre" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                ${LABEL_GENRES.map((g) => `<option value="${escapeHtml(g)}" ${novel.genre === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">작가명</label>
              <input id="m-author" type="text" value="${escapeHtml(novel.author)}" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">별점</label>
            <div class="grid grid-cols-2 gap-1.5">
              ${RATINGS.map((r) => `
                <button type="button" data-m-r="${r.id}" class="m-r-btn py-2 px-2.5 rounded-xl border text-left text-xs font-bold cursor-pointer ${
                  novel.rating === r.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200'
                }">${r.label}</button>
              `).join('')}
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">추가 분류 (중복 선택)</label>
            <div class="grid grid-cols-2 gap-1.5">
              ${MULTI_FLAGS.map((fl) => {
                const act = (novel.flags || []).includes(fl.id);
                return `
                  <button type="button" data-m-f="${fl.id}" class="m-f-btn py-2 px-2.5 rounded-xl border text-xs font-bold cursor-pointer ${
                    act ? fl.active : 'bg-white text-slate-700 border-slate-200'
                  }">${fl.icon} ${fl.label}</button>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">태그 (최대 5개, 쉼표 구분)</label>
            <input id="m-tags" type="text" value="${escapeHtml((novel.tags || []).join(', '))}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
          </div>

          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-2">
            <div class="text-xs font-extrabold text-amber-950">미슐랭 지표</div>
            <select id="m-tier" class="w-full px-2.5 py-2 rounded-xl bg-white border border-amber-300 text-xs font-bold">
              ${MICHELIN_OPTIONS.map((opt) => `<option value="${opt.id}" ${m.tier === opt.id ? 'selected' : ''}>${opt.medal ? opt.medal + ' ' : ''}${opt.label}</option>`).join('')}
            </select>
            <div class="grid grid-cols-2 gap-2">
              <input id="m-conv" type="number" step="any" value="${escapeHtml(m.conversionValue)}" placeholder="전환값" class="px-2.5 py-2 rounded-xl bg-white border border-amber-300 text-xs" />
              <input id="m-free" type="number" step="1" value="${escapeHtml(m.freeEndEpisode)}" placeholder="무료 최종화" class="px-2.5 py-2 rounded-xl bg-white border border-amber-300 text-xs" />
            </div>
          </div>

          <button id="btn-save-modal" type="button" class="w-full py-3 rounded-2xl bg-chef-500 hover:bg-chef-600 text-white text-xs font-extrabold cursor-pointer">
            수정 저장하기
          </button>

          <button id="btn-delete-inside-modal" type="button" class="w-full py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-extrabold cursor-pointer">
            삭제
          </button>
        </div>
      `;

      let draftR = novel.rating;
      let draftF = [...(novel.flags || [])];

      body.querySelectorAll('.m-r-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          draftR = btn.getAttribute('data-m-r');
          body.querySelectorAll('.m-r-btn').forEach((b) => {
            const on = b.getAttribute('data-m-r') === draftR;
            b.className = `m-r-btn py-2 px-2.5 rounded-xl border text-left text-xs font-bold cursor-pointer ${
              on ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200'
            }`;
          });
        });
      });

      body.querySelectorAll('.m-f-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const fid = btn.getAttribute('data-m-f');
          draftF = draftF.includes(fid) ? draftF.filter((x) => x !== fid) : [...draftF, fid];
          const fObj = MULTI_FLAGS.find((x) => x.id === fid);
          const on = draftF.includes(fid);
          btn.className = `m-f-btn py-2 px-2.5 rounded-xl border text-xs font-bold cursor-pointer ${
            on ? fObj.active : 'bg-white text-slate-700 border-slate-200'
          }`;
        });
      });

      document.getElementById('btn-save-modal')?.addEventListener('click', () => {
        const nextTitle = (document.getElementById('m-title')?.value || '').trim();
        if (!nextTitle) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }
        const nextGenre = document.getElementById('m-genre')?.value || '기타';
        const nextAuthor = (document.getElementById('m-author')?.value || '').trim() || '작가 미상';
        const nextTags = (document.getElementById('m-tags')?.value || '')
          .split(',')
          .map((t) => t.replace(/^#+/, '').trim())
          .filter(Boolean)
          .slice(0, 5);

        nextTags.forEach((t) => {
          if (!state.tagPool.includes(t)) state.tagPool.unshift(t);
        });

        const nextTier = document.getElementById('m-tier')?.value || 'unanalyzed';
        const nextConv = document.getElementById('m-conv')?.value || '';
        const nextFree = document.getElementById('m-free')?.value || '';

        state.novels = state.novels.map((item) =>
          item.id === workId
            ? {
                ...item,
                title: nextTitle,
                genre: nextGenre,
                author: nextAuthor,
                rating: draftR,
                flags: draftF,
                tags: nextTags,
                inCookQueue: item.inCookQueue || draftF.includes('cook'),
                michelin: { tier: nextTier, conversionValue: nextConv, freeEndEpisode: nextFree },
              }
            : item
        );

        saveData();
        closeEditModal();
        renderAll();
        showToast('작품 정보가 수정되었습니다.', 'success');
      });

      document.getElementById('btn-delete-inside-modal')?.addEventListener('click', () => {
        state.novels = state.novels.filter((item) => item.id !== workId);
        saveData();
        closeEditModal();
        renderAll();
        showToast('작품이 삭제되었습니다.', 'info');
      });

      modal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
      state.modalEditId = null;
    }

    // =========================================================================
    // 9. 이벤트 바인딩 & 렌더링 루프
    // =========================================================================
    function bindAllEvents() {
      // 제목 복사 & 작품 삭제
      document.querySelectorAll('.copy-title-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          copyTextToClipboard(btn.getAttribute('data-copy-title') || '', '작품 제목');
        });
      });

      document.querySelectorAll('.del-work-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-id');
          state.novels = state.novels.filter((n) => n.id !== id);
          if (state.regForm.editingId === id) {
            state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
          }
          saveData();
          renderAll();
          showToast('작품이 삭제되었습니다.', 'info');
        });
      });

      // [1] 제품 등록
      document.querySelectorAll('.reg-src-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const src = btn.getAttribute('data-reg-src');
          const cur = state.regForm.sources;
          if (cur.includes(src)) {
            if (cur.length > 1) {
              state.regForm.sources = cur.filter((x) => x !== src);
            } else {
              showToast('최소 1개 이상 선택해야 합니다.', 'warning');
            }
          } else {
            state.regForm.sources = [...cur, src];
          }
          renderAll();
        });
      });

      document.getElementById('btn-cancel-reg')?.addEventListener('click', () => {
        state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
        renderAll();
      });

      document.getElementById('btn-submit-reg')?.addEventListener('click', () => {
        const title = (document.getElementById('reg-title')?.value || '').trim();
        const genre = (document.getElementById('reg-genre')?.value || '').trim();
        const author = (document.getElementById('reg-author')?.value || '').trim();

        if (!title) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }

        const dup = state.novels.find(
          (n) => normalizeKey(n.title) === normalizeKey(title) && n.id !== state.regForm.editingId
        );
        if (dup) {
          showDuplicateCharacterModal(title);
          return;
        }

        const isLabeled = Boolean(genre && author);
        const targetStage = isLabeled ? 'prep' : 'register_temp';

        if (state.regForm.editingId) {
          state.novels = state.novels.map((n) =>
            n.id === state.regForm.editingId
              ? { ...n, sources: [...state.regForm.sources], title, genre, author, stage: targetStage }
              : n
          );
          state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
          saveData();
          if (isLabeled) {
            state.activeCategory = 'prep';
            showToast('라벨링 완료 → 조리실로 이동했습니다!', 'success');
          } else {
            showToast('[임시등록] 내용이 수정되었습니다.', 'info');
          }
          renderAll();
          return;
        }

        const newItem = {
          id: 'w-' + Date.now(),
          sources: [...state.regForm.sources],
          title,
          genre,
          author,
          stage: targetStage,
          inCookQueue: false,
          cookDone: false,
          michelinDone: false,
          rating: 'hold',
          flags: [],
          tags: [],
          cooking: createDefaultCooking(),
          recipeText: '',
          michelin: { tier: 'unanalyzed', conversionValue: '', freeEndEpisode: '' },
          createdAt: formatYMD(new Date()),
        };

        state.novels = [newItem, ...state.novels];
        state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
        saveData();

        if (isLabeled) {
          state.activeCategory = 'prep';
          showToast(`「${title}」 등록 완료 → 조리실로 이동했습니다.`, 'success');
        } else {
          showToast(`「${title}」이 [임시등록]으로 저장되었습니다.`, 'warning');
        }
        renderAll();
      });

      document.querySelectorAll('.finish-temp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-finish-temp');
          const gVal = document.querySelector(`.temp-g-sel[data-temp-g="${id}"]`)?.value || '';
          const aVal = (document.querySelector(`.temp-a-inp[data-temp-a="${id}"]`)?.value || '').trim();
          if (!gVal || !aVal) {
            showToast('장르와 작가명을 모두 입력해야 조리실로 이동합니다.', 'warning');
            return;
          }
          state.novels = state.novels.map((n) =>
            n.id === id ? { ...n, genre: gVal, author: aVal, stage: 'prep' } : n
          );
          saveData();
          state.activeCategory = 'prep';
          renderAll();
          showToast('라벨링 완료! 조리실로 이동했습니다.', 'success');
        });
      });

      document.querySelectorAll('.edit-temp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-temp');
          const found = state.novels.find((n) => n.id === id);
          if (!found) return;
          state.regForm = {
            sources: [...(found.sources || ['today'])],
            title: found.title,
            genre: found.genre || '',
            author: found.author || '',
            editingId: found.id,
          };
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      // [2] 조리실
      document.querySelectorAll('.prep-r-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-prep-r-work');
          const rId = btn.getAttribute('data-prep-r-id');
          state.novels = state.novels.map((n) => (n.id === wId ? { ...n, rating: rId } : n));
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.prep-f-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-prep-f-work');
          const fId = btn.getAttribute('data-prep-f-id');
          state.novels = state.novels.map((n) => {
            if (n.id !== wId) return n;
            const cur = n.flags || [];
            const next = cur.includes(fId) ? cur.filter((x) => x !== fId) : [...cur, fId];
            return { ...n, flags: next };
          });
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.tag-inp').forEach((inp) => {
        inp.addEventListener('input', (e) => {
          const wId = e.target.getAttribute('data-tag-inp-work');
          state.prepTagDrafts[wId] = e.target.value;
        });
      });

      document.querySelectorAll('.add-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-add-tag-work');
          const tag = (state.prepTagDrafts[wId] || '').replace(/^#+/, '').trim();
          if (!tag) {
            showToast('태그를 입력해주세요.', 'warning');
            return;
          }
          const novel = state.novels.find((n) => n.id === wId);
          if (!novel) return;
          const cur = novel.tags || [];
          if (!cur.includes(tag) && cur.length >= 5) {
            showToast('태그는 최대 5개까지 추가할 수 있습니다.', 'warning');
            return;
          }
          if (!state.tagPool.includes(tag)) state.tagPool.unshift(tag);
          const next = cur.includes(tag) ? cur : [...cur, tag];
          state.novels = state.novels.map((n) => (n.id === wId ? { ...n, tags: next } : n));
          state.prepTagDrafts[wId] = '';
          saveData();
          renderAll();
          showToast(`#${tag} 태그 저장 및 적용`, 'success');
        });
      });

      document.querySelectorAll('.pool-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-pool-tag-work');
          const val = btn.getAttribute('data-pool-tag-val');
          state.novels = state.novels.map((n) => {
            if (n.id !== wId) return n;
            const cur = n.tags || [];
            if (cur.includes(val)) return { ...n, tags: cur.filter((t) => t !== val) };
            if (cur.length >= 5) {
              showToast('태그는 최대 5개까지 선택할 수 있습니다.', 'warning');
              return n;
            }
            return { ...n, tags: [...cur, val] };
          });
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.rm-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-rm-tag-work');
          const val = btn.getAttribute('data-rm-tag');
          state.novels = state.novels.map((n) =>
            n.id === wId ? { ...n, tags: (n.tags || []).filter((t) => t !== val) } : n
          );
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.move-pantry-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-move-pantry-work');
          const novel = state.novels.find((n) => n.id === wId);
          if (!novel) return;
          const goCook = hasCookFlag(novel);
          state.novels = state.novels.map((n) =>
            n.id === wId
              ? { ...n, stage: 'pantry', inCookQueue: goCook, cookDone: false }
              : n
          );
          if (goCook) state.selectedCookId = wId;
          saveData();
          state.activeCategory = goCook ? 'cook' : 'pantry';
          renderAll();
          showToast(
            goCook ? '요리하기 + 팬트리로 이동되었습니다!' : '팬트리로 이동되었습니다!',
            'success'
          );
        });
      });

      // [3] 요리하기 & 레시피분석
      document.querySelectorAll('.pick-cook-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedCookId = btn.getAttribute('data-pick-cook-id');
          renderAll();
        });
      });

      document.querySelectorAll('.cook-done-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-cook-done-id');
          state.novels = state.novels.map((n) => (n.id === id ? { ...n, cookDone: true } : n));
          if (state.selectedCookId === id) state.selectedCookId = '';
          saveData();
          renderAll();
          showToast('요리완료 처리되어 요리하기 목록에서 숨겨졌습니다.', 'success');
        });
      });

      document.querySelectorAll('.cook-dim-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.cookUI.activeDim = btn.getAttribute('data-cook-dim');
          renderAll();
        });
      });

      document.querySelectorAll('.toggle-grp-open-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-toggle-grp-open');
          state.cookUI.openGroups[key] = !state.cookUI.openGroups[key];
          renderAll();
        });
      });

      document.querySelectorAll('.toggle-big-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = state.selectedCookId;
          const dimKey = state.cookUI.activeDim;
          const bigName = btn.getAttribute('data-toggle-big');
          state.novels = state.novels.map((n) => {
            if (n.id !== wId) return n;
            const cooking = { ...(n.cooking || createDefaultCooking()) };
            const b = cooking[dimKey] || { bigs: [], subs: [] };
            const nextBigs = b.bigs.includes(bigName) ? b.bigs.filter((x) => x !== bigName) : [...b.bigs, bigName];
            cooking[dimKey] = { ...b, bigs: nextBigs };
            return { ...n, cooking, recipeText: '' };
          });
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.toggle-sub-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = state.selectedCookId;
          const dimKey = state.cookUI.activeDim;
          const subName = btn.getAttribute('data-toggle-sub');
          state.novels = state.novels.map((n) => {
            if (n.id !== wId) return n;
            const cooking = { ...(n.cooking || createDefaultCooking()) };
            const b = cooking[dimKey] || { bigs: [], subs: [] };
            const nextSubs = b.subs.includes(subName) ? b.subs.filter((x) => x !== subName) : [...b.subs, subName];
            cooking[dimKey] = { ...b, subs: nextSubs };
            return { ...n, cooking, recipeText: '' };
          });
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.remix-dim-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const dKey = btn.getAttribute('data-remix-dim');
          let cur = state.cookUI.selectedRemixDims || ['genre', 'setting'];
          cur = cur.includes(dKey) ? cur.filter((x) => x !== dKey) : [...cur, dKey];
          if (!cur.length) cur = [dKey];
          state.cookUI.selectedRemixDims = cur;
          renderAll();
        });
      });

      document.getElementById('btn-mutate-recipe')?.addEventListener('click', () => {
        const wId = state.selectedCookId;
        const novel = state.novels.find((n) => n.id === wId);
        if (!novel) return;
        state.cookUI.remixSeed = (state.cookUI.remixSeed || 1) + 1;
        const sentence = buildMutatedConceptSentence(novel, state.cookUI.selectedRemixDims, state.cookUI.remixSeed);
        state.novels = state.novels.map((n) => (n.id === wId ? { ...n, recipeText: sentence } : n));
        saveData();
        renderAll();
        showToast('선택 항목이 랜덤 변형되어 재설정되었습니다!', 'success');
      });

      document.querySelectorAll('.copy-recipe-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          copyTextToClipboard(btn.getAttribute('data-copy-recipe') || '', '레시피 아이디어 문장');
        });
      });

      // [4] 미슐랭
      document.querySelectorAll('.toggle-mich-edit-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-mich-edit');
          state.michelinEditingId = state.michelinEditingId === id ? null : id;
          renderAll();
        });
      });

      document.querySelectorAll('.mich-tier-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-mich-tier-w');
          const tVal = btn.getAttribute('data-mich-tier-v');
          state.novels = state.novels.map((n) =>
            n.id === wId ? { ...n, michelin: { ...(n.michelin || {}), tier: tVal } } : n
          );
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.mich-conv-inp').forEach((inp) => {
        inp.addEventListener('change', (e) => {
          const wId = e.target.getAttribute('data-mich-conv-w');
          const val = e.target.value;
          state.novels = state.novels.map((n) =>
            n.id === wId ? { ...n, michelin: { ...(n.michelin || {}), conversionValue: val } } : n
          );
          saveData();
        });
      });

      document.querySelectorAll('.mich-free-inp').forEach((inp) => {
        inp.addEventListener('change', (e) => {
          const wId = e.target.getAttribute('data-mich-free-w');
          const val = e.target.value;
          state.novels = state.novels.map((n) =>
            n.id === wId ? { ...n, michelin: { ...(n.michelin || {}), freeEndEpisode: val } } : n
          );
          saveData();
        });
      });

      document.querySelectorAll('.mich-done-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-mich-done-id');
          state.novels = state.novels.map((n) => (n.id === id ? { ...n, michelinDone: true } : n));
          saveData();
          renderAll();
          showToast('미슐랭 분류 완료 처리되었습니다.', 'success');
        });
      });

      // [5] 팬트리
      document.querySelectorAll('.pantry-f-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.pantryFilter = btn.getAttribute('data-pantry-f');
          saveData();
          renderAll();
        });
      });

      document.querySelectorAll('.open-modal-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          openEditModal(btn.getAttribute('data-open-modal-id'));
        });
      });

      document.querySelectorAll('.send-cook-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-send-cook-id');
          state.novels = state.novels.map((n) => {
            if (n.id !== id) return n;
            const nextFlags = (n.flags || []).includes('cook') ? n.flags : [...(n.flags || []), 'cook'];
            return { ...n, flags: nextFlags, inCookQueue: true, cookDone: false };
          });
          state.selectedCookId = id;
          saveData();
          state.activeCategory = 'cook';
          renderAll();
          showToast('요리하기로 다시 보냈습니다!', 'success');
        });
      });

      // [6] 설거지 달력 & 백업/복구
      document.getElementById('btn-cal-prev')?.addEventListener('click', () => {
        if (state.calendar.month === 0) {
          state.calendar.year -= 1;
          state.calendar.month = 11;
        } else {
          state.calendar.month -= 1;
        }
        renderAll();
      });

      document.getElementById('btn-cal-next')?.addEventListener('click', () => {
        if (state.calendar.month === 11) {
          state.calendar.year += 1;
          state.calendar.month = 0;
        } else {
          state.calendar.month += 1;
        }
        renderAll();
      });

      document.querySelectorAll('.cal-date-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.calendar.selectedDate = btn.getAttribute('data-cal-date');
          renderAll();
        });
      });

      document.getElementById('btn-export-json')?.addEventListener('click', () => {
        const jsonStr = JSON.stringify({ novels: state.novels, tagPool: state.tagPool }, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chef-note-${formatYMD(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('백업 파일이 저장되었습니다.', 'success');
      });

      document.getElementById('btn-copy-json')?.addEventListener('click', () => {
        const raw = document.getElementById('restore-json-box')?.value || '';
        copyTextToClipboard(raw, '백업 JSON');
      });

      document.getElementById('file-restore-json')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const box = document.getElementById('restore-json-box');
          if (box) box.value = String(ev.target?.result || '');
          showToast('백업 파일을 불러왔습니다. [복구 적용하기]를 누르세요.', 'info');
        };
        reader.readAsText(file);
      });

      document.getElementById('btn-apply-restore')?.addEventListener('click', () => {
        const raw = document.getElementById('restore-json-box')?.value || '';
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed.novels)) {
            showToast('올바른 쉐프 노트 백업 형식이 아닙니다.', 'error');
            return;
          }
          state.novels = parsed.novels;
          if (Array.isArray(parsed.tagPool) && parsed.tagPool.length) {
            state.tagPool = parsed.tagPool;
          }
          saveData();
          renderAll();
          showToast(`총 ${state.novels.length}편의 데이터가 복구되었습니다!`, 'success');
        } catch (err) {
          showToast('JSON 형식을 확인해주세요.', 'error');
        }
      });
    }

    function renderAll() {
      renderNavBars();
      const container = document.getElementById('main-content');

      switch (state.activeCategory) {
        case 'register':
          container.innerHTML = renderRegisterView();
          break;
        case 'prep':
          container.innerHTML = renderPrepView();
          break;
        case 'cook':
          container.innerHTML = renderCookView();
          break;
        case 'michelin':
          container.innerHTML = renderMichelinView();
          break;
        case 'pantry':
          container.innerHTML = renderPantryView();
          break;
        case 'wash':
          container.innerHTML = renderWashView();
          break;
        default:
          container.innerHTML = renderRegisterView();
      }

      bindAllEvents();
    }

    // 전역 모달 닫기 & 샘플 초기화
    document.getElementById('btn-close-edit-modal')?.addEventListener('click', closeEditModal);
    document.getElementById('edit-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'edit-modal') closeEditModal();
    });

    document.getElementById('btn-reset-sample')?.addEventListener('click', () => {
      state.novels = buildInitialNovels();
      state.tagPool = [...DEFAULT_TAGS];
      state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
      state.pantryFilter = 'recent';
      state.selectedCookId = '';
      saveData();
      renderAll();
      showToast('초기 샘플 데이터가 로드되었습니다.', 'info');
    });

    loadData();
    renderAll();
  </script>
</body>
</html>
