    // 헬퍼: 오늘 날짜 (YYYY-MM-DD)
    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getCurrentMonthStr() {
      return getTodayStr().slice(0, 7);
    }

    function shiftDateStr(baseDateStr, offsetDays) {
      const [y, m, d] = baseDateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createSampleState();
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.novels)) return createSampleState();
        return {
          ...createSampleState(),
          ...parsed,
          dishwashLogs: parsed.dishwashLogs || {},
          globalTags: Array.isArray(parsed.globalTags) ? parsed.globalTags : [],
        };
      } catch (err) {
        console.error('로컬스토리지 로드 실패:', err);
        return createSampleState();
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('로컬스토리지 저장 실패:', err);
        showToast('저장 공간 확인이 필요합니다.', 'error');
      }
    }

    // 토스트 알림 표시
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colorClass =
        type === 'error'
          ? 'bg-red-700 text-white'
          : type === 'success'
          ? 'bg-sage text-white'
          : 'bg-ink text-white';
      el.className = `${colorClass} text-xs font-semibold px-3.5 py-2 rounded-2xl shadow-float animate-pop flex items-center gap-1.5`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2100);
    }

    // 문피아 검색용 제목 자동 복사
    async function copyTitleForMunpia(title) {
      if (!title || !title.trim()) {
        showToast('복사할 제목이 없습니다.', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(title.trim());
        showToast(`"${title.trim()}" 문피아 검색용 제목 복사 완료!`);
      } catch {
        // 폴백 복사
        const ta = document.createElement('textarea');
        ta.value = title.trim();
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`"${title.trim()}" 제목이 복사되었습니다!`);
      }
    }

    // 중복 제목 체크 (excludeId 지정 시 자기 자신 제외)
    function findDuplicateNovel(title, excludeId = null) {
      const normalized = (title || '').trim().replace(/\s+/g, ' ').toLowerCase();
      if (!normalized) return null;
      return (
        state.novels.find(
          (n) =>
            n.id !== excludeId &&
            (n.title || '').trim().replace(/\s+/g, ' ').toLowerCase() === normalized
        ) || null
      );
    }

    // 라벨링 완료 여부 (장르 + 작가명 모두 입력되어야 완료)
    function isLabelingComplete(novel) {
      return Boolean((novel.genre || '').trim() && (novel.author || '').trim());
    }

    // 미슐랭 선정 완료 여부 (3가지 항목: 유료 도달 티어, 전환값, 무료 최종화 입력 시 미슐랭 반영)
    function hasMichelinInput(novel) {
      const m = novel.michelin || {};
      const tierSet = Boolean(m.tier && m.tier !== '분석 전');
      const convSet = m.conversionRate !== '' && m.conversionRate !== null && m.conversionRate !== undefined;
      const freeSet = m.freeEndEpisode !== '' && m.freeEndEpisode !== null && m.freeEndEpisode !== undefined;
      return tierSet || convSet || freeSet;
    }

    // 전환 4~1티어 메달 뱃지 렌더링
    function getMichelinMedalBadge(tier) {
      switch (tier) {
        case '전환 1티어':
          return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-amber-100 text-amber-900 border border-amber-300 shrink-0" title="전환 1티어">1️⃣🏅</span>`;

            </p>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 작품 삭제
    function deleteNovel(novelId, afterDeleteCb = null) {
      const target = state.novels.find((n) => n.id === novelId);
      if (!target) return;
      state.novels = state.novels.filter((n) => n.id !== novelId);
      if (state.selectedRecipeNovelId === novelId) {
        state.selectedRecipeNovelId = null;
      }
      saveState();
      closeModal();
      showToast(`"${target.title}" 작품이 삭제되었습니다.`, 'info');
      if (afterDeleteCb) afterDeleteCb();
      renderApp();
    }

    // 모달 제어
    function openModal(title, bodyHtml) {
      const backdrop = document.getElementById('modal-backdrop');
      const titleEl = document.getElementById('modal-title');
      const bodyEl = document.getElementById('modal-body');
      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      document.getElementById('modal-body').innerHTML = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // 샘플 데이터 복원 버튼
    document.getElementById('btn-reset-sample').addEventListener('click', () => {
      state = createSampleState();
      saveState();
      showToast('샘플 데이터가 복원되었습니다!', 'success');
      renderApp();
    });

    // =========================================================================
    // 전체 렌더링 컨트롤러
    // =========================================================================
    function renderApp() {
      renderBottomNav();
      renderCategoryBanner();
      const main = document.getElementById('main-content');
      main.scrollTop = 0;

      switch (state.activeCategory) {
        case 'register':
          renderRegisterView(main);
          break;
        case 'kitchen':
          renderKitchenView(main);
          break;
        case 'michelin':
          renderMichelinView(main);
          break;
        case 'pantry':
          renderPantryView(main);
          break;
        case 'recipe':
          renderRecipeView(main);
          break;
        case 'dishwash':
          renderDishwashView(main);
          break;
        default:
          renderRegisterView(main);
      }
    }

    function renderBottomNav() {
      const nav = document.querySelector('nav');
      nav.innerHTML = CATEGORIES.map((cat) => {
        const active = state.activeCategory === cat.id;
        return `
          <button
            type="button"
            data-nav="${cat.id}"
            class="flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl transition active:scale-95 ${
              active
                ? 'bg-terracotta/14 text-terracottaDark font-extrabold shadow-inner'
                : 'text-muted hover:bg-stonebg/80 font-medium'
            }"
          >
            <span class="text-base leading-none mb-1">${cat.icon}</span>
            <span class="text-[10px] tracking-tighter leading-tight whitespace-nowrap">${cat.name}</span>
          </button>
        `;
      }).join('');

      nav.querySelectorAll('button[data-nav]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activeCategory = btn.dataset.nav;
          saveState();
          renderApp();
        });
      });
    }

    function renderCategoryBanner() {
      const cat = CATEGORIES.find((c) => c.id === state.activeCategory) || CATEGORIES[0];
      const banner = document.getElementById('category-banner');

      // 카테고리별 실시간 카운트 뱃지 계산
      const regCount = state.novels.filter((n) => n.location === 'register').length;
      const draftCount = state.novels.filter((n) => n.location === 'register' && !isLabelingComplete(n)).length;
      const kitchenCount = state.novels.filter((n) => n.location === 'kitchen').length;
      const michelinCount = state.novels.filter((n) => hasMichelinInput(n)).length;
      const pantryCount = state.novels.filter((n) => n.location === 'pantry').length;
      const recipeActiveCount = state.novels.filter(
        (n) => (n.location === 'recipe' || (n.specials || []).includes('recipe')) && !n.recipeCompleted && n.location !== 'pantry'
      ).length;

      let statText = '';
      if (cat.id === 'register') statText = `대기 ${regCount}편 · 임시등록 ${draftCount}편`;
      if (cat.id === 'kitchen') statText = `조리 대기 ${kitchenCount}편`;
      if (cat.id === 'michelin') statText = `미슐랭 등록 ${michelinCount}편`;
      if (cat.id === 'pantry') statText = `보관 중 ${pantryCount}편`;
      if (cat.id === 'recipe') statText = `분석 대상 ${recipeActiveCount}편`;
      if (cat.id === 'dishwash') {
        const monthTotal = getMonthlyDishwashCount(state.selectedDishMonth);
        statText = `${state.selectedDishMonth} 완료 ${monthTotal}편`;
      }

      banner.innerHTML = `
        <div class="bg-cardbg border border-line rounded-2xl px-3.5 py-2.5 flex items-center justify-between shadow-soft">
          <div class="flex items-center gap-2.5 min-w-0">

            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-extrabold text-ink">${cat.name}</h2>

              </div>
              <p class="text-[11px] text-muted truncate mt-0.5">${cat.desc}</p>
            </div>
          </div>
        </div>
      `;
