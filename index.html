    /**
     * Helper: get today's date string in YYYY-MM-DD (local time)
     */
    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getOffsetDateStr(daysAgo) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const init = createInitialState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
          return init;
        }
        const parsed = JSON.parse(raw);
        return { ...createInitialState(), ...parsed };
      } catch (err) {
        console.error('Failed to load state:', err);
        return createInitialState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Failed to save state:', err);
        showToast('저장 공간에 문제가 발생했습니다.', 'error');
      }
    }

    function nextSeq() {
      const maxSeq = state.works.reduce((max, w) => Math.max(max, w.seq || 0), 0);
      return maxSeq + 1;
    }

    /**
     * Toast notification helper
     */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass =
        type === 'error'
          ? 'bg-rose-600 text-white'
          : type === 'info'
          ? 'bg-stone-800 text-white'
          : 'bg-stone-900 text-white border border-stone-700';

      toast.className = `${bgClass} px-4 py-2.5 rounded-2xl shadow-float text-xs font-semibold flex items-center justify-between gap-2 animate-pop pointer-events-auto`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    /**
     * Copy novel title for instant Munpia search
     */
    function copyTitleForMunpia(title) {
      if (!title) return;
      // Use fallback-friendly clipboard copy
      let copied = false;
      try {
        const textarea = document.createElement('textarea');
        textarea.value = title;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        copied = document.execCommand('copy');
        document.body.removeChild(textarea);
      } catch (e) {
        copied = false;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(title).catch(() => {});
      }

      showToast(`"${title}" 제목 복사 완료! 문피아에 붙여넣어 검색하세요.`, 'success');
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Medal badge generator for Michelin Tiers 4, 3, 2, 1
     */
    function getMichelinMedalBadge(tier) {
      switch (tier) {
        case '전환 1티어':
          return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-amber-100 text-amber-800 border border-amber-300 shadow-2xs" title="전환 1티어 메달">🥇 1티어</span>`;
        case '전환 2티어':
          return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-slate-100 text-slate-700 border border-slate-300" title="전환 2티어 메달">🥈 2티어</span>`;
        case '전환 3티어':
          return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-orange-100 text-orange-800 border border-orange-300" title="전환 3티어 메달">🥉 3티어</span>`;
        case '전환 4티어':
          return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-sky-100 text-sky-800 border border-sky-300" title="전환 4티어 메달">🏅 4티어</span>`;
        default:
          return '';
      }
    }

          return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>

        case 'kitchen': // 조리실: Cooking Pot / Flame
          return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

        case 'pantry': // 팬트리: Pantry Shelf / Archive Box

    /**
     * ============================================================================
     * RENDER ORCHESTRATOR
     * ============================================================================
     */
    function renderAll() {
      renderBottomNav();
      const main = document.getElementById('main-content');
      if (!main) return;

      switch (state.activeTab) {
        case 'register':
          main.innerHTML = renderRegisterView();
          break;
        case 'kitchen':
          main.innerHTML = renderKitchenView();
          break;
        case 'michelin':
          main.innerHTML = renderMichelinView();
          break;
        case 'pantry':
          main.innerHTML = renderPantryView();
          break;
        case 'recipe':
          main.innerHTML = renderRecipeView();
          break;
        case 'dishwash':
          main.innerHTML = renderDishwashView();
          break;
        default:
          main.innerHTML = renderRegisterView();
      }
    }

    function renderBottomNav() {
      const grid = document.getElementById('bottom-nav-grid');
      if (!grid) return;
      grid.innerHTML = CATEGORIES_NAV.map((cat) => {
        const active = state.activeTab === cat.id;
        return `
          <button
            type="button"
            onclick="switchTab('${cat.id}')"
            class="flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl transition ${
              active
                ? 'text-bistro-600 bg-bistro-50/90 font-bold'
                : 'text-stone-500 hover:text-stone-800 hover:bg-stone-100/70 font-medium'
            }"
          >
            ${getNavPictogram(cat.id, active)}
            <span class="text-[10px] mt-1 tracking-tight leading-none whitespace-nowrap">${cat.label}</span>
          </button>
        `;
      }).join('');
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      saveState();
      renderAll();
      document.getElementById('main-content')?.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * ============================================================================
     * 1. 제품 등록 (3-STEP REGISTRATION, DRAFTS, LABELING & MICHELIN)
     * ============================================================================
     */
    function renderRegisterView() {
      const stage = state.registerStage || 'menu';
      const activeRegisterWorks = state.works
        .filter((w) => w.inRegister || w.isDraft)
        .sort((a, b) => a.seq - b.seq);

      const draftWorks = activeRegisterWorks.filter((w) => w.isDraft);
      const filteredWorks =
        state.registerFilter === 'draft' ? draftWorks : activeRegisterWorks;

      // Work selected in labeling step
      const labelTarget =
        state.works.find((w) => w.id === state.selectedLabelingWorkId) ||
        draftWorks[0] ||
        activeRegisterWorks[0] ||
        null;

      // Work selected in michelin step (can pick from any work in state so user can update Michelin anytime)
      const michelinTarget =
        state.works.find((w) => w.id === state.selectedMichelinWorkId) ||
        state.works[0] ||
        null;

      return `
        <div class="space-y-4">
          <!-- Section Banner -->
          <div class="bg-gradient-to-r from-bistro-600 to-bistro-500 text-white rounded-3xl p-4 shadow-soft">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">STEP 1~3 WORKFLOW</span>
                <h2 class="text-lg font-extrabold mt-1">제품 등록</h2>
                <p class="text-xs text-bistro-100 mt-0.5">메뉴 선정 → 라벨링 완료 시 [조리실·팬트리]로 이동합니다.</p>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black">${draftWorks.length}</div>
                <div class="text-[10px] text-bistro-100">임시등록</div>
              </div>
            </div>
          </div>

          <!-- 3-Stage Stepper Tabs -->
          <div class="grid grid-cols-3 gap-1.5 bg-stone-200/70 p-1 rounded-2xl">
            <button
              type="button"
              onclick="setRegisterStage('menu')"
              class="py-2 px-2 rounded-xl text-xs font-bold transition ${
                stage === 'menu'
                  ? 'bg-white text-bistro-600 shadow-xs'
                  : 'text-stone-600 hover:text-stone-900'
              }"
            >
              ① 메뉴 선정
            </button>
            <button
              type="button"
              onclick="setRegisterStage('labeling')"
              class="py-2 px-2 rounded-xl text-xs font-bold transition ${
                stage === 'labeling'
                  ? 'bg-white text-bistro-600 shadow-xs'
                  : 'text-stone-600 hover:text-stone-900'
              }"
            >
              ② 라벨링
            </button>
            <button
              type="button"
              onclick="setRegisterStage('michelin')"
              class="py-2 px-2 rounded-xl text-xs font-bold transition ${
                stage === 'michelin'
                  ? 'bg-white text-bistro-600 shadow-xs'
                  : 'text-stone-600 hover:text-stone-900'
              }"
            >
              ③ 미슐랭 선정
            </button>
          </div>

          <!-- Duplicate Alert Box (Hidden unless triggered) -->
          <div id="duplicate-alert-box" class="hidden bg-rose-50 border-2 border-rose-200 rounded-3xl p-4 shadow-soft animate-pop">
            <div class="flex items-center gap-3">
              ${getCuteChefMascotSvg()}
              <div class="flex-1">
                <span class="inline-block text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 mb-1">중복 감지!</span>
                <h3 class="text-sm font-extrabold text-rose-900">이미 등록된 작품입니다</h3>
                <p id="duplicate-alert-detail" class="text-xs text-rose-700 mt-0.5">쉐프가 노트를 확인해보니 같은 제목의 작품이 이미 있어요.</p>
                <button
                  type="button"
                  onclick="document.getElementById('duplicate-alert-box').classList.add('hidden')"
                  class="mt-2 text-[11px] font-bold px-3 py-1 rounded-xl bg-rose-600 text-white hover:bg-rose-700 transition"
                >
                  확인했어요
                </button>
              </div>
            </div>
          </div>

          ${
            stage === 'menu'
              ? renderMenuSelectionForm()
              : stage === 'labeling'
              ? renderLabelingForm(labelTarget, activeRegisterWorks)
              : renderMichelinSelectionForm(michelinTarget)
          }

          <!-- Current Works in 제품 등록 / 임시등록 -->
          <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/70 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h3 class="text-sm font-extrabold text-stone-900">등록 대기 · 임시등록 목록</h3>
                <p class="text-[11px] text-stone-500">라벨링이 완료된 작품은 [조리실]과 [팬트리]로 자동 이동합니다.</p>
              </div>
              <div class="flex gap-1 bg-stone-100 p-1 rounded-xl shrink-0">
                <button
                  type="button"
                  onclick="setRegisterFilter('all')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                    state.registerFilter === 'all' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-500'
                  }"
                >
                  전체 (${activeRegisterWorks.length})
                </button>
                <button
                  type="button"
                  onclick="setRegisterFilter('draft')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                    state.registerFilter === 'draft' ? 'bg-amber-500 text-white shadow-2xs' : 'text-stone-500'
                  }"
                >
                  임시등록 (${draftWorks.length})
                </button>
              </div>
            </div>

            ${
              filteredWorks.length === 0
                ? `<div class="text-center py-8 px-4 bg-stone-50 rounded-2xl border border-dashed border-stone-200">
                    <p class="text-xs font-semibold text-stone-500">현재 표시할 등록 대기/임시등록 작품이 없습니다.</p>
                    <p class="text-[11px] text-stone-400 mt-1">위에서 새 작품을 등록하거나 [조리실]·[팬트리]에서 작품을 확인해 보세요.</p>
                  </div>`
                : `<div class="space-y-2.5">
                    ${filteredWorks.map((w) => renderRegisterWorkCard(w)).join('')}
                  </div>`
            }
          </div>
        </div>
      `;
    }

    function renderMenuSelectionForm() {
      return `
        <form onsubmit="handleMenuSubmit(event)" class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/70 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-stone-900">① 메뉴 선정 (수동 체크 &amp; 제목 입력)</h3>
            <span class="text-[11px] font-semibold text-bistro-600">중복 체크 가능</span>

          <!-- Multi-select Menus -->
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-2">문피아 차트 / 구분 (중복 선택 가능)</label>
            <div class="grid grid-cols-3 gap-2">
              ${MENUS.map(
                (m) => `
                <label class="cursor-pointer select-none">
                  <input type="checkbox" name="menuCheck" value="${escapeHtml(m)}" class="peer sr-only" />
                  <div class="py-2.5 px-2 rounded-2xl border border-stone-200 text-center text-xs font-bold text-stone-600 peer-checked:bg-bistro-50 peer-checked:border-bistro-500 peer-checked:text-bistro-700 transition">
                    ${escapeHtml(m)}
                  </div>
                </label>
              `
              ).join('')}
            </div>
          </div>

          <!-- Title Input -->
          <div>
            <label for="reg-title-input" class="block text-xs font-bold text-stone-700 mb-1.5">작품 제목 <span class="text-rose-500">*</span></label>
            <input
              id="reg-title-input"
              type="text"
              placeholder="예: 회귀한 천재 대장장이의 훈제 치킨"
              class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-bistro-400 focus:bg-white transition"
            />
          </div>

          <!-- Optional Immediate Labeling Fields -->
          <div class="bg-stone-50/90 rounded-2xl p-3.5 border border-stone-200/80 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-stone-800">라벨링 함께 입력 (선택 · 미입력 시 [임시등록])</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold">임시등록 지원</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label for="reg-genre-select" class="block text-[11px] font-bold text-stone-600 mb-1">장르</label>
                <select
                  id="reg-genre-select"
                  class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-semibold text-stone-800 focus:outline-none focus:ring-2 focus:ring-bistro-400"
                >
                  <option value="">장르 선택 (미선택 시 임시등록)</option>
                  ${GENRES.map((g) => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label for="reg-author-input" class="block text-[11px] font-bold text-stone-600 mb-1">작가명</label>
                <input
                  id="reg-author-input"
                  type="text"
                  placeholder="작가명 입력 (미입력 시 임시등록)"
                  class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-bistro-400"
                />
              </div>
            </div>
          </div>

          <!-- Submit Actions -->
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button
              type="submit"
              data-mode="draft"
              class="py-3 px-3 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-extrabold transition"
            >
              제목만 [임시등록]
            </button>
            <button
              type="submit"
              data-mode="full"
              class="py-3 px-3 rounded-2xl bg-bistro-600 hover:bg-bistro-700 text-white text-xs font-extrabold shadow-sm transition"

              등록 완료 (라벨 포함 시 이동)

    function renderLabelingForm(target, registerList) {
      if (!target) {
        return `
          <div class="bg-white rounded-3xl p-5 shadow-soft border border-stone-200/70 text-center space-y-2">
            <p class="text-sm font-bold text-stone-700">라벨링할 작품이 없습니다.</p>
            <button type="button" onclick="setRegisterStage('menu')" class="px-4 py-2 rounded-xl bg-bistro-600 text-white text-xs font-bold">
              ① 메뉴 선정으로 이동
            </button>
          </div>
        `;
      }

      return `
        <form onsubmit="handleLabelingSubmit(event, '${target.id}')" class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/70 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-stone-900">② 라벨링 입력 및 수정</h3>
            ${
              target.isDraft
                ? `<span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800">[임시등록]</span>`
                : `<span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">라벨 완료</span>`
            }
          </div>

          <!-- Select target work -->
          <div>
            <label for="label-work-select" class="block text-xs font-bold text-stone-700 mb-1">대상 작품 선택</label>

              id="label-work-select"
              onchange="selectLabelingWork(this.value)"
              class="w-full px-3 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-xs font-bold text-stone-800"
            >
              ${state.works
                .slice()
                .sort((a, b) => a.seq - b.seq)
                .map(
                  (w) =>
                    `<option value="${w.id}" ${w.id === target.id ? 'selected' : ''}>#${w.seq} ${escapeHtml(w.title)} ${
                      w.isDraft ? '[임시등록]' : `(${escapeHtml(w.genre || '미지정')})`
                    }</option>`
                )
                .join('')}
            </select>
          </div>

          <!-- Menu checkboxes editable here too -->
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">메뉴 구분 (중복 선택 가능)</label>
            <div class="grid grid-cols-3 gap-2">
              ${MENUS.map((m) => {
                const checked = (target.menus || []).includes(m);
                return `
                  <label class="cursor-pointer select-none">
                    <input type="checkbox" name="labelMenuCheck" value="${escapeHtml(m)}" ${checked ? 'checked' : ''} class="peer sr-only" />
                    <div class="py-2 px-2 rounded-xl border border-stone-200 text-center text-[11px] font-bold text-stone-600 peer-checked:bg-bistro-50 peer-checked:border-bistro-500 peer-checked:text-bistro-700 transition">
                      ${escapeHtml(m)}
                    </div>
                  </label>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Title edit -->
          <div>
            <label for="label-title-input" class="block text-xs font-bold text-stone-700 mb-1">작품 제목</label>
            <input
              id="label-title-input"
              type="text"
              value="${escapeHtml(target.title)}"
              class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-bistro-400 focus:bg-white"
            />

    function handleMenuSubmit(event) {
      event.preventDefault();
      const submitter = event.submitter;
      const mode = submitter?.dataset?.mode || 'full';

      const titleInput = document.getElementById('reg-title-input');
      const genreSelect = document.getElementById('reg-genre-select');
      const authorInput = document.getElementById('reg-author-input');
      const checkedMenus = Array.from(document.querySelectorAll('input[name="menuCheck"]:checked')).map(
        (el) => el.value
      );

      const rawTitle = (titleInput?.value || '').trim();
      if (!rawTitle) {
        showToast('작품 제목을 입력해 주세요!', 'error');
        titleInput?.focus();
        return;
      }

      // Check duplicate title (case-insensitive normalized)
      const normalized = rawTitle.replace(/\s+/g, ' ').toLowerCase();
      const duplicate = state.works.find(
        (w) => w.title.replace(/\s+/g, ' ').toLowerCase() === normalized
      );
      if (duplicate) {
        const alertBox = document.getElementById('duplicate-alert-box');
        const detail = document.getElementById('duplicate-alert-detail');
        if (alertBox && detail) {
          detail.textContent = `"${duplicate.title}" (${duplicate.author || '작가 미상'}) 작품이 이미 등록되어 있어요.`;
          alertBox.classList.remove('hidden');
          alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        showToast('이미 등록된 작품입니다!', 'error');
        return;
      }

      const genre = mode === 'draft' ? '' : (genreSelect?.value || '').trim();
      const author = mode === 'draft' ? '' : (authorInput?.value || '').trim();
      const isLabelingComplete = Boolean(genre && author);

      const newWork = {
        id: 'w-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        seq: nextSeq(),
        menus: checkedMenus.length > 0 ? checkedMenus : ['기타'],
        title: rawTitle,
        genre,
        author,
        isDraft: !isLabelingComplete,
        // Move to [조리실] and [팬트리] when labeling is complete; hide from 제품 등록
        inRegister: !isLabelingComplete,
        kitchenActive: isLabelingComplete,
        pantryActive: isLabelingComplete,
        recipeActive: false,
        recipeAnalyzed: false,
        rating: '☆☆☆☆ 미지정',
        specials: [],
        tags: [],
        michelin: {
          hasData: false,
          tier: '분석 전',
          conversionValue: '',
          freeFinalEpisode: ''
        },
        recipe: {
          selectedMajor: [],
          selectedSub: []
        },
        completedAt: null,
        createdAt: getTodayStr()
      };

      state.works.push(newWork);
      saveState();

      if (isLabelingComplete) {
        showToast(`"${rawTitle}" 라벨링 완료! [조리실]과 [팬트리]로 이동했습니다.`);
      } else {
        showToast(`"${rawTitle}" [임시등록]으로 저장되었습니다.`);
      }

      renderAll();
    }

    function handleLabelingSubmit(event, workId) {
      event.preventDefault();
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;

      const titleVal = (document.getElementById('label-title-input')?.value || '').trim();
      const genreVal = (document.getElementById('label-genre-select')?.value || '').trim();
      const authorVal = (document.getElementById('label-author-input')?.value || '').trim();
      const menusVal = Array.from(document.querySelectorAll('input[name="labelMenuCheck"]:checked')).map(
        (el) => el.value
      );

      if (!titleVal) {
        showToast('제목은 비워둘 수 없습니다.', 'error');
        return;
      }

      // Check duplicate against other works
      const dup = state.works.find(
        (w) => w.id !== workId && w.title.trim().toLowerCase() === titleVal.toLowerCase()
      );
      if (dup) {
        showToast('이미 등록된 작품입니다!', 'error');
        return;
      }

      work.title = titleVal;
      work.genre = genreVal;
      work.author = authorVal;
      work.menus = menusVal.length > 0 ? menusVal : ['기타'];

      const complete = Boolean(genreVal && authorVal);
      if (complete) {
        work.isDraft = false;
        work.inRegister = false;
        work.kitchenActive = true;
        work.pantryActive = true;
        saveState();
        showToast(`"${work.title}" 라벨링 완료! [조리실]과 [팬트리]로 이동했습니다.`);
        renderAll();
      } else {
        work.isDraft = true;
        work.inRegister = true;
        saveState();
        showToast(`장르 또는 작가명이 미입력되어 [임시등록] 상태로 저장되었습니다.`, 'info');
        renderAll();
      }
    }

    function handleMichelinSubmit(event, workId) {
      event.preventDefault();
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;

      const tier = document.getElementById('mich-tier-select')?.value || '분석 전';
      const convRaw = document.getElementById('mich-conv-input')?.value;
      const freeRaw = document.getElementById('mich-free-input')?.value;

      const convVal = convRaw === '' || convRaw === undefined ? '' : Number(convRaw);
      const freeVal = freeRaw === '' || freeRaw === undefined ? '' : Number(freeRaw);

      const hasAnyInput =
        tier !== '분석 전' || (convVal !== '' && !Number.isNaN(convVal)) || (freeVal !== '' && !Number.isNaN(freeVal));

      work.michelin = {
        hasData: hasAnyInput,
        tier,
        conversionValue: Number.isNaN(convVal) ? '' : convVal,
        freeFinalEpisode: Number.isNaN(freeVal) ? '' : freeVal
      };

      saveState();
      showToast(`"${work.title}" 미슐랭 정보가 업데이트되었습니다.`);
      renderAll();
    }

                  <p class="text-xs text-stone-500">[제품 등록]에서 라벨링을 완료하면 작품이 이곳에 나타납니다.</p>
