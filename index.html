      const m = String(d.getMonth() + 1).padStart(2, '0');

      return `${y}-${m}-${day}`;

    function offsetDateStr(days) {

      return formatDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + days));

    function saveToStorage() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            novels: state.novels,
            tagPool: state.tagPool,
          })
        );
      } catch (e) {
        console.error('로컬스토리지 저장 실패:', e);
        showToast('저장 공간에 접근할 수 없습니다.', 'error');
      }
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.novels = Array.isArray(parsed.novels) ? parsed.novels : buildSampleNovels();
          state.tagPool = Array.isArray(parsed.tagPool) && parsed.tagPool.length ? parsed.tagPool : [...DEFAULT_TAG_POOL];
          return;
        }
      } catch (e) {
        console.error('로컬스토리지 파싱 실패:', e);
      }
      state.novels = buildSampleNovels();
      state.tagPool = [...DEFAULT_TAG_POOL];
    }

    function showToast(message, type = 'info') {
      const area = document.getElementById('toast-area');
      const el = document.createElement('div');
      const styles = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-950 text-emerald-100 border-emerald-500',
        warning: 'bg-amber-950 text-amber-100 border-amber-500',
        error: 'bg-rose-950 text-rose-100 border-rose-500',
      };
      el.className = `pointer-events-auto border rounded-2xl px-3.5 py-2.5 shadow-xl text-xs font-bold flex items-center gap-2 animate-pop-in ${styles[type] || styles.info}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      area.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }

          <p class="text-[11px] text-slate-500 truncate">「${escapeHtml(titleText)}」</p>
        </div>
      `;
      area.appendChild(card);
      setTimeout(() => {
        card.style.opacity = '0';
        card.style.transition = 'opacity 0.3s ease';

    function copyToClipboard(text, label = '제목') {
      if (!text) return;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(`${label} 복사 완료! 문피아 검색창에 붙여넣으세요.`, 'success');
      } catch (e) {
        showToast('복사에 실패했습니다.', 'error');
      } finally {
        ta.remove();
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    function getMichelinMedalBadge(novel) {
      const tierId = novel?.michelin?.tier;
      const found = MICHELIN_TIERS.find((t) => t.id === tierId);
      if (!found || !found.medal) return '';
      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded-lg bg-amber-100 border border-amber-300 text-amber-900 text-[11px] font-extrabold ml-1.5 align-middle">${found.medal}</span>`;
    }

    function hasCompletedPrep(novel) {
      return novel.stage !== 'register_temp';
    }

    function isCookSourceSelected(novel) {
      return Array.isArray(novel.badges) && novel.badges.includes('cook');
    }

    function hasCookingSelections(novel) {
      if (!novel.cooking) return false;
      return COOKING_DIMENSIONS.some((d) => {
        const block = novel.cooking[d.key];
        return block && ((block.bigs && block.bigs.length > 0) || (block.subs && block.subs.length > 0));
      });
    }

      return state.novels.filter((n) => n.stage === 'recipe' && !n.recipeCompleted);
    }

    // 메타데이터 장르 분석용: 요리하기에 등록되었던(혹은 요리하기 단계를 거친/소스가 선택된) 작품들
    function getMetadataGenreNovels() {
      return state.novels.filter(
        (n) =>
          isCookSourceSelected(n) ||
          hasCookingSelections(n) ||
          n.stage === 'cook' ||
          n.stage === 'recipe' ||
          n.recipeCompleted
      );
    }

    // 레시피분석 랜덤 변형 엔진
    function generateRemixSentence(novel, selectedDims, seed = 1) {
      const dimsToUse = selectedDims && selectedDims.length ? selectedDims : ['genre', 'setting', 'protagonist'];
      const pickedDetails = dimsToUse.map((dimKey, idx) => {
        const dimObj = COOKING_DIMENSIONS.find((d) => d.key === dimKey) || COOKING_DIMENSIONS[0];
        const block = novel.cooking?.[dimKey] || { bigs: [], subs: [] };
        const pool = [...(block.subs || []), ...(block.bigs || [])];

        if (pool.length > 0) {
          const baseItem = pool[(seed + idx) % pool.length];
          // 랜덤 변형 파생어 생성
          const allSubPool = dimObj.groups.flatMap((g) => g.items);
          const randomAlt = allSubPool[(seed * 7 + idx * 13 + novel.title.length) % allSubPool.length];
          return `${dimObj.label.replace(/^\d+\)\s*/, '')}: 「${baseItem}」 → 변형「${randomAlt}」`;
        } else {
          const fallbackGroup = dimObj.groups[(seed + idx) % dimObj.groups.length];
          const fallbackSub = fallbackGroup.items[(seed * 5 + idx) % fallbackGroup.items.length];
          return `${dimObj.label.replace(/^\d+\)\s*/, '')}: 「${fallbackGroup.name}」 기반 「${fallbackSub}」`;
        }
      });

      const hookActions = [
        '초반 15화 내 확실한 이권과 보상 루프를 배치한',
        '기존 클리셰의 허점을 역이용해 초반 몰입감을 끌어올린',
        '독자의 기대치를 비틀며 회차 넘김 속도를 극대화한',
      ];
      const hook = hookActions[seed % hookActions.length];

      return `「${novel.title}」(${novel.genre || '웹소설'}) 베이스 변형 기획 — ${pickedDetails.join(' / ')} 조합으로, ${hook} 차기작 컨셉입니다.`;
    }

      if (catId === 'cook') return getCookingQueueNovels().length;
      if (catId === 'recipe') return getRecipeAnalysisNovels().length;
      if (catId === 'michelin') return state.novels.filter((n) => hasCompletedPrep(n)).length;
      if (catId === 'pantry') return state.novels.filter((n) => hasCompletedPrep(n)).length;
      if (catId === 'wash') return state.novels.length;
      return 0;

    // [4] 레시피분석 (랜덤 변형 + 문장 복사 + 삭제 + 완료 숨김 + 하단 [메타데이터] 취향 그래프)

              <article class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">

                  <div>
                    <div class="flex items-center gap-1.5 mb-0.5">
                      <span class="px-2 py-0.5 rounded-lg bg-violet-100 text-violet-800 text-[10px] font-extrabold">${escapeHtml(n.genre)}</span>
                      <span class="text-[11px] text-slate-500">${escapeHtml(n.author)}</span>
                    </div>
                    <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(n.title)}${getMichelinMedalBadge(n)}</h3>

                      const active = rs.selectedDims.includes(d.key);

                <!-- 문장 정리 결과 박스 -->

                  <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold text-violet-900">메모장 붙여넣기용 아이디어 문장</span>

    // [5] 미슐랭 (조리실 입력 완료 작품 대상 유료 도달 / 전환값 / 무료 최종화 / 메달 뱃지)

        ...PREP_BADGES.map((b) => ({
          id: `badge:${b.id}`,
          label: `${b.icon} ${b.label.split(' ')[0]} (${pantryPool.filter((n) => n.badges?.includes(b.id)).length})`,
        })),
        { id: 'tier:tier_4', label: `🏅4 전환 4티어 (${pantryPool.filter((n) => n.michelin?.tier === 'tier_4').length})` },
        { id: 'tier:tier_3', label: `🥉3 전환 3티어 (${pantryPool.filter((n) => n.michelin?.tier === 'tier_3').length})` },
        { id: 'tier:tier_2', label: `🥈2 전환 2티어 (${pantryPool.filter((n) => n.michelin?.tier === 'tier_2').length})` },
        { id: 'tier:tier_1', label: `🥇1 전환 1티어 (${pantryPool.filter((n) => n.michelin?.tier === 'tier_1').length})` },
      ];

      const filtered = pantryPool.filter((n) => {
        if (pf === 'all') return true;
        if (pf.startsWith('rating:')) return n.rating === pf.split(':')[1];
        if (pf.startsWith('badge:')) return Array.isArray(n.badges) && n.badges.includes(pf.split(':')[1]);
        if (pf.startsWith('tier:')) return n.michelin?.tier === pf.split(':')[1];
        return true;
      });

      return `
        <section class="space-y-3 animate-pop-in">
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xl">🗄️</span>
                <div>
                  <h2 class="text-base font-extrabold text-slate-900">팬트리 · 분류 보관소</h2>
                  <p class="text-[11px] text-slate-500">별점·구분·미슐랭 티어별로 한눈에 모아보고 수정하거나 재분석하세요.</p>
                </div>
              </div>
              <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">${filtered.length}편</span>

            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
              ${filterTabs.map((ft) => {
                const active = pf === ft.id;
                return `
                  <button
                    type="button"
                    data-pantry-filter="${ft.id}"
                    class="pantry-filter-btn shrink-0 px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition cursor-pointer ${
                      active ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                    }"
                  >
                    ${escapeHtml(ft.label)}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          ${filtered.length ? filtered.map((n) => {
            const ratingObj = RATING_CHOICES.find((r) => r.id === n.rating) || RATING_CHOICES[4];
            const michObj = MICHELIN_TIERS.find((t) => t.id === n.michelin?.tier) || MICHELIN_TIERS[0];

            return `
              <article class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-1 mb-1">
                      <span class="px-2 py-0.5 rounded-lg border text-[10px] font-extrabold ${ratingObj.pill}">${ratingObj.label}</span>
                      <span class="px-2 py-0.5 rounded-lg bg-slate-100 text-slate-700 text-[10px] font-bold">${escapeHtml(n.genre)}</span>
                      <span class="text-[11px] text-slate-500">${escapeHtml(n.author)}</span>
                    </div>
                    <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(n.title)}${getMichelinMedalBadge(n)}</h3>
                  </div>
                </div>

                <!-- 구분 뱃지 & 미슐랭 수치 -->
                <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                  ${(n.badges || []).map((bid) => {
                    const bObj = PREP_BADGES.find((x) => x.id === bid);
                    return bObj ? `<span class="px-2 py-0.5 rounded-lg border font-bold ${bObj.chip}">${bObj.icon} ${bObj.label}</span>` : '';
                  }).join('')}
                  <span class="px-2 py-0.5 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 font-bold">
                    미슐랭: ${michObj.label} · 전환값 ${escapeHtml(n.michelin?.conversionValue || '-')} · 무료 ${escapeHtml(n.michelin?.freeEpisodeEnd || '-')}화
                  </span>
                </div>

                <!-- 태그 -->
                ${(n.tags && n.tags.length) ? `
                  <div class="flex flex-wrap gap-1">
                    ${n.tags.map((t) => `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-semibold">#${escapeHtml(t)}</span>`).join('')}
                  </div>
                ` : ''}

                <!-- 팬트리 액션 3종: 수정하기 / 레시피분석으로 다시 보내기 / 삭제 -->
                <div class="pt-2 border-t border-slate-100 grid grid-cols-3 gap-1.5">
                  <button
                    type="button"
                    data-open-edit-id="${n.id}"
                    class="open-edit-modal-btn py-2 px-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold cursor-pointer"

                    수정하기
                  </button>
                  <button
                    type="button"
                    data-resend-recipe-id="${n.id}"

                  <button
                    type="button"

                    삭제

            `;
          }).join('') : `

              선택한 팬트리 카테고리에 해당하는 작품이 없습니다.
            </div>
          `}
        </section>
      `;
    }

    // [7] 설거지 (일별 자동 등록 카운트 달력 + 월별 통계 + 데이터 백업/복구)
    function renderWashView() {
      const { year, month, selectedDate } = state.calendar;
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthNovels = state.novels.filter((n) => (n.createdAt || '').startsWith(monthPrefix));

      const dailyMap = {};
      monthNovels.forEach((n) => {
        dailyMap[n.createdAt] = (dailyMap[n.createdAt] || 0) + 1;
      });

      // 월별 통계 계산
      const genreFreq = {};
      const ratingFreq = {};
      monthNovels.forEach((n) => {
        if (n.genre) genreFreq[n.genre] = (genreFreq[n.genre] || 0) + 1;
        if (n.rating) ratingFreq[n.rating] = (ratingFreq[n.rating] || 0) + 1;
      });
      const topGenre = Object.entries(genreFreq).sort((a, b) => b[1] - a[1])[0];
      const topRatingEntry = Object.entries(ratingFreq).sort((a, b) => b[1] - a[1])[0];
      const topRatingLabel = topRatingEntry
        ? (RATING_CHOICES.find((r) => r.id === topRatingEntry[0])?.short || topRatingEntry[0])
        : '없음';

      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDate(new Date());

      const cells = [];
      for (let i = 0; i < firstDow; i++) {
        cells.push(`<div class="h-14 rounded-2xl bg-slate-50/50"></div>`);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cnt = dailyMap[key] || 0;
        const isSel = key === selectedDate;
        const isToday = key === todayStr;

        cells.push(`
          <button
            type="button"
            data-wash-date="${key}"
            class="wash-date-btn h-14 rounded-2xl border p-1 flex flex-col items-center justify-between transition cursor-pointer ${
              isSel
                ? 'bg-sky-600 text-white border-sky-600 shadow-xs'
                : cnt > 0
                  ? 'bg-sky-50 border-sky-200 text-slate-900 hover:bg-sky-100/70'
                  : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'
            }"
          >
            <span class="text-[11px] font-bold ${isToday && !isSel ? 'text-sky-600 underline' : ''}">${d}</span>
            ${cnt > 0
              ? `<span class="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${isSel ? 'bg-amber-300 text-slate-950' : 'bg-sky-600 text-white'}">${cnt}편</span>`
              : `<span class="text-[10px] ${isSel ? 'text-sky-100' : 'text-slate-300'}">0</span>`
            }
          </button>
        `);
      }

      const dayNovels = state.novels.filter((n) => n.createdAt === selectedDate);
      const backupJsonString = JSON.stringify({ novels: state.novels, tagPool: state.tagPool }, null, 2);

      return `
        <section class="space-y-3 animate-pop-in">
          <!-- 월별 통계 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xl">🧼</span>
                <h2 class="text-base font-extrabold text-slate-900">설거지 · ${year}년 ${month + 1}월 통계</h2>
              </div>
              <span class="px-2.5 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-extrabold">월 ${monthNovels.length}편 등록</span>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                <div class="text-[10px] text-slate-500 font-semibold">월간 등록</div>
                <div class="text-base font-extrabold text-slate-900 mt-0.5">${monthNovels.length}편</div>
              </div>
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                <div class="text-[10px] text-slate-500 font-semibold">최다 장르</div>
                <div class="text-xs font-extrabold text-chef-700 mt-1 truncate">${topGenre ? `${escapeHtml(topGenre[0])} (${topGenre[1]})` : '-'}</div>
              </div>
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                <div class="text-[10px] text-slate-500 font-semibold">주요 별점</div>
                <div class="text-xs font-extrabold text-emerald-700 mt-1 truncate">${escapeHtml(topRatingLabel)}</div>
              </div>
            </div>
          </div>

          <!-- 달력 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <button id="btn-wash-prev" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">◀ 이전</button>
              <span class="text-sm font-extrabold text-slate-900">${year}년 ${month + 1}월 일별 등록</span>
              <button id="btn-wash-next" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">다음 ▶</button>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
              <span class="text-rose-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-500">토</span>
            </div>

            <div class="grid grid-cols-7 gap-1">
              ${cells.join('')}
            </div>

            <div class="pt-2 border-t border-slate-100 space-y-1.5">
              <div class="text-xs font-extrabold text-slate-700">${selectedDate} 등록 작품 (${dayNovels.length}편)</div>
              ${dayNovels.length ? dayNovels.map((dn) => `
                <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200/70 flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-900 truncate">${escapeHtml(dn.title)}${getMichelinMedalBadge(dn)}</span>
                  <span class="text-[11px] text-slate-500 shrink-0 ml-2">${escapeHtml(dn.genre || '임시등록')}</span>
                </div>
              `).join('') : `<p class="text-xs text-slate-400">해당 날짜 등록 내역이 없습니다.</p>`}
            </div>
          </div>

          <!-- 데이터 백업 및 복구 -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-slate-900">💾 데이터 백업 및 복구</h3>
              <span class="text-[10px] text-slate-400">JSON 파일·텍스트 지원</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button id="btn-download-backup" type="button" class="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer">
                백업 파일 다운로드
              </button>
              <button id="btn-copy-backup" type="button" class="py-2.5 px-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold cursor-pointer">
                백업 JSON 복사
              </button>
            </div>

            <div>
              <label for="restore-json-textarea" class="block text-[11px] font-bold text-slate-700 mb-1">백업 JSON 붙여넣기 / 파일 업로드 복구</label>
              <textarea
                id="restore-json-textarea"
                rows="3"
                placeholder='{"novels": [...], "tagPool": [...]}'
                class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-[11px] font-mono"
              >${escapeHtml(backupJsonString)}</textarea>
              <div class="mt-2 flex items-center gap-2">
                <label class="flex-1 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold text-center cursor-pointer">
                  JSON 파일 선택
                  <input id="input-restore-file" type="file" accept="application/json,.json" class="hidden" />
                </label>
                <button id="btn-run-restore" type="button" class="flex-1 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">
                  데이터 복구 실행
                </button>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 8. 전체 항목 수정 모달 (팬트리 '수정하기')
    // =========================================================================
    function openFullEditModal(novelId) {
      const novel = state.novels.find((n) => n.id === novelId);
      if (!novel) return;
      state.editingModalNovelId = novelId;

      const modal = document.getElementById('edit-modal');
      const titleEl = document.getElementById('edit-modal-title');
      const bodyEl = document.getElementById('edit-modal-body');

      titleEl.textContent = `「${novel.title}」 전체 항목 수정`;

      const m = novel.michelin || { tier: 'unanalyzed', conversionValue: '', freeEpisodeEnd: '' };
      const pickedSubSet = new Set(
        COOKING_DIMENSIONS.flatMap((d) => novel.cooking?.[d.key]?.subs || [])
      );
      const sampleSubChoices = [
        '회귀물', '빙의물', '상태창물', '먼치킨', '던전물', '요리물',
        '신무협', '무림경영물', '한국대체역사', '경제개발물',
        '회귀자', '냉철한 주인공', '모략가', '셰프', '전술분석', '요리능력'
      ];

      bodyEl.innerHTML = `
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">작품 제목</label>
            <input id="modal-edit-title" type="text" value="${escapeHtml(novel.title)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold" />
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">장르</label>
              <select id="modal-edit-genre" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                ${LABEL_GENRES.map((g) => `<option value="${escapeHtml(g)}" ${novel.genre === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">작가명</label>
              <input id="modal-edit-author" type="text" value="${escapeHtml(novel.author)}" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">별점 (5종 중 1개)</label>
            <div class="grid grid-cols-2 gap-1.5">
              ${RATING_CHOICES.map((r) => `
                <button type="button" data-modal-rating="${r.id}" class="modal-rating-btn py-2 px-2.5 rounded-xl border text-left text-xs font-bold cursor-pointer ${
                  novel.rating === r.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200'
                }">${r.label}</button>
              `).join('')}
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">추가 구분 (중복 선택)</label>
            <div class="grid grid-cols-2 gap-1.5">
              ${PREP_BADGES.map((b) => {
                const act = novel.badges?.includes(b.id);
                return `
                  <button type="button" data-modal-badge="${b.id}" class="modal-badge-btn py-2 px-2.5 rounded-xl border text-xs font-bold cursor-pointer ${
                    act ? b.active : 'bg-white text-slate-700 border-slate-200'
                  }">${b.icon} ${b.label}</button>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">태그 (최대 5개, 쉼표 구분)</label>
            <input id="modal-edit-tags" type="text" value="${escapeHtml((novel.tags || []).join(', '))}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
          </div>

          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-2">
            <div class="text-xs font-extrabold text-amber-900">미슐랭 유료 전환 지표</div>
            <select id="modal-edit-mich-tier" class="w-full px-2.5 py-2 rounded-xl bg-white border border-amber-300 text-xs font-bold">
              ${MICHELIN_TIERS.map((t) => `<option value="${t.id}" ${m.tier === t.id ? 'selected' : ''}>${t.medal ? t.medal + ' ' : ''}${t.label}</option>`).join('')}
            </select>
            <div class="grid grid-cols-2 gap-2">
              <input id="modal-edit-mich-conv" type="number" step="any" value="${escapeHtml(m.conversionValue)}" placeholder="전환값" class="px-2.5 py-2 rounded-xl bg-white border border-amber-300 text-xs" />
              <input id="modal-edit-mich-free" type="number" step="1" value="${escapeHtml(m.freeEpisodeEnd)}" placeholder="무료 최종화" class="px-2.5 py-2 rounded-xl bg-white border border-amber-300 text-xs" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">주요 요리 세부 키워드 토글</label>
            <div class="flex flex-wrap gap-1.5">
              ${sampleSubChoices.map((kw) => {
                const has = pickedSubSet.has(kw);
                return `
                  <button type="button" data-modal-kw="${escapeHtml(kw)}" class="modal-kw-btn px-2 py-1 rounded-lg border text-[11px] font-bold cursor-pointer ${
                    has ? 'bg-chef-500 text-white border-chef-500' : 'bg-slate-50 text-slate-700 border-slate-200'
                  }">${has ? '✓ ' : ''}${escapeHtml(kw)}</button>
                `;
              }).join('')}
            </div>
          </div>

          <button id="btn-save-full-modal" type="button" class="w-full py-3 rounded-2xl bg-chef-500 hover:bg-chef-600 text-white text-xs font-extrabold cursor-pointer">
            전체 수정 내용 저장
          </button>
        </div>
      `;

      // 모달 내부 임시 선택 상태
      let draftRating = novel.rating;
      let draftBadges = [...(novel.badges || [])];
      let draftKeywords = [...pickedSubSet];

      bodyEl.querySelectorAll('.modal-rating-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          draftRating = btn.getAttribute('data-modal-rating');
          bodyEl.querySelectorAll('.modal-rating-btn').forEach((b) => {
            const on = b.getAttribute('data-modal-rating') === draftRating;
            b.className = `modal-rating-btn py-2 px-2.5 rounded-xl border text-left text-xs font-bold cursor-pointer ${
              on ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200'
            }`;
          });
        });
      });

      bodyEl.querySelectorAll('.modal-badge-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const bid = btn.getAttribute('data-modal-badge');
          draftBadges = draftBadges.includes(bid) ? draftBadges.filter((x) => x !== bid) : [...draftBadges, bid];
          const bObj = PREP_BADGES.find((x) => x.id === bid);
          const on = draftBadges.includes(bid);
          btn.className = `modal-badge-btn py-2 px-2.5 rounded-xl border text-xs font-bold cursor-pointer ${
            on ? bObj.active : 'bg-white text-slate-700 border-slate-200'
          }`;
        });
      });

      bodyEl.querySelectorAll('.modal-kw-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const kw = btn.getAttribute('data-modal-kw');
          draftKeywords = draftKeywords.includes(kw) ? draftKeywords.filter((x) => x !== kw) : [...draftKeywords, kw];
          const on = draftKeywords.includes(kw);
          btn.className = `modal-kw-btn px-2 py-1 rounded-lg border text-[11px] font-bold cursor-pointer ${
            on ? 'bg-chef-500 text-white border-chef-500' : 'bg-slate-50 text-slate-700 border-slate-200'
          }`;
          btn.textContent = `${on ? '✓ ' : ''}${kw}`;
        });
      });

      document.getElementById('btn-save-full-modal')?.addEventListener('click', () => {
        const nextTitle = document.getElementById('modal-edit-title').value.trim();
        if (!nextTitle) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }
        const nextGenre = document.getElementById('modal-edit-genre').value;
        const nextAuthor = document.getElementById('modal-edit-author').value.trim() || '작가 미상';
        const parsedTags = document
          .getElementById('modal-edit-tags')
          .value.split(',')
          .map((s) => s.replace(/^#+/, '').trim())
          .filter(Boolean)
          .slice(0, 5);

        parsedTags.forEach((pt) => {
          if (!state.tagPool.includes(pt)) state.tagPool.unshift(pt);
        });

        const nextTier = document.getElementById('modal-edit-mich-tier').value;
        const nextConv = document.getElementById('modal-edit-mich-conv').value;
        const nextFree = document.getElementById('modal-edit-mich-free').value;

        state.novels = state.novels.map((item) => {
          if (item.id !== novelId) return item;
          const updatedCooking = { ...(item.cooking || createEmptyCookingProfile()) };
          updatedCooking.genre = {
            bigs: updatedCooking.genre?.bigs || [],
            subs: draftKeywords.slice(0, 8),
          };
          return {
            ...item,
            title: nextTitle,
            genre: nextGenre,
            author: nextAuthor,
            rating: draftRating,
            badges: draftBadges,
            tags: parsedTags,
            cooking: updatedCooking,
            michelin: {
              tier: nextTier,
              conversionValue: nextConv,
              freeEpisodeEnd: nextFree,
            },
          };
        });

        saveToStorage();
        closeFullEditModal();
        renderApp();
        showToast('수정된 내용이 저장되었습니다.', 'success');
      });

      modal.classList.remove('hidden');
    }

    function closeFullEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
      state.editingModalNovelId = null;
    }

    // =========================================================================
    // 9. 이벤트 바인딩 및 메인 루프
    // =========================================================================
    function bindViewEvents() {
      // 공용 복사(문피아 검색) & 삭제 버튼
      document.querySelectorAll('.copy-search-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          copyToClipboard(btn.getAttribute('data-copy-title') || '', '작품 제목');
        });
      });

      document.querySelectorAll('.delete-novel-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-id');
          state.novels = state.novels.filter((n) => n.id !== id);
          if (state.regForm.editingId === id) {
            state.regForm.editingId = null;
            state.regForm.title = '';
            state.regForm.genre = '';
            state.regForm.author = '';
          }
          saveToStorage();
          renderApp();
          showToast('작품이 삭제되었습니다.', 'info');
        });
      });

      // [1] 제품 등록 이벤트
      document.querySelectorAll('.reg-source-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const src = btn.getAttribute('data-reg-source');
          const cur = state.regForm.sources;
          if (cur.includes(src)) {
            if (cur.length > 1) {
              state.regForm.sources = cur.filter((x) => x !== src);
            } else {
              showToast('최소 1개 이상의 메뉴 구분을 선택해야 합니다.', 'warning');
            }
          } else {
            state.regForm.sources = [...cur, src];
          }
          renderApp();
        });
      });

      document.getElementById('btn-cancel-reg-edit')?.addEventListener('click', () => {
        state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
        renderApp();
      });

      document.getElementById('btn-save-registration')?.addEventListener('click', () => {
        const title = (document.getElementById('reg-title-input')?.value || '').trim();
        const genre = (document.getElementById('reg-genre-select')?.value || '').trim();
        const author = (document.getElementById('reg-author-input')?.value || '').trim();

        if (!title) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }

        const normTarget = normalizeTitle(title);
        const duplicate = state.novels.find(
          (n) => normalizeTitle(n.title) === normTarget && n.id !== state.regForm.editingId
        );
        if (duplicate) {
          showDuplicateCharacterAlert(title);
          return;
        }

        const labelingDone = Boolean(genre && author);
        const nextStage = labelingDone ? 'prep' : 'register_temp';

        if (state.regForm.editingId) {
          state.novels = state.novels.map((n) => {
            if (n.id !== state.regForm.editingId) return n;
            return {
              ...n,
              sources: [...state.regForm.sources],
              title,
              genre,
              author,
              stage: nextStage,
            };
          });
          state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
          saveToStorage();
          if (labelingDone) {
            state.activeCategory = 'prep';
            showToast('라벨링이 완료되어 조리실로 이동했습니다!', 'success');
          } else {
            showToast('임시등록 항목이 수정되었습니다.', 'info');
          }
          renderApp();
          return;
        }

        const created = {
          id: 'n-' + Date.now(),
          sources: [...state.regForm.sources],
          title,
          genre,
          author,
          stage: nextStage,
          rating: 'hold',
          badges: [],
          tags: [],
          cooking: createEmptyCookingProfile(),
          recipeCompleted: false,
          remixedSummary: '',
          michelin: {
            tier: 'unanalyzed',
            conversionValue: '',
            freeEpisodeEnd: '',
          },
          createdAt: formatDate(new Date()),
        };

        state.novels = [created, ...state.novels];
        state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
        saveToStorage();

        if (labelingDone) {
          state.activeCategory = 'prep';
          showToast(`「${title}」 라벨링 완료 → 조리실로 이동했습니다.`, 'success');
        } else {
          showToast(`「${title}」이 [임시등록] 목록에 저장되었습니다.`, 'warning');
        }
        renderApp();
      });

      document.querySelectorAll('.complete-label-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-complete-label-id');
          const gVal = document.querySelector(`.quick-genre-select[data-quick-genre-id="${id}"]`)?.value || '';
          const aVal = (document.querySelector(`.quick-author-input[data-quick-author-id="${id}"]`)?.value || '').trim();

          if (!gVal || !aVal) {
            showToast('장르와 작가명을 모두 입력해야 조리실로 이동합니다.', 'warning');
            return;
          }

          state.novels = state.novels.map((n) =>
            n.id === id ? { ...n, genre: gVal, author: aVal, stage: 'prep' } : n
          );
          saveToStorage();
          state.activeCategory = 'prep';
          renderApp();
          showToast('라벨링 완료! 조리실로 이동했습니다.', 'success');
        });
      });

      document.querySelectorAll('.edit-temp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-temp-id');
          const target = state.novels.find((n) => n.id === id);
          if (!target) return;
          state.regForm = {
            sources: [...(target.sources || ['today'])],
            title: target.title,
            genre: target.genre || '',
            author: target.author || '',
            editingId: target.id,
          };
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      // [2] 조리실 이벤트
      document.querySelectorAll('.prep-rating-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-prep-rating-work');
          const ratingId = btn.getAttribute('data-prep-rating-id');
          state.novels = state.novels.map((n) => (n.id === workId ? { ...n, rating: ratingId } : n));
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.prep-badge-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-prep-badge-work');
          const badgeId = btn.getAttribute('data-prep-badge-id');
          state.novels = state.novels.map((n) => {
            if (n.id !== workId) return n;
            const cur = n.badges || [];
            const next = cur.includes(badgeId) ? cur.filter((x) => x !== badgeId) : [...cur, badgeId];
            return { ...n, badges: next };
          });
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.prep-tag-input').forEach((inp) => {
        inp.addEventListener('input', (e) => {
          const id = e.target.getAttribute('data-prep-tag-input-id');
          state.prepTagInputs[id] = e.target.value;
        });
      });

      document.querySelectorAll('.prep-add-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-prep-add-tag-id');
          const raw = (state.prepTagInputs[workId] || '').replace(/^#+/, '').trim();
          if (!raw) {
            showToast('추가할 태그를 입력해주세요.', 'warning');
            return;
          }
          const novel = state.novels.find((n) => n.id === workId);
          if (!novel) return;
          const curTags = novel.tags || [];
          if (!curTags.includes(raw) && curTags.length >= 5) {
            showToast('작품별 태그는 최대 5개까지 입력할 수 있습니다.', 'warning');
            return;
          }
          if (!state.tagPool.includes(raw)) {
            state.tagPool.unshift(raw);
          }
          const nextTags = curTags.includes(raw) ? curTags : [...curTags, raw];
          state.novels = state.novels.map((n) => (n.id === workId ? { ...n, tags: nextTags } : n));
          state.prepTagInputs[workId] = '';
          saveToStorage();
          renderApp();
          showToast(`#${raw} 태그 저장 및 적용 완료`, 'success');
        });
      });

      document.querySelectorAll('.prep-pool-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-prep-pool-work');
          const tagText = btn.getAttribute('data-prep-pool-tag');
          state.novels = state.novels.map((n) => {
            if (n.id !== workId) return n;
            const cur = n.tags || [];
            if (cur.includes(tagText)) {
              return { ...n, tags: cur.filter((t) => t !== tagText) };
            }
            if (cur.length >= 5) {
              showToast('작품별 태그는 최대 5개까지 선택할 수 있습니다.', 'warning');
              return n;
            }
            return { ...n, tags: [...cur, tagText] };
          });
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.prep-del-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-prep-del-tag-work');
          const tagText = btn.getAttribute('data-prep-del-tag');
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, tags: (n.tags || []).filter((t) => t !== tagText) } : n
          );
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.route-prep-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-route-prep-id');
          const novel = state.novels.find((n) => n.id === workId);
          if (!novel) return;
          const goCook = isCookSourceSelected(novel);
          const nextStage = goCook ? 'cook' : 'pantry';

          state.novels = state.novels.map((n) => (n.id === workId ? { ...n, stage: nextStage } : n));
          saveToStorage();
          state.activeCategory = goCook ? 'cook' : 'pantry';
          renderApp();
          showToast(
            goCook
              ? '요리하기 항목 선택됨 → 요리하기 및 팬트리에 반영되었습니다!'
              : '팬트리로 이동되었습니다!',
            'success'
          );
        });
      });

      // [3] 요리하기 이벤트
      document.querySelectorAll('.cook-dim-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-cook-dim-work');
          const dimKey = btn.getAttribute('data-cook-dim-key');
          const prev = state.cookExpanded[workId] || { openDim: 'genre', openGroups: {} };
          state.cookExpanded[workId] = { ...prev, openDim: dimKey };
          renderApp();
        });
      });

      document.querySelectorAll('.cook-expand-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-cook-expand-work');
          const gKey = btn.getAttribute('data-cook-expand-key');
          const prev = state.cookExpanded[workId] || { openDim: 'genre', openGroups: {} };
          const nextGroups = { ...(prev.openGroups || {}), [gKey]: !prev.openGroups?.[gKey] };
          state.cookExpanded[workId] = { ...prev, openGroups: nextGroups };
          renderApp();
        });
      });

      document.querySelectorAll('.cook-big-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-cook-big-work');
          const dimKey = btn.getAttribute('data-cook-big-dim');
          const bigName = btn.getAttribute('data-cook-big-name');
          state.novels = state.novels.map((n) => {
            if (n.id !== workId) return n;
            const cooking = { ...(n.cooking || createEmptyCookingProfile()) };
            const curBlock = cooking[dimKey] || { bigs: [], subs: [] };
            const nextBigs = curBlock.bigs.includes(bigName)
              ? curBlock.bigs.filter((x) => x !== bigName)
              : [...curBlock.bigs, bigName];
            cooking[dimKey] = { ...curBlock, bigs: nextBigs };
            return { ...n, cooking };
          });
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.cook-sub-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-cook-sub-work');
          const dimKey = btn.getAttribute('data-cook-sub-dim');
          const subName = btn.getAttribute('data-cook-sub-name');
          state.novels = state.novels.map((n) => {
            if (n.id !== workId) return n;
            const cooking = { ...(n.cooking || createEmptyCookingProfile()) };
            const curBlock = cooking[dimKey] || { bigs: [], subs: [] };
            const nextSubs = curBlock.subs.includes(subName)
              ? curBlock.subs.filter((x) => x !== subName)
              : [...curBlock.subs, subName];
            cooking[dimKey] = { ...curBlock, subs: nextSubs };
            return { ...n, cooking };
          });
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.move-recipe-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-move-recipe-id');
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, stage: 'recipe', recipeCompleted: false } : n
          );
          saveToStorage();
          state.activeCategory = 'recipe';
          renderApp();
          showToast('레시피분석 단계로 이동했습니다!', 'success');
        });
      });

      // [4] 레시피분석 이벤트
      document.querySelectorAll('.remix-dim-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-remix-dim-work');
          const dimKey = btn.getAttribute('data-remix-dim-key');
          const cur = state.recipeRemixState[workId] || { selectedDims: ['genre', 'setting'], seed: 1 };
          let nextDims = cur.selectedDims.includes(dimKey)
            ? cur.selectedDims.filter((k) => k !== dimKey)
            : [...cur.selectedDims, dimKey];
          if (!nextDims.length) nextDims = [dimKey];
          state.recipeRemixState[workId] = { ...cur, selectedDims: nextDims };
          renderApp();
        });
      });

      document.querySelectorAll('.run-remix-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-run-remix-id');
          const novel = state.novels.find((n) => n.id === workId);
          if (!novel) return;
          const cur = state.recipeRemixState[workId] || { selectedDims: ['genre', 'setting'], seed: 1 };
          const nextSeed = (cur.seed || 1) + 1;
          state.recipeRemixState[workId] = { ...cur, seed: nextSeed };
          const sentence = generateRemixSentence(novel, cur.selectedDims, nextSeed);

          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, remixedSummary: sentence } : n
          );
          saveToStorage();
          renderApp();
          showToast('랜덤 변형 아이디어 문장이 재설정되었습니다!', 'success');
        });
      });

      document.querySelectorAll('.copy-sentence-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          copyToClipboard(btn.getAttribute('data-copy-sentence') || '', '변형 아이디어 문장');
        });
      });

      document.querySelectorAll('.complete-recipe-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-complete-recipe-id');
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, recipeCompleted: true } : n
          );
          saveToStorage();
          renderApp();
          showToast('레시피분석 완료 처리되었습니다. (메타데이터 및 팬트리 유지)', 'success');
        });
      });

      // [5] 미슐랭 이벤트
      document.querySelectorAll('.mich-tier-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-mich-tier-work');
          const tierId = btn.getAttribute('data-mich-tier-id');
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, michelin: { ...(n.michelin || {}), tier: tierId } } : n
          );
          saveToStorage();
          renderApp();
        });
      });

      document.querySelectorAll('.mich-conv-input').forEach((inp) => {
        inp.addEventListener('change', (e) => {
          const workId = e.target.getAttribute('data-mich-conv-work');
          const val = e.target.value;
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, michelin: { ...(n.michelin || {}), conversionValue: val } } : n
          );
          saveToStorage();
        });
      });

      document.querySelectorAll('.mich-free-input').forEach((inp) => {
        inp.addEventListener('change', (e) => {
          const workId = e.target.getAttribute('data-mich-free-work');
          const val = e.target.value;
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, michelin: { ...(n.michelin || {}), freeEpisodeEnd: val } } : n
          );
          saveToStorage();
        });
      });

      // [6] 팬트리 이벤트
      document.querySelectorAll('.pantry-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.pantryFilter = btn.getAttribute('data-pantry-filter');
          renderApp();
        });
      });

      document.querySelectorAll('.open-edit-modal-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          openFullEditModal(btn.getAttribute('data-open-edit-id'));
        });
      });

      document.querySelectorAll('.resend-recipe-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-resend-recipe-id');
          state.novels = state.novels.map((n) =>
            n.id === workId ? { ...n, stage: 'recipe', recipeCompleted: false } : n
          );
          saveToStorage();
          state.activeCategory = 'recipe';
          renderApp();
          showToast('레시피분석으로 다시 보냈습니다!', 'success');
        });
      });

      // [7] 설거지 달력 & 백업/복구 이벤트
      document.getElementById('btn-wash-prev')?.addEventListener('click', () => {
        if (state.calendar.month === 0) {
          state.calendar.year -= 1;
          state.calendar.month = 11;
        } else {
          state.calendar.month -= 1;
        }
        renderApp();
      });

      document.getElementById('btn-wash-next')?.addEventListener('click', () => {
        if (state.calendar.month === 11) {
          state.calendar.year += 1;
          state.calendar.month = 0;
        } else {
          state.calendar.month += 1;
        }
        renderApp();
      });

      document.querySelectorAll('.wash-date-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.calendar.selectedDate = btn.getAttribute('data-wash-date');
          renderApp();
        });
      });

      document.getElementById('btn-download-backup')?.addEventListener('click', () => {
        const jsonStr = JSON.stringify({ novels: state.novels, tagPool: state.tagPool }, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chef-note-backup-${formatDate(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('백업 JSON 파일이 다운로드되었습니다.', 'success');
      });

      document.getElementById('btn-copy-backup')?.addEventListener('click', () => {
        const raw = document.getElementById('restore-json-textarea')?.value || '';
        copyToClipboard(raw, '백업 JSON');
      });

      document.getElementById('input-restore-file')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const area = document.getElementById('restore-json-textarea');
          if (area) area.value = String(ev.target?.result || '');
          showToast('JSON 파일을 불러왔습니다. [데이터 복구 실행]을 눌러 적용하세요.', 'info');
        };
        reader.readAsText(file);
      });

      document.getElementById('btn-run-restore')?.addEventListener('click', () => {
        const rawText = document.getElementById('restore-json-textarea')?.value || '';
        try {
          const parsed = JSON.parse(rawText);
          if (!Array.isArray(parsed.novels)) {
            showToast('올바른 백업 데이터 형식이 아닙니다.', 'error');
            return;
          }
          state.novels = parsed.novels;
          if (Array.isArray(parsed.tagPool) && parsed.tagPool.length) {
            state.tagPool = parsed.tagPool;
          }
          saveToStorage();
          renderApp();
          showToast(`총 ${state.novels.length}편의 데이터가 복구되었습니다!`, 'success');
        } catch (err) {
          showToast('JSON 구문 오류가 있어 복구에 실패했습니다.', 'error');
        }
      });
    }

    function renderApp() {
      renderNavigation();
      const mainEl = document.getElementById('main-view');

      switch (state.activeCategory) {
        case 'register':
          mainEl.innerHTML = renderRegisterView();
          break;
        case 'prep':
          mainEl.innerHTML = renderPrepView();
          break;
        case 'cook':
          mainEl.innerHTML = renderCookView();
          break;
        case 'recipe':
          mainEl.innerHTML = renderRecipeAnalysisView();
          break;
        case 'michelin':
          mainEl.innerHTML = renderMichelinView();
          break;
        case 'pantry':
          mainEl.innerHTML = renderPantryView();
          break;
        case 'wash':
          mainEl.innerHTML = renderWashView();
          break;
        default:
          mainEl.innerHTML = renderRegisterView();
      }

      bindViewEvents();
    }

    // 전역 모달 & 샘플 초기화 바인딩
    document.getElementById('btn-close-edit-modal')?.addEventListener('click', closeFullEditModal);
    document.getElementById('edit-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'edit-modal') closeFullEditModal();
    });

    document.getElementById('btn-load-sample')?.addEventListener('click', () => {
      state.novels = buildSampleNovels();
      state.tagPool = [...DEFAULT_TAG_POOL];
      state.regForm = { sources: ['today'], title: '', genre: '', author: '', editingId: null };
      state.pantryFilter = 'all';
      saveToStorage();
      renderApp();
      showToast('셰프 노트 샘플 데이터가 초기화되었습니다.', 'info');
    });

    // 초기화 실행
    loadFromStorage();
    renderApp();
  </script>
</body>
</html>
