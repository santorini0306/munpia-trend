                              type="button"
                              onclick="setKitchenRating('${w.id}', '${escapeHtml(r.value)}')"
                              class="py-2 px-2.5 rounded-2xl border text-left text-xs font-bold transition ${
                                active
                                  ? 'bg-amber-500 text-white border-amber-600 shadow-2xs'
                                  : 'bg-white text-stone-700 border-stone-200 hover:border-amber-300'
                              }"
                            >
                              ${escapeHtml(r.label)}
                            </button>
                          `;
                        })
                        .join('')}
                    </div>
                  </div>

                  <!-- 2) 특별전 (Multi-select) -->
                  <div>
                    <label class="block text-xs font-extrabold text-stone-800 mb-2">② 특별전 (중복 선택 가능)</label>
                    <div class="grid grid-cols-2 gap-1.5">
                      ${SPECIAL_EDITIONS.map((sp) => {
                        const checked = specials.includes(sp.key);
                        return `
                          <button
                            type="button"
                            onclick="toggleKitchenSpecial('${w.id}', '${escapeHtml(sp.key)}')"
                            class="py-2 px-2.5 rounded-2xl border text-left text-[11px] font-bold transition ${
                              checked
                                ? 'bg-purple-600 text-white border-purple-700 shadow-2xs'
                                : 'bg-white text-stone-700 border-stone-200 hover:border-purple-300'
                            }"
                          >
                            ${escapeHtml(sp.label)}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>

                  <!-- 3) 추가 태그 (Up to 5 per work + reusable saved tag pool) -->
                  <div class="space-y-2">
                    <div class="flex items-center justify-between">
                      <label class="text-xs font-extrabold text-stone-800">③ 추가 태그 (작품별 최대 5개)</label>
                      <span class="text-[11px] font-bold text-stone-500">${tags.length} / 5</span>
                    </div>

                    <!-- Current work tags -->
                    <div class="flex flex-wrap gap-1.5 min-h-[28px]">
                      ${
                        tags.length === 0
                          ? `<span class="text-[11px] text-stone-400">등록된 태그가 없습니다.</span>`
                          : tags
                              .map(
                                (tg) => `
                                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-bistro-100 text-bistro-800 text-xs font-bold">
                                  #${escapeHtml(tg)}
                                  <button
                                    type="button"
                                    onclick="removeKitchenTag('${w.id}', '${escapeHtml(tg)}')"
                                    class="text-bistro-600 hover:text-rose-600 font-extrabold ml-0.5"
                                    title="태그 제거"
                                  >×</button>
                                </span>
                              `
                              )
                              .join('')
                      }
                    </div>

                    <!-- Tag input -->
                    <div class="flex gap-1.5">
                      <input
                        id="kitchen-tag-input-${w.id}"
                        type="text"
                        placeholder="새 태그 입력 (예: 영지물)"
                        onkeydown="if(event.key==='Enter'){event.preventDefault();addKitchenTagFromInput('${w.id}');}"
                        class="flex-1 px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-bistro-400"
                      />
                      <button
                        type="button"
                        onclick="addKitchenTagFromInput('${w.id}')"
                        class="px-3.5 py-2 rounded-xl bg-stone-800 hover:bg-stone-900 text-white text-xs font-bold transition"
                      >
                        추가
                      </button>
                    </div>

                    <!-- Saved reusable tags pool -->
                    ${
                      state.savedTags.length > 0
                        ? `<div class="pt-1">
                            <div class="text-[10px] font-bold text-stone-500 mb-1">저장된 태그에서 간편 선택:</div>
                            <div class="flex flex-wrap gap-1">
                              ${state.savedTags
                                .map((st) => {
                                  const already = tags.includes(st);
                                  return `
                                    <button
                                      type="button"
                                      onclick="applySavedTag('${w.id}', '${escapeHtml(st)}')"
                                      class="px-2 py-0.5 rounded-lg text-[11px] font-semibold border transition ${
                                        already
                                          ? 'bg-stone-200 text-stone-500 border-stone-300'
                                          : 'bg-white text-stone-700 border-stone-200 hover:border-bistro-400 hover:text-bistro-700'
                                      }"
                                    >
                                      ${already ? '✓ ' : '+ '}${escapeHtml(st)}
                                    </button>
                                  `;
                                })
                                .join('')}
                            </div>
                          </div>`
                        : ''
                    }
                  </div>

                  <!-- Bottom Action Buttons: Delete & 조리 완료 -->
                  <div class="pt-2 border-t border-stone-200 flex items-center gap-2">
                    <button
                      type="button"
                      onclick="deleteWorkConfirm('${w.id}')"
                      class="py-3 px-3.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-extrabold transition"
                    >
                      작품 삭제
                    </button>
                    <button
                      type="button"
                      onclick="completeCooking('${w.id}')"
                      class="flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-bistro-600 to-bistro-500 hover:from-bistro-700 hover:to-bistro-600 text-white text-xs font-extrabold shadow-sm transition"
                    >
                      🍳 조리 완료 (팬트리 이동)
                    </button>
                  </div>
                </div>`
              : ''
          }
        </div>
      `;
    }

    function toggleExpandKitchenWork(id) {
      state.expandedKitchenWorkId = state.expandedKitchenWorkId === id ? null : id;
      saveState();
      renderAll();
    }

    function setKitchenRating(workId, ratingVal) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.rating = ratingVal;
      saveState();
      showToast(`별점이 "${ratingVal}"(으)로 설정되었습니다.`);
      renderAll();
    }

    function toggleKitchenSpecial(workId, specialKey) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.specials = work.specials || [];
      if (work.specials.includes(specialKey)) {
        work.specials = work.specials.filter((s) => s !== specialKey);
      } else {
        work.specials.push(specialKey);
      }
      saveState();
      renderAll();
    }

    function addKitchenTagFromInput(workId) {
      const input = document.getElementById(`kitchen-tag-input-${workId}`);
      if (!input) return;
      const val = input.value.replace(/^#/, '').trim();
      if (!val) return;
      addTagToWork(workId, val);
      input.value = '';
    }

    function applySavedTag(workId, tagText) {
      addTagToWork(workId, tagText);
    }

    function addTagToWork(workId, tagText) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.tags = work.tags || [];
      if (work.tags.includes(tagText)) {
        showToast('이미 해당 작품에 추가된 태그입니다.', 'info');
        return;
      }
      if (work.tags.length >= 5) {
        showToast('작품별 태그는 최대 5개까지 입력할 수 있습니다.', 'error');
        return;
      }
      work.tags.push(tagText);
      if (!state.savedTags.includes(tagText)) {
        state.savedTags.push(tagText);
      }
      saveState();
      showToast(`#${tagText} 태그가 추가되었습니다.`);
      renderAll();
    }

    function removeKitchenTag(workId, tagText) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.tags = (work.tags || []).filter((t) => t !== tagText);
      saveState();
      renderAll();
    }

    /**
     * 조리 완료 (Cooking Complete):
     * - Removes from kitchen (`kitchenActive = false`)
     * - Updates pantry (`pantryActive = true`)
     * - Logs daily completion date for 설거지 calendar
     * - Routes to 레시피분석 (`recipeActive = true`) if '레시피분석 (좋은소스)' is selected
     */
    function completeCooking(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;

      const today = getTodayStr();
      work.kitchenActive = false;
      work.pantryActive = true;
      work.completedAt = today;

      const hasRecipeSpecial = (work.specials || []).includes('레시피분석 (좋은소스)');
      if (hasRecipeSpecial) {
        work.recipeActive = true;
        work.recipeAnalyzed = false;
      }

      state.completionLog[today] = (state.completionLog[today] || 0) + 1;
      if (state.expandedKitchenWorkId === workId) {
        state.expandedKitchenWorkId = null;
      }

      saveState();

      if (hasRecipeSpecial) {
        showToast(`"${work.title}" 조리 완료! [팬트리] 저장 및 [레시피분석]으로 이동했습니다.`);
      } else {
        showToast(`"${work.title}" 조리 완료! [팬트리]에 반영되었습니다.`);
      }
      renderAll();
    }

    /**
     * ============================================================================
     * 3. 미슐랭 (MICHELIN TIER CHART, DRILL-DOWN FILTER, MEDALS & EDIT/DELETE)
     * ============================================================================
     */
    function renderMichelinView() {
      const michelinWorks = state.works.filter((w) => w.michelin && w.michelin.hasData);

      // Count works per tier
      const tierCounts = {};
      MICHELIN_TIERS.forEach((t) => (tierCounts[t] = 0));
      michelinWorks.forEach((w) => {
        const t = w.michelin.tier || '분석 전';
        tierCounts[t] = (tierCounts[t] || 0) + 1;
      });

      const maxCount = Math.max(1, ...Object.values(tierCounts));
      const selectedTier = state.michelinSelectedTier || 'ALL';

      const visibleWorks =
        selectedTier === 'ALL'
          ? michelinWorks
          : michelinWorks.filter((w) => (w.michelin.tier || '분석 전') === selectedTier);

      return `
        <div class="space-y-4">
          <!-- Header -->
          <div class="bg-gradient-to-r from-amber-600 to-bistro-600 text-white rounded-3xl p-4 shadow-soft">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">MICHELIN TIER GUIDE</span>
                <h2 class="text-lg font-extrabold mt-1">미슐랭</h2>
                <p class="text-xs text-amber-100 mt-0.5">티어별 그래프를 클릭하면 해당 티어 작품을 한눈에 볼 수 있습니다.</p>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black">${michelinWorks.length}</div>
                <div class="text-[10px] text-amber-100">분석 작품</div>
              </div>
            </div>
          </div>

          <!-- Interactive SVG Tier Bar Chart -->
          <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/70 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-stone-900">유료 도달 티어 분포 그래프</h3>
              <button
                type="button"
                onclick="selectMichelinFilterTier('ALL')"
                class="text-[11px] font-bold px-2.5 py-1 rounded-xl transition ${
                  selectedTier === 'ALL'
                    ? 'bg-bistro-600 text-white'
                    : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                }"
              >
                전체 보기 (${michelinWorks.length})
              </button>
            </div>

            <!-- Bar rows clickable to filter -->
            <div class="space-y-2">
              ${MICHELIN_TIERS.map((tier) => {
                const count = tierCounts[tier] || 0;
                const pct = Math.round((count / maxCount) * 100);
                const isSelected = selectedTier === tier;
                const medalPrefix =
                  tier === '전환 1티어'
                    ? '🥇 '
                    : tier === '전환 2티어'
                    ? '🥈 '
                    : tier === '전환 3티어'
                    ? '🥉 '
                    : tier === '전환 4티어'
                    ? '🏅 '
                    : '';

                return `
                  <button
                    type="button"
                    onclick="selectMichelinFilterTier('${escapeHtml(tier)}')"
                    class="w-full text-left p-2 rounded-2xl border transition ${
                      isSelected
                        ? 'bg-bistro-50 border-bistro-400 ring-1 ring-bistro-300'
                        : 'bg-stone-50/70 border-stone-200/70 hover:bg-stone-100/80'
                    }"
                  >
                    <div class="flex items-center justify-between text-xs mb-1">
                      <span class="font-bold text-stone-800">${medalPrefix}${escapeHtml(tier)}</span>
                      <span class="font-extrabold text-bistro-700">${count}편</span>
                    </div>
                    <div class="w-full h-3 bg-stone-200/80 rounded-full overflow-hidden">
                      <div
                        class="h-full rounded-full transition-all duration-300 ${
                          tier === '전환 1티어'
                            ? 'bg-amber-500'
                            : tier === '전환 2티어'
                            ? 'bg-slate-500'
                            : tier === '전환 3티어'
                            ? 'bg-orange-500'
                            : tier === '전환 4티어'
                            ? 'bg-sky-500'
                            : tier === '폐사'
                            ? 'bg-rose-400'
                            : 'bg-bistro-500'
                        }"
                        style="width: ${count > 0 ? Math.max(pct, 8) : 0}%"
                      ></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Filtered Works List -->
          <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/70 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-stone-900">
                ${selectedTier === 'ALL' ? '전체 미슐랭 작품' : `${escapeHtml(selectedTier)} 작품`} (${visibleWorks.length})
              </h3>
              <button
                type="button"
                onclick="switchTab('register'); setRegisterStage('michelin');"
                class="text-[11px] font-bold text-bistro-600 hover:underline"
              >
                + 새 미슐랭 입력
              </button>
            </div>

            ${
              visibleWorks.length === 0
                ? `<div class="text-center py-7 bg-stone-50 rounded-2xl border border-dashed border-stone-200 text-xs text-stone-500">
                    해당 티어에 속한 작품이 없습니다.
                  </div>`
                : `<div class="space-y-2.5">
                    ${visibleWorks.map((w) => renderMichelinWorkCard(w)).join('')}
                  </div>`
            }
          </div>
        </div>
      `;
    }

    function renderMichelinWorkCard(w) {
      const m = w.michelin || {};
      return `
        <div class="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="flex items-center flex-wrap gap-1.5">
              <h4 class="text-sm font-extrabold text-stone-900 truncate">${escapeHtml(w.title)}</h4>
              ${getMichelinMedalBadge(m.tier)}
            </div>
            <p class="text-[11px] text-stone-500 mt-1">
              유료도달: <strong class="text-stone-800">${escapeHtml(m.tier || '분석 전')}</strong> ·
              전환값: <strong class="text-bistro-700">${m.conversionValue !== '' ? escapeHtml(m.conversionValue) : '-'}</strong> ·
              무료최종화: <strong class="text-stone-800">${m.freeFinalEpisode !== '' ? escapeHtml(m.freeFinalEpisode) + '화' : '-'}</strong>
            </p>
          </div>
          <button
            type="button"
            onclick="openWorkEditModal('${w.id}')"
            class="shrink-0 px-3 py-2 rounded-xl bg-white hover:bg-bistro-50 text-stone-800 hover:text-bistro-700 border border-stone-200 text-xs font-bold transition"
          >
            수정하기
          </button>
        </div>
      `;
    }

    function selectMichelinFilterTier(tier) {
      state.michelinSelectedTier = tier;
      saveState();
      renderAll();
    }

    /**
     * ============================================================================
     * 4. 팬트리 (PANTRY ARCHIVE: FILTERS, EDIT MODAL WITH DELETE, SEND TO RECIPE)
     * ============================================================================
     */
    function renderPantryView() {
      const pantryWorks = state.works.filter((w) => w.pantryActive);
      const filter = state.pantryFilter || '최근순';

      let list = pantryWorks.slice();
      if (filter === '최근순') {
        list.sort((a, b) => (b.seq || 0) - (a.seq || 0));
      } else if (filter === '별점순') {
        list.sort((a, b) => getRatingRank(b.rating) - getRatingRank(a.rating) || b.seq - a.seq);
      } else if (filter === '레전드') {
        list = list.filter((w) => (w.specials || []).includes('레전드 (작가뽕)'));
      } else if (filter === '슈퍼노멀') {
        list = list.filter((w) => (w.specials || []).includes('슈퍼노멀 (일반연재)'));
      } else if (filter === '냉장고') {
        list = list.filter((w) => (w.specials || []).includes('냉장고 (독자로써 보관)'));
      }

      const pantryTabs = ['최근순', '별점순', '레전드', '슈퍼노멀', '냉장고'];

      return `
        <div class="space-y-4">
          <!-- Header -->
          <div class="bg-gradient-to-r from-stone-800 to-stone-700 text-white rounded-3xl p-4 shadow-soft">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider bg-white/15 px-2 py-0.5 rounded-full">PANTRY STORAGE</span>
                <h2 class="text-lg font-extrabold mt-1">팬트리</h2>
                <p class="text-xs text-stone-300 mt-0.5">직접 삭제하기 전까지 작품 목록과 분석 데이터가 안전하게 보관됩니다.</p>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black">${pantryWorks.length}</div>
                <div class="text-[10px] text-stone-300">보관 중</div>
              </div>
            </div>
          </div>

          <!-- Category Filter Buttons -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${pantryTabs
              .map((tab) => {
                const active = filter === tab;
                return `
                  <button
                    type="button"
                    onclick="setPantryFilter('${escapeHtml(tab)}')"
                    class="shrink-0 px-3.5 py-2 rounded-2xl text-xs font-extrabold transition border ${
                      active
                        ? 'bg-bistro-600 text-white border-bistro-600 shadow-2xs'
                        : 'bg-white text-stone-700 border-stone-200 hover:bg-stone-100'
                    }"
                  >
                    ${escapeHtml(tab)}
                  </button>
                `;
              })
              .join('')}
          </div>

          <!-- Pantry Items -->
          ${
            list.length === 0
              ? `<div class="bg-white rounded-3xl p-6 text-center shadow-soft border border-stone-200/70 text-xs text-stone-500">
                  "${escapeHtml(filter)}" 조건에 해당하는 팬트리 작품이 없습니다.
                </div>`
              : `<div class="space-y-3">
                  ${list.map((w) => renderPantryCard(w)).join('')}
                </div>`
          }
        </div>
      `;
    }

    function getRatingRank(ratingStr) {
      const found = RATINGS.find((r) => r.value === ratingStr);
      return found ? found.stars : 0;
    }

    function renderPantryCard(w) {
      return `
        <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/75 space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center flex-wrap gap-1.5">
                <span class="text-[11px] font-bold text-stone-400">#${w.seq}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-stone-100 text-stone-700">${escapeHtml(w.genre || '미지정')}</span>
                ${getMichelinMedalBadge(w.michelin?.tier)}
                ${
                  w.recipeActive && !w.recipeAnalyzed
                    ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">레시피분석 중</span>`
                    : w.recipeAnalyzed
                    ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">분석완료</span>`
                    : ''
                }
              </div>
              <h3 class="text-sm font-extrabold text-stone-900 mt-1">${escapeHtml(w.title)}</h3>
              <p class="text-[11px] text-stone-500 mt-0.5">
                작가: ${escapeHtml(w.author || '미상')} ·
                별점: <strong class="text-amber-700">${escapeHtml(w.rating || '☆☆☆☆ 미지정')}</strong>
              </p>
            </div>
          </div>

          <!-- Specials & Tags -->
          ${
            (w.specials && w.specials.length) || (w.tags && w.tags.length)
              ? `<div class="flex flex-wrap gap-1">
                  ${(w.specials || [])
                    .map(
                      (sp) =>
                        `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-50 text-purple-700 border border-purple-200">${escapeHtml(sp)}</span>`
                    )
                    .join('')}
                  ${(w.tags || [])
                    .map(
                      (tg) =>
                        `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-stone-100 text-stone-600">#${escapeHtml(tg)}</span>`
                    )
                    .join('')}
                </div>`
              : ''
          }

          <!-- Action Buttons: 수정하기 & 레시피분석으로 보내기 -->
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-stone-100">
            <button
              type="button"
              onclick="openWorkEditModal('${w.id}')"
              class="py-2.5 px-3 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-extrabold transition"
            >
              수정하기
            </button>
            <button
              type="button"
              onclick="sendPantryToRecipe('${w.id}')"
              class="py-2.5 px-3 rounded-2xl bg-bistro-50 hover:bg-bistro-100 text-bistro-700 border border-bistro-200 text-xs font-extrabold transition"
            >
              레시피분석으로 보내기
            </button>
          </div>
        </div>
      `;
    }

    function setPantryFilter(filter) {
      state.pantryFilter = filter;
      saveState();
      renderAll();
    }

    function sendPantryToRecipe(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.recipeActive = true;
      work.recipeAnalyzed = false;
      state.recipeSelectedWorkId = work.id;
      saveState();
      showToast(`"${work.title}" 작품을 [레시피분석]으로 보냈습니다.`);
      switchTab('recipe');
    }

    /**
     * ============================================================================
     * 5. 레시피분석 (METADATA TASTE GRAPH, 7-SECTION TAXONOMY & 분석완료)
     * ============================================================================
     */
    function renderRecipeView() {
      // All works that ever had recipes registered (for [메타데이터] taste chart)
      const worksWithRecipes = state.works.filter((w) => {
        const r = w.recipe || {};
        return (r.selectedMajor && r.selectedMajor.length > 0) || (r.selectedSub && r.selectedSub.length > 0) || w.recipeActive;
      });

      // Genre taste distribution across works that have recipes registered
      const genreTasteMap = {};
      worksWithRecipes.forEach((w) => {
        const g = w.genre || '기타';
        genreTasteMap[g] = (genreTasteMap[g] || 0) + 1;
      });
      const sortedTasteEntries = Object.entries(genreTasteMap).sort((a, b) => b[1] - a[1]);
      const maxTasteCount = Math.max(1, ...sortedTasteEntries.map(([, c]) => c));

      // Active recipe queue (not yet marked 분석완료)
      const activeRecipeWorks = state.works.filter((w) => w.recipeActive && !w.recipeAnalyzed);
      const selectedWork =
        activeRecipeWorks.find((w) => w.id === state.recipeSelectedWorkId) ||
        activeRecipeWorks[0] ||
        null;

      if (selectedWork && state.recipeSelectedWorkId !== selectedWork.id) {
        state.recipeSelectedWorkId = selectedWork.id;
      }

      const activeCatKey = state.recipeActiveCategory || '장르';
      const activeCatObj = RECIPE_TAXONOMY[activeCatKey] || RECIPE_TAXONOMY['장르'];
      const recData = selectedWork?.recipe || { selectedMajor: [], selectedSub: [] };

      return `
        <div class="space-y-4">
          <!-- Header -->
          <div class="bg-gradient-to-r from-bistro-700 to-amber-600 text-white rounded-3xl p-4 shadow-soft">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">IDEA &amp; RECIPE LAB</span>
                <h2 class="text-lg font-extrabold mt-1">레시피분석</h2>
                <p class="text-xs text-amber-100 mt-0.5">큰 계열만 선택하거나 세부 항목까지 중복 선택해 레시피를 분석하세요.</p>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black">${activeRecipeWorks.length}</div>
                <div class="text-[10px] text-amber-100">분석 대기</div>
              </div>
            </div>
          </div>

          <!-- TOP [메타데이터] SECTION (Auto-analyzes genres of recipe-registered works) -->
          <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/75 space-y-3">
            <button
              type="button"
              onclick="toggleMetadataSection()"
              class="w-full flex items-center justify-between text-left"
            >
              <div>
                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-bistro-100 text-bistro-700">자동 취향 분석</span>
                <h3 class="text-sm font-extrabold text-stone-900 mt-1">[메타데이터] 내 레시피 장르 취향 그래프</h3>
              </div>
              <span class="text-xs font-bold text-stone-500">${state.metadataOpen ? '접기 ▲' : '열기 ▼'}</span>
            </button>

            ${
              state.metadataOpen
                ? sortedTasteEntries.length === 0
                  ? `<p class="text-xs text-stone-400 py-3">아직 레시피가 등록된 작품이 없습니다.</p>`
                  : `<div class="space-y-2 pt-1">
                      ${sortedTasteEntries
                        .map(([genreName, cnt]) => {
                          const widthPct = Math.round((cnt / maxTasteCount) * 100);
                          return `
                            <div>
                              <div class="flex justify-between text-xs mb-1">
                                <span class="font-bold text-stone-800">${escapeHtml(genreName)}</span>
                                <span class="font-extrabold text-bistro-600">${cnt}작품</span>
                              </div>
                              <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
                                <div
                                  class="h-full bg-gradient-to-r from-bistro-500 to-amber-400 rounded-full"
                                  style="width: ${Math.max(widthPct, 10)}%"
                                ></div>
                              </div>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>`
                : ''
            }
          </div>

          <!-- Active Recipe Work Selector & Builder -->
          ${
            activeRecipeWorks.length === 0
              ? `<div class="bg-white rounded-3xl p-6 text-center shadow-soft border border-stone-200/70 space-y-2">
                  <p class="text-sm font-extrabold text-stone-800">현재 분석할 레시피 작품이 없습니다.</p>
                  <p class="text-xs text-stone-500">[조리실]에서 '레시피분석 (좋은소스)'를 체크하고 조리 완료하거나, [팬트리]에서 [레시피분석으로 보내기]를 눌러보세요.</p>
                  <button
                    type="button"
                    onclick="switchTab('pantry')"
                    class="mt-2 px-4 py-2 rounded-xl bg-bistro-600 text-white text-xs font-bold"
                  >
                    팬트리로 가기
                  </button>
                </div>`
              : `
                <!-- Work Picker Pills -->
                <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/75 space-y-3">
                  <div class="flex items-center justify-between gap-2">
                    <label class="text-xs font-extrabold text-stone-800">분석 대상 작품 선택</label>
                    <button
                      type="button"
                      onclick="markRecipeAnalysisComplete('${selectedWork.id}')"
                      class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-2xs transition"
                    >
                      ✓ 분석완료
                    </button>
                  </div>

                  <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    ${activeRecipeWorks
                      .map((w) => {
                        const active = w.id === selectedWork.id;
                        return `
                          <button
                            type="button"
                            onclick="selectRecipeWork('${w.id}')"
                            class="shrink-0 px-3 py-2 rounded-2xl text-xs font-bold border transition ${
                              active
                                ? 'bg-stone-900 text-white border-stone-900'
                                : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                            }"
                          >
                            ${escapeHtml(w.title)}
                          </button>
                        `;
                      })
                      .join('')}
                  </div>

                  <!-- Selected Summary for this work -->
                  <div class="bg-bistro-50/70 border border-bistro-200/70 rounded-2xl p-3 space-y-1.5">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold text-bistro-900">${escapeHtml(selectedWork.title)} 선택된 레시피</span>
                      <span class="text-[11px] font-bold text-bistro-700">
                        큰계열 ${(recData.selectedMajor || []).length} · 세부 ${(recData.selectedSub || []).length}
                      </span>
                    </div>
                    <div class="flex flex-wrap gap-1">
                      ${
                        (recData.selectedMajor || []).length === 0 && (recData.selectedSub || []).length === 0
                          ? `<span class="text-[11px] text-stone-500">아직 선택된 레시피 항목이 없습니다 (선택 사항).</span>`
                          : [
                              ...(recData.selectedMajor || []).map(
                                (m) =>
                                  `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-bistro-600 text-white">${escapeHtml(m)}</span>`
                              ),
                              ...(recData.selectedSub || []).map(
                                (s) =>
                                  `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white text-bistro-800 border border-bistro-300">${escapeHtml(s)}</span>`
                              )
                            ].join('')
                      }
                    </div>
                  </div>
                </div>

                <!-- 7 Recipe Categories Tabs (장르, 배경, 주인공, 능력, 목표, 갈등, 성장) -->
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  ${Object.keys(RECIPE_TAXONOMY)
                    .map((catKey) => {
                      const active = activeCatKey === catKey;
                      return `
                        <button
                          type="button"
                          onclick="setRecipeCategory('${catKey}')"
                          class="shrink-0 px-3 py-2 rounded-2xl text-xs font-extrabold border transition ${
                            active
                              ? 'bg-bistro-600 text-white border-bistro-600 shadow-2xs'
                              : 'bg-white text-stone-700 border-stone-200 hover:bg-stone-100'
                          }"
                        >
                          ${escapeHtml(catKey)}
                        </button>
                      `;
                    })
                    .join('')}
                </div>

                <!-- Groups & Sub-items for Active Category -->
                <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/75 space-y-3">
                  <div class="flex items-center justify-between">
                    <h3 class="text-sm font-extrabold text-stone-900">${escapeHtml(activeCatObj.title)}</h3>
                    <span class="text-[11px] text-stone-500">큰 계열 클릭 시 큰 계열 선택, 세부 항목도 선택 가능</span>
                  </div>

                  <div class="space-y-3">
                    ${activeCatObj.groups.map((grp) => renderRecipeGroupCard(selectedWork.id, grp, recData)).join('')}
                  </div>
                </div>
              `
          }
        </div>
      `;
    }

    function renderRecipeGroupCard(workId, grp, recData) {
      const majorSelected = (recData.selectedMajor || []).includes(grp.name);
      const selectedSubSet = new Set(recData.selectedSub || []);

      // Count selected items inside this group (direct items + subGroups)
      let groupSubSelectedCount = 0;
      (grp.items || []).forEach((it) => {
        if (selectedSubSet.has(it)) groupSubSelectedCount++;
      });
      (grp.subGroups || []).forEach((sg) => {
        (sg.items || []).forEach((it) => {
          if (selectedSubSet.has(it)) groupSubSelectedCount++;
        });
      });

      return `
        <div class="p-3.5 rounded-2xl bg-stone-50/90 border border-stone-200/80 space-y-2.5">
          <!-- 큰 계열 (Major Group) Toggle Button -->
          <div class="flex items-center justify-between gap-2">
            <button
              type="button"
              onclick="toggleRecipeMajor('${workId}', '${escapeHtml(grp.name.replace(/'/g, "\\'"))}')"
              class="flex-1 text-left px-3 py-2 rounded-xl border text-xs font-extrabold transition flex items-center justify-between ${
                majorSelected
                  ? 'bg-bistro-600 text-white border-bistro-700 shadow-2xs'
                  : 'bg-white text-stone-800 border-stone-200 hover:border-bistro-400'
              }"
            >
              <span>${majorSelected ? '✓ ' : ''}${escapeHtml(grp.name)}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-md ${
                majorSelected ? 'bg-white/20 text-white' : 'bg-stone-100 text-stone-600'
              }">
                큰 계열 ${groupSubSelectedCount > 0 ? `· 세부 ${groupSubSelectedCount}` : ''}
              </span>
            </button>
          </div>

          <!-- Direct Sub-items if present -->
          ${
            grp.items && grp.items.length > 0
              ? `<div class="flex flex-wrap gap-1.5 pt-1">
                  ${grp.items
                    .map((item) => {
                      const active = selectedSubSet.has(item);
                      return `
                        <button
                          type="button"
                          onclick="toggleRecipeSub('${workId}', '${escapeHtml(item.replace(/'/g, "\\'"))}')"
                          class="px-2.5 py-1 rounded-xl text-[11px] font-semibold border transition ${
                            active
                              ? 'bg-amber-500 text-white border-amber-600 font-bold'
                              : 'bg-white text-stone-700 border-stone-200 hover:border-amber-400'
                          }"
                        >
                          ${escapeHtml(item)}
                        </button>
                      `;
                    })
                    .join('')}
                </div>`
              : ''
          }

          <!-- Nested Sub-groups (e.g. 배경 (1) 현대 및 현실 배경 -> ① 현대사회, ② 직장...) -->
          ${
            grp.subGroups && grp.subGroups.length > 0
              ? `<div class="space-y-2.5 pt-1">
                  ${grp.subGroups
                    .map(
                      (sg) => `
                      <div class="bg-white rounded-xl p-2.5 border border-stone-200/70 space-y-1.5">
                        <div class="text-[11px] font-extrabold text-stone-700">${escapeHtml(sg.name)}</div>
                        <div class="flex flex-wrap gap-1">
                          ${(sg.items || [])
                            .map((item) => {
                              const active = selectedSubSet.has(item);
                              return `
                                <button
                                  type="button"
                                  onclick="toggleRecipeSub('${workId}', '${escapeHtml(item.replace(/'/g, "\\'"))}')"
                                  class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition ${
                                    active
                                      ? 'bg-amber-500 text-white border-amber-600 font-bold'
                                      : 'bg-stone-50 text-stone-700 border-stone-200 hover:border-amber-400'
                                  }"
                                >
                                  ${escapeHtml(item)}
                                </button>
                              `;
                            })
                            .join('')}
                        </div>
                      </div>
                    `
                    )
                    .join('')}
                </div>`
              : ''
          }
        </div>
      `;
    }

    function toggleMetadataSection() {
      state.metadataOpen = !state.metadataOpen;
      saveState();
      renderAll();
    }

    function selectRecipeWork(workId) {
      state.recipeSelectedWorkId = workId;
      saveState();
      renderAll();
    }

    function setRecipeCategory(catKey) {
      state.recipeActiveCategory = catKey;
      saveState();
      renderAll();
    }

    function ensureRecipeObj(work) {
      if (!work.recipe) {
        work.recipe = { selectedMajor: [], selectedSub: [] };
      }
      work.recipe.selectedMajor = work.recipe.selectedMajor || [];
      work.recipe.selectedSub = work.recipe.selectedSub || [];
      return work.recipe;
    }

    function toggleRecipeMajor(workId, majorName) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      const rec = ensureRecipeObj(work);
      if (rec.selectedMajor.includes(majorName)) {
        rec.selectedMajor = rec.selectedMajor.filter((m) => m !== majorName);
      } else {
        rec.selectedMajor.push(majorName);
      }
      saveState();
      renderAll();
    }

    function toggleRecipeSub(workId, subName) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      const rec = ensureRecipeObj(work);
      if (rec.selectedSub.includes(subName)) {
        rec.selectedSub = rec.selectedSub.filter((s) => s !== subName);
      } else {
        rec.selectedSub.push(subName);
      }
      saveState();
      renderAll();
    }

    function markRecipeAnalysisComplete(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.recipeAnalyzed = true;
      work.recipeActive = false;
      if (state.recipeSelectedWorkId === workId) {
        state.recipeSelectedWorkId = null;
      }
      saveState();
      showToast(`"${work.title}" 레시피 분석완료! 목록에서 숨겨졌습니다.`);
      renderAll();
    }

    /**
     * ============================================================================
     * 6. 설거지 (DISHWASHING: CALENDAR DAILY COUNTS, MONTHLY STATS & BACKUP/RESTORE)
     * ============================================================================
     */
    function renderDishwashView() {
      const year = state.dishwashCalendarYear;
      const month = state.dishwashCalendarMonth; // 0-11
      const monthLabel = `${year}년 ${month + 1}월`;

      const firstDayOfMonth = new Date(year, month, 1);
      const startWeekday = firstDayOfMonth.getDay(); // 0=Sun..6=Sat
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Monthly total completions
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
      let monthlyTotal = 0;
      let activeDaysInMonth = 0;
      Object.entries(state.completionLog || {}).forEach(([dateStr, cnt]) => {
        if (dateStr.startsWith(monthPrefix) && cnt > 0) {
          monthlyTotal += cnt;
          activeDaysInMonth += 1;
        }
      });

      const allTimeTotal = Object.values(state.completionLog || {}).reduce((acc, v) => acc + (v || 0), 0);

      // Build calendar cells
      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(`<div class="h-12 rounded-xl bg-stone-50/40"></div>`);
      }

      const todayStr = getTodayStr();
      const selectedDate = state.dishwashSelectedDate || todayStr;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${monthPrefix}${String(day).padStart(2, '0')}`;
        const count = (state.completionLog && state.completionLog[dateStr]) || 0;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;

        cells.push(`
          <button
            type="button"
            onclick="selectDishwashDate('${dateStr}')"
            class="h-12 rounded-xl border flex flex-col items-center justify-center transition relative ${
              isSelected
                ? 'bg-bistro-600 text-white border-bistro-700 shadow-2xs'
                : count > 0
                ? 'bg-bistro-50/90 text-stone-900 border-bistro-200 hover:bg-bistro-100/70'
                : 'bg-white text-stone-700 border-stone-200/70 hover:bg-stone-50'
            }"
          >
            <span class="text-[11px] font-bold ${isToday && !isSelected ? 'text-bistro-600 underline' : ''}">${day}</span>
            ${
              count > 0
                ? `<span class="text-[10px] font-extrabold leading-none mt-0.5 ${
                    isSelected ? 'text-amber-200' : 'text-bistro-600'
                  }">${count}편</span>`
                : `<span class="text-[9px] text-stone-300 leading-none mt-0.5">-</span>`
            }
          </button>
        `);
      }

      const selectedCount = (state.completionLog && state.completionLog[selectedDate]) || 0;
      const completedWorksOnDate = state.works.filter((w) => w.completedAt === selectedDate);

      return `
        <div class="space-y-4">
          <!-- Header -->
          <div class="bg-gradient-to-r from-sky-700 to-bistro-600 text-white rounded-3xl p-4 shadow-soft">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">CALENDAR &amp; BACKUP</span>
                <h2 class="text-lg font-extrabold mt-1">설거지</h2>
                <p class="text-xs text-sky-100 mt-0.5">일별·월별 조리 완료 통계 확인 및 전체 데이터 백업/복구</p>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black">${monthlyTotal}편</div>
                <div class="text-[10px] text-sky-100">이번 달 완료</div>
              </div>
            </div>
          </div>

          <!-- Monthly Summary Cards -->
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-white rounded-2xl p-3 shadow-soft border border-stone-200/70 text-center">
              <div class="text-[10px] font-bold text-stone-500">월간 조리완료</div>
              <div class="text-base font-black text-bistro-600 mt-0.5">${monthlyTotal}편</div>
            </div>
            <div class="bg-white rounded-2xl p-3 shadow-soft border border-stone-200/70 text-center">
              <div class="text-[10px] font-bold text-stone-500">활동 일수</div>
              <div class="text-base font-black text-stone-900 mt-0.5">${activeDaysInMonth}일</div>
            </div>
            <div class="bg-white rounded-2xl p-3 shadow-soft border border-stone-200/70 text-center">
              <div class="text-[10px] font-bold text-stone-500">누적 완료</div>
              <div class="text-base font-black text-olive-700 mt-0.5">${allTimeTotal}편</div>
            </div>
          </div>

          <!-- Calendar Widget -->
          <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/75 space-y-3">
            <div class="flex items-center justify-between">
              <button
                type="button"
                onclick="shiftDishwashMonth(-1)"
                class="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-extrabold text-stone-700"
              >
                ◀ 이전달
              </button>
              <h3 class="text-sm font-extrabold text-stone-900">${escapeHtml(monthLabel)}</h3>
              <button
                type="button"
                onclick="shiftDishwashMonth(1)"
                class="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-extrabold text-stone-700"
              >
                다음달 ▶
              </button>
            </div>

            <!-- Weekday headers -->
            <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-stone-400">
              <span class="text-rose-500">일</span>
              <span>월</span>
              <span>화</span>
              <span>수</span>
              <span>목</span>
              <span>금</span>
              <span class="text-sky-600">토</span>
            </div>

            <!-- Calendar grid -->
            <div class="grid grid-cols-7 gap-1">
              ${cells.join('')}
            </div>

            <!-- Selected Date Detail -->
            <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/75 space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-stone-800">${escapeHtml(selectedDate)} 조리 완료 현황</span>
                <span class="text-xs font-extrabold text-bistro-600">${selectedCount}편 완료</span>
              </div>
              ${
                completedWorksOnDate.length > 0
                  ? `<div class="flex flex-wrap gap-1 pt-1">
                      ${completedWorksOnDate
                        .map(
                          (w) =>
                            `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white border border-stone-200 text-stone-700">${escapeHtml(w.title)}</span>`
                        )
                        .join('')}
                    </div>`
                  : `<p class="text-[11px] text-stone-400">해당 날짜에 기록된 작품 상세 목록이 없습니다 (누적 카운트 ${selectedCount}편).</p>`
              }
            </div>
          </div>

          <!-- Data Backup & Restore Section -->
          <div class="bg-white rounded-3xl p-4 shadow-soft border border-stone-200/75 space-y-3">
            <div>
              <h3 class="text-sm font-extrabold text-stone-900">데이터 백업 및 복구</h3>
              <p class="text-[11px] text-stone-500 mt-0.5">전체 작품·별점·레시피·달력 데이터를 JSON으로 내보내거나 복구할 수 있습니다.</p>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                onclick="exportBackupJson()"
                class="py-2.5 px-3 rounded-2xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-extrabold transition"
              >
                백업 JSON 생성/복사
              </button>
              <button
                type="button"
                onclick="downloadBackupFile()"
                class="py-2.5 px-3 rounded-2xl bg-bistro-50 hover:bg-bistro-100 text-bistro-700 border border-bistro-200 text-xs font-extrabold transition"
              >
                백업 파일 다운로드
              </button>
            </div>

            <div>
              <label for="backup-json-textarea" class="block text-[11px] font-bold text-stone-700 mb-1">
                백업 JSON 데이터 (복구 시 붙여넣기 후 [데이터 복구하기])
              </label>
              <textarea
                id="backup-json-textarea"
                rows="4"
                placeholder="여기에 백업된 JSON 문자열을 붙여넣어 복구하세요..."
                class="w-full p-3 rounded-2xl bg-stone-50 border border-stone-200 text-[11px] font-mono focus:outline-none focus:ring-2 focus:ring-bistro-400 focus:bg-white"
              ></textarea>
            </div>

            <div class="flex items-center justify-between gap-2">
              <button
                type="button"
                onclick="resetToSampleData()"
                class="py-2.5 px-3 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-600 text-xs font-bold transition"
              >
                샘플 데이터 초기화
              </button>
              <button
                type="button"
                onclick="restoreBackupJson()"
                class="py-2.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold transition"
              >
                데이터 복구하기
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function shiftDishwashMonth(delta) {
      let m = state.dishwashCalendarMonth + delta;
      let y = state.dishwashCalendarYear;
      if (m < 0) {
        m = 11;
        y -= 1;
      } else if (m > 11) {
        m = 0;
        y += 1;
      }
      state.dishwashCalendarMonth = m;
      state.dishwashCalendarYear = y;
      saveState();
      renderAll();
    }

    function selectDishwashDate(dateStr) {
      state.dishwashSelectedDate = dateStr;
      saveState();
      renderAll();
    }

    function exportBackupJson() {
      const payload = JSON.stringify(state, null, 2);
      const ta = document.getElementById('backup-json-textarea');
      if (ta) ta.value = payload;

      try {
        const temp = document.createElement('textarea');
        temp.value = payload;
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).catch(() => {});
      }
      showToast('백업 JSON이 생성되고 클립보드에 복사되었습니다!');
    }

    function downloadBackupFile() {
      const payload = JSON.stringify(state, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chef-note-backup-${getTodayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('백업 JSON 파일을 다운로드했습니다.');
    }

    function restoreBackupJson() {
      const ta = document.getElementById('backup-json-textarea');
      const raw = (ta?.value || '').trim();
      if (!raw) {
        showToast('복구할 JSON 데이터를 입력해 주세요.', 'error');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.works)) {
          showToast('올바른 쉐프 노트 백업 JSON 형식이 아닙니다.', 'error');
          return;
        }
        state = { ...createInitialState(), ...parsed };
        saveState();
        showToast('데이터 복구가 완료되었습니다!');
        renderAll();
      } catch (err) {
        showToast('JSON 파싱에 실패했습니다. 형식을 확인해 주세요.', 'error');
      }
    }

    function resetToSampleData() {
      state = createInitialState();
      saveState();
      showToast('초기 샘플 데이터로 재설정되었습니다.', 'info');
      renderAll();
    }

    /**
     * ============================================================================
     * FULL WORK EDIT MODAL (USED BY 미슐랭 & 팬트리, INCLUDES DELETE BUTTON)
     * ============================================================================
     */
    function openWorkEditModal(workId) {
      const w = state.works.find((item) => item.id === workId);

      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');

      const specials = w.specials || [];
      const menus = w.menus || [];
      const tags = w.tags || [];

      panel.innerHTML = `
        <div class="px-5 py-4 bg-white border-b border-stone-200 flex items-center justify-between">
          <div>
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-bistro-100 text-bistro-700">세부 수정</span>
            <h3 class="text-base font-extrabold text-stone-900 mt-0.5">${escapeHtml(w.title)}</h3>
          </div>
          <button
            type="button"
            onclick="closeModal()"
            class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold flex items-center justify-center"

        </div>

        <form onsubmit="saveWorkModalEdit(event, '${w.id}')" class="p-5 overflow-y-auto thin-scroll space-y-4 flex-1">
          <!-- Title & Author -->
          <div class="grid grid-cols-1 gap-3">
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">제목</label>
              <input id="edit-modal-title" type="text" value="${escapeHtml(w.title)}" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">장르</label>
                <select id="edit-modal-genre" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold">
                  <option value="">미선택</option>
                  ${GENRES.map((g) => `<option value="${escapeHtml(g)}" ${w.genre === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">작가명</label>
                <input id="edit-modal-author" type="text" value="${escapeHtml(w.author || '')}" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs" />
              </div>
            </div>
          </div>

          <!-- Menus -->
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">메뉴 선정</label>
            <div class="grid grid-cols-3 gap-1.5">
              ${MENUS.map(
                (mn) => `
                <label class="cursor-pointer">
                  <input type="checkbox" name="editModalMenu" value="${escapeHtml(mn)}" ${menus.includes(mn) ? 'checked' : ''} class="peer sr-only" />
                  <div class="py-2 px-2 rounded-xl border border-stone-200 text-center text-[11px] font-bold text-stone-600 peer-checked:bg-bistro-50 peer-checked:border-bistro-500 peer-checked:text-bistro-700">
                    ${escapeHtml(mn)}
                  </div>
                </label>
              `
              ).join('')}
            </div>
          </div>

          <!-- Rating -->
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">별점</label>
            <select id="edit-modal-rating" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold">
              ${RATINGS.map(
                (r) => `<option value="${escapeHtml(r.value)}" ${w.rating === r.value ? 'selected' : ''}>${escapeHtml(r.label)}</option>`
              ).join('')}
            </select>
          </div>

          <!-- Specials -->
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">특별전 (중복 선택)</label>
            <div class="grid grid-cols-2 gap-1.5">
              ${SPECIAL_EDITIONS.map(
                (sp) => `
                <label class="cursor-pointer">
                  <input type="checkbox" name="editModalSpecial" value="${escapeHtml(sp.key)}" ${
                  specials.includes(sp.key) ? 'checked' : ''
                } class="peer sr-only" />
                  <div class="py-2 px-2.5 rounded-xl border border-stone-200 text-[11px] font-bold text-stone-600 peer-checked:bg-purple-50 peer-checked:border-purple-500 peer-checked:text-purple-800">
                    ${escapeHtml(sp.label)}
                  </div>
                </label>
              `
              ).join('')}
            </div>
          </div>

          <!-- Michelin -->
          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-200/80 space-y-2.5">
            <div class="text-xs font-extrabold text-amber-900">미슐랭 선정</div>
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">유료 도달</label>
              <select id="edit-modal-tier" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold">
                ${MICHELIN_TIERS.map(
                  (t) => `<option value="${escapeHtml(t)}" ${(m.tier || '분석 전') === t ? 'selected' : ''}>${escapeHtml(t)}</option>`
                ).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-bold text-stone-700 mb-1">전환값</label>
                <input id="edit-modal-conv" type="number" step="any" value="${
                  m.conversionValue !== '' ? escapeHtml(m.conversionValue) : ''
                }" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-stone-700 mb-1">무료 최종화</label>
                <input id="edit-modal-free" type="number" step="1" value="${
                  m.freeFinalEpisode !== '' ? escapeHtml(m.freeFinalEpisode) : ''
                }" class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold" />
              </div>
            </div>
          </div>

          <!-- Tags -->
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">추가 태그 (쉼표로 구분, 최대 5개)</label>
            <input
              id="edit-modal-tags"
              type="text"
              value="${escapeHtml(tags.join(', '))}"
              placeholder="예: 영지물, 사이다전개"
              class="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs"
            />
          </div>

          <!-- Delete inside Edit Modal + Save -->
          <div class="flex items-center gap-2 pt-2 border-t border-stone-200">
            <button
              type="button"
              onclick="deleteWorkFromModal('${w.id}')"
              class="py-3 px-4 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-extrabold transition"
            >
              삭제
            </button>
            <button
              type="submit"
              class="flex-1 py-3 px-4 rounded-2xl bg-bistro-600 hover:bg-bistro-700 text-white text-xs font-extrabold transition"
            >
              변경사항 저장
            </button>
          </div>
        </form>
      `;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function saveWorkModalEdit(event, workId) {
      event.preventDefault();
      const w = state.works.find((item) => item.id === workId);
      if (!w) return;

      const titleVal = (document.getElementById('edit-modal-title')?.value || '').trim();
      if (!titleVal) {
        showToast('제목은 비워둘 수 없습니다.', 'error');
        return;
      }

      w.title = titleVal;
      w.genre = (document.getElementById('edit-modal-genre')?.value || '').trim();
      w.author = (document.getElementById('edit-modal-author')?.value || '').trim();
      w.menus = Array.from(document.querySelectorAll('input[name="editModalMenu"]:checked')).map((el) => el.value);
      w.rating = document.getElementById('edit-modal-rating')?.value || '☆☆☆☆ 미지정';
      w.specials = Array.from(document.querySelectorAll('input[name="editModalSpecial"]:checked')).map(
        (el) => el.value
      );

      const tier = document.getElementById('edit-modal-tier')?.value || '분석 전';
      const convRaw = document.getElementById('edit-modal-conv')?.value;
      const freeRaw = document.getElementById('edit-modal-free')?.value;
      const convVal = convRaw === '' || convRaw === undefined ? '' : Number(convRaw);
      const freeVal = freeRaw === '' || freeRaw === undefined ? '' : Number(freeRaw);

      w.michelin = {
        hasData:
          tier !== '분석 전' ||
          (convVal !== '' && !Number.isNaN(convVal)) ||
          (freeVal !== '' && !Number.isNaN(freeVal)),
        tier,
        conversionValue: Number.isNaN(convVal) ? '' : convVal,
        freeFinalEpisode: Number.isNaN(freeVal) ? '' : freeVal
      };

      const tagsRaw = (document.getElementById('edit-modal-tags')?.value || '')
        .split(',')
        .map((s) => s.replace(/^#/, '').trim())
        .filter(Boolean)
        .slice(0, 5);
      w.tags = tagsRaw;
      tagsRaw.forEach((t) => {
        if (!state.savedTags.includes(t)) state.savedTags.push(t);
      });

      saveState();
      closeModal();
      showToast(`"${w.title}" 정보가 저장되었습니다.`);
      renderAll();
    }

    function deleteWorkFromModal(workId) {
      deleteWorkById(workId);
      closeModal();
    }

    function deleteWorkConfirm(workId) {
      deleteWorkById(workId);
    }

    function deleteWorkById(workId) {
      const target = state.works.find((w) => w.id === workId);
      if (!target) return;
      const title = target.title;
      state.works = state.works.filter((w) => w.id !== workId);
      if (state.expandedKitchenWorkId === workId) state.expandedKitchenWorkId = null;
      if (state.recipeSelectedWorkId === workId) state.recipeSelectedWorkId = null;
      saveState();
      showToast(`"${title}" 작품이 삭제되었습니다.`, 'info');
      renderAll();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (backdrop) {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }
    }

    function openQuickGuide() {
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      if (!backdrop || !panel) return;

      panel.innerHTML = `
        <div class="px-5 py-4 bg-white border-b border-stone-200 flex items-center justify-between">
          <h3 class="text-base font-extrabold text-stone-900">쉐프 노트 사용 가이드</h3>
          <button
            type="button"
            onclick="closeModal()"
            class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold flex items-center justify-center"
          >×</button>
        </div>
        <div class="p-5 overflow-y-auto thin-scroll space-y-3 text-xs text-stone-700 leading-relaxed">
          <div class="p-3 rounded-2xl bg-bistro-50 border border-bistro-200/70">
            <strong class="text-bistro-900 block mb-0.5">1. 제품 등록</strong>
            제목만 등록하면 <strong>[임시등록]</strong>으로 분류됩니다. 장르·작가명 라벨링을 마치면 <strong>[조리실]</strong>과 <strong>[팬트리]</strong>로 이동합니다.
          </div>
          <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/70">
            <strong class="text-stone-900 block mb-0.5">2. 조리실 &amp; 미슐랭</strong>
            제목복사 버튼으로 문피아 검색을 돕고, 별점·특별전·태그를 설정한 뒤 <strong>조리 완료</strong>를 누르면 팬트리로 보관됩니다.
          </div>
          <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/70">
            <strong class="text-stone-900 block mb-0.5">3. 팬트리 &amp; 레시피분석</strong>
            팬트리에서 필터링·수정·삭제하거나 레시피분석으로 보낼 수 있으며, 레시피분석 상단 <strong>[메타데이터]</strong>에서 내 취향 장르 그래프를 확인합니다.
          </div>
          <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/70">
            <strong class="text-stone-900 block mb-0.5">4. 설거지</strong>
            달력에서 일별·월별 조리 완료 통계를 확인하고 JSON 데이터 백업 및 복구를 할 수 있습니다.
          </div>
        </div>
      `;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    // Close modal when clicking backdrop outside panel
    document.getElementById('modal-backdrop')?.addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') {
        closeModal();
      }
    });

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });
  </script>
</body>
</html>
