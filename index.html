<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문피아 베스트 트렌드 & 차기작 아이디어 스튜디오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef4ff',
              100: '#dbe8ff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              900: '#172554',
            },
            vault: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              900: '#78350f',
            },
          },
        },
      },
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
      color: #0f172a;
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      min-height: 100vh;
    }
    /* 모바일 프레임 중심 레이아웃이면서도 모바일 기기 및 데스크톱 양쪽에서 쾌적하게 표시 */
    .mobile-frame {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #f8fafc;
      position: relative;
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.65);
      padding-bottom: 92px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes floatBounce {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }
    .animate-pop-in {
      animation: popIn 0.22s ease-out forwards;
    }
    .animate-float {
      animation: floatBounce 2.2s ease-in-out infinite;
    }
    .vault-card-highlight {
      background: linear-gradient(145deg, #fffbeb 0%, #fef3c7 55%, #fde68a 100%);
      border: 2px solid #f59e0b;
      box-shadow: 0 12px 28px -10px rgba(217, 119, 6, 0.35);
    }
  </style>
</head>
<body>
  <div id="app" class="mobile-frame flex flex-col">
    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-30 bg-slate-950 text-white px-4 pt-3.5 pb-3 rounded-b-3xl shadow-lg">
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-[11px] font-bold tracking-wider text-amber-300">
              MUNPIA TREND & NEXT-WORK LAB
            </span>
          </div>
          <h1 class="text-base sm:text-lg font-black tracking-tight mt-0.5 truncate">
            문피아 베스트 분석 · 차기작 스튜디오
          </h1>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button
            id="btn-restore-seed"
            type="button"
            class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-[11px] font-bold transition cursor-pointer"
          >
            샘플복원
          </button>
        </div>
      </div>

      <!-- 상단 요약 상태 바 -->
      <div id="header-stats" class="mt-2.5 pt-2.5 border-t border-slate-800/90 flex items-center justify-between gap-2 text-xs text-slate-300"></div>
    </header>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-area" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-[440px] pointer-events-none flex flex-col gap-2"></div>

    <!-- 메인 뷰 영역 -->
    <main id="main-view" class="flex-1 px-3.5 pt-3.5 space-y-4"></main>

    <!-- 하단 모바일 5탭 내비게이션 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 z-40 w-full max-w-[480px] bg-white/95 backdrop-blur border-t border-slate-200 px-1.5 py-1.5 rounded-t-3xl shadow-[0_-8px_25px_rgba(15,23,42,0.08)]">
      <div class="grid grid-cols-5 gap-1">
        <button type="button" data-nav="register" class="bottom-nav-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl text-[11px] font-bold transition cursor-pointer relative">
          <span class="text-base leading-none mb-1">✍️</span>
          <span>등록/임시</span>
          <span id="nav-badge-temp" class="hidden absolute top-1 right-1.5 min-w-[15px] h-3.5 px-1 rounded-full bg-rose-500 text-white text-[9px] font-black flex items-center justify-center">0</span>
        </button>
        <button type="button" data-nav="categories" class="bottom-nav-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl text-[11px] font-bold transition cursor-pointer relative">
          <span class="text-base leading-none mb-1">🗂️</span>
          <span>카테고리</span>
          <span id="nav-badge-vault" class="hidden absolute top-1 right-1.5 min-w-[15px] h-3.5 px-1 rounded-full bg-amber-500 text-white text-[9px] font-black flex items-center justify-center">0</span>
        </button>
        <button type="button" data-nav="studio" class="bottom-nav-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl text-[11px] font-bold transition cursor-pointer">
          <span class="text-base leading-none mb-1">💡</span>
          <span>변형스튜디오</span>
        </button>
        <button type="button" data-nav="calendar" class="bottom-nav-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl text-[11px] font-bold transition cursor-pointer">
          <span class="text-base leading-none mb-1">📅</span>
          <span>달력</span>
        </button>
        <button type="button" data-nav="metadata" class="bottom-nav-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-2xl text-[11px] font-bold transition cursor-pointer">
          <span class="text-base leading-none mb-1">📈</span>
          <span>메타/백업</span>
        </button>
      </div>
    </nav>

    <!-- 중복 작품 안내 + 귀여운 캐릭터 팝업 모달 -->
    <div id="duplicate-modal" class="fixed inset-0 z-50 hidden bg-slate-950/65 backdrop-blur-xs flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-[380px] rounded-3xl p-5 shadow-2xl border-2 border-amber-300 text-center animate-pop-in">
        <!-- 귀여운 고양이 작가 SVG 캐릭터 -->
        <div class="mx-auto w-24 h-24 animate-float">
          <svg viewBox="0 0 120 120" class="w-full h-full" aria-hidden="true">
            <!-- 귀 -->
            <polygon points="24,48 16,14 48,32" fill="#fbbf24" stroke="#78350f" stroke-width="3" stroke-linejoin="round" />
            <polygon points="96,48 104,14 72,32" fill="#fbbf24" stroke="#78350f" stroke-width="3" stroke-linejoin="round" />
            <polygon points="27,43 22,22 42,34" fill="#fda4af" />
            <polygon points="93,43 98,22 78,34" fill="#fda4af" />
            <!-- 얼굴 -->
            <ellipse cx="60" cy="64" rx="40" ry="34" fill="#fef3c7" stroke="#78350f" stroke-width="3" />
            <!-- 볼 홍조 -->
            <ellipse cx="34" cy="70" rx="6.5" ry="4" fill="#fb7185" opacity="0.55" />
            <ellipse cx="86" cy="70" rx="6.5" ry="4" fill="#fb7185" opacity="0.55" />
            <!-- 눈 -->
            <circle cx="44" cy="60" r="5" fill="#1e293b" />
            <circle cx="42.5" cy="58.2" r="1.8" fill="#ffffff" />
            <circle cx="76" cy="60" r="5" fill="#1e293b" />
            <circle cx="74.5" cy="58.2" r="1.8" fill="#ffffff" />
            <!-- 코 & 입 -->
            <polygon points="56,66 64,66 60,71" fill="#f43f5e" />
            <path d="M52,74 Q56,79 60,74 Q64,79 68,74" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
            <!-- 돋보기 -->
            <circle cx="84" cy="84" r="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
            <line x1="92" y1="92" x2="103" y2="103" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>

        <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 text-[11px] font-extrabold">
          중복 체크 발견!
        </span>
        <h3 class="text-lg font-black text-slate-900 mt-1.5">
          이미 등록된 작품입니다
        </h3>
        <p id="duplicate-modal-desc" class="text-xs text-slate-600 mt-1.5 leading-relaxed"></p>

        <div class="mt-4 flex flex-col gap-2">
          <button
            id="btn-dup-edit"
            type="button"
            class="w-full py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-extrabold transition cursor-pointer"
          >
            기존 작품 수정/평가하러 가기
          </button>
          <button
            id="btn-dup-close"
            type="button"
            class="w-full py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition cursor-pointer"
          >
            닫기
          </button>
        </div>
      </div>
    </div>

    <!-- 1·2·3차 전체 수정 모달 -->
    <div id="edit-work-modal" class="fixed inset-0 z-50 hidden bg-slate-950/65 backdrop-blur-xs flex items-end sm:items-center justify-center p-2.5">
      <div id="edit-work-modal-panel" class="bg-white w-full max-w-[460px] rounded-3xl p-4 shadow-2xl max-h-[88vh] overflow-y-auto animate-pop-in"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 저장소 키 및 기준 상수 정의
    // =========================================================================
    const STORAGE_KEYS = {
      WORKS: 'munpia_studio_works_v2',
      TAGS: 'munpia_studio_tags_v2',
      SAVED_IDEAS: 'munpia_studio_saved_ideas_v2',
    };

    const BEST_SOURCES = [
      { id: 'today', label: '투데이 베스트', badgeClass: 'bg-blue-100 text-blue-800 border-blue-200' },
      { id: 'new', label: '신규 베스트', badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-200' },
    ];

    const GENRE_LIST = [
      '현대판타지', '판타지', '무협', '퓨전판타지', '대체역사',
      '스포츠', '전쟁·밀리터리', 'SF', '드라마'
    ];

    // 요청된 5가지 별점 선택지 (단일 선택)
    const RATING_CHOICES = [
      { id: 'drop_1_5', label: '★ 1~5화 하차', short: '★ 1~5화', score: 1, pill: 'bg-rose-50 text-rose-700 border-rose-200' },
      { id: 'drop_6_10', label: '★★ 6~10화 하차', short: '★★ 6~10화', score: 2, pill: 'bg-orange-50 text-orange-700 border-orange-200' },
      { id: 'drop_11_15', label: '★★★ 11~15화 하차', short: '★★★ 11~15화', score: 3, pill: 'bg-sky-50 text-sky-700 border-sky-200' },
      { id: 'read_16_plus', label: '★★★★ 16화 이상 정독', short: '★★★★ 16화+', score: 4, pill: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'pending', label: '☆ 판단 보류', short: '☆ 판단 보류', score: 2.5, pill: 'bg-slate-100 text-slate-700 border-slate-300' },
    ];

    // 중복 선택 가능한 추가 표시 3종
    const EXTRA_MARKS = [
      {
        id: 'legend',
        label: '레전드 (작가뽕)',
        short: '레전드',
        icon: '🔥',
        activeBtn: 'bg-purple-600 text-white border-purple-600 shadow-xs',
        chip: 'bg-purple-100 text-purple-900 border-purple-300',
      },
      {
        id: 'supernormal',
        label: '슈퍼노멀 (일반연재)',
        short: '슈퍼노멀',
        icon: '⚡',
        activeBtn: 'bg-cyan-600 text-white border-cyan-600 shadow-xs',
        chip: 'bg-cyan-100 text-cyan-900 border-cyan-300',
      },
      {
        id: 'vault',
        label: '보관함 (좋은소스)',
        short: '보관함',
        icon: '💎',
        activeBtn: 'bg-amber-500 text-white border-amber-500 shadow-xs',
        chip: 'bg-amber-200 text-amber-950 border-amber-400',
      },
    ];

    const DEFAULT_TAGS = [
      '회귀', '빙의', '상태창', '먼치킨', '사이다',
      '착각계', '아카데미', '재벌물', '무협', '생존', '두뇌싸움'
    ];

    const TWIST_AXES = [
      { id: 'genre', label: '장르 변경', icon: '🎭', desc: '기존 장르 문법을 다른 장르 틀로 전환' },
      { id: 'material', label: '다른 소재 첨가', icon: '🧩', desc: '독특한 시스템·직업·아이템 소재 결합' },
      { id: 'era', label: '시대 변경', icon: '⏳', desc: '근미래·조선·제국·아포칼립스 배경 전환' },
      { id: 'protagonist', label: '주인공 변경', icon: '🔄', desc: '조연·악역·퇴물 전문가·행정가로 시점 전환' },
    ];

    // =========================================================================
    // 2. 날짜 및 시드 데이터 헬퍼
    // =========================================================================
    function toDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function offsetDateKey(daysOffset) {
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysOffset);
      return toDateKey(target);
    }

    function normalizeTitle(str) {
      return (str || '').replace(/\s+/g, '').toLowerCase().trim();
    }

    // 2차 등록 완료 여부 판별 (장르, 작가명, 총 회차 > 0, 최근화 조회수 입력 시 완료)
    function isStage2Complete(work) {
      return Boolean(
        work &&
        String(work.genre || '').trim() &&
        String(work.author || '').trim() &&
        Number(work.totalEpisodes) > 0 &&
        String(work.latestViews || '').trim()
      );
    }

    // [임시등록] 여부: 2차 등록이 완료되지 않은 작품은 무조건 [임시등록]
    function isTempWork(work) {
      return !isStage2Complete(work);
    }

    function createSeedWorks() {
      return [
        {
          id: 'seed-1',
          title: '재벌가 막내아들이 검도를 숨김',
          sources: ['today'],
          genre: '현대판타지',
          author: '청룡검기',
          totalEpisodes: 168,
          latestViews: '154,200',
          rating: 'read_16_plus',
          extras: ['legend', 'vault'],
          tags: ['회귀', '재벌물', '사이다', '먼치킨'],
          createdAt: offsetDateKey(0),
        },
        {
          id: 'seed-2',
          title: '무림맹 수석 약사의 생존 일지',
          sources: ['today', 'new'],
          genre: '무협',
          author: '백초선인',
          totalEpisodes: 84,
          latestViews: '79,450',
          rating: 'read_16_plus',
          extras: ['vault', 'supernormal'],
          tags: ['무협', '착각계', '두뇌싸움'],
          createdAt: offsetDateKey(0),
        },
        {
          id: 'seed-3',
          title: '레벨 1 공성전 기술자의 요새 설계',
          sources: ['new'],
          genre: '판타지',
          author: '철벽기사',
          totalEpisodes: 29,
          latestViews: '38,900',
          rating: 'drop_11_15',
          extras: ['vault'],
          tags: ['아카데미', '생존', '두뇌싸움'],
          createdAt: offsetDateKey(-1),
        },
        {
          id: 'seed-4',
          title: '던전 속 편의점 알바생이 된 사연',
          sources: ['new'],
          genre: '퓨전판타지',
          author: '야간근무자',
          totalEpisodes: 19,
          latestViews: '24,110',
          rating: 'drop_6_10',
          extras: ['supernormal'],
          tags: ['빙의', '상태창', '착각계'],
          createdAt: offsetDateKey(-2),
        },
        {
          id: 'seed-5',
          title: '조선 말기 철도왕의 비밀 금고',
          sources: ['today'],
          genre: '대체역사',
          author: '증기기관사',
          totalEpisodes: 112,
          latestViews: '66,800',
          rating: 'pending',
          extras: ['legend'],
          tags: ['재벌물', '두뇌싸움'],
          createdAt: offsetDateKey(-4),
        },
        // 1차만 등록된 [임시등록] 샘플 작품 (2차 등록 완료 시 3차 평가 가능)
        {
          id: 'seed-temp-1',
          title: '퇴마사 길드의 꼴찌 기록관',
          sources: ['new'],
          genre: '',
          author: '',
          totalEpisodes: 0,
          latestViews: '',
          rating: null,
          extras: [],
          tags: [],
          createdAt: offsetDateKey(0),
        },
        {
          id: 'seed-temp-2',
          title: '성좌들의 경매장에 낙찰된 폐급 스킬',
          sources: ['today'],
          genre: '판타지',
          author: '',
          totalEpisodes: 0,
          latestViews: '',
          rating: null,
          extras: [],
          tags: ['상태창'],
          createdAt: offsetDateKey(-1),
        },
      ];
    }

    // =========================================================================
    // 3. 앱 상태 및 로컬스토리지 관리
    // =========================================================================
    const appState = {
      activeTab: 'register', // 'register' | 'categories' | 'studio' | 'calendar' | 'metadata'
      works: [],
      tagPool: [],
      savedIdeas: [],
      // 1차 & 연속 2차 등록 폼 상태
      regForm: {
        sources: ['today'],
        title: '',
        openStage2Now: true,
        genre: '현대판타지',
        author: '',
        totalEpisodes: '',
        latestViews: '',
        tagInput: '',
      },
      // 카테고리 탭 상태
      catState: {
        filter: 'all', // 'all' | 'temp' | 'vault' | 'legend' | 'supernormal' | 'rating' | 'tag'
        ratingFilter: 'read_16_plus',
        tagFilter: '',
        search: '',
      },
      // 보관함 변형 스튜디오 상태
      studioState: {
        selectedWorkId: null,
        selectedAxes: ['genre', 'material'],
        ideaSeed: 1,
        titleSeed: 1,
        generatedTwists: [],
        generatedTitles: [],
      },
      // 달력 상태
      calState: {
        year: new Date().getFullYear(),
        month: new Date().getMonth(),
        selectedDate: toDateKey(new Date()),
      },
      // 중복 팝업 대상 작품 ID
      duplicateTargetId: null,
      // 현재 수정 중인 작품 ID
      editingWorkId: null,
    };

    function loadFromStorage() {
      try {
        const rawWorks = localStorage.getItem(STORAGE_KEYS.WORKS);
        const rawTags = localStorage.getItem(STORAGE_KEYS.TAGS);
        const rawIdeas = localStorage.getItem(STORAGE_KEYS.SAVED_IDEAS);

        appState.works = rawWorks ? JSON.parse(rawWorks) : createSeedWorks();
        appState.tagPool = rawTags ? JSON.parse(rawTags) : [...DEFAULT_TAGS];
        appState.savedIdeas = rawIdeas ? JSON.parse(rawIdeas) : [];
      } catch (err) {
        console.error('로컬스토리지 읽기 오류:', err);
        appState.works = createSeedWorks();
        appState.tagPool = [...DEFAULT_TAGS];
        appState.savedIdeas = [];
      }

      syncStudioSelection();
      rebuildStudioTwists();
      rebuildStudioTitles();
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEYS.WORKS, JSON.stringify(appState.works));
        localStorage.setItem(STORAGE_KEYS.TAGS, JSON.stringify(appState.tagPool));
        localStorage.setItem(STORAGE_KEYS.SAVED_IDEAS, JSON.stringify(appState.savedIdeas));
      } catch (err) {
        console.error('로컬스토리지 저장 오류:', err);
        showToast('저장 공간에 쓰지 못했습니다.', 'error');
      }
    }

    function syncStudioSelection() {
      const vaultList = appState.works.filter((w) => Array.isArray(w.extras) && w.extras.includes('vault'));
      const pool = vaultList.length ? vaultList : appState.works;
      if (!pool.length) {
        appState.studioState.selectedWorkId = null;
        return;
      }
      const exists = pool.some((w) => w.id === appState.studioState.selectedWorkId);
      if (!exists) {
        appState.studioState.selectedWorkId = pool[0].id;
      }
    }

    // =========================================================================
    // 4. 토스트 & 클립보드 유틸리티
    // =========================================================================
    function showToast(message, type = 'info') {
      const area = document.getElementById('toast-area');
      const el = document.createElement('div');

      const palette = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-950 text-emerald-100 border-emerald-500',
        warning: 'bg-amber-950 text-amber-100 border-amber-500',
        error: 'bg-rose-950 text-rose-100 border-rose-500',
      };

      el.className = `pointer-events-auto border rounded-2xl px-3.5 py-2.5 text-xs font-bold shadow-xl animate-pop-in ${palette[type] || palette.info}`;
      el.textContent = message;
      area.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.22s ease';
        setTimeout(() => el.remove(), 220);
      }, 2800);
    }

    function copyTitleToClipboard(title) {
      if (!title) return;
      const textarea = document.createElement('textarea');
      textarea.value = title;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`"${title}" 제목 복사 완료! 문피아 앱에서 검색해보세요.`, 'success');
      } catch (err) {
        showToast('제목 복사에 실패했습니다.', 'error');
      } finally {
        textarea.remove();
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    // 5. 보관함 아이디어 변형 & 가제목 3종 생성 엔진
    // =========================================================================
    function getSelectedStudioWork() {
      const vaultList = appState.works.filter((w) => Array.isArray(w.extras) && w.extras.includes('vault'));
      const pool = vaultList.length ? vaultList : appState.works;
      return pool.find((w) => w.id === appState.studioState.selectedWorkId) || pool[0] || null;
    }

    function rebuildStudioTwists() {
      const work = getSelectedStudioWork();
      if (!work) {
        appState.studioState.generatedTwists = [];
        return;
      }

      const seed = appState.studioState.ideaSeed;
      const axes = appState.studioState.selectedAxes.length
        ? appState.studioState.selectedAxes
        : ['genre'];

      const pools = {
        genre: [
          `${work.genre || '판타지'} 핵심 갈등을 '미식·경영 느와르' 전개로 전환`,
          `전투 위주 구조를 '법정·협상 심리전' 중심으로 재배치`,
          `기존 클리셰를 '미스터리 추리 수사극' 서사로 변주`,
        ],
        material: [
          `'기억 잔재 회수' 시스템과 '특수 공방/제조' 소재 결합`,
          `'폐기된 스킬 거래소'와 '정치 킹메이커' 요소 접목`,
          `'미래 오답노트(예지 로그)'와 '현실 정산·투자' 결합`,
        ],
        era: [
          `배경을 '아포칼립스 이후 궤도 엘리베이터 도시'로 변경`,
          `무대를 '근대 개화기·철도 제국 시대'로 전환`,
          `배경을 'AI 통제 메가시티·심해 기지'로 재설정`,
        ],
        protagonist: [
          `주인공을 영웅이 아닌 '현장 철거/정산 전문가'로 변경`,
          `주인공을 귀족가의 '수석 집사·회계사'로 전환`,
          `주인공을 은퇴한 '현장 교관·2인자' 포지션으로 변경`,
        ],
      };

      appState.studioState.generatedTwists = axes.map((axisId) => {
        const meta = TWIST_AXES.find((a) => a.id === axisId) || TWIST_AXES[0];
        const list = pools[axisId] || pools.genre;
        return {
          axisId,
          label: meta.label,
          icon: meta.icon,
          ideaText: list[seed % list.length],
        };
      });
    }

    function rebuildStudioTitles() {
      const work = getSelectedStudioWork();
      if (!work) {
        appState.studioState.generatedTitles = [];
        return;
      }

      const tSeed = appState.studioState.titleSeed;
      const baseWords = (work.title || '차기작').split(' ').slice(0, 2).join(' ');
      const tagSample = (work.tags && work.tags[tSeed % work.tags.length]) || '역대급';
      const twistLabels = appState.studioState.generatedTwists.map((t) => t.label).join('·') || '변주';

      const titlePacks = [
        [
          `${baseWords}, ${twistLabels}로 판을 뒤집다`,
          `[${tagSample} 변주] ${work.genre || '판타지'} 천재는 규칙을 새로 쓴다`,
          `망한 줄 알았던 ${baseWords}의 숨겨진 공략법`,
        ],
        [
          `${twistLabels} 마스터는 1화부터 치트키를 쓴다`,
          `두 번째 인생, ${baseWords}의 룰을 역이용하다`,
          `모두가 포기한 ${baseWords}, 나만 정답을 안다`,
        ],
        [
          `[${tagSample}] ${baseWords}으로 제국을 설계한다`,
          `한계 돌파! ${twistLabels} 각성자의 역전극`,
          `${work.genre || '판타지'} 최약체가 판도를 바꾸는 법`,
        ],
      ];

      appState.studioState.generatedTitles = titlePacks[tSeed % titlePacks.length];
    }

        <section class="bg-white rounded-3xl p-3.5 border border-slate-200/80 space-y-3">
          <input

          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">

        <!-- 필터 결과 목록 -->
        <section class="space-y-2.5">
          <div class="text-xs font-bold text-slate-500 px-1">
            표시 중인 작품 ${filtered.length}편

          ${filtered.length
            ? filtered.map((w) => renderWorkCard(w, { showDelete: true })).join('')
            : `<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-500 border border-slate-200">선택한 조건에 해당하는 작품이 없습니다.</div>`

              <button

                  <span class="text-slate-100 ml-1">${escapeHtml(item.ideaText)}</span>

    // =========================================================================
    // 10. 탭 4: [달력] 일별 인풋 수 및 월별 통계 뷰
    // =========================================================================
    function renderCalendarTab() {
      const { year, month, selectedDate } = appState.calState;
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthWorks = appState.works.filter((w) => (w.createdAt || '').startsWith(monthPrefix));

      const dayCounts = {};
      monthWorks.forEach((w) => {
        if (w.createdAt) {
          dayCounts[w.createdAt] = (dayCounts[w.createdAt] || 0) + 1;
        }
      });

      const totalInMonth = monthWorks.length;
      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const avgPerDay = (totalInMonth / Math.max(1, daysInMonth)).toFixed(2);

      let bestDayLabel = '기록 없음';
      const sortedDays = Object.entries(dayCounts).sort((a, b) => b[1] - a[1]);
      if (sortedDays.length) {
        bestDayLabel = `${sortedDays[0][0].slice(5)} (${sortedDays[0][1]}편)`;
      }

      const todayKey = toDateKey(new Date());
      const cells = [];

      for (let i = 0; i < firstWeekday; i++) {
        cells.push(`<div class="h-14 rounded-xl bg-slate-50/50"></div>`);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cnt = dayCounts[key] || 0;
        const isSelected = key === selectedDate;
        const isToday = key === todayKey;

        cells.push(`
          <button
            type="button"
            data-cal-select="${key}"
            class="cal-day-btn h-14 rounded-xl border p-1 flex flex-col items-center justify-between transition cursor-pointer ${
              isSelected
                ? 'bg-brand-600 text-white border-brand-600 shadow-xs'
                : cnt > 0
                  ? 'bg-blue-50/70 border-blue-200 text-slate-900 hover:bg-blue-100/70'
                  : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'
            }"
          >
            <span class="text-[11px] font-bold ${isToday && !isSelected ? 'text-brand-600 underline' : ''}">${d}</span>
            ${cnt > 0 ? `
              <span class="px-1.5 py-0.5 rounded-full text-[10px] font-black ${
                isSelected ? 'bg-amber-400 text-slate-950' : 'bg-brand-600 text-white'
              }">
                ${cnt}편
              </span>
            ` : `
              <span class="text-[10px] ${isSelected ? 'text-blue-200' : 'text-slate-300'}">0</span>
            `}
          </button>
        `);
      }

      const selectedDayList = appState.works.filter((w) => w.createdAt === selectedDate);

      return `
        <!-- 월별 통계 요약 -->
        <section class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-2xs space-y-3 animate-pop-in">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-black text-slate-900">📅 ${year}년 ${month + 1}월 인풋 통계</h2>
            <span class="px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 text-xs font-extrabold">
              월 ${totalInMonth}편
            </span>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70 text-center">
              <div class="text-[10px] text-slate-500 font-bold">월 총 등록</div>
              <div class="text-base font-black text-slate-900 mt-0.5">${totalInMonth}편</div>
            </div>
            <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70 text-center">
              <div class="text-[10px] text-slate-500 font-bold">일평균 인풋</div>
              <div class="text-base font-black text-brand-700 mt-0.5">${avgPerDay}</div>
            </div>
            <div class="p-2.5 rounded-2xl bg-amber-50 border border-amber-200 text-center">
              <div class="text-[10px] text-amber-800 font-bold">최다 등록일</div>
              <div class="text-xs font-black text-amber-950 mt-1 truncate">${bestDayLabel}</div>
            </div>
          </div>
        </section>

        <!-- 월별 달력 -->
        <section class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-2xs space-y-3">
          <div class="flex items-center justify-between">
            <button type="button" id="btn-cal-prev" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold cursor-pointer">
              ◀ 이전달
            </button>
            <div class="text-sm font-black text-slate-900">${year}년 ${month + 1}월</div>
            <button type="button" id="btn-cal-next" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold cursor-pointer">
              다음달 ▶
            </button>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
            <span class="text-rose-500">일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span class="text-blue-500">토</span>
          </div>

          <div class="grid grid-cols-7 gap-1">
            ${cells.join('')}
          </div>
        </section>

        <!-- 선택 일자 등록 작품 -->
        <section class="space-y-2.5">
          <div class="text-xs font-black text-slate-700 px-1">
            ${selectedDate} 등록 작품 (${selectedDayList.length}편)
          </div>
          ${selectedDayList.length
            ? selectedDayList.map((w) => renderWorkCard(w, { showDelete: true })).join('')
            : `<div class="bg-white rounded-2xl p-5 text-center text-xs text-slate-400 border border-slate-200">선택한 날짜에 등록된 작품이 없습니다.</div>`
          }
        </section>
      `;
    }

    // =========================================================================
    // 11. 탭 5: [메타데이터] 취향 분석 & 데이터 백업/복구 뷰
    // =========================================================================
    function renderMetadataTab() {
      const evaluatedWorks = appState.works.filter((w) => !isTempWork(w) && w.rating);

      // 장르별 집계
      const genreStats = {};
      evaluatedWorks.forEach((w) => {
        const g = w.genre || '기타';
        if (!genreStats[g]) {
          genreStats[g] = { count: 0, read16: 0, scoreSum: 0 };
        }
        const rObj = RATING_CHOICES.find((r) => r.id === w.rating);
        genreStats[g].count += 1;
        if (w.rating === 'read_16_plus') genreStats[g].read16 += 1;
        genreStats[g].scoreSum += rObj ? rObj.score : 2;
      });

      const genreRows = Object.entries(genreStats)
        .map(([genre, st]) => ({
          genre,
          count: st.count,
          read16: st.read16,
          avgScore: (st.scoreSum / Math.max(1, st.count)).toFixed(1),
        }))
        .sort((a, b) => Number(b.avgScore) - Number(a.avgScore) || b.count - a.count);

      // 태그 빈도 집계
      const tagFreq = {};
      appState.works.forEach((w) => {
        (w.tags || []).forEach((t) => {
          tagFreq[t] = (tagFreq[t] || 0) + 1;
        });
      });
      const topTags = Object.entries(tagFreq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      const maxTagCount = topTags.length ? topTags[0][1] : 1;

      const topGenreText = genreRows.length
        ? `${genreRows[0].genre} (평균 ${genreRows[0].avgScore}점, 16화+ 정독 ${genreRows[0].read16}편)`
        : '평가된 작품이 아직 없습니다.';

      return `
        <!-- 취향 자동 분석 요약 -->
        <section class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-2xs space-y-3 animate-pop-in">
          <div>
            <span class="text-[10px] font-extrabold text-brand-600 uppercase">TASTE METADATA</span>
            <h2 class="text-base font-black text-slate-900">📈 취향 메타데이터 분석</h2>
          </div>

          <div class="p-3 rounded-2xl bg-brand-50 border border-brand-100">
            <div class="text-[11px] font-bold text-brand-700">현재 선호 장르 하이라이트</div>
            <div class="text-xs font-black text-slate-900 mt-0.5">${escapeHtml(topGenreText)}</div>
          </div>

          <!-- 장르별 별점 평가 분포 -->
          <div class="space-y-2">
            <h3 class="text-xs font-extrabold text-slate-700">장르별 별점 평가 현황</h3>
            ${genreRows.length ? genreRows.map((row) => {
              const pct = Math.min(100, Math.round((Number(row.avgScore) / 4) * 100));
              return `
                <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70 space-y-1.5">
                  <div class="flex items-center justify-between text-xs">
                    <span class="font-extrabold text-slate-800">${escapeHtml(row.genre)} (${row.count}편)</span>
                    <span class="font-bold text-brand-700">평균 ${row.avgScore} / 4.0 · 정독 ${row.read16}편</span>
                  </div>
                  <div class="w-full h-2 rounded-full bg-slate-200 overflow-hidden">
                    <div class="h-full rounded-full bg-brand-600" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('') : `
              <p class="text-xs text-slate-400 py-2">2차 및 3차 평가를 마친 작품이 생기면 장르별 분포가 표시됩니다.</p>
            `}
          </div>

          <!-- 상위 태그 분석 -->
          <div class="space-y-2 pt-1">
            <h3 class="text-xs font-extrabold text-slate-700">자주 기록한 핵심 태그</h3>
            ${topTags.length ? topTags.map(([tag, cnt]) => {
              const widthPct = Math.max(14, Math.round((cnt / maxTagCount) * 100));
              return `
                <div class="space-y-1">
                  <div class="flex items-center justify-between text-[11px]">
                    <span class="font-bold text-slate-700">#${escapeHtml(tag)}</span>
                    <span class="font-extrabold text-slate-500">${cnt}회</span>
                  </div>
                  <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full rounded-full bg-amber-500" style="width: ${widthPct}%"></div>
                  </div>
                </div>
              `;
            }).join('') : `
              <p class="text-xs text-slate-400">등록된 태그가 없습니다.</p>
            `}
          </div>
        </section>

        <!-- 데이터 백업 및 복구 섹션 -->
        <section class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-2xs space-y-3">
          <div>
            <h3 class="text-sm font-black text-slate-900">💾 데이터 백업 및 복구 (JSON)</h3>
            <p class="text-xs text-slate-500 mt-0.5">모든 작품, 태그 풀, 저장된 가제목 아이디어를 내보내거나 복구합니다.</p>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              id="btn-export-json"
              class="py-2.5 px-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold transition cursor-pointer"
            >
              ⬇️ JSON 파일 다운로드
            </button>
            <label
              for="input-import-file"
              class="py-2.5 px-3 rounded-2xl bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 text-xs font-extrabold text-center transition cursor-pointer"
            >
              ⬆️ JSON 파일 선택
            </label>
            <input id="input-import-file" type="file" accept="application/json,.json" class="hidden" />
          </div>

          <div>
            <label for="backup-json-textarea" class="block text-[11px] font-bold text-slate-600 mb-1">
              백업 JSON 직접 확인 / 붙여넣기 복구
            </label>
            <textarea
              id="backup-json-textarea"
              rows="4"
              placeholder='여기에 백업된 JSON 문자열을 붙여넣어 복구할 수 있습니다.'
              class="w-full p-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-[11px] font-mono leading-relaxed"
            ></textarea>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              id="btn-restore-overwrite"
              class="py-2.5 px-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold transition cursor-pointer"
            >
              덮어쓰기 복구
            </button>
            <button
              type="button"
              id="btn-restore-merge"
              class="py-2.5 px-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold transition cursor-pointer"
            >
              기존 데이터와 병합
            </button>
          </div>
        </section>
      `;
    }

                    checked ? 'bg-brand-50 border-brand-300 text-brand-900' : 'bg-slate-50 border-slate-200 text-slate-600'
                  }">

                    <span>${src.label}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <input
              type="text"
              name="editTitle"
              value="${escapeHtml(work.title)}"
              required
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold"
            />

          <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-slate-800">2차 · 작품 정보</span>

                  <option value="">미입력</option>
                  ${GENRE_LIST.map((g) => `<option value="${g}" ${work.genre === g ? 'selected' : ''}>${g}</option>`).join('')}
                  ${work.genre && !GENRE_LIST.includes(work.genre) ? `<option value="${escapeHtml(work.genre)}" selected>${escapeHtml(work.genre)}</option>` : ''}

              </div>
              <div>

              </div>
              <div>

            <div>

                    work.rating === r.id ? 'border-brand-500 text-brand-900' : 'border-slate-200 text-slate-700'

                    <input type="radio" name="editRating" value="${r.id}" ${work.rating === r.id ? 'checked' : ''} class="accent-brand-600" />

                  const checked = (work.extras || []).includes(m.id);
                  return `

                      <span class="mt-0.5">${m.label}</span>
                    </label>
                  `;
                }).join('')}
              </div>
            </div>

            <div>
              <label class="block text-[10px] font-bold text-slate-600 mb-1">태그 (쉼표로 구분, 약 5개 권장)</label>
              <input
                type="text"
                name="editTags"
                value="${escapeHtml((work.tags || []).join(', '))}"
                placeholder="예: 회귀, 사이다, 먼치킨"
                class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs"
              />

          </div>

          <div class="flex items-center gap-2 pt-1">
            <button
              type="button"
              id="btn-modal-delete-work"
              class="px-3.5 py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-extrabold cursor-pointer"
            >
              작품 삭제
            </button>
            <button
              type="submit"
              class="flex-1 py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-black cursor-pointer"
            >
              변경사항 저장
            </button>
          </div>
        </form>
      `;

      modal.classList.remove('hidden');

      document.getElementById('btn-close-edit-modal')?.addEventListener('click', closeEditWorkModal);

      document.getElementById('btn-modal-delete-work')?.addEventListener('click', () => {
        appState.works = appState.works.filter((w) => w.id !== workId);
        saveToStorage();
        syncStudioSelection();
        closeEditWorkModal();
        renderApp();
        showToast('작품이 삭제되었습니다.', 'info');
      });

      document.getElementById('edit-work-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const nextTitle = String(fd.get('editTitle') || '').trim();
        if (!nextTitle) {
          showToast('작품 제목은 비워둘 수 없습니다.', 'error');
          return;
        }

        // 다른 작품과 제목 중복 검사
        const clash = appState.works.find(
          (other) => other.id !== workId && normalizeTitle(other.title) === normalizeTitle(nextTitle)
        );
        if (clash) {
          showToast('이미 등록된 작품 제목과 중복됩니다.', 'warning');
          return;
        }

        const chosenSources = fd.getAll('editSources').map(String);
        const finalSources = chosenSources.length ? chosenSources : ['today'];
        const chosenExtras = fd.getAll('editExtras').map(String);
        const chosenRating = fd.get('editRating') ? String(fd.get('editRating')) : work.rating;

        const parsedTags = String(fd.get('editTags') || '')
          .split(',')
          .map((t) => t.replace(/^#+/, '').trim())
          .filter(Boolean)
          .slice(0, 5);

        parsedTags.forEach((tag) => {
          if (!appState.tagPool.includes(tag)) {
            appState.tagPool.unshift(tag);
          }
        });

        appState.works = appState.works.map((w) => {
          if (w.id !== workId) return w;
          return {
            ...w,
            title: nextTitle,
            sources: finalSources,
            genre: String(fd.get('editGenre') || '').trim(),
            author: String(fd.get('editAuthor') || '').trim(),
            totalEpisodes: Number(fd.get('editEpisodes') || 0),
            latestViews: String(fd.get('editViews') || '').trim(),
            rating: chosenRating,
            extras: chosenExtras,
            tags: parsedTags,
          };
        });

        saveToStorage();
        syncStudioSelection();
        rebuildStudioTwists();
        rebuildStudioTitles();
        closeEditWorkModal();
        renderApp();
        showToast('작품 정보가 저장되었습니다.', 'success');
      });
    }

    function closeEditWorkModal() {
      appState.editingWorkId = null;
      document.getElementById('edit-work-modal').classList.add('hidden');
    }

    function openDuplicateModal(existingWork) {
      appState.duplicateTargetId = existingWork.id;
      document.getElementById('duplicate-modal-desc').textContent =
        `"${existingWork.title}" 작품은 이미 목록에 등록되어 있습니다. 기존 기록을 확인하거나 수정해보세요.`;
      document.getElementById('duplicate-modal').classList.remove('hidden');
    }

    function closeDuplicateModal() {
      appState.duplicateTargetId = null;
      document.getElementById('duplicate-modal').classList.add('hidden');
    }

    // =========================================================================
    // 13. 전체 화면 렌더링 및 동적 이벤트 바인딩
    // =========================================================================
    function syncRegFormFromDom() {
      const titleEl = document.getElementById('reg-title-input');
      const genreEl = document.getElementById('reg-genre-input');
      const authorEl = document.getElementById('reg-author-input');
      const epEl = document.getElementById('reg-episodes-input');
      const viewsEl = document.getElementById('reg-views-input');

      if (titleEl) appState.regForm.title = titleEl.value;
      if (genreEl) appState.regForm.genre = genreEl.value;
      if (authorEl) appState.regForm.author = authorEl.value;
      if (epEl) appState.regForm.totalEpisodes = epEl.value;
      if (viewsEl) appState.regForm.latestViews = viewsEl.value;
    }

    function bindViewEvents() {
      // 공통: 제목 복사 버튼
      document.querySelectorAll('.copy-title-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          copyTitleToClipboard(btn.getAttribute('data-copy-title') || '');
        });
      });

      // 공통: 1·2·3차 수정 모달 열기
      document.querySelectorAll('.edit-work-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          openEditWorkModal(btn.getAttribute('data-edit-work'));
        });
      });

      // 공통: 보관함 변형 스튜디오로 이동
      document.querySelectorAll('.studio-jump-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          appState.studioState.selectedWorkId = btn.getAttribute('data-studio-work');
          appState.studioState.ideaSeed += 1;
          appState.studioState.titleSeed += 1;
          appState.activeTab = 'studio';
          rebuildStudioTwists();
          rebuildStudioTitles();
          renderApp();
        });
      });

      // 공통: 작품 삭제
      document.querySelectorAll('.delete-work-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-work');
          appState.works = appState.works.filter((w) => w.id !== id);
          saveToStorage();
          syncStudioSelection();
          renderApp();
          showToast('작품이 삭제되었습니다.', 'info');
        });
      });

      // --- 탭 1 이벤트 ---
      document.querySelectorAll('.reg-source-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncRegFormFromDom();
          const src = btn.getAttribute('data-reg-source');
          const cur = appState.regForm.sources;
          if (cur.includes(src)) {
            if (cur.length > 1) {
              appState.regForm.sources = cur.filter((x) => x !== src);
            } else {
              showToast('투데이/신규 베스트 중 최소 1개는 체크해야 합니다.', 'warning');
            }
          } else {
            appState.regForm.sources = [...cur, src];
          }
          renderApp();
        });
      });

      document.getElementById('btn-toggle-stage2-mode')?.addEventListener('click', () => {
        syncRegFormFromDom();
        appState.regForm.openStage2Now = !appState.regForm.openStage2Now;
        renderApp();
      });

      document.getElementById('btn-save-work')?.addEventListener('click', () => {
        syncRegFormFromDom();
        const title = appState.regForm.title.trim();
        if (!title) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }

        const existing = appState.works.find(
          (w) => normalizeTitle(w.title) === normalizeTitle(title)
        );
        if (existing) {
          openDuplicateModal(existing);
          return;
        }

        const newWork = {
          id: 'w-' + Date.now(),
          title,
          sources: [...appState.regForm.sources],
          genre: appState.regForm.openStage2Now ? String(appState.regForm.genre || '').trim() : '',
          author: appState.regForm.openStage2Now ? String(appState.regForm.author || '').trim() : '',
          totalEpisodes: appState.regForm.openStage2Now ? Number(appState.regForm.totalEpisodes || 0) : 0,
          latestViews: appState.regForm.openStage2Now ? String(appState.regForm.latestViews || '').trim() : '',
          rating: 'read_16_plus',
          extras: [],
          tags: [],
          createdAt: toDateKey(new Date()),
        };

        appState.works = [newWork, ...appState.works];
        appState.regForm.title = '';
        appState.regForm.author = '';
        appState.regForm.totalEpisodes = '';
        appState.regForm.latestViews = '';

        saveToStorage();
        renderApp();

        if (isTempWork(newWork)) {
          showToast(`"${newWork.title}"이(가) [임시등록]으로 저장되었습니다.`, 'warning');
        } else {
          showToast(`"${newWork.title}" 1·2차 등록 완료! 수정 버튼에서 3차 평가를 진행하세요.`, 'success');
        }
      });

      // --- 탭 2 이벤트 ---
      document.getElementById('btn-open-studio-from-cat')?.addEventListener('click', () => {
        appState.activeTab = 'studio';
        syncStudioSelection();
        rebuildStudioTwists();
        rebuildStudioTitles();
        renderApp();
      });

      document.getElementById('cat-search-input')?.addEventListener('input', (e) => {
        appState.catState.search = e.target.value;
        document.getElementById('main-view').innerHTML = renderCategoriesTab();
        bindViewEvents();
        const re = document.getElementById('cat-search-input');
        if (re) {
          re.focus();
          re.setSelectionRange(re.value.length, re.value.length);
        }
      });

      document.querySelectorAll('.cat-filter-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          appState.catState.filter = btn.getAttribute('data-cat-filter');
          renderApp();
        });
      });

      document.querySelectorAll('.rating-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          appState.catState.ratingFilter = btn.getAttribute('data-rating-filter');
          renderApp();
        });
      });

      document.querySelectorAll('.tag-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const t = btn.getAttribute('data-tag-filter');
          appState.catState.tagFilter = appState.catState.tagFilter === t ? '' : t;
          renderApp();
        });
      });

      // --- 탭 3 이벤트 ---
      document.getElementById('studio-work-select')?.addEventListener('change', (e) => {
        appState.studioState.selectedWorkId = e.target.value;
        appState.studioState.ideaSeed += 1;
        appState.studioState.titleSeed += 1;
        rebuildStudioTwists();
        rebuildStudioTitles();
        renderApp();
      });

      document.querySelectorAll('.twist-axis-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const axId = btn.getAttribute('data-twist-axis');
          const cur = appState.studioState.selectedAxes;
          if (cur.includes(axId)) {
            if (cur.length > 1) {
              appState.studioState.selectedAxes = cur.filter((x) => x !== axId);
            } else {
              showToast('최소 1개 이상의 변형 축을 선택해야 합니다.', 'warning');
              return;
            }
          } else {
            appState.studioState.selectedAxes = [...cur, axId];
          }
          rebuildStudioTwists();
          rebuildStudioTitles();
          renderApp();
        });
      });

      document.getElementById('btn-rebuild-ideas')?.addEventListener('click', () => {
        appState.studioState.ideaSeed += 1;
        rebuildStudioTwists();
        rebuildStudioTitles();
        renderApp();
        showToast('변형 아이디어를 새롭게 재구성했습니다.', 'success');
      });

      document.getElementById('btn-rebuild-titles')?.addEventListener('click', () => {
        appState.studioState.titleSeed += 1;
        rebuildStudioTitles();
        renderApp();
        showToast('가제목 3종을 다시 구상했습니다.', 'success');
      });

      document.querySelectorAll('.save-idea-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const candTitle = btn.getAttribute('data-save-idea-title') || '';
          const srcWork = getSelectedStudioWork();
          appState.savedIdeas = [
            {
              id: 'idea-' + Date.now(),
              title: candTitle,
              sourceTitle: srcWork?.title || '원작 미상',
              axesText: appState.studioState.generatedTwists.map((t) => t.label).join(' + '),
              savedAt: toDateKey(new Date()),
            },
            ...appState.savedIdeas,
          ];
          saveToStorage();
          renderApp();
          showToast('가제목 아이디어가 저장되었습니다.', 'success');
        });
      });

      document.querySelectorAll('.del-idea-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-idea');
          appState.savedIdeas = appState.savedIdeas.filter((x) => x.id !== id);
          saveToStorage();
          renderApp();
        });
      });

      // --- 탭 4 이벤트 ---
      document.getElementById('btn-cal-prev')?.addEventListener('click', () => {
        if (appState.calState.month === 0) {
          appState.calState.year -= 1;
          appState.calState.month = 11;
        } else {
          appState.calState.month -= 1;
        }
        renderApp();
      });

      document.getElementById('btn-cal-next')?.addEventListener('click', () => {
        if (appState.calState.month === 11) {
          appState.calState.year += 1;
          appState.calState.month = 0;
        } else {
          appState.calState.month += 1;
        }
        renderApp();
      });

      document.querySelectorAll('.cal-day-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          appState.calState.selectedDate = btn.getAttribute('data-cal-select');
          renderApp();
        });
      });

      // --- 탭 5 백업/복구 이벤트 ---
      document.getElementById('btn-export-json')?.addEventListener('click', () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          works: appState.works,
          tagPool: appState.tagPool,
          savedIdeas: appState.savedIdeas,
        };
        const jsonStr = JSON.stringify(payload, null, 2);
        const ta = document.getElementById('backup-json-textarea');
        if (ta) ta.value = jsonStr;

        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `munpia-trend-backup-${toDateKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('백업 JSON 파일을 다운로드했습니다.', 'success');
      });

      document.getElementById('input-import-file')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const ta = document.getElementById('backup-json-textarea');
          if (ta) ta.value = String(reader.result || '');
          showToast('JSON 파일을 불러왔습니다. 덮어쓰기 또는 병합을 선택하세요.', 'info');
        };
        reader.readAsText(file);
      });

      document.getElementById('btn-restore-overwrite')?.addEventListener('click', () => {
        applyJsonRestore('overwrite');
      });

      document.getElementById('btn-restore-merge')?.addEventListener('click', () => {
        applyJsonRestore('merge');
      });
    }

    function applyJsonRestore(mode) {
      const rawText = (document.getElementById('backup-json-textarea')?.value || '').trim();
      if (!rawText) {
        showToast('복구할 JSON 데이터가 비어 있습니다.', 'warning');
        return;
      }

      try {
        const parsed = JSON.parse(rawText);
        const incomingWorks = Array.isArray(parsed) ? parsed : parsed.works;
        if (!Array.isArray(incomingWorks)) {
          throw new Error('works 배열 누락');
        }

        const incomingTags = Array.isArray(parsed.tagPool) ? parsed.tagPool : [];
        const incomingIdeas = Array.isArray(parsed.savedIdeas) ? parsed.savedIdeas : [];

        if (mode === 'overwrite') {
          appState.works = incomingWorks;
          appState.tagPool = [...new Set([...incomingTags, ...DEFAULT_TAGS])];
          appState.savedIdeas = incomingIdeas;
        } else {
          // 기존 데이터 유지 + 제목 기준 미중복 작품 병합
          const existingNormSet = new Set(appState.works.map((w) => normalizeTitle(w.title)));
          const additions = incomingWorks.filter((w) => w.title && !existingNormSet.has(normalizeTitle(w.title)));
          appState.works = [...additions, ...appState.works];
          appState.tagPool = [...new Set([...appState.tagPool, ...incomingTags])];
          appState.savedIdeas = [...incomingIdeas, ...appState.savedIdeas];
        }

        saveToStorage();
        syncStudioSelection();
        rebuildStudioTwists();
        rebuildStudioTitles();
        renderApp();
        showToast(mode === 'overwrite' ? '덮어쓰기 복구가 완료되었습니다.' : '기존 데이터와 병합되었습니다.', 'success');
      } catch (err) {
        console.error('JSON 복구 오류:', err);
        showToast('올바른 백업 JSON 형식이 아닙니다.', 'error');
      }
    }

    function renderApp() {
      renderHeaderAndNav();

      const mainEl = document.getElementById('main-view');
      if (appState.activeTab === 'register') {
        mainEl.innerHTML = renderRegisterTab();
      } else if (appState.activeTab === 'categories') {
        mainEl.innerHTML = renderCategoriesTab();
      } else if (appState.activeTab === 'studio') {
        syncStudioSelection();
        rebuildStudioTwists();
        rebuildStudioTitles();
        mainEl.innerHTML = renderStudioTab();
      } else if (appState.activeTab === 'calendar') {
        mainEl.innerHTML = renderCalendarTab();
      } else if (appState.activeTab === 'metadata') {
        mainEl.innerHTML = renderMetadataTab();
      }

      bindViewEvents();
    }

    // =========================================================================
    // 14. 정적 바인딩 및 초기 실행
    // =========================================================================
    document.querySelectorAll('.bottom-nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        appState.activeTab = btn.getAttribute('data-nav');
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    document.getElementById('btn-restore-seed')?.addEventListener('click', () => {
      appState.works = createSeedWorks();
      appState.tagPool = [...DEFAULT_TAGS];
      appState.savedIdeas = [];
      saveToStorage();
      syncStudioSelection();
      rebuildStudioTwists();
      rebuildStudioTitles();
      renderApp();
      showToast('초기 샘플 데이터로 복원되었습니다.', 'info');
    });

    document.getElementById('btn-dup-close')?.addEventListener('click', closeDuplicateModal);
    document.getElementById('btn-dup-edit')?.addEventListener('click', () => {
      const targetId = appState.duplicateTargetId;
      closeDuplicateModal();
      if (targetId) openEditWorkModal(targetId);
    });

    document.getElementById('edit-work-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'edit-work-modal') closeEditWorkModal();
    });

    document.getElementById('duplicate-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'duplicate-modal') closeDuplicateModal();
    });

    loadFromStorage();
    renderApp();
  </script>
</body>
</html>
