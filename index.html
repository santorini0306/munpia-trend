<script>
/**
 * ============================================================================
 * 1. DATA CONSTANTS & COMPLETE 11-CATEGORY DETAIL TAXONOMY
 * ============================================================================
 */
const STORAGE_KEY = 'munpia_strategy_note_v1';
const TAGS_POOL_KEY = 'munpia_strategy_tags_pool_v1';
const INIT_FLAG_KEY = 'munpia_strategy_initialized_v1';
const GDRIVE_CFG_KEY = 'munpia_strategy_gdrive_cfg_v1';
const LAYOUT_MODE_KEY = 'munpia_strategy_layout_mode_v1';

const SOURCE_OPTIONS = ['투데이 베스트', '신규 베스트', '기타'];
// ... existing code ... -->
let state = {
  activeTab: 'register', // 'register' | 'kitchen' | 'michelin' | 'pantry' | 'drawer' | 'dishwash'
  novels: [],
  tagPool: [],
  // Responsive & PWA layout state ('auto' | 'mobile' | 'ipad')
  layoutMode: 'auto',
  isIpadView: false,
  inlineDetailCatKey: '기획',
  inlineExpandedGroups: { '기획 핵심 요소': true },
  inlineDetailSearch: '',
  // Google Drive API state
  gdrive: {
    clientId: '',
    accessToken: null,
    tokenExpiry: 0,
    fileId: '',
    lastSyncedAt: '',
    sharedFileIdInput: '',
    isSyncing: false
  },
  // Sub-filters & UI state
  selectedCookingId: null,
  michelinFilter: '전체',
  pantryFilter: '최근순',
  calendarYear: new Date().getFullYear(),
  calendarMonth: new Date().getMonth(), // 0-indexed
  selectedCalendarDate: null,
  showRecipeAnalysis: false,
  // Registration form draft state
  regForm: {
    sources: ['투데이 베스트'],
    title: '',
    genre: '',
    author: '',
    paidTier: '분석 전',
    conversionRate: '',
    freeLastEpisode: ''
  }
};

function getTodayStr() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const rawTags = localStorage.getItem(TAGS_POOL_KEY);
    const initialized = localStorage.getItem(INIT_FLAG_KEY);
    const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY);
    const savedGdrive = localStorage.getItem(GDRIVE_CFG_KEY);

    if (savedLayout) {
      state.layoutMode = savedLayout;
    }
    if (savedGdrive) {
      const parsedG = JSON.parse(savedGdrive);
      state.gdrive.clientId = parsedG.clientId || '';
      state.gdrive.fileId = parsedG.fileId || '';
      state.gdrive.lastSyncedAt = parsedG.lastSyncedAt || '';
    }

    if (raw) {
      state.novels = JSON.parse(raw);
    } else if (!initialized) {
      // Seed 2 rich sample novels on very first run so user can explore immediately
      state.novels = getSampleNovels();
      localStorage.setItem(INIT_FLAG_KEY, 'true');
      saveState();
    }

    if (rawTags) {
      state.tagPool = JSON.parse(rawTags);
    } else {
      state.tagPool = ['초반흡입력', '사이다전개', '상태창활용', '전문직디테일', '빌드업탄탄'];
      localStorage.setItem(TAGS_POOL_KEY, JSON.stringify(state.tagPool));
    }

    // Auto-select first cooking work if available
    const cookingList = state.novels.filter(n => n.status === 'cooking');
    if (cookingList.length > 0 && !state.selectedCookingId) {
      state.selectedCookingId = cookingList[0].id;
    }
  } catch (e) {
    console.error('Failed to load state:', e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.novels));
    localStorage.setItem(TAGS_POOL_KEY, JSON.stringify(state.tagPool));
    localStorage.setItem(LAYOUT_MODE_KEY, state.layoutMode);
    localStorage.setItem(GDRIVE_CFG_KEY, JSON.stringify({
      clientId: state.gdrive.clientId,
      fileId: state.gdrive.fileId,
      lastSyncedAt: state.gdrive.lastSyncedAt
    }));
  } catch (e) {
    console.error('Failed to save state:', e);
    showToast('저장 공간 오류 발생');
  }
}

/**
 * ============================================================================
 * 2-B. PWA MANIFEST & RESPONSIVE DEVICE DETECTION (MOBILE vs IPAD MINI)
 * ============================================================================
 */
function setupPWAManifest() {
  try {
    const svgIcon = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#D97706"/><text x="64" y="82" font-size="64" text-anchor="middle" fill="#FFF">🍳</text></svg>`);
    const manifest = {
      name: '문피아 전략 노트',
      short_name: '문피아노트',
      start_url: '.',
      display: 'standalone',
      background_color: '#FAF8F5',
      theme_color: '#D97706',
      icons: [
        { src: `data:image/svg+xml,${svgIcon}`, sizes: '192x192', type: 'image/svg+xml' },
        { src: `data:image/svg+xml,${svgIcon}`, sizes: '512x512', type: 'image/svg+xml' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.getElementById('pwaManifestLink');
    if (link) link.href = URL.createObjectURL(blob);
  } catch (e) {
    console.warn('Manifest setup skipped', e);
  }
}

function detectResponsiveLayout() {
  const w = window.innerWidth;
  const isIpadUA = /iPad|Macintosh/i.test(navigator.userAgent) && 'ontouchend' in document;
  if (state.layoutMode === 'ipad') {
    state.isIpadView = true;
  } else if (state.layoutMode === 'mobile') {
    state.isIpadView = false;
  } else {
    // Auto breakpoint: >= 744px (iPad Mini 8.3" portrait width is 744px)
    state.isIpadView = w >= 744 || isIpadUA;
  }

  const appEl = document.getElementById('app');
  const bodyWrap = document.getElementById('appBodyWrapper');
  const sidebar = document.getElementById('ipadSidebar');
  const bottomNav = document.getElementById('mobileBottomNav');
  const mainEl = document.getElementById('mainContent');
  const badge = document.getElementById('deviceBadge');
  const modeIcon = document.getElementById('layoutModeIcon');
  const modeText = document.getElementById('layoutModeText');

  if (state.isIpadView) {
    appEl.classList.remove('max-w-[480px]');
    appEl.classList.add('max-w-[1180px]');
    bodyWrap.classList.remove('flex-col');
    bodyWrap.classList.add('flex-row');
    sidebar.classList.remove('hidden');
    sidebar.classList.add('flex');
    bottomNav.classList.add('hidden');
    mainEl.classList.remove('pb-28');
    mainEl.classList.add('pb-10', 'px-6');
  } else {
    appEl.classList.add('max-w-[480px]');
    appEl.classList.remove('max-w-[1180px]');
    bodyWrap.classList.add('flex-col');
    bodyWrap.classList.remove('flex-row');
    sidebar.classList.add('hidden');
    sidebar.classList.remove('flex');
    bottomNav.classList.remove('hidden');
    mainEl.classList.add('pb-28');
    mainEl.classList.remove('pb-10', 'px-6');
  }

  const modeLabels = {
    auto: state.isIpadView ? '자동(아이패드)' : '자동(모바일)',
    mobile: '모바일 고정',
    ipad: '아이패드 미니'
  };
  if (badge) badge.textContent = modeLabels[state.layoutMode];
  if (modeIcon) modeIcon.textContent = state.isIpadView ? '📟' : '📱';
  if (modeText) modeText.textContent = state.isIpadView ? '아이패드 뷰' : '모바일 뷰';
}

function cycleLayoutMode() {
  const order = ['auto', 'ipad', 'mobile'];
  const next = order[(order.indexOf(state.layoutMode) + 1) % order.length];
  state.layoutMode = next;
  saveState();
  detectResponsiveLayout();
  renderAll();
  const names = { auto: '화면 자동 인식 모드', ipad: '아이패드 미니 2단 분할 뷰', mobile: '모바일 1단 하단바 뷰' };
  showToast(`${names[next]}로 전환되었습니다`);
}

/**
 * ============================================================================
 * 2-C. GOOGLE DRIVE API (OAuth2 + DRIVE REST v3 ONE-CLICK SYNC & SHARE)
 * ============================================================================
 */
let tokenClient = null;

function isDriveConnected() {
  return !!state.gdrive.accessToken && Date.now() < state.gdrive.tokenExpiry;
}

function updateDriveStatusUI() {
  const connected = isDriveConnected();
  const headerBtn = document.getElementById('headerDriveBtn');
  const headerStatus = document.getElementById('headerDriveStatus');
  const sidebarDot = document.getElementById('sidebarDriveDot');
  const sidebarText = document.getElementById('sidebarDriveText');

  if (headerStatus) {
    headerStatus.textContent = state.gdrive.isSyncing ? '동기화중...' : (connected ? '드라이브 저장' : '동기화');
  }
  if (headerBtn) {
    headerBtn.className = connected
      ? 'px-2.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 text-[11px] font-extrabold flex items-center gap-1 transition'
      : 'px-2.5 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 text-[11px] font-extrabold flex items-center gap-1 transition';
  }
  if (sidebarDot) {
    sidebarDot.className = `w-2 h-2 rounded-full ${connected ? 'bg-emerald-500' : 'bg-slate-300'}`;
  }
  if (sidebarText) {
    sidebarText.textContent = connected
      ? (state.gdrive.lastSyncedAt ? `최근 동기화: ${state.gdrive.lastSyncedAt}` : '연결됨 · 언제든 저장 가능')
      : '설거지 탭에서 구글 Client ID 등록 후 연결';
  }
}

function connectGoogleDrive(onSuccessCallback) {
  const clientId = (state.gdrive.clientId || '').trim();
  if (!clientId) {
    showToast('먼저 [설거지] 탭에서 Google OAuth Client ID를 입력해 주세요!');
    switchTab('dishwash');
    return;
  }
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
    showToast('Google 인증 스크립트를 불러오는 중입니다. 잠시 후 다시 시도하세요.');
    return;
  }

  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp) => {
        if (resp.error) {
          showToast('구글 드라이브 인증 실패: ' + resp.error);
          return;
        }
        state.gdrive.accessToken = resp.access_token;
        state.gdrive.tokenExpiry = Date.now() + ((resp.expires_in || 3500) * 1000);
        updateDriveStatusUI();
        showToast('Google Drive 연결 성공! ☁️');
        if (typeof onSuccessCallback === 'function') {
          onSuccessCallback();
        } else {
          renderAll();
        }
      }
    });
    tokenClient.requestAccessToken({ prompt: isDriveConnected() ? '' : 'consent' });
  } catch (err) {
    showToast('Client ID 형식을 확인해 주세요.');
  }
}

function quickGoogleDriveSync() {
  if (!isDriveConnected()) {
    connectGoogleDrive(() => uploadToGoogleDrive());
    return;
  }
  uploadToGoogleDrive();
}

async function uploadToGoogleDrive() {
  if (!isDriveConnected()) {
    connectGoogleDrive(() => uploadToGoogleDrive());
    return;
  }

  state.gdrive.isSyncing = true;
  updateDriveStatusUI();

  const payload = {
    appName: '문피아 전략 노트',
    exportedAt: new Date().toISOString(),
    novels: state.novels,
    tagPool: state.tagPool
  };
  const fileContent = JSON.stringify(payload, null, 2);
  const fileName = 'munpia_strategy_note_backup.json';

  try {
    let targetFileId = state.gdrive.fileId;

    // If no fileId cached yet, search existing backup file in Drive
    if (!targetFileId) {
      const q = encodeURIComponent(`name='${fileName}' and trashed=false`);
      const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`, {
        headers: { Authorization: `Bearer ${state.gdrive.accessToken}` }
      });
      const searchData = await searchRes.json();
      if (searchData.files && searchData.files.length > 0) {
        targetFileId = searchData.files[0].id;
      }
    }

    const metadata = { name: fileName, mimeType: 'application/json' };
    const boundary = '-------munpia_note_boundary_314159';
    const body =
      `--${boundary}\r\n` +
      `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
      `${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\n` +
      `Content-Type: application/json\r\n\r\n` +
      `${fileContent}\r\n` +
      `--${boundary}--`;

    const url = targetFileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${targetFileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const method = targetFileId ? 'PATCH' : 'POST';

    const uploadRes = await fetch(url, {
      method,
      headers: {
        Authorization: `Bearer ${state.gdrive.accessToken}`,
        'Content-Type': `multipart/related; boundary=${boundary}`
      },
      body
    });

    if (!uploadRes.ok) throw new Error('Drive API Upload Error');
    const result = await uploadRes.json();

    state.gdrive.fileId = result.id;
    const now = new Date();
    state.gdrive.lastSyncedAt = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    saveState();
    showToast('구글 드라이브에 자동 백업 완료! ☁️✅');
  } catch (e) {
    console.error(e);
    showToast('구글 드라이브 업로드 중 오류가 발생했습니다');
  } finally {
    state.gdrive.isSyncing = false;
    updateDriveStatusUI();
    renderAll();
  }
}

async function restoreFromGoogleDrive(customFileId = null) {
  if (!isDriveConnected()) {
    connectGoogleDrive(() => restoreFromGoogleDrive(customFileId));
    return;
  }

  state.gdrive.isSyncing = true;
  updateDriveStatusUI();

  try {
    let targetId = customFileId || state.gdrive.fileId;
    if (!targetId) {
      const q = encodeURIComponent(`name contains 'munpia_strategy_note' and trashed=false`);
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime)`, {
        headers: { Authorization: `Bearer ${state.gdrive.accessToken}` }
      });
      const listData = await listRes.json();
      if (!listData.files || listData.files.length === 0) {
        showToast('구글 드라이브에서 백업 파일을 찾지 못했습니다');
        return;
      }
      targetId = listData.files[0].id;
    }

    const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${targetId}?alt=media`, {
      headers: { Authorization: `Bearer ${state.gdrive.accessToken}` }
    });
    if (!fileRes.ok) throw new Error('Drive File Download Failed');

    const parsed = await fileRes.json();
    if (!parsed || !Array.isArray(parsed.novels)) {
      showToast('올바른 문피아 전략 노트 백업 데이터가 아닙니다');
      return;
    }

    state.novels = parsed.novels;
    if (Array.isArray(parsed.tagPool)) state.tagPool = parsed.tagPool;
    state.gdrive.fileId = targetId;
    const now = new Date();
    state.gdrive.lastSyncedAt = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    saveState();
    showToast(`구글 드라이브에서 ${state.novels.length}편 복구 완료! 🎉`);
  } catch (e) {
    console.error(e);
    showToast('드라이브 파일 불러오기 실패 (공유 권한 또는 파일 ID 확인)');
  } finally {
    state.gdrive.isSyncing = false;
    updateDriveStatusUI();
    renderAll();
  }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  const msgEl = document.getElementById('toastMessage');
  msgEl.textContent = msg;
  el.classList.remove('opacity-0', '-translate-y-2');
  el.classList.add('opacity-100', 'translate-y-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.add('opacity-0', '-translate-y-2');
    el.classList.remove('opacity-100', 'translate-y-0');
  }, 2200);
}

function copyTitleToClipboard(title) {
  if (!title) return;
  const textarea = document.createElement('textarea');
  textarea.value = title;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast(`'${title}' 복사 완료! 문피아에서 검색하세요`);
  } catch (err) {
    showToast('복사에 실패했습니다');
  }
  document.body.removeChild(textarea);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function toggleRegSource(src) {
  const idx = state.regForm.sources.indexOf(src);
  if (idx >= 0) {
    state.regForm.sources.splice(idx, 1);
  } else {
    state.regForm.sources.push(src);
  }
  renderAll();
}

function handleRegTitleInput(val) {
  state.regForm.title = val;
  const trimmed = val.trim();
  if (!trimmed) return;
  const existing = state.novels.find(n => n.general.title.trim().toLowerCase() === trimmed.toLowerCase());
  if (existing) {
    showDuplicateModal(existing);
  }
}

function showDuplicateModal(existingNovel) {
  const statusLabels = { temp: '제품 등록(임시등록)', cooking: '조리실', pantry: '팬트리' };
  const infoEl = document.getElementById('duplicateWorkInfo');
  infoEl.innerHTML = `
    <strong class="text-slate-900">"${escapeHtml(existingNovel.general.title)}"</strong><br/>
    현재 위치: <span class="text-amber-700 font-bold">${statusLabels[existingNovel.status] || existingNovel.status}</span>
    ${existingNovel.general.author ? ` / 작가: ${escapeHtml(existingNovel.general.author)}` : ''}
  `;
  document.getElementById('duplicateOverlay').classList.remove('hidden');
}

function closeDuplicateModal() {
  document.getElementById('duplicateOverlay').classList.add('hidden');
}

function resetRegForm() {
  state.regForm = {
    sources: ['투데이 베스트'],
    title: '',
    genre: '',
    author: '',
    paidTier: '분석 전',
    conversionRate: '',
    freeLastEpisode: ''
  };
  renderAll();
  showToast('입력창이 초기화되었습니다');
}

function submitNewNovel() {
  const f = state.regForm;
  const title = (f.title || '').trim();
  if (!title) {
    showToast('작품 제목을 입력해 주세요!');
    return;
  }

  // Duplicate Check
  const existing = state.novels.find(n => n.general.title.trim().toLowerCase() === title.toLowerCase());
  if (existing) {
    showDuplicateModal(existing);
    return;
  }

  const genre = (f.genre || '').trim();
  const author = (f.author || '').trim();
  const isLabelComplete = genre !== '' && author !== '';

  const newNovel = {
    id: 'novel_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    createdAt: Date.now(),
    completedAt: null,
    status: isLabelComplete ? 'cooking' : 'temp',
    general: {
      sources: f.sources.length > 0 ? [...f.sources] : ['기타'],
      title: title,
      genre: genre,
      author: author,
      paidTier: f.paidTier || '분석 전',
      conversionRate: f.conversionRate !== '' ? Number(f.conversionRate) : '',
      freeLastEpisode: f.freeLastEpisode !== '' ? Number(f.freeLastEpisode) : ''
    },
    evaluation: {
      spoons: '미지정',
      memos: [],
      tags: []
    },
    details: {},
    drawer: {
      readEpisode: 0,
      isCompleted: false
    }
  };

  state.novels.push(newNovel);
  if (isLabelComplete) {
    state.selectedCookingId = newNovel.id;
  }
  saveState();

  // Reset form
  state.regForm = {
    sources: ['투데이 베스트'],
    title: '',
    genre: '',
    author: '',
    paidTier: '분석 전',
    conversionRate: '',
    freeLastEpisode: ''
  };

  if (isLabelComplete) {
    showToast(`라벨링 완료! [조리실]로 이동했습니다 🍳`);
    state.activeTab = 'kitchen';
  } else {
    showToast(`[임시등록]에 저장되었습니다 📝`);
  }
  renderAll();
}

// Inline 11-Category Detail Selector for iPad Mini Right Pane
function renderInlineDetailSelectorCard(novel) {
  const currentCat = DETAIL_TAXONOMY.find(c => c.key === state.inlineDetailCatKey) || DETAIL_TAXONOMY[0];
  const catData = novel.details?.[currentCat.key] || { groups: [], items: [] };
  const q = state.inlineDetailSearch.trim().toLowerCase();

  return `
    <div class="bg-white rounded-2xl border border-[#E7E2DA] shadow-xs overflow-hidden flex flex-col max-h-[68vh]">
      <div class="p-3 bg-teal-50/70 border-b border-teal-200/70 flex items-center justify-between gap-2">

        <input type="text" value="${escapeHtml(state.inlineDetailSearch)}"
          oninput="state.inlineDetailSearch = this.value; renderAll();"
          placeholder="항목 빠른 검색..."
          class="w-40 px-2.5 py-1 rounded-lg bg-white border border-teal-200 text-[11px] font-semibold focus:outline-none" />
      </div>

      <!-- 11 Category Tabs -->
      <div class="px-2.5 py-2 bg-white border-b border-slate-200 flex flex-wrap gap-1">
        ${DETAIL_TAXONOMY.map(cat => {
          const isAct = cat.key === state.inlineDetailCatKey;
          const d = novel.details?.[cat.key];
          const cnt = (d?.groups?.length || 0) + (d?.items?.length || 0);
          return `
            <button onclick="selectInlineDetailTab('${cat.key}')"
              class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${isAct ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
              ${cat.title}${cnt > 0 ? ` (${cnt})` : ''}
            </button>
          `;
        }).join('')}
      </div>

      <!-- Groups & Sub-items Scroll Area -->
      <div class="p-3 overflow-y-auto space-y-2.5 flex-1 bg-[#FAF8F5]">
        ${currentCat.groups.map(grp => {
          const filteredItems = q ? grp.items.filter(it => it.toLowerCase().includes(q) || grp.name.toLowerCase().includes(q)) : grp.items;
          if (q && filteredItems.length === 0) return '';
          const isGroupChecked = catData.groups.includes(grp.name);
          const isExp = !!state.inlineExpandedGroups[grp.name] || currentCat.groups.length === 1 || !!q;

          return `
            <div class="bg-white rounded-xl border ${isGroupChecked ? 'border-teal-400' : 'border-slate-200'} overflow-hidden">
              <div class="px-3 py-2 bg-slate-50 flex items-center justify-between gap-2">
                <label class="flex items-center gap-2 cursor-pointer flex-1 min-w-0">
                  <input type="checkbox" ${isGroupChecked ? 'checked' : ''}
                    onchange="toggleInlineDetailGroup('${novel.id}', '${currentCat.key}', '${escapeHtml(grp.name).replace(/'/g, "\\'")}')"
                    class="w-3.5 h-3.5 accent-teal-600" />
                  <span class="text-xs font-extrabold text-slate-800 truncate">${escapeHtml(grp.name)}</span>
                </label>
                <button onclick="state.inlineExpandedGroups['${escapeHtml(grp.name).replace(/'/g, "\\'")}'] = !state.inlineExpandedGroups['${escapeHtml(grp.name).replace(/'/g, "\\'")}']; renderAll();"
                  class="text-[10px] font-bold px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-600">
                  ${isExp ? '접기 ▲' : `펼치기 (${grp.items.length}) ▼`}
                </button>
              </div>
              ${isExp ? `
                <div class="p-2.5 border-t border-slate-100 flex flex-wrap gap-1.5">
                  ${filteredItems.map(item => {
                    const checked = catData.items.includes(item);
                    return `
                      <button onclick="toggleInlineDetailItem('${novel.id}', '${currentCat.key}', '${escapeHtml(item).replace(/'/g, "\\'")}')"
                        class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition ${checked ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                        ${checked ? '✓ ' : ''}${escapeHtml(item)}
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function selectInlineDetailTab(key) {
  state.inlineDetailCatKey = key;
  const cat = DETAIL_TAXONOMY.find(c => c.key === key);
  if (cat && cat.groups.length > 0) {
    state.inlineExpandedGroups[cat.groups[0].name] = true;
  }
  renderAll();
}

function toggleInlineDetailGroup(novelId, catKey, groupName) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;
  if (!novel.details) novel.details = {};
  if (!novel.details[catKey]) novel.details[catKey] = { groups: [], items: [] };
  const arr = novel.details[catKey].groups;
  const idx = arr.indexOf(groupName);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(groupName);
  saveState();
  renderAll();
}

function toggleInlineDetailItem(novelId, catKey, itemName) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;
  if (!novel.details) novel.details = {};
  if (!novel.details[catKey]) novel.details[catKey] = { groups: [], items: [] };
  const arr = novel.details[catKey].items;
  const idx = arr.indexOf(itemName);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(itemName);
  saveState();
  renderAll();
}

function renderDetailsSummaryBox(details) {
  if (!details || countDetailsSelected(details) === 0) {
    return `
      <div class="p-3 rounded-xl bg-slate-50 border border-dashed border-slate-200 text-center text-[11px] text-slate-400">
        아직 선택된 상세정보가 없습니다. 아래 버튼을 눌러 설정해 보세요.
      </div>
    `;
  }

  const rows = [];
  DETAIL_TAXONOMY.forEach(cat => {
    const sel = details[cat.key];
    if (!sel) return;
    const groups = sel.groups || [];
    const items = sel.items || [];
    if (groups.length === 0 && items.length === 0) return;

    rows.push(`
      <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 space-y-1">
        <div class="text-[11px] font-extrabold text-slate-800">${cat.title}</div>
        <div class="flex flex-wrap gap-1">
          ${groups.map(g => `<span class="px-2 py-0.5 rounded-md bg-teal-600 text-white text-[10px] font-bold">[계열] ${escapeHtml(g)}</span>`).join('')}
          ${items.map(it => `<span class="px-2 py-0.5 rounded-md bg-white text-slate-700 border border-slate-200 text-[10px] font-semibold">${escapeHtml(it)}</span>`).join('')}
        </div>
      </div>
    `);
  });

  return `<div class="space-y-2 max-h-60 overflow-y-auto pr-0.5">${rows.join('')}</div>`;
}

function selectCookingNovel(id) {
  state.selectedCookingId = id;
  renderAll();
}

function setNovelSpoons(id, spoonVal) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  novel.evaluation.spoons = spoonVal;
  saveState();
  renderAll();
  showToast(spoonVal === '미지정' ? '숟가락 평가를 미지정으로 변경했습니다' : `숟가락 ${spoonVal}개로 설정되었습니다`);
}

function toggleNovelMemo(id, memoId) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  const idx = novel.evaluation.memos.indexOf(memoId);
  if (idx >= 0) {
    novel.evaluation.memos.splice(idx, 1);
  } else {
    novel.evaluation.memos.push(memoId);
  }
  saveState();
  renderAll();
}

function addNovelTagFromInput(id) {
  const input = document.getElementById('kitchenTagInput');
  if (!input) return;
  const tag = input.value.trim().replace(/^#/, '');
  if (!tag) return;

  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;

  if (novel.evaluation.tags.length >= 5) {
    showToast('작품당 태그는 최대 5개까지 등록할 수 있습니다');
    return;
  }

  if (!novel.evaluation.tags.includes(tag)) {
    novel.evaluation.tags.push(tag);
  }
  if (!state.tagPool.includes(tag)) {
    state.tagPool.unshift(tag);
  }
  saveState();
  renderAll();
  showToast(`'#${tag}' 태그가 추가되었습니다`);
}

function removeNovelTag(id, tag) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  novel.evaluation.tags = novel.evaluation.tags.filter(t => t !== tag);
  saveState();
  renderAll();
}

function togglePoolTagOnNovel(id, tag) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  const idx = novel.evaluation.tags.indexOf(tag);
  if (idx >= 0) {
    novel.evaluation.tags.splice(idx, 1);
  } else {
    if (novel.evaluation.tags.length >= 5) {
      showToast('작품당 태그는 최대 5개까지 선택 가능합니다');
      return;
    }
    novel.evaluation.tags.push(tag);
  }
  saveState();
  renderAll();
}

function completeCookingNovel(id) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  novel.status = 'pantry';
  if (!novel.completedAt) {
    novel.completedAt = getTodayStr();
  }
  saveState();
  showToast('조리 완료! 팬트리로 이동 및 설거지 달력에 반영되었습니다 🎉');
  renderAll();
}

  detailModalState.novelId = novelId;

    return `
      <div class="bg-white rounded-2xl border ${isGroupChecked || selectedSubCount > 0 ? 'border-teal-400' : 'border-slate-200'} overflow-hidden shadow-2xs">
        <!-- Major Group Header (큰 계열 선택 + 펼치기) -->

          <label class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0">
            <input type="checkbox" ${isGroupChecked ? 'checked' : ''}
              onchange="toggleDetailGroup('${cat.key}', '${escapeHtml(grp.name).replace(/'/g, "\\'")}')"
              class="w-4 h-4 rounded accent-teal-600 shrink-0" />
            <div class="min-w-0">
              <span class="text-xs font-extrabold text-slate-900 block truncate">${escapeHtml(grp.name)}</span>
              <span class="text-[10px] text-slate-400">체크 시 큰 계열 자체 선택 · 우측 버튼으로 세부항목 펼치기</span>
            </div>
          </label>
          <button onclick="toggleDetailGroupExpand('${escapeHtml(grp.name).replace(/'/g, "\\'")}')"

        ${isExpanded ? `
          <div class="p-3 border-t border-slate-100 flex flex-wrap gap-1.5">
            ${grp.items.map(item => {
              const checked = catDraft.items.includes(item);
              return `
                <button type="button" onclick="toggleDetailSubItem('${cat.key}', '${escapeHtml(item).replace(/'/g, "\\'")}')"
                  class="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold border transition ${checked ? 'bg-teal-600 text-white border-teal-600 shadow-2xs' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">

                </button>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function renderDetailSearchResults(q) {
  const results = [];
  DETAIL_TAXONOMY.forEach(cat => {
    const catDraft = detailModalState.draftDetails[cat.key] || { groups: [], items: [] };
    cat.groups.forEach(grp => {
      const groupMatch = grp.name.toLowerCase().includes(q);
      const matchedItems = grp.items.filter(it => it.toLowerCase().includes(q));
      if (groupMatch || matchedItems.length > 0) {
        results.push({ cat, grp, groupMatch, matchedItems: groupMatch ? grp.items : matchedItems, catDraft });
      }
    });
  });

  if (results.length === 0) {
    return `<div class="text-center py-8 text-xs text-slate-400">검색 결과가 없습니다.</div>`;
  }

  return results.map(({ cat, grp, catDraft, matchedItems }) => {
    const isGroupChecked = catDraft.groups.includes(grp.name);
    return `
      <div class="bg-white rounded-2xl border border-slate-200 p-3 space-y-2">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <div>
            <span class="text-[10px] font-bold text-teal-600">${cat.title}</span>
            <div class="text-xs font-extrabold text-slate-900">${escapeHtml(grp.name)}</div>
          </div>
          <label class="flex items-center gap-1.5 text-[11px] font-bold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg">
            <input type="checkbox" ${isGroupChecked ? 'checked' : ''}
              onchange="toggleDetailGroup('${cat.key}', '${escapeHtml(grp.name).replace(/'/g, "\\'")}')"
              class="accent-teal-600" />
            <span>계열 선택</span>
          </label>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${matchedItems.map(item => {
            const checked = catDraft.items.includes(item);
            return `
              <button type="button" onclick="toggleDetailSubItem('${cat.key}', '${escapeHtml(item).replace(/'/g, "\\'")}')"
                class="px-2.5 py-1 rounded-xl text-[11px] font-semibold border ${checked ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">
                ${checked ? '✓ ' : ''}${escapeHtml(item)}
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function selectDetailCategoryTab(key) {
  detailModalState.activeCatKey = key;
  const cat = DETAIL_TAXONOMY.find(c => c.key === key);
  if (cat && cat.groups.length > 0) {
    detailModalState.expandedGroups[cat.groups[0].name] = true;
  }
  renderDetailsModalContent();
}

function updateDetailSearch(val) {
  detailModalState.searchQuery = val;
  renderDetailsModalContent();
}

function toggleDetailGroupExpand(groupName) {
  detailModalState.expandedGroups[groupName] = !detailModalState.expandedGroups[groupName];
  renderDetailsModalContent();
}

function toggleDetailGroup(catKey, groupName) {
  if (!detailModalState.draftDetails[catKey]) {
    detailModalState.draftDetails[catKey] = { groups: [], items: [] };
  }
  const arr = detailModalState.draftDetails[catKey].groups;
  const idx = arr.indexOf(groupName);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(groupName);
  renderDetailsModalContent();
}

function toggleDetailSubItem(catKey, itemName) {
  if (!detailModalState.draftDetails[catKey]) {
    detailModalState.draftDetails[catKey] = { groups: [], items: [] };
  }
  const arr = detailModalState.draftDetails[catKey].items;
  const idx = arr.indexOf(itemName);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(itemName);
  renderDetailsModalContent();
}

function saveDetailsModal() {
  const novel = state.novels.find(n => n.id === detailModalState.novelId);
  if (novel) {
    novel.details = detailModalState.draftDetails;
    saveState();
    showToast('상세정보가 깔끔하게 저장되었습니다 ✨');

  renderAll();

function saveGeneralEdit(novelId) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;

  const newTitle = document.getElementById('editTitle').value.trim();
  if (!newTitle) {
    showToast('작품 제목은 필수입니다!');
    return;
  }

  // Check duplicate excluding self
  const dup = state.novels.find(n => n.id !== novelId && n.general.title.trim().toLowerCase() === newTitle.toLowerCase());
  if (dup) {
    showDuplicateModal(dup);
    return;
  }

  const selectedSources = [];
  document.querySelectorAll('.edit-src-btn').forEach(btn => {
    if (btn.classList.contains('bg-amber-500')) {
      selectedSources.push(btn.getAttribute('data-src'));
    }
  });

  const newGenre = document.getElementById('editGenre').value.trim();
  const newAuthor = document.getElementById('editAuthor').value.trim();
  const newPaidTier = document.getElementById('editPaidTier').value;
  const newConv = document.getElementById('editConversion').value;
  const newFreeEp = document.getElementById('editFreeEp').value;

  novel.general.sources = selectedSources.length > 0 ? selectedSources : ['기타'];
  novel.general.title = newTitle;
  novel.general.genre = newGenre;
  novel.general.author = newAuthor;
  novel.general.paidTier = newPaidTier;
  novel.general.conversionRate = newConv !== '' ? Number(newConv) : '';
  novel.general.freeLastEpisode = newFreeEp !== '' ? Number(newFreeEp) : '';

  // Auto-transition from temp -> cooking if labeling completed!
  if (novel.status === 'temp' && newGenre !== '' && newAuthor !== '') {
    novel.status = 'cooking';
    state.selectedCookingId = novel.id;
    showToast('라벨링 완료! [조리실]로 자동 이동했습니다 🍳');
  } else {
    showToast('일반정보가 수정되었습니다');
  }

  saveState();
  closeModal();
  renderAll();
}

function saveEvaluationEdit(novelId) {
  const novel = state.novels.find(n => n.id === novelId);
  if (!novel) return;

  novel.evaluation.spoons = document.getElementById('editSpoons').value;
  const memos = [];
  document.querySelectorAll('.edit-memo-chk:checked').forEach(chk => memos.push(chk.value));
  novel.evaluation.memos = memos;

  const rawTags = document.getElementById('editTagsInput').value
    .split(',')
    .map(t => t.trim().replace(/^#/, ''))
    .filter(Boolean)
    .slice(0, 5);
  novel.evaluation.tags = rawTags;
  rawTags.forEach(t => {
    if (!state.tagPool.includes(t)) state.tagPool.unshift(t);
  });

  saveState();
  closeModal();
  renderAll();
  showToast('평가 정보가 수정되었습니다');
}

 */
function renderMichelinView() {
  const michelinNovels = state.novels.filter(hasMichelinData);

  const tierKeys = ['전환 1티어', '전환 2티어', '전환 3티어', '전환 4티어', '전환 예정', '폐사'];
  const tierColors = {
    '전환 1티어': 'bg-amber-500',
    '전환 2티어': 'bg-slate-500',
    '전환 3티어': 'bg-orange-500',
    '전환 4티어': 'bg-teal-500',
    '전환 예정': 'bg-indigo-500',
    '폐사': 'bg-rose-400'
  };

  const counts = {};
  tierKeys.forEach(k => counts[k] = 0);
  michelinNovels.forEach(n => {
    const t = n.general.paidTier;
    if (counts[t] !== undefined) counts[t]++;
  });

  const maxCount = Math.max(1, ...Object.values(counts));

  const filteredNovels = state.michelinFilter === '전체'
    ? michelinNovels
    : michelinNovels.filter(n => n.general.paidTier === state.michelinFilter);

  return `
    <div>
      <h2 class="text-lg font-extrabold text-slate-900">미슐랭 티어 분석</h2>
      <p class="text-xs text-slate-500">유료 도달 및 전환값이 입력된 작품들의 티어 분포입니다.</p>
    </div>

    <div class="${state.isIpadView ? 'grid grid-cols-12 gap-5 items-start' : 'space-y-4'}">
      <!-- Interactive Tier Bar Chart -->
      <div class="${state.isIpadView ? 'col-span-5 sticky top-4' : ''} bg-white rounded-2xl p-4 border border-[#E7E2DA] shadow-xs space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-slate-800">티어별 분포 그래프 (클릭 필터링)</span>
          <button onclick="setMichelinFilter('전체')" class="text-[11px] font-bold px-2.5 py-1 rounded-lg ${state.michelinFilter === '전체' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">
            전체 (${michelinNovels.length})
          </button>
        </div>

        <div class="grid grid-cols-6 gap-2 pt-4 pb-1 items-end h-40 border-b border-slate-100">
          ${tierKeys.map(tier => {
            const c = counts[tier];
            const heightPct = Math.max(8, Math.round((c / maxCount) * 100));
            const isSelected = state.michelinFilter === tier;
            return `
              <button onclick="setMichelinFilter('${tier}')" class="flex flex-col items-center h-full justify-end group focus:outline-none">
                <span class="text-[11px] font-extrabold mb-1 ${isSelected ? 'text-amber-600 scale-110' : 'text-slate-700'} transition">${c}</span>
                <div class="w-full max-w-[34px] rounded-t-xl transition-all duration-300 ${tierColors[tier]} ${isSelected ? 'ring-2 ring-offset-2 ring-slate-900 opacity-100' : 'opacity-80 group-hover:opacity-100'}"
                  style="height: ${heightPct}%;"></div>
              </button>
            `;
          }).join('')}
        </div>

        <!-- X-Axis Labels -->
        <div class="grid grid-cols-6 gap-1 text-center">
          ${tierKeys.map(tier => {
            const isSelected = state.michelinFilter === tier;
            const shortLabel = tier.replace('전환 ', '');
            return `
              <button onclick="setMichelinFilter('${tier}')"
                class="text-[10px] font-bold py-1 rounded-lg truncate ${isSelected ? 'bg-amber-100 text-amber-900' : 'text-slate-500'}">
                ${shortLabel}
              </button>
            `;
          }).join('')}
        </div>
      </div>

      <!-- Filtered Works List -->
      <div class="${state.isIpadView ? 'col-span-7' : ''} space-y-2.5">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-slate-800">
            ${state.michelinFilter === '전체' ? '미슐랭 선정 전체 작품' : `[${state.michelinFilter}] 작품 목록`} (${filteredNovels.length})
          </h3>
        </div>

        ${filteredNovels.length === 0 ? `
          <div class="bg-white rounded-2xl p-6 border border-dashed border-slate-300 text-center text-xs text-slate-400">
            해당 조건의 미슐랭 작품이 없습니다.
          </div>
        ` : `<div class="${state.isIpadView ? 'grid grid-cols-2 gap-3' : 'space-y-2.5'}">${filteredNovels.map(novel => renderManagedNovelCard(novel, true)).join('')}</div>`}
      </div>
    </div>
  `;
}

          ${(g.sources || []).map(s => `<span class="px-1.5 py-0.5 rounded bg-amber-50 text-amber-800 text-[10px] font-bold">${s}</span>`).join('')}
          ${g.genre ? `<span class="px-1.5 py-0.5 rounded bg-teal-50 text-teal-800 text-[10px] font-bold">${escapeHtml(g.genre)}</span>` : ''}
          <span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-bold">${escapeHtml(g.paidTier)}</span>
        </div>

        <div class="flex items-center gap-1.5 flex-wrap">
          <h4 class="text-sm font-extrabold text-slate-900">${escapeHtml(g.title)}</h4>
          ${medalHtml}
        </div>

        <div class="text-[11px] text-slate-500 mt-1 flex flex-wrap gap-x-3 gap-y-0.5">
          <span>작가: <strong class="text-slate-700">${escapeHtml(g.author) || '-'}</strong></span>
          <span>전환값: <strong class="text-indigo-600">${g.conversionRate !== '' ? g.conversionRate + '%' : '-'}</strong></span>
          <span>무료최종: <strong class="text-slate-700">${g.freeLastEpisode !== '' ? g.freeLastEpisode + '화' : '-'}</strong></span>
        </div>
      </div>

      <!-- Evaluation Summary -->
      <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 space-y-1.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            ${renderSpoonPictogram(spoonObj.count, 'w-3.5 h-3.5')}
            <span class="text-[11px] font-bold text-slate-700">${spoonObj.label}</span>
          </div>
          <span class="text-[10px] text-slate-400">상세항목 ${countDetailsSelected(novel.details)}개</span>
        </div>

        ${ev.memos.length > 0 ? `
          <div class="flex flex-wrap gap-1">
            ${ev.memos.map(m => `<span class="px-2 py-0.5 rounded-md bg-teal-100/80 text-teal-900 text-[10px] font-bold">${m}</span>`).join('')}
          </div>
        ` : ''}

        ${ev.tags.length > 0 ? `
          <div class="flex flex-wrap gap-1">
            ${ev.tags.map(t => `<span class="text-[10px] font-semibold text-amber-700">#${escapeHtml(t)}</span>`).join('')}
          </div>
        ` : ''}
      </div>

      <!-- 3 Separate Edit Buttons: [일반정보], [평가], [상세정보] -->
      <div class="grid grid-cols-3 gap-1.5 pt-0.5">
        <button onclick="openEditModal('${novel.id}', 'general')"
          class="py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-bold transition">
          일반정보
        </button>
        <button onclick="openEditModal('${novel.id}', 'evaluation')"
          class="py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-[11px] font-bold transition">
          평가
        </button>
        <button onclick="openEditModal('${novel.id}', 'details')"
          class="py-2 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-900 border border-teal-200 text-[11px] font-bold transition">
          상세정보
        </button>
      </div>
    </div>
  `;
}

/**
 * ============================================================================
 * 10. VIEW 4: 팬트리 (PANTRY ARCHIVE & CATEGORY FILTERS)
 * ============================================================================
 */
function renderPantryView() {
  const pantryNovels = state.novels.filter(n => n.status === 'pantry');

  const filterButtons = [
    { id: '최근순', label: '최근순' },
    { id: '숟가락순', label: '숟가락순' },
    { id: '레전드', label: '레전드' },
    { id: '슈퍼노멀', label: '슈퍼노멀' },
    { id: '레시피분석', label: '레시피분석' },
    { id: '서랍장', label: '서랍장' },
  ];

  let list = [...pantryNovels];

  if (state.pantryFilter === '최근순') {
    list.sort((a, b) => b.createdAt - a.createdAt);
  } else if (state.pantryFilter === '숟가락순') {
    const score = (val) => (val === '미지정' ? 0 : Number(val));
    list.sort((a, b) => score(b.evaluation.spoons) - score(a.evaluation.spoons) || b.createdAt - a.createdAt);
  } else if (state.pantryFilter === '레전드') {
    list = list.filter(n => n.evaluation.memos.includes('레전드 (작가뽕)')).sort((a, b) => b.createdAt - a.createdAt);
  } else if (state.pantryFilter === '슈퍼노멀') {
    list = list.filter(n => n.evaluation.memos.includes('슈퍼노멀 (일반연재)')).sort((a, b) => b.createdAt - a.createdAt);
  } else if (state.pantryFilter === '레시피분석') {
    list = list.filter(n => n.evaluation.memos.includes('레시피분석 (좋은소스)')).sort((a, b) => b.createdAt - a.createdAt);
  } else if (state.pantryFilter === '서랍장') {
    list = list.filter(n => n.evaluation.memos.includes('서랍장 (독자로써 보관)')).sort((a, b) => b.createdAt - a.createdAt);
  }

  return `
    <div>
      <h2 class="text-lg font-extrabold text-slate-900">팬트리 보관함</h2>
      <p class="text-xs text-slate-500">조리 완료된 작품들의 영구 분석 아카이브입니다.</p>
    </div>

    <!-- 6 Filter / Sort Buttons -->
    <div class="grid grid-cols-3 gap-1.5 bg-white p-2 rounded-2xl border border-[#E7E2DA]">
      ${filterButtons.map(btn => {
        const active = state.pantryFilter === btn.id;
        return `
          <button onclick="setPantryFilter('${btn.id}')"
            class="py-2 px-2 rounded-xl text-xs font-extrabold transition ${active ? 'bg-amber-500 text-white shadow-xs' : 'bg-slate-50 text-slate-600 hover:bg-slate-100'}">
            ${btn.label}
          </button>
        `;
      }).join('')}
    </div>

    <!-- Pantry Works List -->
    <div class="space-y-2.5">
      <div class="text-xs font-bold text-slate-500 px-1">
        표시 중: <strong class="text-slate-800">${state.pantryFilter}</strong> (${list.length}편)
      </div>

      ${list.length === 0 ? `
        <div class="bg-white rounded-2xl p-8 border border-dashed border-slate-300 text-center space-y-2">
          <p class="text-xs text-slate-500 font-semibold">해당 분류에 보관된 작품이 없습니다.</p>
          <p class="text-[11px] text-slate-400">조리실에서 [조리 완료] 버튼을 누르면 팬트리에 저장됩니다.</p>
        </div>
      ` : `<div class="${state.isIpadView ? 'grid grid-cols-2 gap-3' : 'space-y-2.5'}">${list.map(novel => renderManagedNovelCard(novel, true)).join('')}</div>`}
    </div>
  `;
}

function setPantryFilter(filterId) {
  state.pantryFilter = filterId;
  renderAll();
}

/**
 * ============================================================================
 * 11. VIEW 5: 서랍장 (READER'S BOOKSHELF & EPISODE TRACKER)
 * ============================================================================
 */
function renderDrawerView() {
  // All works where '서랍장 (독자로써 보관)' is checked, sorted newest first
  const drawerNovels = state.novels
    .filter(n => n.evaluation.memos.includes('서랍장 (독자로써 보관)'))
    .sort((a, b) => b.createdAt - a.createdAt);

  return `
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-lg font-extrabold text-slate-900">독자 서랍장</h2>
        <p class="text-xs text-slate-500">정독 보관 작품의 읽은 화수와 완결 여부를 관리합니다.</p>
      </div>
      <span class="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800 text-xs font-extrabold">
        보관 ${drawerNovels.length}편
      </span>
    </div>

    ${drawerNovels.length === 0 ? `
      <div class="bg-white rounded-3xl p-8 border border-dashed border-slate-300 text-center space-y-2 mt-4">
        <p class="text-sm font-bold text-slate-700">서랍장에 담긴 작품이 없습니다</p>
        <p class="text-xs text-slate-400">조리실 또는 평가 수정에서 [서랍장 (독자로써 보관)]을 체크해 보세요.</p>
      </div>
    ` : `
      <div class="${state.isIpadView ? 'grid grid-cols-2 gap-3.5' : 'space-y-3'}">
        ${drawerNovels.map(novel => {
          const isComp = !!novel.drawer?.isCompleted;
          const readEp = novel.drawer?.readEpisode ?? 0;

          return `
            <div class="rounded-2xl p-4 transition-all duration-300 ${isComp ? 'drawer-completed-card' : 'bg-white border border-[#E7E2DA] shadow-xs'}">
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap mb-1">
                    ${isComp
                      ? `<span class="px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 text-[10px] font-extrabold tracking-wide shadow-xs">👑 완결 정독 완료</span>`
                      : `<span class="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-[10px] font-bold">📖 연재 따라가는 중</span>`
                    }
                    <span class="text-[10px] font-semibold ${isComp ? 'text-indigo-200' : 'text-slate-400'}">
                      ${escapeHtml(novel.general.genre)} · ${escapeHtml(novel.general.author)}
                    </span>
                  </div>
                  <h3 class="text-base font-extrabold leading-snug ${isComp ? 'text-white' : 'text-slate-900'}">
                    ${escapeHtml(novel.general.title)}
                  </h3>
                </div>
                <button onclick="copyTitleToClipboard('${escapeHtml(novel.general.title).replace(/'/g, "\\'")}')"
                  class="px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 ${isComp ? 'bg-white/15 text-amber-200 hover:bg-white/25' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                  제목복사
                </button>
              </div>

              <!-- Episode Number Input + [완결] Button -->
              <div class="flex items-center gap-2 pt-2 border-t ${isComp ? 'border-white/15' : 'border-slate-100'}">
                <div class="flex items-center gap-1.5 flex-1 px-3 py-2 rounded-xl ${isComp ? 'bg-white/10 border border-white/20' : 'bg-slate-50 border border-slate-200'}">
                  <span class="text-xs font-bold ${isComp ? 'text-indigo-200' : 'text-slate-500'} shrink-0">읽은 화수:</span>
                  <input type="number" min="0" value="${readEp}"
                    onchange="updateDrawerEpisode('${novel.id}', this.value)"
                    class="w-full bg-transparent text-sm font-extrabold text-right focus:outline-none ${isComp ? 'text-amber-300' : 'text-slate-900'}" />
                  <span class="text-xs font-bold ${isComp ? 'text-indigo-200' : 'text-slate-500'} shrink-0">화</span>
                </div>

                <button onclick="toggleDrawerCompleted('${novel.id}')"
                  class="px-4 py-2.5 rounded-xl text-xs font-extrabold transition shrink-0 ${isComp
                    ? 'bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 shadow-md'
                    : 'bg-slate-800 hover:bg-slate-900 text-white'}">
                  ${isComp ? '✨ 완결됨' : '완결'}
                </button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

function updateDrawerEpisode(id, val) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  if (!novel.drawer) novel.drawer = { readEpisode: 0, isCompleted: false };
  novel.drawer.readEpisode = Math.max(0, Number(val) || 0);
  saveState();
  showToast(`${novel.drawer.readEpisode}화까지 기록되었습니다`);
}

function toggleDrawerCompleted(id) {
  const novel = state.novels.find(n => n.id === id);
  if (!novel) return;
  if (!novel.drawer) novel.drawer = { readEpisode: 0, isCompleted: false };
  novel.drawer.isCompleted = !novel.drawer.isCompleted;
  saveState();
  renderAll();
  showToast(novel.drawer.isCompleted ? '완결 작품으로 멋지게 변경되었습니다! 👑' : '완결 상태가 해제되었습니다');
}

/**
 * ============================================================================
 * 12. VIEW 6: 설거지 (CALENDAR STATS, BACKUP/RESTORE, RECIPE ANALYSIS)
 * ============================================================================
 */
function renderDishwashView() {
  const year = state.calendarYear;
  const month = state.calendarMonth; // 0-11
  const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`;

  // Group completed works by date (only existing novels in state.novels are counted, so deleted novels automatically disappear!)
  const completedNovels = state.novels.filter(n => n.status === 'pantry' && n.completedAt);
  const byDate = {};
  let monthlyTotal = 0;
  const activeDaysSet = new Set();

  completedNovels.forEach(n => {
    const d = n.completedAt;
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(n);
    if (d.startsWith(monthStr)) {
      monthlyTotal++;
      activeDaysSet.add(d);
    }
  });

  const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 (Sun) - 6 (Sat)
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = getTodayStr();

  const calendarCells = [];
  for (let i = 0; i < firstDayOfWeek; i++) {
    calendarCells.push(`<div class="h-12 rounded-xl bg-slate-50/50"></div>`);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateKey = `${monthStr}-${String(day).padStart(2, '0')}`;
    const worksOnDay = byDate[dateKey] || [];
    const count = worksOnDay.length;
    const isToday = dateKey === todayStr;
    const isSelected = state.selectedCalendarDate === dateKey;

    calendarCells.push(`
      <button onclick="selectCalendarDay('${dateKey}')"
        class="h-12 rounded-xl border flex flex-col items-center justify-between p-1 transition ${isSelected ? 'border-amber-500 bg-amber-50 ring-1 ring-amber-500' : isToday ? 'border-teal-400 bg-teal-50/40' : 'border-slate-100 bg-white hover:bg-slate-50'}">
        <span class="text-[11px] font-bold ${isToday ? 'text-teal-700' : 'text-slate-700'}">${day}</span>
        ${count > 0
          ? `<span class="px-1.5 py-0.2 rounded-full bg-emerald-500 text-white text-[9px] font-extrabold leading-tight">${count}편</span>`
          : `<span class="h-3"></span>`
        }
      </button>
    `);
  }

  const selectedDayWorks = state.selectedCalendarDate ? (byDate[state.selectedCalendarDate] || []) : [];
  const driveConnected = isDriveConnected();

  return `
    <div>
      <h2 class="text-lg font-extrabold text-slate-900">설거지 & 클라우드 동기화 · 레시피 통계</h2>
      <p class="text-xs text-slate-500">조리 완료 달력 통계, Google Drive API 원클릭 동기화/공유, 레시피분석 그래프</p>
    </div>

    <!-- Monthly Statistics Summary Banner -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white rounded-2xl p-3 border border-[#E7E2DA] text-center">
        <div class="text-[10px] font-bold text-slate-400">이달 조리완료</div>
        <div class="text-lg font-extrabold text-emerald-600 mt-0.5">${monthlyTotal}편</div>
      </div>
      <div class="bg-white rounded-2xl p-3 border border-[#E7E2DA] text-center">
        <div class="text-[10px] font-bold text-slate-400">분석 활동일</div>
        <div class="text-lg font-extrabold text-slate-800 mt-0.5">${activeDaysSet.size}일</div>
      </div>
      <div class="bg-white rounded-2xl p-3 border border-[#E7E2DA] text-center">
        <div class="text-[10px] font-bold text-slate-400">누적 완료작</div>
        <div class="text-lg font-extrabold text-amber-600 mt-0.5">${completedNovels.length}편</div>
      </div>
    </div>

    <!-- Responsive 2-Col Grid on iPad Mini (Left: Calendar, Right: Google Drive + Recipe Stats) -->
    <div class="${state.isIpadView ? 'grid grid-cols-12 gap-5 items-start' : 'space-y-4'}">

      <!-- Left Col: Monthly Calendar Card -->
      <div class="${state.isIpadView ? 'col-span-6' : ''} bg-white rounded-2xl p-4 border border-[#E7E2DA] shadow-xs space-y-3">
        <div class="flex items-center justify-between">
          <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">◀</button>
          <h3 class="text-sm font-extrabold text-slate-900">${year}년 ${month + 1}월</h3>
          <button onclick="changeCalendarMonth(1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">▶</button>
        </div>

        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-extrabold text-slate-400">
          <div class="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-sky-500">토</div>
        </div>

        <!-- Calendar Days Grid -->
        <div class="grid grid-cols-7 gap-1">
          ${calendarCells.join('')}
        </div>

        <!-- Selected Date Works Breakdown -->
        ${state.selectedCalendarDate ? `
          <div class="pt-2 border-t border-slate-100 space-y-1.5">
            <div class="text-xs font-extrabold text-slate-800">📅 ${state.selectedCalendarDate} 조리 완료 목록 (${selectedDayWorks.length}편)</div>
            ${selectedDayWorks.length === 0
              ? `<p class="text-[11px] text-slate-400">이 날짜에는 조리 완료된 작품이 없습니다.</p>`
              : selectedDayWorks.map(w => `
                <div class="px-3 py-2 rounded-xl bg-emerald-50/70 border border-emerald-200 flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-900 truncate">${escapeHtml(w.general.title)}</span>
                  <span class="text-[10px] font-semibold text-emerald-700 shrink-0">${escapeHtml(w.general.genre)}</span>
                </div>
              `).join('')
            }
          </div>
        ` : ''}
      </div>

      <!-- Right Col: Google Drive API Sync + Recipe Analysis + Local Backup -->
      <div class="${state.isIpadView ? 'col-span-6' : ''} space-y-4">

        <!-- Google Drive API Direct Sync & Share Card -->
        <div class="bg-white rounded-2xl p-4 border-2 border-sky-200 shadow-xs space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-lg">☁️</span>
              <div>
                <h3 class="text-sm font-extrabold text-slate-900">Google Drive 원클릭 자동 동기화</h3>
                <p class="text-[11px] text-slate-500">모바일 ↔ 아이패드 미니 실시간 데이터 저장·복구·공유</p>
              </div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${driveConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">
              ${driveConnected ? '연결됨' : '미연결'}
            </span>
          </div>

          <!-- Google Cloud OAuth Client ID Input -->
          <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">
            <label class="block text-[10px] font-extrabold text-slate-600">Google OAuth 2.0 Client ID (한 번만 입력하면 자동 보관)</label>
            <div class="flex gap-1.5">
              <input type="text" value="${escapeHtml(state.gdrive.clientId)}"
                onchange="state.gdrive.clientId = this.value.trim(); saveState(); showToast('Client ID가 저장되었습니다');"
                placeholder="예: 123456789-abc...apps.googleusercontent.com"
                class="flex-1 px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-[11px] font-medium focus:outline-none focus:border-sky-500" />
              <button onclick="connectGoogleDrive()"
                class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-extrabold shrink-0">
                ${driveConnected ? '재인증' : '구글 로그인'}
              </button>
            </div>
          </div>

          <!-- One-Click Cloud Backup & Restore Buttons -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="uploadToGoogleDrive()"
              class="py-3 px-3 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 text-white text-xs font-extrabold shadow-xs flex items-center justify-center gap-1.5 transition">
              <span>☁️ 드라이브에 저장</span>
            </button>
            <button onclick="restoreFromGoogleDrive()"
              class="py-3 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-xs flex items-center justify-center gap-1.5 transition">
              <span>📥 드라이브 불러오기</span>
            </button>
          </div>

          <!-- Cloud File ID & Sharing Sync -->
          <div class="pt-2 border-t border-slate-100 space-y-2">
            <div class="flex items-center justify-between text-[11px]">
              <span class="text-slate-500 font-semibold">
                ${state.gdrive.lastSyncedAt ? `최근 동기화: <strong class="text-slate-800">${state.gdrive.lastSyncedAt}</strong>` : '아직 클라우드 동기화 기록이 없습니다'}
              </span>
              ${state.gdrive.fileId ? `
                <button onclick="copyTitleToClipboard('${escapeHtml(state.gdrive.fileId)}')" class="text-sky-700 font-extrabold underline">
                  공유용 파일ID 복사
                </button>
              ` : ''}
            </div>

            <!-- Load Shared File by Drive File ID -->
            <div class="flex gap-1.5">
              <input type="text" value="${escapeHtml(state.gdrive.sharedFileIdInput)}"
                oninput="state.gdrive.sharedFileIdInput = this.value"
                placeholder="공유받은 Google Drive 파일 ID 붙여넣기"
                class="flex-1 px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-[11px] focus:outline-none focus:border-sky-500" />
              <button onclick="restoreFromGoogleDrive(state.gdrive.sharedFileIdInput.trim())"
                class="px-3 py-1.5 rounded-lg bg-slate-800 text-white text-[11px] font-bold shrink-0">
                공유파일 열기
              </button>
            </div>
          </div>
        </div>

        <!-- [레시피분석] Button & Visualization Panel -->
        <div class="bg-white rounded-2xl p-4 border border-[#E7E2DA] shadow-xs space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-extrabold text-slate-900">🧪 좋은소스 레시피 통계</h3>
              <p class="text-[11px] text-slate-500">[레시피분석]이 체크된 작품들의 상세정보 빈도 분석</p>
            </div>
            ${!state.showRecipeAnalysis ? `
              <button onclick="toggleRecipeAnalysis(true)"
                class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-xs transition">
                레시피분석
              </button>
            ` : ''}
          </div>

          ${state.showRecipeAnalysis ? renderRecipeAnalysisPanel() : ''}
        </div>

        <!-- Local JSON File & OS Share Sheet Backup / Restore -->
        <div class="bg-white rounded-2xl p-4 border border-[#E7E2DA] shadow-xs space-y-3">
          <div>
            <h3 class="text-sm font-extrabold text-slate-900">💾 기기 파일 백업 · 공유시트 내보내기</h3>
            <p class="text-[11px] text-slate-500">API 연결 없이도 파일 공유(Drive 앱 전송) 및 JSON 복구가 가능합니다.</p>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="shareViaWebShareOrDownload()"
              class="py-3 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center gap-1.5 transition">
              <span>📤 백업 저장 / 공유</span>
            </button>

            <label class="py-3 px-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 text-xs font-extrabold flex items-center justify-center gap-1.5 cursor-pointer transition">
              <span>⬆️ 백업 파일 복구</span>
              <input type="file" accept=".json" onchange="importBackupJson(event)" class="hidden" />
            </label>
          </div>
        </div>

      </div>
    </div>
  `;
}

function changeCalendarMonth(delta) {
  let m = state.calendarMonth + delta;
  let y = state.calendarYear;
  if (m < 0) { m = 11; y--; }
  else if (m > 11) { m = 0; y++; }
  state.calendarMonth = m;
  state.calendarYear = y;
  state.selectedCalendarDate = null;
  renderAll();
}

function selectCalendarDay(dateKey) {
  state.selectedCalendarDate = (state.selectedCalendarDate === dateKey) ? null : dateKey;
  renderAll();
}

function toggleRecipeAnalysis(show) {
  state.showRecipeAnalysis = show;
  renderAll();
}

function renderRecipeAnalysisPanel() {
  const recipeNovels = state.novels.filter(n => n.evaluation.memos.includes('레시피분석 (좋은소스)'));

  if (recipeNovels.length === 0) {
    return `
      <div class="p-4 rounded-xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-3">
        <p class="text-xs text-slate-500">[레시피분석 (좋은소스)]가 체크된 작품이 아직 없습니다.</p>
        <button onclick="toggleRecipeAnalysis(false)" class="px-5 py-2 rounded-xl bg-slate-800 text-white text-xs font-extrabold">
          분석완료
        </button>
      </div>
    `;
  }

  // Aggregate counts per category across all recipeNovels
  const categoryStats = DETAIL_TAXONOMY.map(cat => {
    const freqMap = {};
    recipeNovels.forEach(novel => {
      const sel = novel.details?.[cat.key];
      if (!sel) return;
      (sel.groups || []).forEach(g => {
        const label = `[계열] ${g}`;
        freqMap[label] = (freqMap[label] || 0) + 1;
      });
      (sel.items || []).forEach(it => {
        freqMap[it] = (freqMap[it] || 0) + 1;
      });
    });

    const sorted = Object.entries(freqMap).sort((a, b) => b[1] - a[1]);
    return { title: cat.title, entries: sorted };
  }).filter(c => c.entries.length > 0);

  return `
    <div class="pt-2 border-t border-slate-100 space-y-4">
      <div class="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-900">
        분석 대상: 총 <span class="underline">${recipeNovels.length}편</span>의 좋은소스 작품 상세 통계
      </div>

      ${categoryStats.length === 0 ? `
        <p class="text-xs text-slate-400 text-center py-4">선택된 상세정보 항목이 없습니다.</p>
      ` : categoryStats.map(cat => {
        const maxVal = Math.max(1, ...cat.entries.map(e => e[1]));
        return `
          <div class="space-y-1.5">
            <div class="text-xs font-extrabold text-slate-800">${cat.title}</div>
            <div class="space-y-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200/70">
              ${cat.entries.slice(0, 8).map(([label, count]) => {
                const pct = Math.round((count / maxVal) * 100);
                return `
                  <div class="space-y-0.5">
                    <div class="flex justify-between text-[11px]">
                      <span class="font-bold text-slate-700 truncate pr-2">${escapeHtml(label)}</span>
                      <span class="font-extrabold text-emerald-700 shrink-0">${count}편 (${Math.round((count / recipeNovels.length) * 100)}%)</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-slate-200 overflow-hidden">
                      <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-500" style="width: ${pct}%;"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('')}

      <!-- [분석완료] Button to close/hide statistics -->
      <button onclick="toggleRecipeAnalysis(false)"
        class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs shadow-md transition">
        분석완료
      </button>
    </div>
  `;
}

function exportBackupJson() {
  const payload = {
    appName: '문피아 전략 노트',
    exportedAt: new Date().toISOString(),
    novels: state.novels,
    tagPool: state.tagPool
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateTag = getTodayStr().replace(/-/g, '');
  a.href = url;
  a.download = `문피아_전략노트_백업_${dateTag}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('백업 JSON 파일이 다운로드되었습니다 💾');
}

function importBackupJson(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed || !Array.isArray(parsed.novels)) {
        showToast('올바른 백업 파일 형식이 아닙니다');
        return;
      }
      state.novels = parsed.novels;
      if (Array.isArray(parsed.tagPool)) {
        state.tagPool = parsed.tagPool;
      }
      saveState();
      renderAll();
      showToast(`총 ${state.novels.length}편의 데이터가 성공적으로 복구되었습니다! 🎉`);
    } catch (err) {
      showToast('파일을 읽는 중 오류가 발생했습니다');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/**
 * ============================================================================
 * 13. MAIN RENDER CONTROLLER & INITIALIZATION
 * ============================================================================
 */
function renderAll() {
  renderNav();
  const main = document.getElementById('mainContent');

  switch (state.activeTab) {
    case 'register':
      main.innerHTML = renderRegisterView();
      break;
    case 'kitchen':
      main.innerHTML = renderKitchenView();
      break;
    case 'michelin':
      main.innerHTML = renderMichelinView();
      break;
    case 'pantry':
      main.innerHTML = renderPantryView();
      break;
    case 'drawer':
      main.innerHTML = renderDrawerView();
      break;
    case 'dishwash':
      main.innerHTML = renderDishwashView();
      break;
    default:
      main.innerHTML = renderRegisterView();
  }
}

window.onload = function() {
  setupPWAManifest();
  loadState();
  detectResponsiveLayout();
  renderAll();
  window.addEventListener('resize', () => {
    const prev = state.isIpadView;
    detectResponsiveLayout();
    if (prev !== state.isIpadView) {
      renderAll();
    }
  });
};
</script>
