    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getRelativeDateKey(offsetDays) {
      const now = new Date();
      const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetDays);
      return formatDateKey(dt);
    }

    };

    function loadState() {
      try {
        const rawWorks = localStorage.getItem(STORAGE_KEY_WORKS);
        const rawTags = localStorage.getItem(STORAGE_KEY_TAGS);
        const rawDrafts = localStorage.getItem(STORAGE_KEY_DRAFTS);

        state.works = rawWorks ? JSON.parse(rawWorks) : buildInitialWorks();
        state.tagPool = rawTags ? JSON.parse(rawTags) : [...DEFAULT_TAG_POOL];
        state.savedDrafts = rawDrafts ? JSON.parse(rawDrafts) : [];
      } catch (err) {
        console.error('스토리지 로드 실패:', err);
        state.works = buildInitialWorks();
        state.tagPool = [...DEFAULT_TAG_POOL];
        state.savedDrafts = [];
      }

      const firstVault = state.works.find((w) => Array.isArray(w.extras) && w.extras.includes('vault'));
      state.vaultStudio.selectedWorkId = firstVault ? firstVault.id : (state.works[0]?.id || null);
      generateIdeaPlan();
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY_WORKS, JSON.stringify(state.works));
        localStorage.setItem(STORAGE_KEY_TAGS, JSON.stringify(state.tagPool));
        localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(state.savedDrafts));
      } catch (err) {
        console.error('스토리지 저장 실패:', err);
        showToast('브라우저 저장 공간에 쓰기 중 오류가 발생했습니다.', 'error');
      }
    }

    function normalizeTitle(str) {
      return (str || '').replace(/\s+/g, '').toLowerCase().trim();
    }

    // =========================================================================
    // 3. 토스트 알림 유틸리티
    // =========================================================================
    function showToast(message, type = 'info', actionLabel = null, onAction = null) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const styleMap = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-950 text-emerald-100 border-emerald-600',
        warning: 'bg-amber-950 text-amber-100 border-amber-500',
        error: 'bg-rose-950 text-rose-100 border-rose-500',
      };

      toast.className = `pointer-events-auto border rounded-2xl px-3.5 py-2.5 shadow-xl text-xs sm:text-sm font-medium flex items-center justify-between gap-2 animate-fade-up ${styleMap[type] || styleMap.info}`;

      const textSpan = document.createElement('span');
      textSpan.textContent = message;
      toast.appendChild(textSpan);

      if (actionLabel && typeof onAction === 'function') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = actionLabel;
        btn.className = 'shrink-0 px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-bold text-xs hover:bg-amber-300 cursor-pointer';
        btn.addEventListener('click', () => {
          onAction();
          toast.remove();
        });
        toast.appendChild(btn);
      }

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3400);
    }

    // =========================================================================
    // 4. 문피아 베스트 자동 정보 검색/생성 시뮬레이터
    // =========================================================================
    function lookupMunpiaMetadata(rawTitle) {
      const clean = (rawTitle || '').trim();
      const norm = normalizeTitle(clean);

      // 1) 내장 샘플 카탈로그에서 부분/정확 매칭
      const matched = MUNPIA_SAMPLE_CATALOG.find((item) => {
        const itemNorm = normalizeTitle(item.title);
        return itemNorm === norm || itemNorm.includes(norm) || (norm.length >= 3 && norm.includes(itemNorm));
      });

      if (matched) {
        return {
          matched: true,
          sourceLabel: matched.sources.map((s) => (s === 'today' ? '투데이 베스트' : '신규 베스트')).join(' · '),
          genre: matched.genre,
          author: matched.author,
          synopsis: matched.synopsis,
          totalEpisodes: matched.totalEpisodes,
          latestViews: matched.latestViews,
          suggestedTags: [...matched.tags],
        };
      }

      // 2) 미등록 제목일 경우 키워드 기반 자동 메타데이터 생성
      let genre = '판타지';
      let suggestedTags = ['사이다', '성장형'];
      if (/검|무림|협|도|내공|문파|의원/.test(clean)) {
        genre = '무협';
        suggestedTags = ['무협', '사이다', '역대급'];
      } else if (/헌터|게이트|각성|던전|성좌|상태창|재벌|회사|AI|시스템/.test(clean)) {
        genre = '현대판타지';
        suggestedTags = ['상태창', '현대판타지', '사이다'];
      } else if (/아카데미|마법|영주|황자|공작|빙의|회귀/.test(clean)) {
        genre = '퓨전판타지';
        suggestedTags = ['회귀', '빙의', '착각계'];
      }

      const hash = Array.from(clean).reduce((acc, ch) => acc + ch.charCodeAt(0), 17);
      const authors = ['별빛작가', '천마서생', '달빛잉크', '은빛펜촉', '현실도피자', '네오스토리'];
      const author = authors[hash % authors.length];
      const totalEpisodes = 18 + (hash % 165);
      const viewsNum = 14500 + ((hash * 3791) % 145000);

      return {
        matched: false,
        sourceLabel: '문피아 베스트 자동 추정',
        genre,
        author,
        synopsis: `「${clean}」 — 초반 전개 속도와 고유 설정을 중심으로 독자 유입을 노리는 ${genre} 작품. 핵심 갈등 구조와 보상 타이밍을 분석하기 좋은 트렌드 샘플입니다.`,
        totalEpisodes,
        latestViews: viewsNum.toLocaleString('ko-KR'),
        suggestedTags,
      };
    }

    function applyAutoMetadataToForm() {
      const title = state.form.title.trim();
      if (!title) {
        showToast('먼저 작품 제목을 입력해주세요.', 'warning');
        return;
      }

      // 중복 체크 안내
      const duplicate = state.works.find((w) => normalizeTitle(w.title) === normalizeTitle(title));
      if (duplicate) {
        showToast('이미 등록된 작품입니다', 'warning', '목록 보기', () => {
          state.activeTab = 'categories';
          state.categoryFilter.type = 'all';
          state.highlightWorkId = duplicate.id;
          renderAll();
        });
      }

      const meta = lookupMunpiaMetadata(title);
      state.form.genre = meta.genre;
      state.form.author = meta.author;
      state.form.synopsis = meta.synopsis;
      state.form.totalEpisodes = meta.totalEpisodes;
      state.form.latestViews = meta.latestViews;

      // 추천 태그를 기존 선택 태그와 합쳐 최대 5개까지 채움
      const mergedTags = [...new Set([...state.form.tags, ...meta.suggestedTags])].slice(0, 5);
      state.form.tags = mergedTags;
      state.form.autoFilledNotice = meta.matched
        ? `문피아(${meta.sourceLabel}) DB에서 정보를 자동 불러왔습니다.`
        : `입력하신 제목을 기준으로 ${meta.genre} 장르 메타데이터를 자동 생성했습니다. 필요시 직접 수정하세요.`;

      renderAll();
      showToast('작품 정보가 자동으로 채워졌습니다.', 'success');
    }

    // =========================================================================
    // 5. 보관함(좋은소스) 차기작 아이디어 변형 엔진
    // =========================================================================
    function generateIdeaPlan() {
      const vaultWorks = state.works.filter((w) => Array.isArray(w.extras) && w.extras.includes('vault'));
      const sourceWork =
        vaultWorks.find((w) => w.id === state.vaultStudio.selectedWorkId) ||
        vaultWorks[0] ||
        state.works[0];

      if (!sourceWork) {
        state.vaultStudio.generatedPlan = null;
        return;
      }

      state.vaultStudio.selectedWorkId = sourceWork.id;
      const chosenIds = state.vaultStudio.selectedIdeas.length
        ? state.vaultStudio.selectedIdeas
        : ['genre_shift'];

      const s = state.vaultStudio.seed;

      // 변형 요소별 구체 아이디어 풀
      const twistPool = {
        genre_shift: [
          `${sourceWork.genre} 문법을 '미식·경영 느와르' 구조로 전복`,
          `전투 중심 서사를 '법정·협상 스릴러' 전개로 재설계`,
          `정통 ${sourceWork.genre} 클리셰를 '미스터리 추리 수사극'으로 전환`,
        ],
        add_material: [
          `'기억 경매소' 시스템과 '생존 요리/공방' 소재를 결합`,
          `'폐기된 스킬 거래소'와 '정치 킹메이커' 요소를 접목`,
          `'예지 로그(미래 오답노트)'와 '특수 직무 시뮬레이션' 결합`,
        ],
        era_shift: [
          `배경을 '아포칼립스 이후 궤도 엘리베이터 도시'로 변경`,
          `무대를 '근대 개화기·철도 제국 시대'로 전환`,
          `배경을 '초고령화·AI 통제 메가시티'로 재설정`,
        ],
        protagonist_shift: [
          `주인공을 영웅이 아닌 '현장 철거/정산 전문가'로 변경`,
          `주인공을 몰락 귀족의 '수석 집사·회계사'로 전환`,
          `주인공을 은퇴한 '2인자·교관' 포지션으로 변경`,
        ],
        rule_twist: [
          `강해질수록 '감정·기억 일부를 대가로 지불'하는 규칙 도입`,
          `패배하거나 위기에 처할수록 '상대 역량이 복제'되는 반전 규칙`,
          `하루 단위로 '능력치 배분이 리셋'되는 하이리스크 설계`,
        ],
        tone_shift: [
          `어두운 생존극 톤에 '극단적 현실주의·블랙코미디'를 가미`,
          `진지한 세계관 속에서 주인공만 '초월적 마이페이스'로 진행`,
          `초반 사이다 쾌감을 '치밀한 복선 회수형 카타르시스'로 변주`,
        ],
      };

      const selectedTwistLines = chosenIds.map((id) => {
        const list = twistPool[id] || twistPool.genre_shift;
        return {
          id,
          label: VARIATION_IDEAS.find((v) => v.id === id)?.label || id,
          text: list[s % list.length],
        };
      });

      const baseKeyword = sourceWork.title.split(' ').slice(0, 2).join(' ');
      const tagKeyword = sourceWork.tags[s % Math.max(1, sourceWork.tags.length)] || '역대급';
      const primaryTwistLabel = selectedTwistLines[0]?.label || '아이디어 변주';

      const candidateTitles = [
        `${baseKeyword}, ${primaryTwistLabel}로 판을 뒤집다`,
        `[${tagKeyword} 변주] ${sourceWork.genre} 천재는 룰을 새로 쓴다`,
        `망한 줄 알았던 ${baseKeyword}의 숨겨진 공략법`,
      ];

      const twistSummaryText = selectedTwistLines.map((t) => `• [${t.label}] ${t.text}`).join('\n');

      const pitchSynopsis = [
        `원작 「${sourceWork.title}」(${sourceWork.genre}, ${sourceWork.totalEpisodes}화 연재 트렌드 참고)의 핵심 매력인 '${sourceWork.tags.slice(0, 2).join('·') || '고속 전개'}' 감각을 가져오되, 차기작에서는 다음과 같이 변주했습니다.`,
        twistSummaryText,
        `1화부터 명확한 목표와 손에 잡히는 보상을 제시하며, 독자가 "다음 화를 안 보면 손해다"라고 느끼게 만드는 고밀도 차기작 시놉시스 가안입니다.`,
      ].join('\n\n');

      state.vaultStudio.generatedPlan = {
        sourceTitle: sourceWork.title,
        sourceGenre: sourceWork.genre,
        twistLines: selectedTwistLines,
        candidateTitles,
        pitchSynopsis,
      };
    }

    // 6. 문피아 앱/웹 바로가기 URL 헬퍼
    // =========================================================================
    function getMunpiaLinks(title) {
      const encoded = encodeURIComponent(title.trim());
      return {
        appScheme: `munpia://search?keyword=${encoded}`,
        webSearchUrl: `https://www.munpia.com/search?keyword=${encoded}`,
        bestBoardUrl: 'https://www.munpia.com/best/today?displayType=LIST',
      };
    }

    function openMunpiaApp(title) {
      const links = getMunpiaLinks(title);
      // 모바일 앱 스킴 호출 시도 후 웹 검색 페이지 새 탭 오픈
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = links.appScheme;
      document.body.appendChild(iframe);
      setTimeout(() => iframe.remove(), 800);

      window.open(links.webSearchUrl, '_blank', 'noopener,noreferrer');
      showToast(`"${title}" 문피아 앱/검색 페이지를 열었습니다.`, 'info');
    }

                <input id="input-author" type="text" value="${escapeHtml(f.author)}" placeholder="작가명" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">총 회차</label>
                <input id="input-episodes" type="number" min="1" value="${Number(f.totalEpisodes) || 1}" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">최근화 조회수</label>
                <input id="input-views" type="text" value="${escapeHtml(f.latestViews)}" placeholder="예: 85,200" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs" />
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1">작품소개</label>
              <textarea id="input-synopsis" rows="2" placeholder="작품 줄거리 및 도입부 특징" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs leading-relaxed">${escapeHtml(f.synopsis)}</textarea>
            </div>
          </div>

          <!-- 4) 별점 선택 (4가지 중 1개) -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">하차/정독 별점 (4가지 중 1개 선택)</label>
            <div class="grid grid-cols-2 gap-2">
              ${RATING_OPTIONS.map((opt) => {
                const active = f.rating === opt.id;
                return `
                  <button
                    type="button"
                    data-rating-id="${opt.id}"
                    class="rating-select-btn p-2.5 rounded-xl border text-left transition cursor-pointer ${
                      active ? 'bg-slate-900 text-white border-slate-900 shadow-xs' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                    }"
                  >
                    <div class="text-xs font-bold">${opt.label}</div>
                    <div class="text-[10px] mt-0.5 ${active ? 'text-slate-300' : 'text-slate-500'}">${opt.desc}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 5) 추가 표시 3가지 (중복 선택 가능) -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">추가 표시 (중복 선택 가능)</label>
            <div class="grid grid-cols-3 gap-1.5">
              ${EXTRA_BADGES.map((badge) => {
                const selected = f.extras.includes(badge.id);
                return `
                  <button
                    type="button"
                    data-extra-id="${badge.id}"
                    class="extra-toggle-btn py-2 px-2 rounded-xl border text-[11px] font-bold flex flex-col items-center justify-center gap-0.5 transition cursor-pointer ${
                      selected ? badge.activeClass + ' shadow-xs' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                    }"
                  >
                    <span>${badge.emoji} ${selected ? '✓' : ''}</span>
                    <span class="text-center leading-tight">${badge.label}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 6) 작품별 태그 (최대 5개 + 저장된 태그 풀 재사용) -->
          <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200/70 space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-slate-700">작품 태그 (${f.tags.length}/5)</label>
              <span class="text-[11px] text-slate-500">저장된 태그 탭하여 추가</span>
            </div>

            <!-- 현재 선택된 태그 -->
            <div class="flex flex-wrap gap-1.5 min-h-[28px]">
              ${f.tags.length ? f.tags.map((t) => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-munpia-600 text-white text-xs font-semibold">
                  #${escapeHtml(t)}
                  <button type="button" data-remove-tag="${escapeHtml(t)}" class="remove-tag-btn hover:text-amber-200 cursor-pointer">✕</button>
                </span>
              `).join('') : `<span class="text-xs text-slate-400">선택된 태그가 없습니다.</span>`}
            </div>

            <!-- 새 태그 입력 및 태그 풀 추가 -->
            <div class="flex gap-1.5">
              <input
                id="input-custom-tag"
                type="text"
                value="${escapeHtml(f.customTagInput)}"
                placeholder="새 태그 입력 (예: 역클리셰)"
                class="flex-1 min-w-0 px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs"
              />
              <button id="btn-add-custom-tag" type="button" class="px-3 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold cursor-pointer">
                추가·저장
              </button>
            </div>

            <!-- 저장된 태그 풀 -->
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${state.tagPool.map((poolTag) => {
                const isSelected = f.tags.includes(poolTag);
                return `
                  <button
                    type="button"
                    data-pool-tag="${escapeHtml(poolTag)}"
                    class="pool-tag-btn px-2 py-1 rounded-lg text-[11px] font-medium border transition cursor-pointer ${
                      isSelected
                        ? 'bg-munpia-100 text-munpia-800 border-munpia-300 font-bold'
                        : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'
                    }"
                  >
                    ${isSelected ? '✓ ' : '+ '}#${escapeHtml(poolTag)}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 등록 버튼 -->
          <button
            id="btn-submit-work"
            type="button"
            class="w-full py-3.5 rounded-2xl bg-munpia-600 hover:bg-munpia-700 active:scale-[0.99] text-white font-extrabold text-sm shadow-md transition cursor-pointer"
          >
            작품 등록하기
          </button>
        </section>

        <!-- 최근 등록 작품 미리보기 -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-sm font-bold text-slate-800">최근 등록한 작품</h3>
            <button id="btn-go-all-categories" type="button" class="text-xs font-bold text-munpia-600 hover:underline cursor-pointer">
              전체 카테고리 보기 →
            </button>
          </div>
          ${state.works.slice(0, 3).map((w) => renderWorkCard(w, false)).join('')}
        </section>
      `;
    }

    // 탭 2: 카테고리 & 보관함 강조 뷰
    function renderCategoriesTab() {
      const cf = state.categoryFilter;
      const vaultWorks = state.works.filter((w) => w.extras?.includes('vault'));

      const filteredWorks = state.works.filter((w) => {
        if (cf.searchQuery.trim()) {
          const q = cf.searchQuery.trim().toLowerCase();
          const hay = `${w.title} ${w.author} ${w.genre} ${(w.tags || []).join(' ')}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (cf.type === 'vault') return w.extras?.includes('vault');
        if (cf.type === 'legend') return w.extras?.includes('legend');
        if (cf.type === 'supernormal') return w.extras?.includes('supernormal');
        if (cf.type === 'rating') return w.rating === cf.ratingId;
        if (cf.type === 'source_today') return w.sources?.includes('today');
        if (cf.type === 'source_new') return w.sources?.includes('new');
        return true;
      });

      const filterBtnClass = (active) =>
        active
          ? 'px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold shrink-0 cursor-pointer'
          : 'px-3 py-1.5 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 text-xs font-semibold shrink-0 cursor-pointer';

      return `
        <!-- 보관함 (좋은소스) 강조 섹션 -->
        <section class="vault-glow rounded-2xl p-4 space-y-2.5 animate-fade-up">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="text-lg">💎</span>
              <div>
                <h2 class="text-sm font-extrabold text-vault-900">보관함 (좋은소스) 하이라이트</h2>
                <p class="text-[11px] text-amber-800">차기작 레퍼런스 및 아이디어 변형에 바로 쓸 수 있는 핵심 소스</p>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-amber-500 text-white text-xs font-extrabold">
              ${vaultWorks.length}편
            </span>
          </div>

          ${vaultWorks.length ? `
            <div class="flex gap-2 overflow-x-auto no-scrollbar pt-1">
              ${vaultWorks.map((vw) => `
                <div class="shrink-0 w-60 bg-white/95 rounded-xl p-2.5 border border-amber-300 shadow-2xs flex flex-col justify-between gap-2">
                  <div>
                    <div class="flex items-center justify-between gap-1">
                      <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-900">${escapeHtml(vw.genre)}</span>
                      <span class="text-[10px] text-slate-500">${Number(vw.totalEpisodes) || 0}화 · ${escapeHtml(vw.latestViews)}</span>
                    </div>
                    <div class="font-bold text-xs text-slate-900 mt-1 line-clamp-1">${escapeHtml(vw.title)}</div>
                  </div>
                  <button
                    type="button"
                    data-transform-work-id="${vw.id}"
                    class="go-transform-btn w-full py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-[11px] font-bold transition cursor-pointer"
                  >
                    💡 아이디어 변형하기
                  </button>
                </div>
              `).join('')}
            </div>
          ` : `
            <p class="text-xs text-amber-900 bg-white/70 rounded-xl p-2.5">
              아직 보관함(좋은소스)에 담긴 작품이 없습니다. 작품 등록 또는 카드에서 '보관함 (좋은소스)'를 체크해보세요!
            </p>
          `}
        </section>

        <!-- 카테고리 필터 컨트롤 -->
        <section class="bg-white rounded-2xl p-3.5 border border-slate-200/80 space-y-3">
          <input
            id="input-category-search"
            type="text"
            value="${escapeHtml(cf.searchQuery)}"
            placeholder="제목, 작가, 장르, #태그로 검색..."
            class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-munpia-500"
          />

          <!-- 주요 카테고리 칩 -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            <button type="button" data-cat-type="all" class="cat-filter-btn ${filterBtnClass(cf.type === 'all')}">전체 (${state.works.length})</button>
            <button type="button" data-cat-type="vault" class="cat-filter-btn ${filterBtnClass(cf.type === 'vault')}">💎 보관함</button>
            <button type="button" data-cat-type="legend" class="cat-filter-btn ${filterBtnClass(cf.type === 'legend')}">🔥 레전드</button>
            <button type="button" data-cat-type="supernormal" class="cat-filter-btn ${filterBtnClass(cf.type === 'supernormal')}">⚡ 슈퍼노멀</button>
            <button type="button" data-cat-type="rating" class="cat-filter-btn ${filterBtnClass(cf.type === 'rating')}">⭐ 별점별</button>
            <button type="button" data-cat-type="source_today" class="cat-filter-btn ${filterBtnClass(cf.type === 'source_today')}">투데이베스트</button>
            <button type="button" data-cat-type="source_new" class="cat-filter-btn ${filterBtnClass(cf.type === 'source_new')}">신규베스트</button>
          </div>

          <!-- 별점 카테고리 선택 시 세부 별점 필터 -->
          ${cf.type === 'rating' ? `
            <div class="grid grid-cols-2 gap-1.5 pt-1 border-t border-slate-100">
              ${RATING_OPTIONS.map((r) => `
                <button
                  type="button"
                  data-filter-rating-id="${r.id}"
                  class="sub-rating-btn px-2.5 py-1.5 rounded-xl text-xs font-bold border text-left cursor-pointer ${
                    cf.ratingId === r.id ? 'bg-munpia-600 text-white border-munpia-600' : 'bg-slate-50 text-slate-700 border-slate-200'
                  }"
                >
                  ${r.label}
                </button>
              `).join('')}
            </div>
          ` : ''}
        </section>

        <!-- 필터링된 작품 목록 -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-bold text-slate-600">검색·카테고리 결과 ${filteredWorks.length}편</span>
          </div>
          ${filteredWorks.length
            ? filteredWorks.map((w) => renderWorkCard(w, true)).join('')
            : `<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-500 border border-slate-200">조건에 맞는 작품이 없습니다.</div>`
          }
        </section>
      `;
    }

    // 개별 작품 카드 렌더링 (문피아 앱 바로가기 + 빠른 상태 토글 + 삭제)
    function renderWorkCard(w, showDelete) {
      const ratingObj = RATING_OPTIONS.find((r) => r.id === w.rating) || RATING_OPTIONS[3];
      const isVault = w.extras?.includes('vault');
      const isHighlighted = state.highlightWorkId === w.id;

      return `
        <article
          data-work-id="${w.id}"
          class="rounded-2xl p-3.5 transition ${
            isVault
              ? 'bg-amber-50/70 border-2 border-amber-400 shadow-xs'
              : 'bg-white border border-slate-200/80 shadow-2xs'
          } ${isHighlighted ? 'ring-2 ring-munpia-500' : ''}"
        >
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1 mb-1">
                ${(w.sources || []).map((src) => `
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${
                    src === 'today' ? 'bg-munpia-100 text-munpia-800' : 'bg-indigo-100 text-indigo-800'
                  }">
                    ${src === 'today' ? '투데이 베스트' : '신규 베스트'}
                  </span>
                `).join('')}
                <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 text-[10px] font-bold">${escapeHtml(w.genre)}</span>
                <span class="text-[10px] text-slate-400">· ${escapeHtml(w.createdAt)}</span>
              </div>
              <h4 class="font-extrabold text-sm text-slate-900 leading-snug">${escapeHtml(w.title)}</h4>
              <p class="text-[11px] text-slate-500 mt-0.5">
                작가: <strong class="text-slate-700">${escapeHtml(w.author || '미상')}</strong> · 총 ${Number(w.totalEpisodes) || 0}화 · 최근화 조회 ${escapeHtml(w.latestViews || '-')}
              </p>
            </div>
            <span class="shrink-0 px-2 py-1 rounded-xl border text-[11px] font-bold ${ratingObj.color}">
              ${ratingObj.shortLabel}
            </span>
          </div>

          ${w.synopsis ? `
            <p class="mt-2 text-xs text-slate-600 bg-white/80 rounded-xl p-2 border border-slate-100 leading-relaxed">
              ${escapeHtml(w.synopsis)}
            </p>
          ` : ''}

          <!-- 추가 표시 뱃지 (원클릭 토글 가능) -->
          <div class="mt-2.5 flex flex-wrap items-center gap-1.5">
            ${EXTRA_BADGES.map((b) => {
              const active = w.extras?.includes(b.id);
              return `
                <button
                  type="button"
                  data-card-extra-work="${w.id}"
                  data-card-extra-id="${b.id}"
                  class="card-extra-btn px-2 py-1 rounded-lg border text-[11px] font-bold transition cursor-pointer ${
                    active ? b.chipClass : 'bg-slate-50 text-slate-400 border-slate-200 hover:text-slate-700'
                  }"
                >
                  ${b.emoji} ${b.label}
                </button>
              `;
            }).join('')}
          </div>

          <!-- 태그 목록 -->
          ${(w.tags && w.tags.length) ? `
            <div class="mt-2 flex flex-wrap gap-1">
              ${w.tags.map((t) => `
                <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[11px] font-medium">#${escapeHtml(t)}</span>
              `).join('')}
            </div>
          ` : ''}

          <!-- 하단 액션: 문피아 앱 바로가기 + 보관함 변형 + 삭제 -->
          <div class="mt-3 pt-2.5 border-t border-slate-200/60 flex items-center justify-between gap-2">
            <button
              type="button"
              data-munpia-title="${escapeHtml(w.title)}"
              class="munpia-open-btn flex-1 py-2 px-3 rounded-xl bg-munpia-600 hover:bg-munpia-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer"
            >
              <span>📱 문피아 앱/웹에서 보기</span>
            </button>

            ${isVault ? `
              <button
                type="button"
                data-transform-work-id="${w.id}"
                class="go-transform-btn py-2 px-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition cursor-pointer"
              >
                변형💡
              </button>
            ` : ''}

            ${showDelete ? `
              <button
                type="button"
                data-delete-work-id="${w.id}"
                class="delete-work-btn py-2 px-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition cursor-pointer"
                title="삭제"
              >
                삭제
              </button>
            ` : ''}
          </div>
        </article>
      `;
    }

    // 탭 3: 보관함(좋은소스) 변형 & 차기작 아이디어 생성기
    function renderVaultStudioTab() {
      const vaultWorks = state.works.filter((w) => w.extras?.includes('vault'));
      const candidates = vaultWorks.length ? vaultWorks : state.works;
      const plan = state.vaultStudio.generatedPlan;

      return `
        <section class="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-4 animate-fade-up">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold text-slate-900">💡 보관함 작품 변형 스튜디오</h2>
              <p class="text-xs text-slate-500 mt-0.5">보관함(좋은소스) 작품에 변형 아이디어를 조합해 차기작 가제목·소개안을 구상합니다.</p>
            </div>
            <button
              id="btn-open-drafts-modal"
              type="button"
              class="shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer"
            >
              저장안 (${state.savedDrafts.length})
            </button>
          </div>

          ${!vaultWorks.length && state.works.length ? `
            <div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
              현재 '보관함 (좋은소스)' 체크 작품이 없어 전체 등록 작품 중 선택해 테스트할 수 있습니다.
            </div>
          ` : ''}

          <!-- 1) 기준 작품 선택 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">1. 기준 소스 작품 선택</label>
            <select
              id="select-vault-work"
              class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-800"
            >
              ${candidates.map((w) => `
                <option value="${w.id}" ${w.id === state.vaultStudio.selectedWorkId ? 'selected' : ''}>
                  ${w.extras?.includes('vault') ? '💎 ' : ''}${escapeHtml(w.title)} (${escapeHtml(w.genre)})
                </option>
              `).join('')}
            </select>
          </div>

          <!-- 2) 변형 아이디어 복수 선택 -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-bold text-slate-700">2. 변형 아이디어 추가 (1개 이상 선택)</label>
              <button
                id="btn-regenerate-idea"
                type="button"
                class="px-2.5 py-1 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold flex items-center gap-1 shadow-2xs transition cursor-pointer"
              >
                <span>🔄 아이디어 재구성</span>
              </button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              ${VARIATION_IDEAS.map((idea) => {
                const active = state.vaultStudio.selectedIdeas.includes(idea.id);
                return `
                  <button
                    type="button"
                    data-idea-id="${idea.id}"
                    class="idea-toggle-btn p-2.5 rounded-xl border text-left transition cursor-pointer ${
                      active
                        ? 'bg-amber-50 border-amber-500 text-amber-950 ring-1 ring-amber-400'
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                    }"
                  >
                    <div class="text-xs font-bold flex items-center justify-between">
                      <span>${idea.icon} ${idea.label}</span>
                      <span>${active ? '✓' : '+'}</span>
                    </div>
                    <div class="text-[10px] text-slate-500 mt-0.5 line-clamp-1">${idea.hint}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 3) 생성된 가제목 및 작품소개 가안 -->
          ${plan ? `
            <div class="rounded-2xl bg-slate-900 text-white p-4 space-y-3.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-400">GENERATED CONCEPT DRAFT</span>
                <span class="text-[11px] text-slate-400">원본: ${escapeHtml(plan.sourceTitle)}</span>
              </div>

              <!-- 적용된 변형 조합 -->
              <div class="space-y-1.5 bg-slate-800/80 rounded-xl p-2.5">
                <div class="text-[11px] font-bold text-slate-300">적용된 변형 포인트</div>
                ${plan.twistLines.map((line) => `
                  <div class="text-xs text-amber-200">
                    <strong class="text-white">[${escapeHtml(line.label)}]</strong> ${escapeHtml(line.text)}
                  </div>
                `).join('')}
              </div>

              <!-- 가제목 추천 3종 -->
              <div>
                <div class="text-xs font-bold text-slate-200 mb-1.5">흥미로운 가제목 후보</div>
                <div class="space-y-1.5">
                  ${plan.candidateTitles.map((candTitle, idx) => `
                    <div class="flex items-center justify-between gap-2 bg-slate-800 rounded-xl px-3 py-2">
                      <span class="text-xs font-bold text-white">가제 ${idx + 1}. ${escapeHtml(candTitle)}</span>
                      <button
                        type="button"
                        data-copy-text="${escapeHtml(candTitle)}"
                        class="copy-btn shrink-0 px-2 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-[10px] font-semibold text-slate-200 cursor-pointer"
                      >
                        복사
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 매력적인 작품소개 가안 -->
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-xs font-bold text-slate-200">작품소개 가안</span>
                  <button
                    type="button"
                    data-copy-text="${escapeHtml(plan.pitchSynopsis)}"
                    class="copy-btn px-2 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-[10px] font-semibold text-slate-200 cursor-pointer"
                  >
                    소개 복사
                  </button>
                </div>
                <div class="bg-slate-800 rounded-xl p-3 text-xs text-slate-100 whitespace-pre-line leading-relaxed border border-slate-700">
                  ${escapeHtml(plan.pitchSynopsis)}
                </div>
              </div>

              <button
                id="btn-save-draft"
                type="button"
                class="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold transition cursor-pointer"
              >
                📌 이 차기작 기획안 보관하기
              </button>
            </div>
          ` : ''}
        </section>
      `;
    }

    // 탭 4: 달력 및 월별 통계 뷰
    function renderCalendarTab() {
      const { year, month, selectedDate } = state.calendar;
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthWorks = state.works.filter((w) => (w.createdAt || '').startsWith(monthPrefix));

      // 날짜별 등록 수 맵
      const countByDate = {};
      monthWorks.forEach((w) => {
        countByDate[w.createdAt] = (countByDate[w.createdAt] || 0) + 1;
      });

      // 월별 통계 계산
      const totalMonth = monthWorks.length;
      const todayBestCount = monthWorks.filter((w) => w.sources?.includes('today')).length;
      const newBestCount = monthWorks.filter((w) => w.sources?.includes('new')).length;
      const vaultMonthCount = monthWorks.filter((w) => w.extras?.includes('vault')).length;
      const read16Count = monthWorks.filter((w) => w.rating === 'read_16_plus').length;

      // 최다 등록일 계산
      let peakDateText = '기록 없음';
      const entries = Object.entries(countByDate);
      if (entries.length) {
        entries.sort((a, b) => b[1] - a[1]);
        peakDateText = `${entries[0][0]} (${entries[0][1]}편)`;
      }

      // 달력 그리드 계산
      const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0(일)~6(토)
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDateKey(new Date());

      const cells = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        cells.push(`<div class="h-14 rounded-xl bg-slate-50/50"></div>`);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cnt = countByDate[dateKey] || 0;
        const isSelected = dateKey === selectedDate;
        const isToday = dateKey === todayStr;

        cells.push(`
          <button
            type="button"
            data-cal-date="${dateKey}"
            class="cal-day-btn h-14 rounded-xl border p-1 flex flex-col items-center justify-between transition cursor-pointer ${
              isSelected
                ? 'bg-munpia-600 text-white border-munpia-600 shadow-xs'
                : cnt > 0
                  ? 'bg-munpia-50/70 border-munpia-200 text-slate-900 hover:bg-munpia-100/70'
                  : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'
            }"
          >
            <span class="text-[11px] font-bold ${isToday && !isSelected ? 'text-munpia-600 underline' : ''}">${day}</span>
            ${cnt > 0 ? `
              <span class="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${
                isSelected ? 'bg-amber-400 text-slate-950' : 'bg-munpia-600 text-white'
              }">
                ${cnt}편
              </span>
            ` : `
              <span class="text-[10px] ${isSelected ? 'text-munpia-200' : 'text-slate-300'}">-</span>
            `}
          </button>
        `);
      }

      const selectedDayWorks = state.works.filter((w) => w.createdAt === selectedDate);

      return `
        <!-- 월별 통계 카드 -->
        <section class="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-3 animate-fade-up">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-bold text-slate-900">📊 ${year}년 ${month + 1}월 등록 통계</h2>
            <span class="text-xs font-bold text-munpia-600">총 ${totalMonth}편</span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/60">
              <div class="text-[11px] text-slate-500">월간 등록 편수</div>
              <div class="text-lg font-extrabold text-slate-900 mt-0.5">${totalMonth}편</div>
              <div class="text-[10px] text-slate-500 mt-0.5">최다: ${peakDateText}</div>
            </div>
            <div class="p-3 rounded-xl bg-amber-50/80 border border-amber-200/80">
              <div class="text-[11px] text-amber-800">보관함 적립 / 16화+ 정독</div>
              <div class="text-lg font-extrabold text-amber-900 mt-0.5">💎 ${vaultMonthCount} · ⭐ ${read16Count}</div>
              <div class="text-[10px] text-amber-800 mt-0.5">투데이 ${todayBestCount} · 신규 ${newBestCount}</div>
            </div>
          </div>
        </section>

        <!-- 달력 뷰 -->
        <section class="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-3">
          <div class="flex items-center justify-between">
            <button id="btn-prev-month" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">◀ 이전</button>
            <div class="text-sm font-extrabold text-slate-900">${year}년 ${month + 1}월</div>
            <button id="btn-next-month" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">다음 ▶</button>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
            <span class="text-rose-500">일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span class="text-blue-500">토</span>
          </div>

          <div class="grid grid-cols-7 gap-1">
            ${cells.join('')}
          </div>
        </section>

        <!-- 선택 일자 등록 작품 목록 -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-xs font-bold text-slate-700">${selectedDate} 등록 작품 (${selectedDayWorks.length}편)</h3>
          </div>
          ${selectedDayWorks.length
            ? selectedDayWorks.map((w) => renderWorkCard(w, false)).join('')
            : `<div class="bg-white rounded-2xl p-5 text-center text-xs text-slate-400 border border-slate-200">선택한 날짜에 등록된 작품이 없습니다.</div>`
          }
        </section>
      `;
    }

    function renderAll() {
      renderHeaderSummary();
      renderNav();

      const mainEl = document.getElementById('main-content');
      if (state.activeTab === 'register') {
        mainEl.innerHTML = renderRegisterTab();
      } else if (state.activeTab === 'categories') {
        mainEl.innerHTML = renderCategoriesTab();
      } else if (state.activeTab === 'vault') {
        generateIdeaPlan();
        mainEl.innerHTML = renderVaultStudioTab();
      } else if (state.activeTab === 'calendar') {
        mainEl.innerHTML = renderCalendarTab();
      }

      bindDynamicEvents();
    }

    // =========================================================================
    // 8. 이벤트 바인딩
    // =========================================================================
    function syncFormInputsFromDom() {
      const titleEl = document.getElementById('input-title');
      const genreEl = document.getElementById('input-genre');
      const authorEl = document.getElementById('input-author');
      const epEl = document.getElementById('input-episodes');
      const viewsEl = document.getElementById('input-views');
      const synEl = document.getElementById('input-synopsis');
      const tagInpEl = document.getElementById('input-custom-tag');

      if (titleEl) state.form.title = titleEl.value;
      if (genreEl) state.form.genre = genreEl.value;
      if (authorEl) state.form.author = authorEl.value;
      if (epEl) state.form.totalEpisodes = Number(epEl.value) || 1;
      if (viewsEl) state.form.latestViews = viewsEl.value;
      if (synEl) state.form.synopsis = synEl.value;
      if (tagInpEl) state.form.customTagInput = tagInpEl.value;
    }

    function bindDynamicEvents() {
      // 베스트 구분 토글
      document.querySelectorAll('.source-toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncFormInputsFromDom();
          const src = btn.getAttribute('data-source');
          const list = state.form.sources;
          if (list.includes(src)) {
            if (list.length > 1) {
              state.form.sources = list.filter((x) => x !== src);
            } else {
              showToast('최소 1개 이상의 베스트 구분을 선택해야 합니다.', 'warning');
            }
          } else {
            state.form.sources = [...list, src];
          }
          renderAll();
        });
      });

      // 샘플 제목 칩 클릭 시 제목 입력 및 자동 정보 채움
      document.querySelectorAll('.sample-title-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          state.form.title = chip.getAttribute('data-sample-title') || '';
          renderAll();
          applyAutoMetadataToForm();
        });
      });

      // 자동입력 버튼
      document.getElementById('btn-auto-fill')?.addEventListener('click', () => {
        syncFormInputsFromDom();
        applyAutoMetadataToForm();
      });

      // 별점 4종 중 1개 선택
      document.querySelectorAll('.rating-select-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncFormInputsFromDom();
          state.form.rating = btn.getAttribute('data-rating-id');
          renderAll();
        });
      });

      // 추가 3종 중복 선택 토글
      document.querySelectorAll('.extra-toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncFormInputsFromDom();
          const id = btn.getAttribute('data-extra-id');
          if (state.form.extras.includes(id)) {
            state.form.extras = state.form.extras.filter((x) => x !== id);
          } else {
            state.form.extras = [...state.form.extras, id];
          }
          renderAll();
        });
      });

      // 태그 제거
      document.querySelectorAll('.remove-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncFormInputsFromDom();
          const target = btn.getAttribute('data-remove-tag');
          state.form.tags = state.form.tags.filter((t) => t !== target);
          renderAll();
        });
      });

      // 커스텀 태그 추가 & 태그 풀 저장
      document.getElementById('btn-add-custom-tag')?.addEventListener('click', () => {
        syncFormInputsFromDom();
        const rawTag = state.form.customTagInput.replace(/^#+/, '').trim();
        if (!rawTag) {
          showToast('추가할 태그를 입력해주세요.', 'warning');
          return;
        }
        if (state.form.tags.length >= 5 && !state.form.tags.includes(rawTag)) {
          showToast('작품당 태그는 최대 5개까지 설정할 수 있습니다.', 'warning');
          return;
        }
        if (!state.tagPool.includes(rawTag)) {
          state.tagPool = [rawTag, ...state.tagPool];
        }
        if (!state.form.tags.includes(rawTag)) {
          state.form.tags = [...state.form.tags, rawTag];
        }
        state.form.customTagInput = '';
        persistState();
        renderAll();
        showToast(`#${rawTag} 태그가 저장 및 적용되었습니다.`, 'success');
      });

      // 저장된 태그 풀 원클릭 추가/해제
      document.querySelectorAll('.pool-tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncFormInputsFromDom();
          const poolTag = btn.getAttribute('data-pool-tag');
          if (state.form.tags.includes(poolTag)) {
            state.form.tags = state.form.tags.filter((t) => t !== poolTag);
          } else {
            if (state.form.tags.length >= 5) {
              showToast('작품당 태그는 최대 5개까지 설정할 수 있습니다.', 'warning');
              return;
            }
            state.form.tags = [...state.form.tags, poolTag];
          }
          renderAll();
        });
      });

      // 작품 등록 제출
      document.getElementById('btn-submit-work')?.addEventListener('click', () => {
        syncFormInputsFromDom();
        const cleanTitle = state.form.title.trim();
        if (!cleanTitle) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }

        // 중복 체크
        const existing = state.works.find((w) => normalizeTitle(w.title) === normalizeTitle(cleanTitle));
        if (existing) {
          showToast('이미 등록된 작품입니다', 'warning', '확인하기', () => {
            state.activeTab = 'categories';
            state.categoryFilter.type = 'all';
            state.highlightWorkId = existing.id;
            renderAll();
          });
          return;
        }

        const newWork = {
          id: 'w-' + Date.now(),
          title: cleanTitle,
          sources: [...state.form.sources],
          genre: (state.form.genre || '판타지').trim(),
          author: (state.form.author || '작가 미상').trim(),
          synopsis: (state.form.synopsis || '').trim(),
          totalEpisodes: Number(state.form.totalEpisodes) || 1,
          latestViews: (state.form.latestViews || '0').trim(),
          rating: state.form.rating,
          extras: [...state.form.extras],
          tags: state.form.tags.slice(0, 5),
          createdAt: formatDateKey(new Date()),
        };

        state.works = [newWork, ...state.works];
        state.highlightWorkId = newWork.id;
        if (newWork.extras.includes('vault')) {
          state.vaultStudio.selectedWorkId = newWork.id;
        }

        // 폼 초기화
        state.form.title = '';
        state.form.author = '';
        state.form.synopsis = '';
        state.form.autoFilledNotice = '';
        state.form.tags = [];

        persistState();
        renderAll();
        showToast(`"${newWork.title}" 작품이 등록되었습니다!`, 'success');
      });

      document.getElementById('btn-go-all-categories')?.addEventListener('click', () => {
        state.activeTab = 'categories';
        renderAll();
      });

      // 카테고리 검색 및 필터
      document.getElementById('input-category-search')?.addEventListener('input', (e) => {
        state.categoryFilter.searchQuery = e.target.value;
        const mainEl = document.getElementById('main-content');
        mainEl.innerHTML = renderCategoriesTab();
        bindDynamicEvents();
        const reInput = document.getElementById('input-category-search');
        if (reInput) {
          reInput.focus();
          reInput.setSelectionRange(reInput.value.length, reInput.value.length);
        }
      });

      document.querySelectorAll('.cat-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.categoryFilter.type = btn.getAttribute('data-cat-type');
          renderAll();
        });
      });

      document.querySelectorAll('.sub-rating-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.categoryFilter.ratingId = btn.getAttribute('data-filter-rating-id');
          renderAll();
        });
      });

      // 카드 내 추가 뱃지 원클릭 토글
      document.querySelectorAll('.card-extra-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-card-extra-work');
          const extraId = btn.getAttribute('data-card-extra-id');
          state.works = state.works.map((w) => {
            if (w.id !== workId) return w;
            const current = Array.isArray(w.extras) ? w.extras : [];
            const nextExtras = current.includes(extraId)
              ? current.filter((x) => x !== extraId)
              : [...current, extraId];
            return { ...w, extras: nextExtras };
          });
          persistState();
          renderAll();
        });
      });

      // 문피아 앱 바로가기 버튼
      document.querySelectorAll('.munpia-open-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const t = btn.getAttribute('data-munpia-title') || '';
          openMunpiaApp(t);
        });
      });

      // 보관함 변형 탭 이동
      document.querySelectorAll('.go-transform-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const workId = btn.getAttribute('data-transform-work-id');
          state.vaultStudio.selectedWorkId = workId;
          state.vaultStudio.seed += 1;
          state.activeTab = 'vault';
          renderAll();
        });
      });

      // 작품 삭제
      document.querySelectorAll('.delete-work-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-work-id');
          state.works = state.works.filter((w) => w.id !== id);
          persistState();
          renderAll();
          showToast('작품이 삭제되었습니다.', 'info');
        });
      });

      // 보관함 변형 스튜디오 이벤트
      document.getElementById('select-vault-work')?.addEventListener('change', (e) => {
        state.vaultStudio.selectedWorkId = e.target.value;
        state.vaultStudio.seed += 1;
        renderAll();
      });

      document.querySelectorAll('.idea-toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const ideaId = btn.getAttribute('data-idea-id');
          const cur = state.vaultStudio.selectedIdeas;
          if (cur.includes(ideaId)) {
            if (cur.length > 1) {
              state.vaultStudio.selectedIdeas = cur.filter((x) => x !== ideaId);
            } else {
              showToast('최소 1개 이상의 변형 아이디어를 선택해주세요.', 'warning');
            }
          } else {
            state.vaultStudio.selectedIdeas = [...cur, ideaId];
          }
          renderAll();
        });
      });

      document.getElementById('btn-regenerate-idea')?.addEventListener('click', () => {
        state.vaultStudio.seed += 1;
        renderAll();
        showToast('새로운 변형 조합과 가제목·소개안을 재구성했습니다.', 'success');
      });

      document.querySelectorAll('.copy-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const text = btn.getAttribute('data-copy-text') || '';
          copyToClipboard(text);
        });
      });

      document.getElementById('btn-save-draft')?.addEventListener('click', () => {
        const plan = state.vaultStudio.generatedPlan;
        if (!plan) return;
        state.savedDrafts = [
          {
            id: 'd-' + Date.now(),
            savedAt: formatDateKey(new Date()),
            sourceTitle: plan.sourceTitle,
            title: plan.candidateTitles[0],
            synopsis: plan.pitchSynopsis,
          },
          ...state.savedDrafts,
        ];
        persistState();
        renderAll();
        showToast('차기작 기획안이 저장되었습니다.', 'success');
      });

      document.getElementById('btn-open-drafts-modal')?.addEventListener('click', openDraftsModal);

      // 달력 이벤트
      document.getElementById('btn-prev-month')?.addEventListener('click', () => {
        if (state.calendar.month === 0) {
          state.calendar.year -= 1;
          state.calendar.month = 11;
        } else {
          state.calendar.month -= 1;
        }
        renderAll();
      });

      document.getElementById('btn-next-month')?.addEventListener('click', () => {
        if (state.calendar.month === 11) {
          state.calendar.year += 1;
          state.calendar.month = 0;
        } else {
          state.calendar.month += 1;
        }
        renderAll();
      });

      document.querySelectorAll('.cal-day-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.calendar.selectedDate = btn.getAttribute('data-cal-date');
          renderAll();
        });
      });
    }

    function openDraftsModal() {
      const modal = document.getElementById('draft-modal');
      const listEl = document.getElementById('saved-drafts-list');

      if (!state.savedDrafts.length) {
        listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">저장된 차기작 기획안이 없습니다.</p>`;
      } else {
        listEl.innerHTML = state.savedDrafts.map((d) => `
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">
            <div class="flex items-center justify-between text-[11px] text-slate-500">
              <span>원본: ${escapeHtml(d.sourceTitle)}</span>
              <span>${escapeHtml(d.savedAt)}</span>
            </div>
            <div class="text-xs font-extrabold text-slate-900">${escapeHtml(d.title)}</div>
            <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed">${escapeHtml(d.synopsis)}</p>
          </div>
        `).join('');
      }
      modal.classList.remove('hidden');
    }

    function copyToClipboard(text) {
      if (!text) return;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('클립보드에 복사되었습니다.', 'success');
      } catch (err) {
        showToast('복사에 실패했습니다.', 'error');
      } finally {
        ta.remove();
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    // 9. 초기 바인딩 및 부트스트랩
    // =========================================================================
    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.getAttribute('data-tab');
        renderAll();
      });
    });

    document.getElementById('btn-reset-demo')?.addEventListener('click', () => {
      state.works = buildInitialWorks();
      state.tagPool = [...DEFAULT_TAG_POOL];
      state.savedDrafts = [];
      persistState();
      renderAll();
      showToast('초기 샘플 데이터로 복원되었습니다.', 'info');
    });

    document.getElementById('btn-close-draft-modal')?.addEventListener('click', () => {
      document.getElementById('draft-modal').classList.add('hidden');
    });

    document.getElementById('draft-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'draft-modal') {
        e.currentTarget.classList.add('hidden');
      }
    });

    loadState();
    renderAll();
  </script>
</body>
</html>
