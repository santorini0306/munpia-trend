<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>문피아 전략 노트</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans KR & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            emerald: {
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }

  <style>
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* 커스텀 스크롤바 숨김 및 슬림화 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .thin-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .thin-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    @keyframes bounceSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-bounce-slow {
      animation: bounceSlow 1.8s infinite ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900">

        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">

          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />

        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <span id="total-works-badge" class="text-xs font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full border border-indigo-100">
          총 0편
        </span>
      </div>
    </header>

    <!-- 메인 콘텐츠 영역 (하단 네비게이션 여백 확보) -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 pt-4 pb-24 space-y-4">
      <!-- JavaScript로 동적 렌더링 -->
    </main>

        <!-- 2. 조리실 -->

          <span id="badge-kitchen" class="hidden absolute top-1 right-2 w-4 h-4 rounded-full bg-emerald-500 text-white text-[9px] font-bold flex items-center justify-center">0</span>
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 00.495-7.467 5.99 5.99 0 00-1.925 3.546 5.974 5.974 0 01-2.133-1A3.75 3.75 0 0012 18z" />
          </svg>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState.works = Array.isArray(parsed.works) ? parsed.works : [];
          appState.savedTags = Array.isArray(parsed.savedTags) ? parsed.savedTags : appState.savedTags;
          appState.dishwashHistory = parsed.dishwashHistory || {};
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
    }

    function saveState() {
      try {
        const toSave = {
          works: appState.works,
          savedTags: appState.savedTags,
          dishwashHistory: appState.dishwashHistory
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
        updateHeaderBadges();
      } catch (e) {
        console.error('Failed to save state:', e);
        showToast('저장 공간이 부족할 수 있습니다.', '⚠️');
      }
    }

    /*************************************************************************
     * 4. 유틸리티 함수 (토스트, 클립보드, 날짜, 메달 뱃지 등)
     *************************************************************************/
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`"${text}" 제목이 복사되었습니다!`, '📋');
      } catch (err) {
        showToast('복사에 실패했습니다.', '❌');
      }
      document.body.removeChild(textarea);
    }

    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function normalizeTitle(t) {
      return (t || '').replace(/\s+/g, '').toLowerCase();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

      return `<span class="text-xs font-bold text-amber-600">${'🥄'.repeat(spoonCount)} (${spoonCount}숟가락)</span>`;
    }

    function updateHeaderBadges() {
      document.getElementById('total-works-badge').textContent = `총 ${appState.works.length}편`;
      const kitchenCount = appState.works.filter(w => w.stage === 'kitchen').length;
      const badgeK = document.getElementById('badge-kitchen');
      if (kitchenCount > 0) {
        badgeK.textContent = kitchenCount;
        badgeK.classList.remove('hidden');
      } else {
        badgeK.classList.add('hidden');
      }
    }

    function switchTab(tabName) {
      appState.activeTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.classList.remove('text-slate-500', 'hover:text-slate-800');
          btn.classList.add('text-indigo-600', 'bg-indigo-50/80');
        } else {
          btn.classList.add('text-slate-500', 'hover:text-slate-800');
          btn.classList.remove('text-indigo-600', 'bg-indigo-50/80');
        }
      });
      renderCurrentTab();
      document.getElementById('main-content').scrollTop = 0;
    }

    /*************************************************************************
     * 5. 중복 체크 팝업 제어
     *************************************************************************/
    function openDuplicateModal(existingWork) {
      const infoEl = document.getElementById('duplicate-work-info');
      const stageMap = {
        temp: '제품 등록 > 임시등록',
        kitchen: '조리실',
        pantry: '팬트리'
      };
      infoEl.innerHTML = `<strong class="text-indigo-700">"${escapeHtml(existingWork.title)}"</strong> 작품은<br/>현재 <strong>[${stageMap[existingWork.stage] || '보관함'}]</strong>에 등록되어 있어요!`;
      document.getElementById('duplicate-modal').classList.remove('hidden');
    }

    function closeDuplicateModal() {
      document.getElementById('duplicate-modal').classList.add('hidden');
    }

    /*************************************************************************
     * 6. 탭별 렌더링 메인 라우터
     *************************************************************************/
    function renderCurrentTab() {
      updateHeaderBadges();
      const main = document.getElementById('main-content');
      switch (appState.activeTab) {
        case 'register':
          main.innerHTML = renderRegisterTab();
          break;
        case 'kitchen':
          main.innerHTML = renderKitchenTab();
          break;
        case 'michelin':
          main.innerHTML = renderMichelinTab();
          break;
        case 'pantry':
          main.innerHTML = renderPantryTab();
          break;
        case 'drawer':
          main.innerHTML = renderDrawerTab();
          break;
        case 'dishwash':
          main.innerHTML = renderDishwashTab();
          break;
      }
    }

                <div>

                    placeholder="작가 필명 입력"

            <!-- 3단계: 미슐랭 선정 -->
            <div>

                  <span class="w-5 h-5 rounded-full bg-amber-500 text-white text-xs font-bold flex items-center justify-center">3</span>
                  <h3 class="text-sm font-extrabold text-slate-800">미슐랭 선정 (유료 전환 지표)</h3>

                    class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-xs font-bold bg-white focus:outline-none focus:border-amber-500">

                작품 등록하기
              </button>
            </div>
          </div>

          <!-- 하단 분류: [임시등록] 작품 목록 -->
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-amber-200/80">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 text-xs font-extrabold">임시등록</span>
                <h3 class="text-sm font-bold text-slate-800">라벨링 대기 작품 (${tempWorks.length})</h3>
              </div>
              <span class="text-[11px] text-slate-400">라벨링 완료 시 조리실 이동</span>

            ${tempWorks.length === 0 ? `

                <p class="text-xs text-slate-400 font-medium">현재 임시등록된 작품이 없습니다.</p>

                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-1.5 flex-wrap mb-1">
                        ${(w.sources || []).map(s => `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white text-indigo-600 border border-indigo-100">${s}</span>`).join('')}

                        ${w.author ? `<span class="text-[10px] text-slate-600 font-medium">${escapeHtml(w.author)}</span>` : `<span class="text-[10px] font-semibold text-amber-600">작가 미지정</span>`}
                      </div>
                      <p class="text-sm font-extrabold text-slate-900 truncate">${escapeHtml(w.title)}</p>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="openEditWorkModal('${w.id}', 'general')" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold shadow-2xs">
                        라벨링
                      </button>
                      <button onclick="confirmDeleteWork('${w.id}')" class="p-1.5 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100" title="삭제">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
