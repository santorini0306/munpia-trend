<!DOCTYPE html>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans KR & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    /* 커스텀 스크롤바 숨김 (모바일 앱 느낌) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 애니메이션 */
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes floatChef {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-chef {
      animation: floatChef 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-200/70">

  <!-- 모바일 프레임 컨테이너 -->
  <div id="app" class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl flex flex-col relative pb-24">
    
    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white text-xl shadow-sm">
          👨‍🍳
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight text-slate-900 leading-tight">쉐프 노트 <span class="text-xs font-semibold text-amber-600">Chef Note</span></h1>
          <p class="text-[11px] text-slate-500">문피아 트렌드 분석 & 차기작 레시피</p>
        </div>
      </div>
      <button onclick="openSampleLoader()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-2.5 py-1.5 rounded-lg transition">
        샘플 데이터
      </button>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main id="main-content" class="flex-1 px-4 py-4 space-y-4 overflow-x-hidden">
      <!-- 동적 렌더링 영역 -->
    </main>

    <!-- 하단 6대 카테고리 내비게이션 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur border-t border-slate-200 z-40 px-1 py-1.5 shadow-[0_-4px_12px_rgba(0,0,0,0.04)]">
      <div class="grid grid-cols-6 gap-0.5 text-center" id="bottom-nav">
        <!-- JS로 탭 버튼 렌더링 -->
      </div>
    </nav>

    <!-- 토스트 메시지 -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200">
      <div id="toast-msg" class="bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap">
        알림 메시지
      </div>
    </div>

    <!-- 모달 컨테이너 (중복 경고 캐릭터 팝업, 세부 수정, 확인 창 등) -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
      <div id="modal-box" class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden animate-pop max-h-[88vh] flex flex-col">
        <!-- 모달 내부 동적 렌더링 -->
      </div>
    </div>

  </div>

    function uid() {

    function getTodayStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    // 유틸리티: 토스트 알림
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-msg");
      toastMsg.textContent = msg;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2200);
    }

    // 유틸리티: 클립보드 복사 (iFrame 호환 execCommand 우선 사용)
    function copyToClipboard(text, successMsg = "클립보드에 복사되었습니다!") {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand("copy");
        showToast(successMsg);
      } catch (err) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => showToast(successMsg));
        }
      }
      document.body.removeChild(textarea);
    }

            <h3 class="text-base font-extrabold text-slate-900">이미 등록된 작품입니다!</h3>
            <p class="text-xs text-slate-500 leading-relaxed">
              쉐프님의 노트에 <span class="font-bold text-amber-600">'${escapeHtml(existingNovel.title)}'</span> 작품이<br/>이미 재료 창고에 들어있어요!
            </p>
            <div class="inline-block mt-1 px-3 py-1 rounded-full bg-slate-100 text-[11px] font-medium text-slate-600">
              현재 위치: ${getNovelLocationText(existingNovel)}
            </div>
          </div>
          <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold transition">
            알겠어요!
          </button>
        </div>
      `);
    }

    function getNovelLocationText(novel) {
      if (novel.isTemp) return "📝 제품 등록 (임시등록)";
      if (!novel.kitchenDone) return "🍳 조리실";
      if (novel.inCooking && !novel.cookingDone) return "🧪 레시피분석 & 🗄️ 팬트리";
      if (!novel.michelinDone) return "🏅 미슐랭 & 🗄️ 팬트리";
      return "🗄️ 팬트리";
    }

    function handleRegisterSubmit(forceTemp) {
      const titleInput = document.getElementById("reg-title");
      const authorInput = document.getElementById("reg-author");
      const sourceEl = document.querySelector('input[name="regSource"]:checked');
      const genreEl = document.querySelector('input[name="regGenre"]:checked');

      const title = titleInput.value.trim();
      if (!title) {
        showToast("작품 제목을 입력해 주세요!");
        titleInput.focus();
        return;
      }

      // 중복 체크 (공백/대소문자 무시 비교)
      const normalized = title.replace(/\s+/g, "").toLowerCase();
      const duplicate = state.novels.find(n => n.title.replace(/\s+/g, "").toLowerCase() === normalized);
      if (duplicate) {
        showDuplicateChefPopup(duplicate);
        return;
      }

      const source = sourceEl ? sourceEl.value : "투데이 베스트";
      const genre = forceTemp ? "" : (genreEl ? genreEl.value : "");
      const author = forceTemp ? "" : authorInput.value.trim();

      // 장르와 작가명이 모두 채워졌을 때만 라벨링 완료(조리실 이동)
      const isComplete = Boolean(genre && author);

      const newNovel = {
        id: uid(),
        title,
        source,
        genre,
        author,
        isTemp: !isComplete,
        createdAt: getTodayStr(),
        timestamp: Date.now(),
        // 조리실 필드 (기본값: ☆☆☆☆ 미지정 '0')
        rating: "0",
        kitchenFlags: [], // legend, supernormal, cook, fridge
        tags: [],
        kitchenDone: false,
        // 레시피분석 필드
        inCooking: false,
        cookingDone: false,
        originSettings: {
          genre: [],
          background: [],
          protagonist: [],
          ability: [],
          goal: [],
          conflict: [],
          growth: []
        },
        // 미슐랭 필드
        michelinTier: "분석 전",
        conversionRate: "",
        freeLastEpisode: "",
        michelinDone: false,
        // 팬트리 필드
        inPantry: false
      };

      state.novels.unshift(newNovel);
      saveState();
      renderAll();

      if (isComplete) {
        showToast("라벨링 완료! '조리실'로 이동했습니다 🍳");
      } else {
        showToast("[임시등록]으로 저장되었습니다 📌");
      }
    }

    // 임시등록 작품 수정 및 라벨링 완료 모달
    function openEditTempModal(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      openModal(`
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-sm font-bold text-slate-900">임시등록 작품 수정 & 라벨링</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
        </div>
        <div class="p-4 space-y-3 overflow-y-auto">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">출처</label>
            <div class="grid grid-cols-3 gap-1.5">
              ${SOURCE_LIST.map(src => `
                <label class="cursor-pointer">
                  <input type="radio" name="editTempSource" value="${src}" class="peer hidden" ${novel.source === src ? "checked" : ""}>
                  <div class="text-center py-1.5 rounded-lg border border-slate-200 text-xs font-medium peer-checked:bg-amber-500 peer-checked:text-white">
                    ${src}
                  </div>
                </label>
              `).join("")}

          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">작품 제목</label>
            <input id="edit-temp-title" type="text" value="${escapeHtml(novel.title)}"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">장르 선택 (조리실 이동 필수)</label>
            <div class="grid grid-cols-4 gap-1.5">
              ${GENRE_LIST.map(g => `
                <label class="cursor-pointer">
                  <input type="radio" name="editTempGenre" value="${g}" class="peer hidden" ${novel.genre === g ? "checked" : ""}>
                  <div class="text-center py-1.5 rounded-lg border border-slate-200 text-[11px] font-medium peer-checked:bg-slate-800 peer-checked:text-white truncate">
                    ${g}
                  </div>
                </label>
              `).join("")}
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">작가명 (조리실 이동 필수)</label>
            <input id="edit-temp-author" type="text" value="${escapeHtml(novel.author)}" placeholder="작가명을 입력하세요"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
          </div>
        </div>
        <div class="p-4 border-t border-slate-200 flex gap-2">
          <button onclick="confirmDeleteNovel('${novel.id}', true)" class="px-3 py-2.5 rounded-xl bg-rose-50 text-rose-600 text-xs font-bold">삭제</button>
          <button onclick="saveEditTempModal('${novel.id}')" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-white text-xs font-bold">저장하기</button>
        </div>
      `);
    }

    function saveEditTempModal(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      const newTitle = document.getElementById("edit-temp-title").value.trim();
      if (!newTitle) {
        showToast("제목을 입력해 주세요.");
        return;
      }

      // 다른 작품과 중복 제목 체크
      const normalized = newTitle.replace(/\s+/g, "").toLowerCase();
      const dup = state.novels.find(n => n.id !== id && n.title.replace(/\s+/g, "").toLowerCase() === normalized);
      if (dup) {
        closeModal();
        showDuplicateChefPopup(dup);
        return;
      }

      const srcEl = document.querySelector('input[name="editTempSource"]:checked');
      const genEl = document.querySelector('input[name="editTempGenre"]:checked');
      const newAuthor = document.getElementById("edit-temp-author").value.trim();

      novel.title = newTitle;
      novel.source = srcEl ? srcEl.value : novel.source;
      novel.genre = genEl ? genEl.value : "";
      novel.author = newAuthor;

      if (novel.genre && novel.author) {
        novel.isTemp = false;
        showToast("라벨링이 완료되어 '조리실'로 이동했습니다! 🍳");
      } else {
        novel.isTemp = true;
        showToast("임시등록 정보가 수정되었습니다.");
      }

      saveState();
      closeModal();
      renderAll();
    }

    /*************************************************************************
     * 5. 카테고리 2: 🍳 조리실
     *************************************************************************/
    function renderKitchenTab() {
      const kitchenNovels = state.novels.filter(n => !n.isTemp && !n.kitchenDone);

      return `
        <div class="flex items-center justify-between px-1">
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
            <span>🍳</span> 조리실 : 시식 및 평가
            <span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 text-xs font-bold">${kitchenNovels.length}</span>
          </h2>
          <span class="text-[11px] text-slate-400">이동 완료 시 목록에서 숨김</span>
        </div>

        ${kitchenNovels.length === 0 ? `
          <div class="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-300 space-y-2">
            <div class="text-3xl">🍳</div>
            <p class="text-sm font-bold text-slate-700">조리실이 비어 있습니다</p>
            <p class="text-xs text-slate-400">제품 등록에서 장르와 작가명을 입력하면 이곳으로 이동합니다.</p>
          </div>
        ` : kitchenNovels.map(novel => `
          <article class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3.5">
            <!-- 상단 작품 정보 & 문피아 제목 자동복사 -->
            <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
              <div class="space-y-1">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="px-2 py-0.5 rounded-md bg-slate-800 text-white text-[10px] font-bold">${escapeHtml(novel.genre)}</span>
                  <span class="px-2 py-0.5 rounded-md bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-semibold">${escapeHtml(novel.source)}</span>
                </div>
                <h3 class="text-base font-extrabold text-slate-900 leading-snug">${escapeHtml(novel.title)}</h3>
                <p class="text-xs text-slate-500">작가: <span class="font-semibold text-slate-700">${escapeHtml(novel.author)}</span></p>
              </div>
              <div class="flex flex-col gap-1.5 shrink-0">
                <button onclick="copyToClipboard('${escapeAttr(novel.title)}', '문피아 검색용 제목이 복사되었습니다!')"
                  class="px-2.5 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-[11px] font-bold flex items-center gap-1 transition">
                  📋 제목 복사
                </button>
                <button onclick="confirmDeleteNovel('${novel.id}')"
                  class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-[11px] font-semibold transition">
                  삭제
                </button>
              </div>
            </div>
            <!-- 1) 별점 5종 택1 (기본값: ☆☆☆☆ 미지정) -->
            <div class="space-y-1.5">
              <div class="text-xs font-bold text-slate-700">1. 작품 별점 (택 1)</div>
              <div class="grid grid-cols-1 gap-1.5">
                ${RATING_OPTIONS.map(opt => {
                  const currentRating = novel.rating || "0";
                  const selected = currentRating === opt.id;
                  return `
                    <button onclick="setNovelRating('${novel.id}', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-xl border text-xs font-semibold transition flex items-center justify-between ${selected ? 'bg-amber-500 text-white border-amber-500 shadow-xs' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                      <span>${opt.label}</span>
                      <span>${selected ? '✔' : ''}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>

            <!-- 2) 추가 항목 4종 중복 선택 -->
            <div class="space-y-1.5">
              <div class="text-xs font-bold text-slate-700">2. 분류 체크 (중복 선택 가능)</div>
              <div class="grid grid-cols-2 gap-1.5">
                ${KITCHEN_FLAGS.map(flag => {
                  const active = novel.kitchenFlags.includes(flag.id);
                  return `
                    <button onclick="toggleNovelFlag('${novel.id}', '${flag.id}')"
                      class="px-2.5 py-2 rounded-xl border text-left text-xs font-bold transition flex items-center justify-between ${active ? flag.color + ' ring-1 ring-offset-1 ring-slate-400' : 'bg-white text-slate-500 border-slate-200'}">
                      <span class="truncate">${flag.label}</span>
                      <span class="ml-1">${active ? '☑' : '☐'}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>

            <!-- 3) 작품별 태그 (약 5개 입력 및 기존 태그 풀 원터치 선택) -->
            <div class="space-y-2 pt-1 border-t border-slate-100">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700">3. 작품 태그 (${novel.tags.length}/5개 권장)</span>
                <span class="text-[10px] text-slate-400">저장된 태그는 재사용 가능</span>
              </div>

              <!-- 현재 적용된 태그 -->
              <div class="flex flex-wrap gap-1.5 min-h-[26px]">
                ${novel.tags.map(tag => `
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-800 text-white text-[11px] font-medium">
                    #${escapeHtml(tag)}
                    <button onclick="removeNovelTag('${novel.id}', '${escapeAttr(tag)}')" class="text-slate-300 hover:text-white ml-0.5">✕</button>
                  </span>
                `).join("")}
              </div>

              <!-- 태그 직접 입력 -->
              <div class="flex gap-1.5">
                <input id="tag-input-${novel.id}" type="text" placeholder="새 태그 입력 (예: 회귀, 사이다)"
                  onkeydown="if(event.key==='Enter'){ addNovelTagFromInput('${novel.id}'); }"
                  class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400" />
                <button onclick="addNovelTagFromInput('${novel.id}')"
                  class="px-3 py-2 rounded-xl bg-slate-700 text-white text-xs font-bold hover:bg-slate-800">
                  추가
                </button>
              </div>

              <!-- 저장된 태그 풀에서 원터치 선택 -->
              ${state.tagPool.length > 0 ? `
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/70 space-y-1">
                  <div class="text-[10px] font-semibold text-slate-500">저장된 태그 빠른 선택 (터치하여 추가):</div>
                  <div class="flex flex-wrap gap-1">
                    ${state.tagPool.map(t => {
                      const already = novel.tags.includes(t);
                      return `
                        <button onclick="togglePoolTag('${novel.id}', '${escapeAttr(t)}')"
                          class="px-2 py-0.5 rounded-md text-[11px] border transition ${already ? 'bg-amber-100 border-amber-300 text-amber-800 font-bold' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'}">
                          #${escapeHtml(t)}
                        </button>
                      `;
                    }).join("")}
                  </div>
                </div>
              ` : ""}
            </div>

            <!-- 조리 완료 버튼 -->
            <div class="pt-2">
              <button onclick="completeKitchenStage('${novel.id}')"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white text-xs font-extrabold shadow-sm transition">
                ${novel.kitchenFlags.includes("cook")
                  ? "조리 완료 → 🧪 레시피분석 & 🗄️ 팬트리로 이동"
                  : "조리 완료 → 🗄️ 팬트리(및 🏅 미슐랭)로 이동"}
              </button>
            </div>
          </article>
        `).join("")}
      `;
    }

    function setNovelRating(id, ratingId) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel.rating = ratingId;
      saveState();
      renderAll();
    }

    function toggleNovelFlag(id, flagId) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      const idx = novel.kitchenFlags.indexOf(flagId);
      if (idx > -1) novel.kitchenFlags.splice(idx, 1);
      else novel.kitchenFlags.push(flagId);
      saveState();
      renderAll();
    }

    function addNovelTagFromInput(id) {
      const input = document.getElementById(`tag-input-${id}`);
      if (!input) return;
      const rawTag = input.value.trim().replace(/^#/, "");
      if (!rawTag) return;

      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      if (!novel.tags.includes(rawTag)) {
        novel.tags.push(rawTag);
      }
      if (!state.tagPool.includes(rawTag)) {
        state.tagPool.unshift(rawTag);
      }
      input.value = "";
      saveState();
      renderAll();
    }

    function togglePoolTag(id, tag) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      const idx = novel.tags.indexOf(tag);
      if (idx > -1) novel.tags.splice(idx, 1);
      else novel.tags.push(tag);
      saveState();
      renderAll();
    }

    function removeNovelTag(id, tag) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel.tags = novel.tags.filter(t => t !== tag);
      saveState();
      renderAll();
    }

    function completeKitchenStage(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      if (!novel.rating) {
        novel.rating = "0";
      }

      novel.kitchenDone = true;
      novel.inPantry = true;
      if (novel.kitchenFlags.includes("cook")) {
        novel.inCooking = true;
        novel.cookingDone = false;
        showToast("조리 완료! '레시피분석'과 '팬트리'로 이동되었습니다 🧪");
      } else {
        novel.inCooking = false;
        showToast("조리 완료! '팬트리' 및 '미슐랭'으로 이동되었습니다 🗄️");
      }

      saveState();
      renderAll();
    }

    /*************************************************************************
     * 6. 카테고리 5: 🧪 레시피분석 (메타데이터 그래프, 원본 설정값, 창작마당)
     *************************************************************************/
    function renderCookingTab() {
      const cookingNovels = state.novels.filter(n => n.inCooking && !n.cookingDone);
      // 선택된 작품 유효성 확인
      if (cookingNovels.length > 0 && !cookingNovels.some(n => n.id === state.cookingSelectedNovelId)) {
        state.cookingSelectedNovelId = cookingNovels[0].id;
      } else if (cookingNovels.length === 0) {
        state.cookingSelectedNovelId = null;
      }

      const selectedNovel = cookingNovels.find(n => n.id === state.cookingSelectedNovelId);

      // 메타데이터: 전체 등록 작품 장르 분포 계산
      const totalNovelsCount = state.novels.length;
      const genreCounts = {};
      GENRE_LIST.forEach(g => genreCounts[g] = 0);
      state.novels.forEach(n => {
        if (n.genre && genreCounts[n.genre] !== undefined) genreCounts[n.genre]++;
        else if (n.genre) genreCounts["기타"]++;
      });
      const sortedGenres = Object.entries(genreCounts)
        .filter(([, cnt]) => cnt > 0)
        .sort((a, b) => b[1] - a[1]);
      const maxGenreCnt = sortedGenres.length > 0 ? sortedGenres[0][1] : 1;

      return `
        <!-- 상단 [메타데이터] 장르 취향 그래프 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>📊</span> [메타데이터] 내 웹소설 장르 취향 분석
            </h2>
            <span class="text-[11px] font-semibold text-amber-600">총 ${totalNovelsCount}편 기준</span>
          </div>

          ${sortedGenres.length === 0 ? `
            <p class="text-xs text-slate-400 text-center py-3">등록된 장르 데이터가 쌓이면 취향 그래프가 자동 생성됩니다.</p>
          ` : `
            <div class="space-y-2">
              ${sortedGenres.map(([g, cnt], idx) => {
                const pct = Math.round((cnt / totalNovelsCount) * 100);
                const widthPct = Math.max(12, Math.round((cnt / maxGenreCnt) * 100));
                const barColors = [
                  "bg-gradient-to-r from-amber-500 to-orange-500",
                  "bg-gradient-to-r from-blue-500 to-indigo-500",
                  "bg-gradient-to-r from-emerald-500 to-teal-500",
                  "bg-gradient-to-r from-purple-500 to-pink-500",
                  "bg-slate-600"
                ];
                const colorClass = barColors[Math.min(idx, barColors.length - 1)];
                return `
                  <div class="space-y-0.5">
                    <div class="flex justify-between text-[11px] font-semibold">
                      <span class="text-slate-700">${idx === 0 ? '👑 ' : ''}${g}</span>
                      <span class="text-slate-500">${cnt}편 (${pct}%)</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                      <div class="h-full ${colorClass} rounded-full transition-all duration-500" style="width: ${widthPct}%"></div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `}
        </section>

        <!-- 레시피분석 대상 작품 선택 및 원본값 설정 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3.5">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>🧪</span> 레시피분석 : 원본값 해체
            </h2>
            <span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">${cookingNovels.length}편</span>
          </div>

          ${cookingNovels.length === 0 ? `
            <div class="p-6 text-center border border-dashed border-slate-300 rounded-xl space-y-1.5">
              <p class="text-xs font-bold text-slate-600">분석할 작품(좋은소스)이 없습니다.</p>
              <p class="text-[11px] text-slate-400">조리실에서 '레시피분석 (좋은소스)'를 체크하거나 팬트리에서 다시 보낼 수 있어요.</p>
            </div>
          ` : `
            <!-- 작품 선택 버튼 리스트 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">분석할 작품 선택</label>
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                ${cookingNovels.map(n => {
                  const isSel = n.id === selectedNovel.id;
                  return `
                    <button onclick="selectCookingNovel('${n.id}')"
                      class="shrink-0 px-3 py-2 rounded-xl border text-xs font-bold transition ${isSel ? 'bg-amber-500 text-white border-amber-500 shadow-xs' : 'bg-slate-50 text-slate-700 border-slate-200'}">
                      ${escapeHtml(n.title)}
                    </button>
                  `;
                }).join("")}
              </div>
            </div>

            ${selectedNovel ? renderOriginSettingsSection(selectedNovel) : ""}
          `}
        </section>

        <!-- 하단 [창작마당] 영역 (원본값 기반 + 변동값 수동/랜덤 변형) -->
        ${renderRecipeAnalysisSection(selectedNovel)}
      `;
    }

    function selectCookingNovel(id) {
      state.cookingSelectedNovelId = id;
      state.cookingOriginMode = false;
      renderAll();
    }

    function toggleOriginSettingsMode() {
      state.cookingOriginMode = !state.cookingOriginMode;
      renderAll();
    }

    // 원본 설정값 섹션 렌더링
    function renderOriginSettingsSection(novel) {
      if (!novel.originSettings) {
        novel.originSettings = { genre: [], background: [], protagonist: [], ability: [], goal: [], conflict: [], growth: [] };
      }

      // 선택된 모든 원본 설정값 요약
      const allSelectedBadges = [];
      Object.entries(RECIPE_TAXONOMY).forEach(([dimKey, dimObj]) => {
        const list = novel.originSettings[dimKey] || [];
        list.forEach(item => {
          allSelectedBadges.push({ dimKey, dimLabel: dimObj.label.split(" ")[1], item });
        });
      });

      const activeDimObj = RECIPE_TAXONOMY[state.cookingActiveDim];
      const groupNames = Object.keys(activeDimObj.groups);
      if (!state.cookingExpandedGroup || !activeDimObj.groups[state.cookingExpandedGroup]) {
        state.cookingExpandedGroup = groupNames[0];
      }

      const currentItems = activeDimObj.groups[state.cookingExpandedGroup] || [];
      const query = state.cookingSearchQuery.trim().toLowerCase();
      const filteredItems = query ? currentItems.filter(i => i.toLowerCase().includes(query)) : currentItems;

      return `
        <div class="bg-amber-50/50 border border-amber-200 rounded-xl p-3 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <div class="text-xs font-bold text-slate-900">${escapeHtml(novel.title)}</div>
              <div class="text-[11px] text-slate-500">${escapeHtml(novel.genre)} · ${escapeHtml(novel.author)}</div>
            </div>
            <button onclick="toggleOriginSettingsMode()"
              class="px-3 py-2 rounded-xl text-xs font-extrabold transition shadow-xs ${state.cookingOriginMode ? 'bg-slate-800 text-white' : 'bg-amber-500 text-white hover:bg-amber-600'}">
              ${state.cookingOriginMode ? '설정창 접기 ▲' : '⚙️ 원본 설정하기'}
            </button>
          </div>

          <!-- 현재 선택된 원본 설정값 태그 모음 -->
          <div class="space-y-1">
            <div class="text-[11px] font-semibold text-slate-600">적용된 원본 설정값 (${allSelectedBadges.length}개):</div>
            ${allSelectedBadges.length === 0 ? `
              <p class="text-[11px] text-slate-400">아직 선택된 원본 설정값이 없습니다. (선택 사항)</p>
            ` : `
              <div class="flex flex-wrap gap-1 max-h-28 overflow-y-auto">
                ${allSelectedBadges.map(b => `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-white border border-amber-300 text-[11px] text-slate-800 font-medium">
                    <span class="text-[9px] text-amber-600 font-bold">[${b.dimLabel}]</span>${escapeHtml(b.item)}
                    <button onclick="toggleOriginItem('${novel.id}', '${b.dimKey}', '${escapeAttr(b.item)}')" class="text-slate-400 hover:text-rose-500">✕</button>
                  </span>
                `).join("")}
              </div>
            `}
          </div>

          <!-- 원본 설정하기 계층 선택 UI -->
          ${state.cookingOriginMode ? `
            <div class="bg-white rounded-xl p-3 border border-slate-200 space-y-3 animate-pop">
              <div class="text-[11px] text-slate-500">
                💡 <b>큰 계열</b>만 선택하거나, 아래 <b>세부 항목</b>을 펼쳐서 중복 선택할 수 있습니다.
              </div>

              <!-- 7대 영역 탭 -->
              <div class="flex gap-1 overflow-x-auto no-scrollbar pb-1">
                ${Object.entries(RECIPE_TAXONOMY).map(([k, v]) => {
                  const cnt = (novel.originSettings[k] || []).length;
                  const act = state.cookingActiveDim === k;
                  return `
                    <button onclick="setCookingDim('${k}')"
                      class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${act ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                      ${v.icon} ${v.label.split(" ")[1]} ${cnt > 0 ? `(${cnt})` : ""}
                    </button>
                  `;
                }).join("")}
              </div>

              <!-- 큰 계열 목록 (큰 계열 자체 선택 버튼 + 세부 펼치기) -->
              <div class="space-y-1.5">
                <div class="text-[11px] font-bold text-slate-700">큰 계열 선택 (터치 시 세부항목 보기 / 체크 시 계열 자체 선택):</div>
                <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1 bg-slate-50 rounded-lg">
                  ${groupNames.map(gName => {
                    const isGroupSelected = (novel.originSettings[state.cookingActiveDim] || []).includes(gName);
                    const isExpanded = state.cookingExpandedGroup === gName;
                    return `
                      <div class="inline-flex items-center rounded-lg border overflow-hidden ${isExpanded ? 'border-amber-500 ring-1 ring-amber-400' : 'border-slate-300'} bg-white">
                        <button onclick="toggleOriginItem('${novel.id}', '${state.cookingActiveDim}', '${escapeAttr(gName)}')"
                          title="큰 계열 자체 선택"
                          class="px-2 py-1 text-[11px] font-bold transition ${isGroupSelected ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">
                          ${isGroupSelected ? '✔' : '+'}
                        </button>
                        <button onclick="setCookingGroup('${escapeAttr(gName)}')"
                          class="px-2 py-1 text-[11px] font-semibold ${isExpanded ? 'text-amber-700 bg-amber-50' : 'text-slate-700'}">
                          ${escapeHtml(gName)}
                        </button>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>

              <!-- 세부 항목 검색 및 다중 선택 -->
              <div class="space-y-2 pt-2 border-t border-slate-100">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[11px] font-bold text-amber-800 truncate">└ ${escapeHtml(state.cookingExpandedGroup)} 세부 항목</span>
                  <input type="text" value="${escapeHtml(state.cookingSearchQuery)}"
                    oninput="updateCookingSearch(this.value)"
                    placeholder="세부 키워드 필터..."
                    class="w-32 px-2 py-1 rounded-lg border border-slate-300 text-[11px]" />
                </div>
                <div class="flex flex-wrap gap-1.5 max-h-44 overflow-y-auto p-1">
                  ${filteredItems.map(item => {
                    const checked = (novel.originSettings[state.cookingActiveDim] || []).includes(item);
                    return `
                      <button onclick="toggleOriginItem('${novel.id}', '${state.cookingActiveDim}', '${escapeAttr(item)}')"
                        class="px-2.5 py-1 rounded-full text-[11px] border transition ${checked ? 'bg-amber-500 text-white border-amber-500 font-bold shadow-2xs' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                        ${escapeHtml(item)}
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>
            </div>
          ` : ""}

          <!-- 분석완료 버튼 -->
          <div class="pt-1">
            <button onclick="completeCookingNovel('${novel.id}')"
              class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold transition shadow-xs">
              ✅ 분석완료 (레시피분석 목록에서 숨김)
            </button>
          </div>
        </div>
      `;
    }

    function setCookingDim(dimKey) {
      state.cookingActiveDim = dimKey;
      state.cookingExpandedGroup = Object.keys(RECIPE_TAXONOMY[dimKey].groups)[0];
      state.cookingSearchQuery = "";
      renderAll();
    }

    function setCookingGroup(groupName) {
      state.cookingExpandedGroup = groupName;
      state.cookingSearchQuery = "";
      renderAll();
    }

    function updateCookingSearch(val) {
      state.cookingSearchQuery = val;
      renderAll();
    }

    function toggleOriginItem(novelId, dimKey, item) {
      const novel = state.novels.find(n => n.id === novelId);
      if (!novel) return;
      if (!novel.originSettings) novel.originSettings = {};
      if (!Array.isArray(novel.originSettings[dimKey])) novel.originSettings[dimKey] = [];

      const arr = novel.originSettings[dimKey];
      const idx = arr.indexOf(item);
      if (idx > -1) arr.splice(idx, 1);
      else arr.push(item);

      saveState();
      renderAll();
    }

    function completeCookingNovel(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel.cookingDone = true;
      saveState();
      renderAll();
      showToast("분석완료 처리되어 레시피분석 목록에서 숨겨졌습니다! 🧪");
    }

    // 하단 [창작마당] 섹션
    function renderRecipeAnalysisSection(selectedNovel) {
      const varDimObj = RECIPE_TAXONOMY[state.recipeVarDim];
      const varGroups = Object.keys(varDimObj.groups);
      if (!state.recipeVarGroup || !varDimObj.groups[state.recipeVarGroup]) {
        state.recipeVarGroup = varGroups[0];
      }
      const varItems = varDimObj.groups[state.recipeVarGroup] || [];

      // 원본 + 변동값 통합 기획 문장 생성
      const summarySentence = buildRecipeSummarySentence(selectedNovel);

      return `
        <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white rounded-2xl p-4 shadow-lg space-y-3.5">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-extrabold flex items-center gap-1.5 text-amber-400">
                <span>💡</span> 창작마당 (차기작 아이디어 변형)
              </h3>
              <p class="text-[11px] text-slate-300">원본값 기본 + 변동값(수동/랜덤)으로 새로운 레시피 구상</p>
            </div>
            <div class="flex gap-1.5">
              <button onclick="randomizeRecipeVariations()"
                class="px-2.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold transition shadow-sm">
                🎲 랜덤 변형
              </button>
              <button onclick="resetRecipeVariations()"
                class="px-2.5 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold transition">
                ↺ 재설정
              </button>
            </div>
          </div>

          <!-- 변동값 수동 선택기 -->
          <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-3 space-y-2.5">
            <div class="text-[11px] font-bold text-amber-300">변동값 추가/선택 (버튼식 수동 조작):</div>
            
            <!-- 7대 영역 선택 -->
            <div class="flex gap-1 overflow-x-auto no-scrollbar pb-1">
              ${Object.entries(RECIPE_TAXONOMY).map(([k, v]) => {
                const cnt = (state.recipeVariations[k] || []).length;
                const act = state.recipeVarDim === k;
                return `
                  <button onclick="setRecipeVarDim('${k}')"
                    class="shrink-0 px-2 py-1 rounded-lg text-[11px] font-bold border transition ${act ? 'bg-amber-500 text-slate-950 border-amber-500' : 'bg-slate-900 text-slate-300 border-slate-700'}">
                    ${v.icon} ${v.label.split(" ")[1]} ${cnt > 0 ? `(+${cnt})` : ""}
                  </button>
                `;
              }).join("")}
            </div>

            <!-- 계열 선택 -->
            <div class="flex gap-1 overflow-x-auto no-scrollbar pb-1">
              ${varGroups.map(g => {
                const act = state.recipeVarGroup === g;
                return `
                  <button onclick="setRecipeVarGroup('${escapeAttr(g)}')"
                    class="shrink-0 px-2 py-1 rounded-md text-[10px] font-semibold transition ${act ? 'bg-slate-600 text-white' : 'bg-slate-900/60 text-slate-400'}">
                    ${escapeHtml(g)}
                  </button>
                `;
              }).join("")}
            </div>

            <!-- 세부 변동 키워드 버튼들 -->
            <div class="flex flex-wrap gap-1 max-h-32 overflow-y-auto p-1 bg-slate-900/60 rounded-lg">
              ${varItems.map(item => {
                const active = (state.recipeVariations[state.recipeVarDim] || []).includes(item);
                return `
                  <button onclick="toggleRecipeVarItem('${state.recipeVarDim}', '${escapeAttr(item)}')"
                    class="px-2 py-1 rounded-full text-[11px] transition ${active ? 'bg-amber-400 text-slate-950 font-extrabold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    ${active ? '★ ' : '+ '}${escapeHtml(item)}
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- 조합된 차기작 기획 문장 출력 및 복사 -->
          <div class="bg-slate-950/80 border border-slate-700 rounded-xl p-3 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-emerald-400">📝 창작마당 정리 문장 (메모장 붙여넣기용)</span>
              <button onclick="copyRecipeSummary()"
                class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold transition flex items-center gap-1">
                📋 복사하기
              </button>
            </div>
            <div id="recipe-summary-box" class="text-xs text-slate-200 leading-relaxed whitespace-pre-line bg-slate-900 p-3 rounded-lg border border-slate-800">
${escapeHtml(summarySentence)}
            </div>
          </div>
        </section>
      `;
    }

    function setRecipeVarDim(dim) {
      state.recipeVarDim = dim;
      state.recipeVarGroup = Object.keys(RECIPE_TAXONOMY[dim].groups)[0];
      renderAll();
    }

    function setRecipeVarGroup(g) {
      state.recipeVarGroup = g;
      renderAll();
    }

    function toggleRecipeVarItem(dim, item) {
      const arr = state.recipeVariations[dim];
      const idx = arr.indexOf(item);
      if (idx > -1) arr.splice(idx, 1);
      else arr.push(item);
      renderAll();
    }

    function resetRecipeVariations() {
      Object.keys(state.recipeVariations).forEach(k => {
        state.recipeVariations[k] = [];
      });
      renderAll();
      showToast("임의 변동값이 초기화되었습니다.");
    }

    function randomizeRecipeVariations() {
      // 7개 영역 중 랜덤하게 2~4개 영역을 골라 각 1개씩 랜덤 세부 키워드 추출
      resetRecipeVariations();
      const dims = Object.keys(RECIPE_TAXONOMY);
      const shuffled = [...dims].sort(() => Math.random() - 0.5);
      const pickCount = Math.floor(Math.random() * 3) + 2; // 2~4개
      for (let i = 0; i < pickCount; i++) {
        const dKey = shuffled[i];
        const groups = Object.values(RECIPE_TAXONOMY[dKey].groups);
        const randomGroup = groups[Math.floor(Math.random() * groups.length)];
        const randomItem = randomGroup[Math.floor(Math.random() * randomGroup.length)];
        state.recipeVariations[dKey].push(randomItem);
      }
      renderAll();
      showToast("🎲 새로운 랜덤 변주 레시피가 조합되었습니다!");
    }

    function buildRecipeSummarySentence(novel) {
      const baseTitle = novel ? `[베이스 작품: ${novel.title}]` : "[베이스 작품: 미선택]";
      const lines = [`🍳 쉐프 노트 창작마당 레시피 ${baseTitle}`];

      const dimEntries = Object.entries(RECIPE_TAXONOMY);
      let hasAnyContent = false;

      dimEntries.forEach(([key, obj]) => {
        const originArr = (novel && novel.originSettings && novel.originSettings[key]) ? novel.originSettings[key] : [];
        const varArr = state.recipeVariations[key] || [];
        if (originArr.length > 0 || varArr.length > 0) {
          hasAnyContent = true;
          const cleanLabel = obj.label.replace(/^\d+\)\s*/, "");
          const parts = [];
          if (originArr.length > 0) parts.push(`원본(${originArr.join(", ")})`);
          if (varArr.length > 0) parts.push(`변동✨(${varArr.join(", ")})`);
          lines.push(`• ${cleanLabel}: ${parts.join(" + ")}`);
        }
      });

      if (!hasAnyContent) {
        lines.push("• 위에서 원본 설정값을 선택하거나, 변동값 버튼(또는 랜덤 변형)을 눌러 새로운 조합을 만들어 보세요!");
      } else {
        // 한 줄 시놉시스 로그라인 생성
        const g = [...(novel?.originSettings?.genre || []), ...state.recipeVariations.genre].slice(0, 2).join("·") || "복합장르";
        const b = [...(novel?.originSettings?.background || []), ...state.recipeVariations.background].slice(0, 2).join("·") || "독창적 세계관";
        const p = [...(novel?.originSettings?.protagonist || []), ...state.recipeVariations.protagonist].slice(0, 2).join("·") || "매력적인 주인공";
        const a = [...(novel?.originSettings?.ability || []), ...state.recipeVariations.ability].slice(0, 2).join("·") || "특수 능력";
        const gl = [...(novel?.originSettings?.goal || []), ...state.recipeVariations.goal].slice(0, 1).join("") || "최종 목표 달성";
        const cf = [...(novel?.originSettings?.conflict || []), ...state.recipeVariations.conflict].slice(0, 1).join("") || "거대한 위기";
        const gr = [...(novel?.originSettings?.growth || []), ...state.recipeVariations.growth].slice(0, 1).join("") || "폭발적 성장";

        lines.push("");
        lines.push(`💡 [한 줄 컨셉 요약]`);
        lines.push(`'${b}'을(를) 무대로 한 '${g}' 작품. '${p}'인 주인공이 '${a}'을(를) 활용해 '${cf}'에 맞서며 '${gr}'을(를) 거쳐 '${gl}'에 도달하는 이야기.`);
      }

      return lines.join("\n");
    }

    function copyRecipeSummary() {
      const box = document.getElementById("recipe-summary-box");
      if (!box) return;
      copyToClipboard(box.innerText, "창작마당 정리 문장이 복사되었습니다! 메모장에 붙여넣으세요 📋");
    }

    /*************************************************************************
     * 7. 카테고리 3: 🏅 미슐랭 (유료 도달 티어, 전환값, 무료 최종화)
     *************************************************************************/
    function renderMichelinTab() {
      // 조리실까지 입력이 끝난 작품 중 '미슐랭 분류 완료'를 누르지 않은 작품
      const michelinNovels = state.novels.filter(n => n.kitchenDone && !n.michelinDone);

      return `
        <div class="flex items-center justify-between px-1">
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
            <span>🏅</span> 미슐랭 : 유료화 지표 평가
            <span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">${michelinNovels.length}</span>
          </h2>
          <span class="text-[11px] text-slate-400">분류 완료 시 목록에서 숨김</span>
        </div>

        ${michelinNovels.length === 0 ? `
          <div class="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-300 space-y-2">
            <div class="text-3xl">🏅</div>
            <p class="text-sm font-bold text-slate-700">미슐랭 심사 대기 작품이 없습니다</p>
            <p class="text-xs text-slate-400">조리실에서 평가를 완료한 작품이 이곳으로 넘어옵니다.</p>
          </div>
        ` : michelinNovels.map(novel => {
          const medalHtml = getTierMedalBadge(novel.michelinTier);
          return `
            <article class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3.5">
              <div class="flex items-start justify-between gap-2 pb-2 border-b border-slate-100">
                <div>
                  <div class="flex items-center gap-1.5 mb-1">
                    <span class="px-2 py-0.5 rounded-md bg-slate-800 text-white text-[10px] font-bold">${escapeHtml(novel.genre)}</span>
                    <span class="text-xs text-slate-500">${escapeHtml(novel.author)}</span>
                  </div>
                  <h3 class="text-base font-extrabold text-slate-900 flex items-center flex-wrap gap-1.5">
                    <span>${escapeHtml(novel.title)}</span>
                    ${medalHtml}
                  </h3>
                </div>
                <button onclick="openFullEditModal('${novel.id}')"
                  class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold shrink-0">
                  수정하기
                </button>
              </div>

              <!-- 유료 도달 선택 -->
              <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700">유료 도달 등급</label>
                <div class="grid grid-cols-3 gap-1.5">
                  ${MICHELIN_TIERS.map(tier => {
                    const active = novel.michelinTier === tier;
                    return `
                      <button onclick="setMichelinTier('${novel.id}', '${tier}')"
                        class="py-2 px-1.5 rounded-xl border text-[11px] font-bold transition ${active ? 'bg-amber-500 text-white border-amber-500 shadow-xs' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
                        ${tier}
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>

              <!-- 전환값 & 무료 최종화 숫자 입력 -->
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">전환값 (숫자)</label>
                  <input type="number" step="any" value="${escapeHtml(novel.conversionRate)}"
                    onchange="updateMichelinField('${novel.id}', 'conversionRate', this.value)"
                    placeholder="예: 35.5"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-amber-400" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">무료 최종화 (화수)</label>
                  <input type="number" value="${escapeHtml(novel.freeLastEpisode)}"
                    onchange="updateMichelinField('${novel.id}', 'freeLastEpisode', this.value)"
                    placeholder="예: 25"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-amber-400" />
                </div>
              </div>

              <!-- 미슐랭 분류 완료 버튼 -->
              <button onclick="completeMichelinStage('${novel.id}')"
                class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-400 text-xs font-extrabold transition">
                🏅 미슐랭 분류 완료 (목록에서 숨김)
              </button>
            </article>
          `;
        }).join("")}
      `;
    }

    function setMichelinTier(id, tier) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel.michelinTier = tier;
      saveState();
      renderAll();
    }

    function updateMichelinField(id, field, val) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel[field] = val;
      saveState();
      showToast("지표가 저장되었습니다.");
    }

    function completeMichelinStage(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel.michelinDone = true;
      saveState();
      renderAll();
      showToast("미슐랭 분류 완료! 팬트리에서 언제든 조회·수정할 수 있습니다.");
    }

    /*************************************************************************
     * 8. 카테고리 5: 🗄️ 팬트리 (미슐랭 티어 그래프, 필터, 전체 수정/삭제, 요리하기 재전송)
     *************************************************************************/
    function renderPantryTab() {
      const pantryNovels = state.novels.filter(n => n.inPantry);

      // 상단 미슐랭 등급별(전환 4티어 ~ 1티어) 그래프 집계
      const tierKeys = ["전환 1티어", "전환 2티어", "전환 3티어", "전환 4티어"];
      const tierMeta = {
        "전환 1티어": { medal: "🥇1", color: "bg-amber-500", bg: "bg-amber-50 text-amber-900" },
        "전환 2티어": { medal: "🥈2", color: "bg-slate-500", bg: "bg-slate-100 text-slate-900" },
        "전환 3티어": { medal: "🥉3", color: "bg-orange-500", bg: "bg-orange-50 text-orange-900" },
        "전환 4티어": { medal: "🏅4", color: "bg-sky-500", bg: "bg-sky-50 text-sky-900" }
      };
      const tierCounts = {};
      tierKeys.forEach(k => tierCounts[k] = pantryNovels.filter(n => n.michelinTier === k).length);
      const maxTierCnt = Math.max(1, ...Object.values(tierCounts));

      // 필터링 & 정렬
      let filtered = [...pantryNovels];
      if (state.pantryFilter === "recent") {
        filtered.sort((a, b) => b.timestamp - a.timestamp);
      } else if (state.pantryFilter === "rating") {
        const getScore = (r) => {
          const found = RATING_OPTIONS.find(o => o.id === r);
          return found ? found.score : -1;
        };
        filtered.sort((a, b) => getScore(b.rating) - getScore(a.rating));
      } else if (state.pantryFilter === "legend") {
        filtered = filtered.filter(n => n.kitchenFlags.includes("legend"));
      } else if (state.pantryFilter === "supernormal") {
        filtered = filtered.filter(n => n.kitchenFlags.includes("supernormal"));
      } else if (state.pantryFilter === "fridge") {
        filtered = filtered.filter(n => n.kitchenFlags.includes("fridge"));
      }

      const filterButtons = [
        { id: "recent", label: "최근순" },
        { id: "rating", label: "별점순" },
        { id: "legend", label: "레전드" },
        { id: "supernormal", label: "슈퍼노멀" },
        { id: "fridge", label: "냉장고" }
      ];

      return `
        <!-- 상단 미슐랭 등급별 시각화 그래프 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>🏆</span> 미슐랭 전환 티어별 현황
            </h2>
            <span class="text-[11px] text-slate-500">보관 작품 총 ${pantryNovels.length}편</span>
          </div>

          <div class="grid grid-cols-4 gap-2 pt-1">
            ${tierKeys.map(tKey => {
              const cnt = tierCounts[tKey];
              const heightPct = cnt === 0 ? 8 : Math.max(20, Math.round((cnt / maxTierCnt) * 100));
              const meta = tierMeta[tKey];
              return `
                <div class="flex flex-col items-center p-2 rounded-xl ${meta.bg} border border-slate-200/60">
                  <div class="text-xs font-extrabold mb-1">${meta.medal}</div>
                  <div class="w-full h-16 flex items-end justify-center bg-white/70 rounded-lg p-1 mb-1.5">
                    <div class="w-7 ${meta.color} rounded-t-md transition-all duration-500" style="height: ${heightPct}%"></div>
                  </div>
                  <div class="text-[10px] font-bold text-slate-600">${tKey.replace("전환 ", "")}</div>
                  <div class="text-xs font-extrabold text-slate-900">${cnt}편</div>
                </div>
              `;
            }).join("")}
          </div>
        </section>

        <!-- 분류/정렬 버튼 바 -->
        <section class="space-y-3">
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${filterButtons.map(btn => {
              const act = state.pantryFilter === btn.id;
              return `
                <button onclick="setPantryFilter('${btn.id}')"
                  class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold border transition ${act ? 'bg-slate-900 text-white border-slate-900 shadow-xs' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}">
                  ${btn.label}
                </button>
              `;
            }).join("")}
          </div>

          <!-- 팬트리 작품 리스트 -->
          ${filtered.length === 0 ? `
            <div class="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-300 text-xs text-slate-400">
              해당 분류에 보관된 작품이 없습니다.
            </div>
          ` : filtered.map(novel => {
            const ratingObj = RATING_OPTIONS.find(r => r.id === novel.rating);
            const medalHtml = getTierMedalBadge(novel.michelinTier);

            return `
              <article class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <div class="space-y-1">
                    <div class="flex flex-wrap items-center gap-1">
                      <span class="px-2 py-0.5 rounded-md bg-slate-800 text-white text-[10px] font-bold">${escapeHtml(novel.genre)}</span>
                      <span class="px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 border border-amber-200 text-[10px] font-bold">
                        ${ratingObj ? ratingObj.label : "별점 미정"}
                      </span>
                      ${medalHtml}
                    </div>
                    <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(novel.title)}</h3>
                    <p class="text-[11px] text-slate-500">
                      작가: <b class="text-slate-700">${escapeHtml(novel.author)}</b> · 출처: ${escapeHtml(novel.source)}
                    </p>
                  </div>
                </div>

                <!-- 분류 뱃지 & 미슐랭 수치 요약 -->
                <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                  ${novel.kitchenFlags.map(fId => {
                    const fObj = KITCHEN_FLAGS.find(x => x.id === fId);
                    return fObj ? `<span class="px-2 py-0.5 rounded-md border text-[10px] font-bold ${fObj.color}">${fObj.label}</span>` : "";
                  }).join("")}
                  ${novel.michelinTier && novel.michelinTier !== "분석 전" ? `
                    <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 font-semibold text-[10px]">
                      ${novel.michelinTier}${novel.conversionRate ? ` (전환 ${novel.conversionRate}%)` : ""}${novel.freeLastEpisode ? ` / 무료 ${novel.freeLastEpisode}화` : ""}
                    </span>
                  ` : ""}
                </div>

                <!-- 태그 표시 -->
                ${novel.tags.length > 0 ? `
                  <div class="flex flex-wrap gap-1">
                    ${novel.tags.map(t => `<span class="text-[10px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">#${escapeHtml(t)}</span>`).join("")}
                  </div>
                ` : ""}

                <!-- 액션 버튼: 세부 수정하기 / 요리하기로 다시 보내기 -->
                <div class="pt-2 border-t border-slate-100 flex gap-2">
                  <button onclick="openFullEditModal('${novel.id}')"
                    class="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition">
                    ✏️ 수정하기
                  </button>
                  <button onclick="sendBackToCooking('${novel.id}')"
                    class="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition">
                    👨‍🍳 요리하기로 다시 보내기
                  </button>
                </div>
              </article>
            `;
          }).join("")}
        </section>
      `;
    }

    function setPantryFilter(filterId) {
      state.pantryFilter = filterId;
      renderAll();
    }

    function sendBackToCooking(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;
      novel.inCooking = true;
      novel.cookingDone = false;
      if (!novel.kitchenFlags.includes("cook")) {
        novel.kitchenFlags.push("cook");
      }
      state.cookingSelectedNovelId = novel.id;
      saveState();
      switchTab("cooking");
      showToast(`'${novel.title}' 작품을 요리하기로 보냈습니다! 👨‍🍳`);
    }

    /*************************************************************************
     * 9. 전체 세부 수정하기 모달 (미슐랭 & 팬트리 공용, 내부에 삭제 버튼 포함)
     *************************************************************************/
    function openFullEditModal(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      openModal(`
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-slate-900">작품 전체 항목 세부 수정</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
        </div>
        <div class="p-4 space-y-3.5 overflow-y-auto text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">작품 제목</label>
            <input id="fedit-title" type="text" value="${escapeHtml(novel.title)}"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">작가명</label>
              <input id="fedit-author" type="text" value="${escapeHtml(novel.author)}"
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">장르</label>
              <select id="fedit-genre" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                ${GENRE_LIST.map(g => `<option value="${g}" ${novel.genre === g ? "selected" : ""}>${g}</option>`).join("")}
              </select>
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">출처</label>
            <select id="fedit-source" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-sm bg-white">
              ${SOURCE_LIST.map(s => `<option value="${s}" ${novel.source === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">별점 평가</label>
            <select id="fedit-rating" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-sm bg-white">
              ${RATING_OPTIONS.map(r => `<option value="${r.id}" ${novel.rating === r.id ? "selected" : ""}>${r.label}</option>`).join("")}
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">분류 체크 (중복 가능)</label>
            <div class="grid grid-cols-2 gap-1.5">
              ${KITCHEN_FLAGS.map(f => `
                <label class="flex items-center gap-1.5 p-2 rounded-lg border border-slate-200 bg-slate-50">
                  <input type="checkbox" name="feditFlags" value="${f.id}" ${novel.kitchenFlags.includes(f.id) ? "checked" : ""}>
                  <span class="font-semibold text-[11px]">${f.label}</span>
                </label>
              `).join("")}
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">태그 (쉼표로 구분)</label>
            <input id="fedit-tags" type="text" value="${escapeHtml(novel.tags.join(", "))}"
              placeholder="사이다, 먼치킨, 회귀"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
          </div>

          <div class="pt-2 border-t border-slate-200 space-y-2">
            <div class="font-bold text-amber-800">🏅 미슐랭 지표</div>
            <div>
              <label class="block font-semibold text-slate-600 mb-1">유료 도달 등급</label>
              <select id="fedit-tier" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                ${MICHELIN_TIERS.map(t => `<option value="${t}" ${novel.michelinTier === t ? "selected" : ""}>${t}</option>`).join("")}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-slate-600 mb-1">전환값</label>
                <input id="fedit-conv" type="number" step="any" value="${escapeHtml(novel.conversionRate)}"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block font-semibold text-slate-600 mb-1">무료 최종화</label>
                <input id="fedit-free" type="number" value="${escapeHtml(novel.freeLastEpisode)}"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
            </div>
          </div>
        </div>
        <div class="p-4 border-t border-slate-200 flex items-center justify-between gap-2">
          <button onclick="confirmDeleteNovel('${novel.id}', true)"
            class="px-3.5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition">
            🗑️ 삭제하기
          </button>
          <button onclick="saveFullEditModal('${novel.id}')"
            class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-extrabold transition">
            수정 내용 저장
          </button>
        </div>
      `);
    }

    function saveFullEditModal(id) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      const title = document.getElementById("fedit-title").value.trim();
      const author = document.getElementById("fedit-author").value.trim();
      if (!title) {
        showToast("제목을 입력해 주세요.");
        return;
      }

      novel.title = title;
      novel.author = author;
      novel.genre = document.getElementById("fedit-genre").value;
      novel.source = document.getElementById("fedit-source").value;
      novel.rating = document.getElementById("fedit-rating").value;

      const checkedFlags = Array.from(document.querySelectorAll('input[name="feditFlags"]:checked')).map(el => el.value);
      novel.kitchenFlags = checkedFlags;

      const rawTags = document.getElementById("fedit-tags").value
        .split(",")
        .map(s => s.trim().replace(/^#/, ""))
        .filter(Boolean);
      novel.tags = [...new Set(rawTags)];
      novel.tags.forEach(t => {
        if (!state.tagPool.includes(t)) state.tagPool.unshift(t);
      });

      novel.michelinTier = document.getElementById("fedit-tier").value;
      novel.conversionRate = document.getElementById("fedit-conv").value;
      novel.freeLastEpisode = document.getElementById("fedit-free").value;

      saveState();
      closeModal();
      renderAll();
      showToast("작품 정보가 세부 수정되었습니다!");
    }

    // 공통 작품 삭제 확인 모달 (alert/confirm 금지 규칙 준수)
    function confirmDeleteNovel(id, fromOtherModal = false) {
      const novel = state.novels.find(n => n.id === id);
      if (!novel) return;

      openModal(`
        <div class="p-5 text-center space-y-4">
          <div class="text-3xl">🗑️</div>
          <div class="space-y-1">
            <h3 class="text-base font-extrabold text-slate-900">작품을 삭제할까요?</h3>
            <p class="text-xs text-slate-500">
              <b class="text-slate-800">'${escapeHtml(novel.title)}'</b> 데이터가 영구 삭제됩니다.
            </p>
          </div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">취소</button>
            <button onclick="executeDeleteNovel('${novel.id}')" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold">삭제 확인</button>
          </div>
        </div>
      `);
    }

    function executeDeleteNovel(id) {
      state.novels = state.novels.filter(n => n.id !== id);
      saveState();
      closeModal();
      renderAll();
      showToast("작품이 삭제되었습니다.");
    }

    /*************************************************************************
     * 10. 카테고리 6: 🧼 설거지 (인풋 달력, 월별 통계, JSON 백업/복구)
     *************************************************************************/
    function renderWashTab() {
      const year = state.calendarYear;
      const month = state.calendarMonth; // 0 ~ 11
      const monthPrefix = `${year}-${String(month + 1).padStart(2, "0")}`;

      // 해당 월에 등록된 작품들
      const monthNovels = state.novels.filter(n => (n.createdAt || "").startsWith(monthPrefix));

      // 일자별 등록 편수 매핑
      const dailyMap = {};
      monthNovels.forEach(n => {
        dailyMap[n.createdAt] = (dailyMap[n.createdAt] || 0) + 1;
      });

      // 월별 통계 계산
      const activeDaysCount = Object.keys(dailyMap).length;
      const tierSuccessCount = monthNovels.filter(n => ["전환 1티어", "전환 2티어", "전환 3티어", "전환 4티어"].includes(n.michelinTier)).length;
      const highRatingCount = monthNovels.filter(n => n.rating === "4").length;

      // 달력 날짜 배열 계산
      const firstDay = new Date(year, month, 1).getDay(); // 0(일)~6(토)
      const lastDate = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= lastDate; d++) cells.push(d);

      const selectedDateNovels = state.selectedCalendarDate
        ? state.novels.filter(n => n.createdAt === state.selectedCalendarDate)
        : [];

      return `
        <!-- 월별 통계 요약 카드 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>🧼</span> 설거지 : 월별 인풋 통계 & 관리
            </h2>
            <span class="text-xs font-bold text-amber-600">${year}년 ${month + 1}월</span>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-amber-50 rounded-xl p-2.5 border border-amber-100">
              <div class="text-[10px] font-semibold text-amber-800">이달 등록 편수</div>
              <div class="text-lg font-extrabold text-amber-600 mt-0.5">${monthNovels.length}<span class="text-xs">편</span></div>
            </div>
            <div class="bg-blue-50 rounded-xl p-2.5 border border-blue-100">
              <div class="text-[10px] font-semibold text-blue-800">16화+ 정독작</div>
              <div class="text-lg font-extrabold text-blue-600 mt-0.5">${highRatingCount}<span class="text-xs">편</span></div>
            </div>
            <div class="bg-emerald-50 rounded-xl p-2.5 border border-emerald-100">
              <div class="text-[10px] font-semibold text-emerald-800">티어 진입작</div>
              <div class="text-lg font-extrabold text-emerald-600 mt-0.5">${tierSuccessCount}<span class="text-xs">편</span></div>
            </div>
          </div>
          <div class="text-[11px] text-slate-500 text-right">
            활동 일수: <b>${activeDaysCount}일</b> · 누적 전체 등록: <b>${state.novels.length}편</b>
          </div>
        </section>

        <!-- 일별 작품 등록 달력 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="changeCalendarMonth(-1)" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">◀ 이전달</button>
            <div class="text-sm font-extrabold text-slate-900">${year}년 ${month + 1}월 인풋 달력</div>
            <button onclick="changeCalendarMonth(1)" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">다음달 ▶</button>
          </div>

          <!-- 요일 헤더 -->
          <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
            <div class="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
          </div>

          <!-- 날짜 그리드 -->
          <div class="grid grid-cols-7 gap-1">
            ${cells.map(day => {
              if (!day) return `<div class="h-12 rounded-lg bg-slate-50/50"></div>`;
              const dateStr = `${monthPrefix}-${String(day).padStart(2, "0")}`;
              const cnt = dailyMap[dateStr] || 0;
              const isSelected = state.selectedCalendarDate === dateStr;
              const isToday = getTodayStr() === dateStr;
              return `
                <button onclick="selectCalendarDate('${dateStr}')"
                  class="h-12 rounded-xl border flex flex-col items-center justify-between p-1 transition ${isSelected ? 'border-amber-500 bg-amber-50 ring-1 ring-amber-400' : isToday ? 'border-blue-300 bg-blue-50/40' : 'border-slate-100 bg-white hover:bg-slate-50'}">
                  <span class="text-[11px] font-bold ${isToday ? 'text-blue-600' : 'text-slate-700'}">${day}</span>
                  ${cnt > 0
                    ? `<span class="px-1.5 py-0.2 rounded-full bg-orange-500 text-white text-[9px] font-extrabold">${cnt}편</span>`
                    : `<span class="text-[9px] text-slate-300">-</span>`}
                </button>
              `;
            }).join("")}
          </div>

          <!-- 선택한 날짜의 등록 작품 목록 -->
          ${state.selectedCalendarDate ? `
            <div class="pt-2 border-t border-slate-100 space-y-1.5">
              <div class="text-xs font-bold text-slate-800">📅 ${state.selectedCalendarDate} 등록 작품 (${selectedDateNovels.length}편)</div>
              ${selectedDateNovels.length === 0 ? `
                <p class="text-[11px] text-slate-400">이 날짜에는 등록된 작품이 없습니다.</p>
              ` : selectedDateNovels.map(n => `
                <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl text-xs">
                  <span class="font-bold text-slate-800 truncate">${escapeHtml(n.title)}</span>
                  <span class="text-[11px] text-slate-500 shrink-0 ml-2">${n.genre || "임시등록"}</span>
                </div>
              `).join("")}
            </div>
          ` : ""}
        </section>

        <!-- 데이터 백업 및 복구 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div>
            <h3 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>💾</span> 데이터 백업 및 복구
            </h3>
            <p class="text-[11px] text-slate-500 mt-0.5">
              브라우저 캐시 삭제에 대비해 JSON 파일로 노트를 안전하게 백업하거나 불러올 수 있습니다.
            </p>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="exportBackupJson()"
              class="py-3 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition">
              ⬇️ JSON 백업 저장
            </button>
            <label class="py-3 px-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer transition">
              ⬆️ JSON 백업 복구
              <input type="file" accept=".json,application/json" onchange="importBackupJson(event)" class="hidden" />
            </label>
          </div>
        </section>
      `;
    }

    function changeCalendarMonth(delta) {
      let m = state.calendarMonth + delta;
      let y = state.calendarYear;
      if (m < 0) { m = 11; y--; }
      else if (m > 11) { m = 0; y++; }
      state.calendarMonth = m;
      state.calendarYear = y;
      state.selectedCalendarDate = null;
      renderAll();
    }

    function selectCalendarDate(dateStr) {
      state.selectedCalendarDate = dateStr;
      renderAll();
    }

    function exportBackupJson() {
      const payload = {
        appName: "Chef Note (쉐프 노트)",
        exportedAt: new Date().toISOString(),
        novels: state.novels,
        tagPool: state.tagPool
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `chef_note_backup_${getTodayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("백업 JSON 파일이 다운로드되었습니다!");
    }

    function importBackupJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed.novels)) {
            showToast("올바른 쉐프 노트 백업 파일이 아닙니다.");
            return;
          }
          state.novels = parsed.novels;
          if (Array.isArray(parsed.tagPool)) state.tagPool = parsed.tagPool;
          saveState();
          renderAll();
          showToast(`총 ${state.novels.length}편의 데이터가 성공적으로 복구되었습니다!`);
        } catch (err) {
          showToast("JSON 파일을 읽는 중 오류가 발생했습니다.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    /*************************************************************************
     * 11. 샘플 데이터 로더 (최초 테스트 및 시연용)
     *************************************************************************/

            임시등록, 조리실, 요리하기, 미슐랭, 팬트리 기능을 바로 테스트할 수 있도록 문피아 스타일 예시 작품 4편을 추가합니다.

    /*************************************************************************
     * 12. 보안 이스케이프 및 메인 렌더 루프
     *************************************************************************/
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, " ")
        .replace(/\r/g, "");
    }

    function renderAll() {
      try {
        renderNav();
        const main = document.getElementById("main-content");
        if (!main) return;
        switch (state.activeTab) {
          case "register":
            main.innerHTML = renderRegisterTab();
            break;
          case "kitchen":
            main.innerHTML = renderKitchenTab();
            break;
          case "cooking":
            main.innerHTML = renderCookingTab();
            break;
          case "michelin":
            main.innerHTML = renderMichelinTab();
            break;
          case "pantry":
            main.innerHTML = renderPantryTab();
            break;
          case "wash":
            main.innerHTML = renderWashTab();
            break;
          default:
            main.innerHTML = renderRegisterTab();
        }
      } catch (err) {
        console.error("렌더링 중 오류 발생:", err);
      }
    }

    // 초기화 실행
    window.addEventListener("DOMContentLoaded", function () {
      try {
        loadState();
        renderAll();
      } catch (err) {

      }
