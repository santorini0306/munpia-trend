      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {

    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const init = getDefaultData();
          saveState(init);
          return init;
        }
        const parsed = JSON.parse(raw);
        const def = getDefaultData();
        return {
          works: Array.isArray(parsed.works) ? parsed.works : def.works,
          tagPool: Array.isArray(parsed.tagPool) ? parsed.tagPool : def.tagPool,
          ui: { ...def.ui, ...(parsed.ui || {}) }
        };
      } catch (err) {
        console.error('Failed to load state:', err);
        return getDefaultData();
      }
    }

    function saveState(nextState = state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      } catch (err) {
        console.error('Failed to save state:', err);
        showToast('저장 공간 확인이 필요합니다.', 'error');
      }
    }

    let state = loadState();

    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colorClass =
        type === 'error'
          ? 'bg-rose-900 text-rose-50 border-rose-700'
          : type === 'success'
          ? 'bg-stone-900 text-amber-50 border-orange-500/60'
          : 'bg-stone-800 text-white border-stone-700';
      el.className = `pointer-events-auto px-4 py-2.5 rounded-2xl border text-xs font-semibold shadow-xl flex items-center gap-2 animate-pop ${colorClass}`;
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : type === 'success' ? '✨' : '🍽️'}</span><span class="flex-1 leading-snug">${escapeHTML(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function escapeHTML(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeTitle(title = '') {
      return title.replace(/\s+/g, '').toLowerCase();
    }

    function isLabeledComplete(work) {
      return Boolean(work.title && work.title.trim()) && Boolean(work.genre && work.genre.trim()) && Boolean(work.author && work.author.trim());
    }

    function copyToClipboard(text, customMsg) {
      if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
        showToast(customMsg || `"${text}" 복사 완료! 문피아 검색창에 붙여넣으세요.`, 'success');
      } catch (e) {
        fallbackCopy(text);
        showToast(customMsg || `"${text}" 복사 완료!`, 'success');
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

      const query = encodeURIComponent(title);
      window.open(`https://novel.munpia.com/page/hd.search/searchWord/${query}`, '_blank', 'noopener,noreferrer');
    }

    }

    // 귀여운 SVG 마스코트 캐릭터 ('이미 등록된 작품입니다' 전용)
    function renderDuplicateMascotSVG() {
      return `
        <svg viewBox="0 0 120 110" class="w-20 h-20 shrink-0 animate-float" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="중복 알림 캐릭터">
          <ellipse cx="60" cy="100" rx="34" ry="6" fill="#FDE68A" />
          <path d="M35 42C35 25 46 16 60 16C74 16 85 25 85 42V58C85 75 74 86 60 86C46 86 35 75 35 58V42Z" fill="#FFFBEB" stroke="#EA580C" stroke-width="3"/>

          <path d="M40 24C34 22 32 14 38 10C43 7 49 10 51 14C54 8 66 8 69 14C71 10 77 7 82 10C88 14 86 22 80 24H40Z" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5" stroke-linejoin="round"/>
          <rect x="42" y="23" width="36" height="7" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.2"/>
          <!-- 눈 & 놀란 표정 -->
          <circle cx="49" cy="48" r="4.5" fill="#1C1917"/>
          <circle cx="47.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
          <circle cx="71" cy="48" r="4.5" fill="#1C1917"/>
          <circle cx="69.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
          <!-- 볼터치 -->
          <ellipse cx="42" cy="56" rx="4.5" ry="2.5" fill="#FDBA74" opacity="0.8"/>
          <ellipse cx="78" cy="56" rx="4.5" ry="2.5" fill="#FDBA74" opacity="0.8"/>
          <!-- 입 -->
          <path d="M54 61C56 57 64 57 66 61" stroke="#EA580C" stroke-width="2.6" stroke-linecap="round"/>
          <!-- 손 흔들기 -->
          <path d="M35 54C25 50 22 42 26 37" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
          <path d="M85 54C95 50 98 42 94 37" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
        </svg>
      `;
    }

    // =========================================================================
    // 4. 전체 렌더 디스패처 & 7개 탭 구성
    // =========================================================================
    function getCategoryCounts() {
      const registerCount = state.works.filter((w) => w.stage === 'register').length;
      const kitchenCount = state.works.filter((w) => w.stage === 'kitchen').length;
      const cookCount = state.works.filter((w) => w.stage === 'cook').length;
      const recipeCount = state.works.filter((w) => w.stage === 'recipe').length;
      const michelinCount = state.works.filter((w) => w.stage !== 'register').length;
      const pantryCount = state.works.filter((w) => w.rating !== null).length;
      const dishwashCount = state.works.length;
      return {
        register: registerCount,
        kitchen: kitchenCount,
        cook: cookCount,
        recipe: recipeCount,
        michelin: michelinCount,
        pantry: pantryCount,
        dishwash: dishwashCount
      };
    }

    function setCategory(catId) {
      state.ui.activeCategory = catId;
      state.ui.editingWorkId = null;
      saveState();
      renderApp();
      document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTabs() {
      const nav = document.getElementById('category-tabs');
      const counts = getCategoryCounts();
      nav.innerHTML = CATEGORIES.map((cat) => {
        const active = state.ui.activeCategory === cat.id;
        const cnt = counts[cat.id] || 0;
        return `
          <button
            type="button"
            onclick="setCategory('${cat.id}')"
            class="shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-2xl text-xs font-bold transition active:scale-95 ${
              active
                ? 'bg-orange-600 text-white shadow-float'
                : 'bg-white text-stone-700 border border-stone-200 hover:border-orange-300'
            }"
          >
            <span class="text-sm leading-none">${cat.icon}</span>
            <span>${cat.label}</span>
            <span class="px-1.5 py-0.2 rounded-full text-[10px] ${
              active ? 'bg-white/25 text-white' : 'bg-stone-100 text-stone-600'
            }">${cnt}</span>
          </button>
        `;
      }).join('');
    }

    function renderApp() {
      renderTabs();
      const main = document.getElementById('main-content');
      const active = state.ui.activeCategory;
      switch (active) {
        case 'register':
          main.innerHTML = renderRegisterView();
          break;
        case 'kitchen':
          main.innerHTML = renderKitchenView();
          break;
        case 'cook':
          main.innerHTML = renderCookView();
          break;
        case 'recipe':
          main.innerHTML = renderRecipeView();
          break;
        case 'michelin':
          main.innerHTML = renderMichelinView();
          break;
        case 'pantry':
          main.innerHTML = renderPantryView();
          break;
        case 'dishwash':
          main.innerHTML = renderDishwashView();
          break;
        default:
          main.innerHTML = renderRegisterView();
      }
    }

    // =========================================================================
    // 5. 카테고리 1: 🛒 제품 등록 (1단계 메뉴 선정 · 2단계 라벨링)
    // =========================================================================
    let duplicateAlertTitle = '';

    function renderRegisterView() {
      const registerWorks = state.works.filter((w) => w.stage === 'register');
      const draftWorks = registerWorks.filter((w) => !isLabeledComplete(w));
      const listToShow = state.ui.registerSubTab === 'draft' ? draftWorks : registerWorks;

      const editingWork = state.ui.editingWorkId
        ? state.works.find((w) => w.id === state.ui.editingWorkId)
        : null;

      const formTitle = editingWork ? editingWork.title : '';
      const formSources = editingWork ? editingWork.sources : ['투데이 베스트'];
      const formGenre = editingWork ? editingWork.genre : '';
      const formAuthor = editingWork ? editingWork.author : '';

      return `
        <!-- 1단계 메뉴 선정 & 2단계 라벨링 통합 카드 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-orange-600">STEP 1 · 2</span>
              <h2 class="text-base font-extrabold text-stone-900">
                ${editingWork ? '작품 등록 · 라벨링 수정' : '새 작품 등록 & 라벨링'}
              </h2>
            </div>
            ${
              editingWork
                ? `<button type="button" onclick="cancelEditRegister()" class="text-xs font-semibold text-stone-500 underline">수정 취소</button>`
                : `<span class="text-[11px] text-stone-500 bg-stone-100 px-2.5 py-1 rounded-full">동시 입력 가능</span>`
            }
          </div>

          ${
            duplicateAlertTitle
              ? `
              <div class="p-3.5 rounded-2xl bg-amber-50 border-2 border-amber-300 flex items-center gap-3 animate-pop">
                ${renderDuplicateMascotSVG()}
                <div class="flex-1 min-w-0">
                  <p class="text-xs font-extrabold text-orange-700">이미 등록된 작품입니다</p>
                  <p class="text-[11px] text-stone-600 mt-0.5 truncate">"<b>${escapeHTML(duplicateAlertTitle)}</b>"은(는) 이미 주방에 올라와 있어요! 기존 목록에서 수정해 보세요.</p>
                </div>
                <button type="button" onclick="dismissDuplicateAlert()" class="text-stone-400 hover:text-stone-700 text-xs font-bold px-1.5">✕</button>
              </div>
              `
              : ''
          }

          <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
            <!-- 1단계: 수동 체크 -->
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1.5">1단계 · 메뉴 출처 체크 (중복 가능)</label>
              <div class="grid grid-cols-3 gap-2">
                ${SOURCE_OPTIONS.map((src) => {
                  const checked = formSources.includes(src);
                  return `
                    <label class="cursor-pointer flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-2xl border text-xs font-bold transition select-none ${
                      checked
                        ? 'bg-orange-50 border-orange-500 text-orange-800 shadow-xs'
                        : 'bg-stone-50 border-stone-200 text-stone-600'
                    }">
                      <input type="checkbox" name="sources" value="${escapeHTML(src)}" ${checked ? 'checked' : ''} class="accent-orange-600 rounded" />
                      <span class="truncate">${escapeHTML(src)}</span>
                    </label>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 1단계: 제목 입력 -->
            <div>
              <label for="reg-title" class="block text-xs font-bold text-stone-700 mb-1">제목 <span class="text-rose-500">*</span></label>
              <input
                id="reg-title"
                name="title"
                type="text"
                value="${escapeHTML(formTitle)}"
                oninput="onTitleInput(this.value, '${editingWork ? editingWork.id : ''}')"
                placeholder="문피아 작품 제목을 입력하세요"
                class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-sm font-medium focus:outline-none focus:border-orange-500 focus:bg-white transition"
                required
              />
            </div>

            <!-- 2단계: 라벨링 (장르 & 작가명) -->
            <div class="pt-2 border-t border-dashed border-stone-200 space-y-3">
              <div class="flex items-center justify-between">
                <label class="text-xs font-bold text-stone-700">2단계 · 라벨링 (완료 시 조리실로 이동)</label>
                <span class="text-[10px] text-stone-400">미입력 시 [임시등록]</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                  <label for="reg-genre" class="block text-[11px] font-semibold text-stone-600 mb-1">장르 (12종 중 택 1)</label>
                  <select
                    id="reg-genre"
                    name="genre"
                    class="w-full px-3 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:bg-white"
                  >
                    <option value="">장르 선택 (미선택 시 임시등록)</option>
                    ${LABEL_GENRES.map((g) => `<option value="${escapeHTML(g)}" ${formGenre === g ? 'selected' : ''}>${escapeHTML(g)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label for="reg-author" class="block text-[11px] font-semibold text-stone-600 mb-1">작가명</label>
                  <input
                    id="reg-author"
                    name="author"
                    type="text"
                    value="${escapeHTML(formAuthor)}"
                    placeholder="작가명 입력"
                    class="w-full px-3 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-xs font-medium focus:outline-none focus:border-orange-500 focus:bg-white"
                  />
                </div>
              </div>
            </div>

            <button
              type="submit"
              class="w-full py-3 rounded-2xl bg-gradient-to-r from-orange-600 to-amber-600 text-white text-sm font-extrabold shadow-float active:scale-[0.98] transition"
            >
              ${editingWork ? '수정 내용 저장하기' : '주방에 담기 (라벨링 완료 시 조리실 이동)'}
            </button>
          </form>
        </section>

        <!-- 대기/임시등록 목록 필터 -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-1">
            <div class="flex gap-1.5">
              <button
                type="button"
                onclick="setRegisterSubTab('all')"
                class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                  state.ui.registerSubTab === 'all'
                    ? 'bg-stone-900 text-white'
                    : 'bg-white text-stone-600 border border-stone-200'
                }"
              >
                등록 대기 (${registerWorks.length})
              </button>
              <button
                type="button"
                onclick="setRegisterSubTab('draft')"
                class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                  state.ui.registerSubTab === 'draft'
                    ? 'bg-amber-600 text-white'
                    : 'bg-white text-stone-600 border border-stone-200'
                }"
              >
                [임시등록] (${draftWorks.length})
              </button>
            </div>
            <span class="text-[11px] text-stone-500">라벨링 완료 → 조리실</span>
          </div>

          ${
            listToShow.length === 0
              ? `
              <div class="bg-white rounded-3xl p-7 text-center border border-stone-200 space-y-1.5">
                <div class="text-3xl">🛒</div>
                <p class="text-sm font-bold text-stone-800">대기 중인 작품이 없습니다</p>
                <p class="text-xs text-stone-500">위에서 새 작품을 등록하거나 라벨링을 마치면 조리실로 이동합니다.</p>
              </div>
              `
              : listToShow.map((w) => renderRegisterWorkCard(w)).join('')
          }
        </section>
      `;
    }

    function renderRegisterWorkCard(work) {
      const isDraft = !isLabeledComplete(work);
      return `
        <div class="bg-white rounded-3xl p-4 border ${isDraft ? 'border-amber-300' : 'border-stone-200'} shadow-mobile space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1.5 mb-1">
                ${
                  isDraft
                    ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 text-amber-800">[임시등록]</span>`
                    : `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800">라벨링 완료</span>`
                }
                ${(work.sources || []).map((s) => `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-orange-50 text-orange-700 border border-orange-200">${escapeHTML(s)}</span>`).join('')}
                <span class="text-[10px] text-stone-400">${escapeHTML(work.createdAt || '')}</span>
              </div>
              <h3 class="text-sm font-extrabold text-stone-900 break-words">${escapeHTML(work.title)}</h3>
              <p class="text-xs text-stone-600 mt-0.5">
                장르: <b class="${work.genre ? 'text-stone-800' : 'text-rose-500'}">${escapeHTML(work.genre || '미입력')}</b>
                <span class="mx-1.5 text-stone-300">|</span>
                작가: <b class="${work.author ? 'text-stone-800' : 'text-rose-500'}">${escapeHTML(work.author || '미입력')}</b>
              </p>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-stone-100">
            <button
              type="button"
              onclick="searchOnMunpia('${escapeHTML(work.title.replace(/'/g, "\\'"))}')"
              class="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 text-xs font-bold flex items-center gap-1 active:scale-95 transition"
            >
              <span>🔍</span>
              <span>문피아 제목복사·검색</span>
            </button>

            <div class="flex items-center gap-1.5">
              ${
                isDraft
                  ? `<button type="button" onclick="startEditRegister('${work.id}')" class="px-3 py-1.5 rounded-xl bg-orange-600 text-white text-xs font-bold active:scale-95 transition">라벨링 완료</button>`
                  : `<button type="button" onclick="startEditRegister('${work.id}')" class="px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-bold active:scale-95 transition">수정</button>`
              }
              <button
                type="button"
                onclick="deleteWork('${work.id}')"
                class="px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold active:scale-95 transition"
              >
                삭제
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function setRegisterSubTab(tab) {
      state.ui.registerSubTab = tab;
      saveState();
      renderApp();
    }

    function onTitleInput(val, currentEditId) {
      const norm = normalizeTitle(val);
      if (!norm) {
        duplicateAlertTitle = '';
        return;
      }
      const dup = state.works.find(
        (w) => normalizeTitle(w.title) === norm && w.id !== currentEditId
      );
      if (dup) {
        duplicateAlertTitle = dup.title;
      } else {
        duplicateAlertTitle = '';
      }
      const alertBox = document.getElementById('register-form')?.parentElement?.querySelector('.animate-pop');
      if ((dup && !alertBox) || (!dup && alertBox)) {
        renderApp();
        const inputEl = document.getElementById('reg-title');
        if (inputEl) {
          inputEl.focus();
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        }
      }
    }

    function dismissDuplicateAlert() {
      duplicateAlertTitle = '';
      renderApp();
    }

    function startEditRegister(workId) {
      state.ui.editingWorkId = workId;
      duplicateAlertTitle = '';
      saveState();
      renderApp();
      document.getElementById('reg-genre')?.focus();
    }

    function cancelEditRegister() {
      state.ui.editingWorkId = null;
      duplicateAlertTitle = '';
      saveState();
      renderApp();
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const title = form.title.value.trim();
      const genre = form.genre.value.trim();
      const author = form.author.value.trim();
      const sources = Array.from(form.querySelectorAll('input[name="sources"]:checked')).map((i) => i.value);

      if (!title) {
        showToast('작품 제목을 입력해 주세요.', 'error');
        return;
      }

      const editingId = state.ui.editingWorkId;
      const dup = state.works.find(
        (w) => normalizeTitle(w.title) === normalizeTitle(title) && w.id !== editingId
      );
      if (dup) {
        duplicateAlertTitle = dup.title;
        renderApp();
        showToast('이미 등록된 작품입니다!', 'error');
        return;
      }

      duplicateAlertTitle = '';
      const complete = Boolean(title && genre && author);

      if (editingId) {
        const target = state.works.find((w) => w.id === editingId);
        if (target) {
          target.title = title;
          target.sources = sources.length ? sources : ['기타'];
          target.genre = genre;
          target.author = author;
          if (complete && target.stage === 'register') {
            target.stage = 'kitchen';
            state.ui.editingWorkId = null;
            state.ui.activeCategory = 'kitchen';
            saveState();
            renderApp();
            showToast(`"${title}" 라벨링 완료! 조리실로 이동했습니다.`, 'success');
            return;
          }
        }
        state.ui.editingWorkId = null;
        saveState();
        renderApp();
        showToast('작품 정보가 수정되었습니다.', 'success');
        return;
      }

      const newWork = {
        id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title,
        sources: sources.length ? sources : ['기타'],
        genre,
        author,
        createdAt: formatDateISO(new Date()),
        stage: complete ? 'kitchen' : 'register',
        rating: null,
        attributes: [],
        tags: [],
        cookSelections: {},
        michelin: {
          tier: '분석 전',
          conversionValue: '',
          freeEndEpisode: ''
        }
      };

      state.works.unshift(newWork);
      if (complete) {
        state.ui.activeCategory = 'kitchen';
        saveState();
        renderApp();
        showToast(`"${title}" 등록 & 라벨링 완료! 조리실로 이동했습니다.`, 'success');
      } else {
        saveState();
        renderApp();
        showToast(`"${title}" [임시등록]에 저장되었습니다.`, 'info');
      }
    }

    function deleteWork(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      state.works = state.works.filter((w) => w.id !== workId);
      if (state.ui.editingWorkId === workId) state.ui.editingWorkId = null;
      saveState();
      renderApp();
      showToast(`"${work.title}" 작품이 삭제되었습니다.`, 'info');
    }

    // =========================================================================
    // 6. 카테고리 2: 🧑‍🍳 조리실 (별점 · 속성 4종 · 태그 5개 내외)
    // =========================================================================
    function renderKitchenView() {
      const kitchenWorks = state.works.filter((w) => w.stage === 'kitchen');

      return `
        <div class="flex items-center justify-between px-1">
          <div>
            <h2 class="text-base font-extrabold text-stone-900">🧑‍🍳 조리실 · 맛보기 평가</h2>
            <p class="text-[11px] text-stone-500">별점·속성·태그를 고른 뒤 조리 완료를 누르면 이동합니다.</p>
          </div>
          <span class="px-2.5 py-1 rounded-full bg-orange-100 text-orange-800 text-xs font-extrabold">${kitchenWorks.length}편 대기</span>
        </div>

        ${
          kitchenWorks.length === 0
            ? `
            <div class="bg-white rounded-3xl p-8 text-center border border-stone-200 space-y-2">
              <div class="text-3xl">🧑‍🍳</div>
              <p class="text-sm font-bold text-stone-800">조리실에 남은 작품이 없습니다</p>
              <p class="text-xs text-stone-500">제품 등록에서 라벨링을 마치면 이곳에서 별점과 속성을 매길 수 있어요.</p>
              <button type="button" onclick="setCategory('register')" class="mt-2 px-4 py-2 rounded-2xl bg-orange-600 text-white text-xs font-bold">제품 등록으로 가기</button>
            </div>
            `
            : kitchenWorks.map((w) => renderKitchenCard(w)).join('')
        }
      `;
    }

    function renderKitchenCard(work) {
      const selectedTags = work.tags || [];
      const availablePoolTags = state.tagPool.filter((t) => !selectedTags.includes(t));

      return `
        <article class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-4">
          <!-- 상단 작품 정보 & 수정/삭제 -->
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-stone-100">
            <div>
              <div class="flex flex-wrap items-center gap-1.5 mb-1">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-stone-100 text-stone-700">${escapeHTML(work.genre)}</span>
                <span class="text-[11px] text-stone-500">작가: <b>${escapeHTML(work.author)}</b></span>
              </div>
              <h3 class="text-base font-extrabold text-stone-900">${escapeHTML(work.title)}</h3>
            </div>
            <button
              type="button"
              onclick="openEditBasicInfoModal('${work.id}')"
              class="px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-stone-200 text-[11px] font-bold text-stone-700 shrink-0"
            >
              정보수정
            </button>
          </div>

          <!-- 1) 체크 가능한 별점 (5가지 중 택 1, 언제든 수정 가능) -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-extrabold text-stone-800">1. 별점 선택 (1개 선택)</span>
              <span class="text-[11px] text-orange-600 font-semibold">${work.rating ? getStarLabel(work.rating) : '선택 필요'}</span>
            </div>
            <div class="grid grid-cols-1 gap-1.5">
              ${STAR_RATINGS.map((st) => {
                const active = work.rating === st.key;
                return `
                  <button
                    type="button"
                    onclick="setKitchenRating('${work.id}', '${st.key}')"
                    class="w-full text-left px-3.5 py-2 rounded-2xl border text-xs font-bold flex items-center justify-between transition active:scale-[0.99] ${
                      active
                        ? 'bg-amber-50 border-amber-500 text-amber-950 shadow-xs'
                        : 'bg-stone-50 border-stone-200 text-stone-700 hover:bg-stone-100'
                    }"
                  >
                    <span>${escapeHTML(st.label)}</span>
                    <span>${active ? '✅' : '○'}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 2) 추가 항목 (4가지 중복 선택 가능, 언제든 수정 가능) -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-extrabold text-stone-800">2. 주방 속성 (중복 선택 가능)</span>
              <span class="text-[10px] text-stone-400">요리하기 체크 시 요리하기 탭에도 추가</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              ${ATTRIBUTE_TAGS.map((attr) => {
                const active = (work.attributes || []).includes(attr.key);
                return `
                  <button
                    type="button"
                    onclick="toggleKitchenAttribute('${work.id}', '${attr.key}')"
                    class="px-3 py-2.5 rounded-2xl border text-xs font-bold text-left flex items-center justify-between transition active:scale-95 ${
                      active
                        ? 'bg-orange-600 border-orange-600 text-white shadow-xs'
                        : 'bg-stone-50 border-stone-200 text-stone-700'
                    }"
                  >
                    <span class="leading-tight">${escapeHTML(attr.label)}</span>
                    <span class="ml-1 text-xs">${active ? '✓' : '+'}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 3) 작품별 태그 (5개 정도 입력 + 저장된 태그 풀에서 선택, 언제든 수정 가능) -->
          <div class="pt-2 border-t border-dashed border-stone-200 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-stone-800">3. 작품 태그 (약 5개 권장 · ${selectedTags.length}개 선택됨)</span>
            </div>

            <!-- 현재 선택된 태그 -->
            <div class="flex flex-wrap gap-1.5 min-h-[28px]">
              ${
                selectedTags.length
                  ? selectedTags
                      .map(
                        (tag) => `
                        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-stone-900 text-white text-xs font-semibold">
                          #${escapeHTML(tag)}
                          <button type="button" onclick="removeWorkTag('${work.id}', '${escapeHTML(tag.replace(/'/g, "\\'"))}')" class="text-stone-300 hover:text-white ml-0.5">✕</button>
                        </span>
                      `
                      )
                      .join('')
                  : `<span class="text-[11px] text-stone-400">태그를 입력하거나 아래 태그 풀에서 눌러 추가하세요.</span>`
              }
            </div>

            <!-- 새 태그 입력 -->
            <div class="flex gap-1.5">
              <input
                id="tag-input-${work.id}"
                type="text"
                placeholder="새 태그 입력 (예: 회귀, 사이다)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();addWorkTagFromInput('${work.id}');}"
                class="flex-1 px-3 py-2 rounded-xl bg-stone-50 border border-stone-200 text-xs focus:outline-none focus:border-orange-500 focus:bg-white"
              />
              <button
                type="button"
                onclick="addWorkTagFromInput('${work.id}')"
                class="px-3 py-2 rounded-xl bg-stone-800 text-white text-xs font-bold active:scale-95"
              >
                추가
              </button>
            </div>

            <!-- 저장된 태그 풀에서 원터치 선택 -->
            <div>
              <p class="text-[11px] font-semibold text-stone-500 mb-1">저장된 태그 풀 (눌러서 추가)</p>
              <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1">
                ${availablePoolTags
                  .map(
                    (poolTag) => `
                    <button
                      type="button"
                      onclick="addTagToWork('${work.id}', '${escapeHTML(poolTag.replace(/'/g, "\\'"))}')"
                      class="px-2.5 py-1 rounded-full bg-orange-50 hover:bg-orange-100 border border-orange-200 text-orange-800 text-[11px] font-semibold active:scale-95 transition"
                    >
                      + ${escapeHTML(poolTag)}
                    </button>
                  `
                  )
                  .join('')}
              </div>
            </div>
          </div>

          <!-- 조리 완료 버튼 (팬트리 이동, 요리하기 선택 시 요리하기 탭에도 동시 이동, 조리실에서는 숨김) -->
          <button
            type="button"
            onclick="finishKitchenWork('${work.id}')"
            class="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-extrabold shadow-md active:scale-[0.98] transition"
          >
            조리 완료 · ${(work.attributes || []).includes('cook') ? '요리하기 & 팬트리로 보내기' : '팬트리로 보내기'}
          </button>
        </article>
      `;
    }

    function setKitchenRating(workId, starKey) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.rating = starKey;
      saveState();
      renderApp();
    }

    function toggleKitchenAttribute(workId, attrKey) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.attributes = work.attributes || [];
      if (work.attributes.includes(attrKey)) {
        work.attributes = work.attributes.filter((k) => k !== attrKey);
      } else {
        work.attributes.push(attrKey);
      }
      saveState();
      renderApp();
    }

    function addTagToWork(workId, rawTag) {
      const tag = (rawTag || '').replace(/^#+/, '').trim();
      if (!tag) return;
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.tags = work.tags || [];
      if (work.tags.length >= 7) {
        showToast('작품당 태그는 최대 7개까지 권장합니다.', 'info');
      }
      if (!work.tags.includes(tag)) {
        work.tags.push(tag);
      }
      if (!state.tagPool.includes(tag)) {
        state.tagPool.unshift(tag);
      }
      saveState();
      renderApp();
    }

    function addWorkTagFromInput(workId) {
      const input = document.getElementById(`tag-input-${workId}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      val.split(',').forEach((part) => {
        if (part.trim()) addTagToWork(workId, part.trim());
      });
      input.value = '';
    }

    function removeWorkTag(workId, tag) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.tags = (work.tags || []).filter((t) => t !== tag);
      saveState();
      renderApp();
    }

    function finishKitchenWork(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      if (!work.rating) {
        showToast('먼저 별점 1가지를 선택해 주세요!', 'error');
        return;
      }
      const hasCook = (work.attributes || []).includes('cook');
      work.stage = hasCook ? 'cook' : 'pantry';
      saveState();
      renderApp();
      if (hasCook) {
        showToast(`"${work.title}" 요리하기 & 팬트리로 이동 완료!`, 'success');
      } else {
        showToast(`"${work.title}" 팬트리로 이동 완료!`, 'success');
      }
    }

    function openEditBasicInfoModal(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-stone-900">작품 기본 정보 수정</h3>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-stone-200 text-stone-700 font-bold">✕</button>
        </div>
        <form onsubmit="saveBasicInfoModal(event, '${work.id}')" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">제목</label>
            <input name="title" type="text" value="${escapeHTML(work.title)}" required class="w-full px-3 py-2.5 rounded-2xl bg-white border border-stone-200 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">장르</label>
              <select name="genre" class="w-full px-3 py-2.5 rounded-2xl bg-white border border-stone-200 text-xs font-semibold">
                ${LABEL_GENRES.map((g) => `<option value="${escapeHTML(g)}" ${work.genre === g ? 'selected' : ''}>${escapeHTML(g)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">작가명</label>
              <input name="author" type="text" value="${escapeHTML(work.author)}" required class="w-full px-3 py-2.5 rounded-2xl bg-white border border-stone-200 text-xs" />
            </div>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="deleteWork('${work.id}'); closeModal();" class="px-4 py-2.5 rounded-2xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold">삭제</button>
            <button type="submit" class="flex-1 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-extrabold">저장하기</button>
          </div>
        </form>
      `);
    }

    function saveBasicInfoModal(e, workId) {
      e.preventDefault();
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.title = e.target.title.value.trim();
      work.genre = e.target.genre.value;
      work.author = e.target.author.value.trim();
      saveState();
      closeModal();
      renderApp();
      showToast('작품 정보가 업데이트되었습니다.', 'success');
    }

    // =========================================================================
    // 7. 카테고리 3: 🍳 요리하기 (7대 축 · 큰 계열 먼저 선택 후 세부 항목 선택 가능)
    // =========================================================================
    function ensureCookSelections(work) {
      work.cookSelections = work.cookSelections || {};
      AXES_ORDER.forEach((ax) => {
        if (!work.cookSelections[ax]) {
          work.cookSelections[ax] = { groups: [], items: [] };
        }
      });
      return work.cookSelections;
    }

    function renderCookView() {
      const cookWorks = state.works.filter((w) => w.stage === 'cook');
      if (cookWorks.length === 0) {
        return `
          <div class="bg-white rounded-3xl p-8 text-center border border-stone-200 space-y-2">
            <div class="text-3xl">🍳</div>
            <p class="text-sm font-bold text-stone-800">요리할 작품이 없습니다</p>
            <p class="text-xs text-stone-500">조리실에서 <b>요리하기 (좋은소스)</b>를 체크하고 조리 완료를 누르면 이곳에 등장합니다.</p>
            <button type="button" onclick="setCategory('kitchen')" class="mt-2 px-4 py-2 rounded-2xl bg-orange-600 text-white text-xs font-bold">조리실로 이동</button>
          </div>
        `;
      }

      const selectedWork =
        cookWorks.find((w) => w.id === state.ui.cookSelectedWorkId) || cookWorks[0];
      state.ui.cookSelectedWorkId = selectedWork.id;
      const sel = ensureCookSelections(selectedWork);

      const activeAxisKey = AXES_ORDER.includes(state.ui.cookExpandedAxis)
        ? state.ui.cookExpandedAxis
        : 'genre';
      const activeAxisData = COOK_TAXONOMY[activeAxisKey];
      const activeAxisSel = sel[activeAxisKey];

      const totalPickedCount = AXES_ORDER.reduce(
        (acc, k) => acc + (sel[k].groups?.length || 0) + (sel[k].items?.length || 0),
        0
      );

      return `
        <!-- 대상 작품 선택 바 -->
        <section class="bg-white rounded-3xl p-3.5 border border-stone-200 shadow-mobile space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-orange-700">🍳 요리 중인 작품 선택 (${cookWorks.length}편)</span>
            <span class="text-[11px] font-bold text-stone-500">총 ${totalPickedCount}개 선택됨 · 선택 사항</span>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            ${cookWorks
              .map((w) => {
                const active = w.id === selectedWork.id;
                return `
                  <button
                    type="button"
                    onclick="selectCookWork('${w.id}')"
                    class="shrink-0 px-3 py-2 rounded-2xl text-xs font-bold transition ${
                      active
                        ? 'bg-stone-900 text-white shadow-xs'
                        : 'bg-stone-100 text-stone-700 hover:bg-stone-200'
                    }"
                  >
                    ${escapeHTML(w.title)}
                  </button>
                `;
              })
              .join('')}
          </div>
        </section>

        <!-- 7개 대항목 탭 -->
        <section class="flex gap-1.5 overflow-x-auto no-scrollbar">
          ${AXES_ORDER.map((axKey) => {
            const ax = COOK_TAXONOMY[axKey];
            const isSel = axKey === activeAxisKey;
            const cnt = (sel[axKey].groups?.length || 0) + (sel[axKey].items?.length || 0);
            return `
              <button
                type="button"
                onclick="setCookAxis('${axKey}')"
                class="shrink-0 px-3 py-2 rounded-2xl text-xs font-extrabold border transition flex items-center gap-1 ${
                  isSel
                    ? 'bg-orange-600 text-white border-orange-600 shadow-xs'
                    : 'bg-white text-stone-700 border-stone-200'
                }"
              >
                <span>${escapeHTML(ax.title)}</span>
                ${cnt > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] ${isSel ? 'bg-white/25' : 'bg-orange-100 text-orange-700'}">${cnt}</span>` : ''}
              </button>
            `;
          }).join('')}
        </section>

        <!-- 큰 계열 -> 세부 항목 계층 선택 영역 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-extrabold text-stone-900">${escapeHTML(activeAxisData.title)}</h3>
              <p class="text-[11px] text-stone-500">큰 계열만 선택해도 되고, 펼쳐서 세부 항목도 중복 선택할 수 있어요.</p>
            </div>
            <button
              type="button"
              onclick="clearAxisSelection('${selectedWork.id}', '${activeAxisKey}')"
              class="text-[11px] font-bold text-stone-500 hover:text-rose-600 underline shrink-0"
            >
              초기화
            </button>
          </div>

          <div class="space-y-2.5">
            ${activeAxisData.groups
              .map((grp) => {
                const groupChecked = (activeAxisSel.groups || []).includes(grp.id);
                const pickedItemsInGroup = (activeAxisSel.items || []).filter((it) =>
                  grp.items.includes(it)
                );
                const isExpanded = groupChecked || pickedItemsInGroup.length > 0 || state.ui[`exp_${grp.id}`];

                return `
                  <div class="rounded-2xl border ${
                    groupChecked || pickedItemsInGroup.length > 0
                      ? 'border-orange-300 bg-orange-50/40'
                      : 'border-stone-200 bg-stone-50/60'
                  } p-3 space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                      <label class="flex items-center gap-2 cursor-pointer flex-1 min-w-0">
                        <input
                          type="checkbox"
                          ${groupChecked ? 'checked' : ''}
                          onchange="toggleCookGroup('${selectedWork.id}', '${activeAxisKey}', '${grp.id}')"
                          class="w-4 h-4 accent-orange-600 rounded shrink-0"
                        />
                        <span class="text-xs font-extrabold text-stone-900 truncate">${escapeHTML(grp.name)}</span>
                      </label>
                      <button
                        type="button"
                        onclick="toggleGroupAccordion('${grp.id}')"
                        class="px-2.5 py-1 rounded-xl bg-white border border-stone-200 text-[11px] font-bold text-stone-700 shrink-0 active:scale-95"
                      >
                        ${pickedItemsInGroup.length > 0 ? `세부 ${pickedItemsInGroup.length}개` : isExpanded ? '접기 ▲' : '세부 보기 ▼'}
                      </button>
                    </div>

                    ${
                      isExpanded
                        ? `
                        <div class="pt-2 border-t border-stone-200/80 flex flex-wrap gap-1.5">
                          ${grp.items
                            .map((item) => {
                              const itemChecked = (activeAxisSel.items || []).includes(item);
                              return `
                                <button
                                  type="button"
                                  onclick="toggleCookItem('${selectedWork.id}', '${activeAxisKey}', '${grp.id}', '${escapeHTML(item.replace(/'/g, "\\'"))}')"
                                  class="px-2.5 py-1 rounded-xl text-[11px] font-semibold border transition active:scale-95 ${
                                    itemChecked
                                      ? 'bg-orange-600 text-white border-orange-600 shadow-xs'
                                      : 'bg-white text-stone-700 border-stone-200 hover:border-orange-300'
                                  }"
                                >
                                  ${itemChecked ? '✓ ' : ''}${escapeHTML(item)}
                                </button>
                              `;
                            })
                            .join('')}
                        </div>
                        `
                        : ''
                    }
                  </div>
                `;
              })
              .join('')}
          </div>
        </section>

        <!-- 선택 완료 -> 레시피분석으로 이동 버튼 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-2.5">
          <div class="text-xs text-stone-600">
            <span class="font-extrabold text-stone-900">현재 선택 요약:</span>
            ${renderCookSummaryChips(sel)}
          </div>
          <button
            type="button"
            onclick="completeCookWork('${selectedWork.id}')"
            class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-orange-600 to-amber-600 text-white text-sm font-extrabold shadow-float active:scale-[0.98] transition"
          >
            요리 선택 완료 · 레시피분석으로 이동 📖
          </button>
        </section>
      `;
    }

    function renderCookSummaryChips(sel) {
      const chips = [];
      AXES_ORDER.forEach((axKey) => {
        const ax = COOK_TAXONOMY[axKey];
        const gNames = (sel[axKey]?.groups || [])
          .map((gid) => ax.groups.find((g) => g.id === gid)?.name)
          .filter(Boolean);
        const iNames = sel[axKey]?.items || [];
        const combined = [...gNames, ...iNames];
        if (combined.length) {
          chips.push(`<span class="inline-block mr-1 mt-1 px-2 py-0.5 rounded-lg bg-stone-100 text-stone-800 text-[11px] font-semibold">${escapeHTML(ax.title.replace(/^\d+\)\s*/, ''))}: ${escapeHTML(combined.slice(0, 3).join(', '))}${combined.length > 3 ? ` 외 ${combined.length - 3}` : ''}</span>`);
        }
      });
      return chips.length ? `<div class="mt-1">${chips.join('')}</div>` : `<span class="text-stone-400 ml-1">선택된 항목 없음 (건너뛰고 이동 가능)</span>`;
    }

    function selectCookWork(workId) {
      state.ui.cookSelectedWorkId = workId;
      saveState();
      renderApp();
    }

    function setCookAxis(axKey) {
      state.ui.cookExpandedAxis = axKey;
      saveState();
      renderApp();
    }

    function toggleGroupAccordion(groupId) {
      const key = `exp_${groupId}`;
      state.ui[key] = !state.ui[key];
      renderApp();
    }

    function toggleCookGroup(workId, axKey, groupId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      const sel = ensureCookSelections(work)[axKey];
      sel.groups = sel.groups || [];
      if (sel.groups.includes(groupId)) {
        sel.groups = sel.groups.filter((id) => id !== groupId);
      } else {
        sel.groups.push(groupId);
        state.ui[`exp_${groupId}`] = true;
      }
      saveState();
      renderApp();
    }

    function toggleCookItem(workId, axKey, groupId, item) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      const sel = ensureCookSelections(work)[axKey];
      sel.items = sel.items || [];
      sel.groups = sel.groups || [];
      if (sel.items.includes(item)) {
        sel.items = sel.items.filter((i) => i !== item);
      } else {
        sel.items.push(item);
        // 세부 항목을 고를 때 큰 계열도 함께 표시되도록 체크 반영
        if (!sel.groups.includes(groupId)) {
          sel.groups.push(groupId);
        }
      }
      saveState();
      renderApp();
    }

    function clearAxisSelection(workId, axKey) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      ensureCookSelections(work)[axKey] = { groups: [], items: [] };
      saveState();
      renderApp();
    }

    function completeCookWork(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.stage = 'recipe';
      state.ui.recipeSelectedWorkId = work.id;
      state.ui.recipeRemix = null;
      state.ui.activeCategory = 'recipe';
      saveState();
      renderApp();
      showToast(`"${work.title}" 요리 완료! 레시피분석으로 이동했습니다.`, 'success');
    }

    // =========================================================================
    // 8. 카테고리 4: 📖 레시피분석 & [메타데이터] (랜덤 변형 · 문장 복사 · 그래프)
    // =========================================================================
    function getAllItemsForAxis(axKey) {
      const ax = COOK_TAXONOMY[axKey];
      if (!ax) return [];
      const list = [];
      ax.groups.forEach((g) => {
        g.items.forEach((it) => list.push({ item: it, groupName: g.name }));
      });
      return list;
    }

    function buildBaseRecipeFromWork(work) {
      const sel = ensureCookSelections(work);
      const result = {};
      AXES_ORDER.forEach((axKey) => {
        const ax = COOK_TAXONOMY[axKey];
        const pickedItems = [...(sel[axKey]?.items || [])];
        (sel[axKey]?.groups || []).forEach((gid) => {
          const grp = ax.groups.find((g) => g.id === gid);
          if (grp && grp.items.length > 0 && !pickedItems.some((it) => grp.items.includes(it))) {
            pickedItems.push(grp.items[0]);
          }
        });
        if (pickedItems.length === 0) {
          const all = getAllItemsForAxis(axKey);
          const randomPick = all[Math.floor(Math.random() * all.length)];
          result[axKey] = randomPick ? randomPick.item : '';
        } else {
          result[axKey] = pickedItems[0];
        }
      });
      return result;
    }

    function composeIdeaSentence(workTitle, itemsByAxis) {
      const g = itemsByAxis.genre || '퓨전판타지';
      const s = itemsByAxis.setting || '현대 대한민국';
      const p = itemsByAxis.protagonist || '회귀자';
      const a = itemsByAxis.ability || '능력복제';
      const go = itemsByAxis.goal || '최고 자리 등극';
      const co = itemsByAxis.conflict || '한계 극복';
      const gr = itemsByAxis.growth || '노력형 성장';

      return `[${workTitle} 기반 차기작 아이디어] "${s}"을(를) 무대로 펼쳐지는 ${g} 작품. "${p}" 주인공이 "${a}" 능력을 바탕으로 "${co}" 속에서 "${gr}"을(를) 이루며 최종적으로 "${go}"을(를) 향해 나아가는 이야기.`;
    }

    let selectedRemixAxes = ['genre', 'ability'];

    function renderRecipeView() {
      const recipeWorks = state.works.filter((w) => w.stage === 'recipe');
      if (recipeWorks.length === 0) {
        return `
          <div class="bg-white rounded-3xl p-8 text-center border border-stone-200 space-y-2">
            <div class="text-3xl">📖</div>
            <p class="text-sm font-bold text-stone-800">레시피분석에 등록된 작품이 없습니다</p>
            <p class="text-xs text-stone-500">요리하기에서 선택을 완료하면 이곳에서 랜덤 변형 및 메타데이터를 볼 수 있습니다.</p>
            <button type="button" onclick="setCategory('cook')" class="mt-2 px-4 py-2 rounded-2xl bg-orange-600 text-white text-xs font-bold">요리하기로 가기</button>
          </div>
        `;
      }

      const targetWork =
        recipeWorks.find((w) => w.id === state.ui.recipeSelectedWorkId) || recipeWorks[0];
      state.ui.recipeSelectedWorkId = targetWork.id;

      if (!state.ui.recipeRemix || state.ui.recipeRemix.workId !== targetWork.id) {
        const baseMap = buildBaseRecipeFromWork(targetWork);
        state.ui.recipeRemix = {
          workId: targetWork.id,
          itemsByAxis: baseMap,
          sentence: composeIdeaSentence(targetWork.title, baseMap)
        };
        saveState();
      }

      const remix = state.ui.recipeRemix;

      return `
        <!-- 작품 선택 -->
        <section class="bg-white rounded-3xl p-3.5 border border-stone-200 shadow-mobile space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-orange-700">📖 레시피 변형 대상 작품</span>
            <span class="text-[11px] text-stone-500">${recipeWorks.length}편 분석됨</span>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            ${recipeWorks
              .map((w) => {
                const active = w.id === targetWork.id;
                return `
                  <button
                    type="button"
                    onclick="selectRecipeWork('${w.id}')"
                    class="shrink-0 px-3 py-2 rounded-2xl text-xs font-bold transition ${
                      active ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'
                    }"
                  >
                    ${escapeHTML(w.title)}
                  </button>
                `;
              })
              .join('')}
          </div>
        </section>

        <!-- 항목 선택 & 랜덤 변형 재설정 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-3.5">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-extrabold text-stone-900">항목 선택 후 랜덤 변형</h3>
              <p class="text-[11px] text-stone-500">변형할 항목 버튼을 1개 이상 고른 뒤 재설정 버튼을 누르세요.</p>
            </div>
            <button
              type="button"
              onclick="resetRecipeToOriginal('${targetWork.id}')"
              class="text-[11px] font-bold text-stone-500 underline shrink-0"
            >
              원본 복원
            </button>
          </div>

          <div class="space-y-2">
            ${AXES_ORDER.map((axKey) => {
              const ax = COOK_TAXONOMY[axKey];
              const isCheckedForRemix = selectedRemixAxes.includes(axKey);
              const val = remix.itemsByAxis[axKey] || '-';
              return `
                <button
                  type="button"
                  onclick="toggleRemixAxisButton('${axKey}')"
                  class="w-full p-3 rounded-2xl border text-left flex items-center justify-between gap-2 transition active:scale-[0.99] ${
                    isCheckedForRemix
                      ? 'bg-orange-50 border-orange-400 text-stone-900'
                      : 'bg-stone-50 border-stone-200 text-stone-700'
                  }"
                >
                  <div class="min-w-0">
                    <div class="text-[11px] font-bold text-orange-700">${escapeHTML(ax.title)}</div>
                    <div class="text-xs font-extrabold text-stone-900 truncate mt-0.5">${escapeHTML(val)}</div>
                  </div>
                  <span class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold shrink-0 ${
                    isCheckedForRemix ? 'bg-orange-600 text-white' : 'bg-white border border-stone-200 text-stone-500'
                  }">
                    ${isCheckedForRemix ? '변형 대상 ✓' : '고정'}
                  </span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button
              type="button"
              onclick="remixSelectedAxes('${targetWork.id}')"
              class="py-3 px-3 rounded-2xl bg-orange-600 text-white text-xs font-extrabold shadow-float active:scale-95 transition"
            >
              🎲 선택 항목 랜덤 재설정 (${selectedRemixAxes.length})
            </button>
            <button
              type="button"
              onclick="remixAllAxes('${targetWork.id}')"
              class="py-3 px-3 rounded-2xl bg-stone-900 text-white text-xs font-extrabold active:scale-95 transition"
            >
              🔀 전체 랜덤 조합
            </button>
          </div>

          <!-- 문장 정리 & 메모장 복사 버튼 -->
          <div class="p-3.5 rounded-2xl bg-amber-50/90 border border-amber-200 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-amber-950">📝 차기작 기획 문장</span>
              <button
                type="button"
                onclick="copyToClipboard(state.ui.recipeRemix.sentence, '기획 문장이 클립보드에 복사되었습니다! 메모장에 붙여넣으세요.')"
                class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-extrabold shadow-xs active:scale-95 transition"
              >
                📋 복사하기
              </button>
            </div>
            <p class="text-xs text-stone-800 leading-relaxed font-medium">${escapeHTML(remix.sentence)}</p>
          </div>
        </section>

        <!-- 하단 [메타데이터] 영역: 취향 그래프 + 슈퍼노멀 특징 분석 -->
        ${renderMetadataSection()}
      `;
    }

    function renderMetadataSection() {
      // 요리하기에 등록되었던 작품(= cookSelections가 있거나 cook/recipe 단계에 진입한 작품)
      const cookedPool = state.works.filter(
        (w) =>
          w.stage === 'cook' ||
          w.stage === 'recipe' ||
          (w.attributes && w.attributes.includes('cook'))
      );

      // 장르 빈도 집계
      const genreMap = {};
      const tagMap = {};
      cookedPool.forEach((w) => {
        if (w.genre) genreMap[w.genre] = (genreMap[w.genre] || 0) + 1;
        (w.tags || []).forEach((t) => {
          tagMap[t] = (tagMap[t] || 0) + 1;
        });
      });

      const topGenres = Object.entries(genreMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);
      const maxGenreVal = Math.max(1, ...topGenres.map(([, v]) => v));

      const topTags = Object.entries(tagMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      const maxTagVal = Math.max(1, ...topTags.map(([, v]) => v));

      // 슈퍼노멀 (일반연재) 작품 특징 분석
      const supernormalWorks = state.works.filter((w) => (w.attributes || []).includes('supernormal'));
      const snGenres = {};
      const snTags = {};
      const snStars = {};
      supernormalWorks.forEach((w) => {
        if (w.genre) snGenres[w.genre] = (snGenres[w.genre] || 0) + 1;
        (w.tags || []).forEach((t) => {
          snTags[t] = (snTags[t] || 0) + 1;
        });
        if (w.rating) snStars[w.rating] = (snStars[w.rating] || 0) + 1;
      });
      const topSnGenres = Object.entries(snGenres).sort((a, b) => b[1] - a[1]).slice(0, 3);
      const topSnTags = Object.entries(snTags).sort((a, b) => b[1] - a[1]).slice(0, 4);

      return `
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">METADATA</span>
              <h3 class="text-sm font-extrabold text-stone-900 mt-1">📊 메타데이터 · 내 취향 & 슈퍼노멀 분석</h3>
            </div>
            <span class="text-[11px] text-stone-500">요리풀 ${cookedPool.length}편 기준</span>
          </div>

          <!-- 장르 취향 SVG 바 차트 -->
          <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/80 space-y-2">
            <div class="text-xs font-extrabold text-stone-800">요리 작품 장르 취향 그래프</div>
            ${
              topGenres.length === 0
                ? `<p class="text-[11px] text-stone-400 py-2">아직 집계할 장르 데이터가 부족합니다.</p>`
                : `
                <svg viewBox="0 0 340 ${topGenres.length * 30 + 8}" class="w-full h-auto">
                  ${topGenres
                    .map(([gName, cnt], idx) => {
                      const y = idx * 30 + 6;
                      const barW = Math.max(18, Math.round((cnt / maxGenreVal) * 185));
                      return `
                        <text x="0" y="${y + 14}" font-size="11" font-weight="700" fill="#44403C">${escapeHTML(gName)}</text>
                        <rect x="86" y="${y + 2}" width="${barW}" height="16" rx="7" fill="#EA580C" opacity="${0.95 - idx * 0.1}" />
                        <text x="${92 + barW}" y="${y + 14}" font-size="11" font-weight="800" fill="#1C1917">${cnt}편</text>
                      `;
                    })
                    .join('')}
                </svg>
                `
            }
          </div>

          <!-- 태그 선호도 SVG 그래프 -->
          <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/80 space-y-2">
            <div class="text-xs font-extrabold text-stone-800">주요 태그 빈도 차트</div>
            ${
              topTags.length === 0
                ? `<p class="text-[11px] text-stone-400 py-2">등록된 태그가 없습니다.</p>`
                : `
                <svg viewBox="0 0 340 ${topTags.length * 26 + 6}" class="w-full h-auto">
                  ${topTags
                    .map(([tName, cnt], idx) => {
                      const y = idx * 26 + 4;
                      const barW = Math.max(16, Math.round((cnt / maxTagVal) * 180));
                      return `
                        <text x="0" y="${y + 13}" font-size="10.5" font-weight="700" fill="#57534E">#${escapeHTML(tName)}</text>
                        <rect x="92" y="${y + 2}" width="${barW}" height="14" rx="6" fill="#0D9488" />
                        <text x="${98 + barW}" y="${y + 13}" font-size="10.5" font-weight="800" fill="#1C1917">${cnt}</text>
                      `;
                    })
                    .join('')}
                </svg>
                `
            }
          </div>

          <!-- 슈퍼노멀 (일반연재) 특징 분석 -->
          <div class="p-3.5 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-indigo-950">⚡ 슈퍼노멀 (일반연재) 특징 분석</span>
              <span class="text-[11px] font-bold text-indigo-700">${supernormalWorks.length}편</span>
            </div>
            ${
              supernormalWorks.length === 0
                ? `<p class="text-[11px] text-indigo-800/70">슈퍼노멀 (일반연재)로 분류된 작품이 아직 없습니다.</p>`
                : `
                <p class="text-xs text-stone-800 leading-relaxed">
                  • <b>주요 장르:</b> ${
                    topSnGenres.length
                      ? topSnGenres.map(([g, c]) => `${g}(${c})`).join(', ')
                      : '데이터 없음'
                  }<br/>
                  • <b>자주 쓰인 태그:</b> ${
                    topSnTags.length
                      ? topSnTags.map(([t, c]) => `#${t}(${c})`).join(' ')
                      : '태그 없음'
                  }<br/>
                  • <b>평균 성향:</b> 일반 연재 흐름에서 안정적인 독자 반응과 핵심 키워드 결합력이 두드러집니다.
                </p>
                `
            }
          </div>
        </section>
      `;
    }

    function selectRecipeWork(workId) {
      state.ui.recipeSelectedWorkId = workId;
      state.ui.recipeRemix = null;
      saveState();
      renderApp();
    }

    function toggleRemixAxisButton(axKey) {
      if (selectedRemixAxes.includes(axKey)) {
        selectedRemixAxes = selectedRemixAxes.filter((k) => k !== axKey);
      } else {
        selectedRemixAxes.push(axKey);
      }
      renderApp();
    }

    function remixSelectedAxes(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work || !state.ui.recipeRemix) return;
      if (selectedRemixAxes.length === 0) {
        showToast('랜덤 변형할 항목을 1개 이상 선택해 주세요.', 'error');
        return;
      }
      selectedRemixAxes.forEach((axKey) => {
        const pool = getAllItemsForAxis(axKey);
        if (pool.length > 0) {
          const current = state.ui.recipeRemix.itemsByAxis[axKey];
          const candidates = pool.filter((p) => p.item !== current);
          const pick = (candidates.length ? candidates : pool)[
            Math.floor(Math.random() * (candidates.length ? candidates.length : pool.length))
          ];
          state.ui.recipeRemix.itemsByAxis[axKey] = pick.item;
        }
      });
      state.ui.recipeRemix.sentence = composeIdeaSentence(
        work.title,
        state.ui.recipeRemix.itemsByAxis
      );
      saveState();
      renderApp();
      showToast('선택한 항목이 새롭게 랜덤 변형되었습니다!', 'success');
    }

    function remixAllAxes(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work || !state.ui.recipeRemix) return;
      AXES_ORDER.forEach((axKey) => {
        const pool = getAllItemsForAxis(axKey);
        if (pool.length > 0) {
          state.ui.recipeRemix.itemsByAxis[axKey] =
            pool[Math.floor(Math.random() * pool.length)].item;
        }
      });
      state.ui.recipeRemix.sentence = composeIdeaSentence(
        work.title,
        state.ui.recipeRemix.itemsByAxis
      );
      saveState();
      renderApp();
      showToast('7개 항목 전체가 새 레시피로 조합되었습니다!', 'success');
    }

    function resetRecipeToOriginal(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      const baseMap = buildBaseRecipeFromWork(work);
      state.ui.recipeRemix = {
        workId: work.id,
        itemsByAxis: baseMap,
        sentence: composeIdeaSentence(work.title, baseMap)
      };
      saveState();
      renderApp();
      showToast('원래 선택했던 항목으로 복원했습니다.', 'info');
    }

    // =========================================================================
    // 9. 카테고리 5: 🏅 미슐랭 (유료 도달 · 전환값 · 무료 최종화 · 메달 배지)
    // =========================================================================
    function renderMichelinView() {
      // 조리실까지 입력이 끝난 모든 작품 (stage !== 'register')
      const eligibleWorks = state.works.filter((w) => w.stage !== 'register');

      return `
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-1">
          <h2 class="text-base font-extrabold text-stone-900">🏅 미슐랭 · 유료 전환 기록</h2>
          <p class="text-[11px] text-stone-500">
            조리실을 거친 전 작품의 유료 도달 티어, 전환값, 무료 최종화를 기록하고 언제든 수정하세요.
          </p>
        </section>

        ${
          eligibleWorks.length === 0
            ? `
            <div class="bg-white rounded-3xl p-8 text-center border border-stone-200 space-y-2">
              <div class="text-3xl">🏅</div>
              <p class="text-sm font-bold text-stone-800">미슐랭 평가 대상 작품이 없습니다</p>
              <p class="text-xs text-stone-500">조리실 평가를 마친 작품이 자동으로 이곳에 표시됩니다.</p>
            </div>
            `
            : eligibleWorks.map((w) => renderMichelinCard(w)).join('')
        }
      `;
    }

    function renderMichelinCard(work) {
      const m = work.michelin || { tier: '분석 전', conversionValue: '', freeEndEpisode: '' };
      return `
        <article class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <h3 class="text-sm font-extrabold text-stone-900">${escapeHTML(work.title)}</h3>
                ${getTierBadgeHTML(m.tier)}
              </div>
              <p class="text-[11px] text-stone-500 mt-0.5">
                ${escapeHTML(work.genre || '-')} · ${escapeHTML(work.author || '-')}
                ${work.rating ? ` · ${escapeHTML(getStarLabel(work.rating))}` : ''}
              </p>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-stone-100 text-stone-700 shrink-0">${escapeHTML(m.tier)}</span>
          </div>

          <div class="grid grid-cols-1 gap-2.5 pt-2 border-t border-stone-100">
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">유료 도달</label>
              <select
                onchange="updateMichelinField('${work.id}', 'tier', this.value)"
                class="w-full px-3 py-2.5 rounded-2xl bg-stone-50 border border-stone-200 text-xs font-bold focus:outline-none focus:border-orange-500 focus:bg-white"
              >
                ${MICHELIN_TIERS.map((t) => `<option value="${escapeHTML(t)}" ${m.tier === t ? 'selected' : ''}>${escapeHTML(t)}</option>`).join('')}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-bold text-stone-700 mb-1">전환값 (숫자)</label>
                <input
                  type="number"
                  step="any"
                  value="${escapeHTML(m.conversionValue)}"
                  onchange="updateMichelinField('${work.id}', 'conversionValue', this.value)"
                  placeholder="예: 24.5"
                  class="w-full px-3 py-2 rounded-2xl bg-stone-50 border border-stone-200 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:bg-white"
                />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-stone-700 mb-1">무료 최종화 (숫자)</label>
                <input
                  type="number"
                  step="1"
                  min="0"
                  value="${escapeHTML(m.freeEndEpisode)}"
                  onchange="updateMichelinField('${work.id}', 'freeEndEpisode', this.value)"
                  placeholder="예: 25"
                  class="w-full px-3 py-2 rounded-2xl bg-stone-50 border border-stone-200 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:bg-white"
                />
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function updateMichelinField(workId, field, value) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.michelin = work.michelin || { tier: '분석 전', conversionValue: '', freeEndEpisode: '' };
      work.michelin[field] = value;
      saveState();
      renderApp();
      showToast(`"${work.title}" 미슐랭 기록이 저장되었습니다.`, 'success');
    }

    // =========================================================================
    // 10. 카테고리 6: 🗄️ 팬트리 (별점별 · 레전드 · 슈퍼노멀 · 요리하기 · 냉장고 · 미슐랭 등급별)
    // =========================================================================
    function renderPantryView() {
      const ratedWorks = state.works.filter((w) => w.rating !== null);
      const filterKey = state.ui.pantryFilter || 'all';

      const filterGroups = [
        { key: 'all', label: `전체 (${ratedWorks.length})` },
        ...STAR_RATINGS.map((s) => ({
          key: `star:${s.key}`,
          label: `${s.short} (${ratedWorks.filter((w) => w.rating === s.key).length})`
        })),
        ...ATTRIBUTE_TAGS.map((a) => ({
          key: `attr:${a.key}`,
          label: `${a.short} (${ratedWorks.filter((w) => (w.attributes || []).includes(a.key)).length})`
        })),
        ...['전환 1티어', '전환 2티어', '전환 3티어', '전환 4티어'].map((t) => ({
          key: `tier:${t}`,
          label: `${t} (${ratedWorks.filter((w) => w.michelin?.tier === t).length})`
        }))
      ];

      const filteredWorks = ratedWorks.filter((w) => {
        if (filterKey === 'all') return true;
        if (filterKey.startsWith('star:')) return w.rating === filterKey.replace('star:', '');
        if (filterKey.startsWith('attr:')) return (w.attributes || []).includes(filterKey.replace('attr:', ''));
        if (filterKey.startsWith('tier:')) return w.michelin?.tier === filterKey.replace('tier:', '');
        return true;
      });

      return `
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-2.5">
          <div>
            <h2 class="text-base font-extrabold text-stone-900">🗄️ 팬트리 · 식재료 저장고</h2>
            <p class="text-[11px] text-stone-500">별점·속성·미슐랭 티어별로 분류된 작품을 한눈에 확인하세요.</p>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${filterGroups
              .map((fg) => {
                const active = filterKey === fg.key;
                return `
                  <button
                    type="button"
                    onclick="setPantryFilter('${escapeHTML(fg.key)}')"
                    class="shrink-0 px-3 py-1.5 rounded-2xl text-xs font-bold border transition ${
                      active
                        ? 'bg-stone-900 text-white border-stone-900'
                        : 'bg-stone-50 text-stone-700 border-stone-200'
                    }"
                  >
                    ${escapeHTML(fg.label)}
                  </button>
                `;
              })
              .join('')}
          </div>
        </section>

        ${
          filteredWorks.length === 0
            ? `
            <div class="bg-white rounded-3xl p-8 text-center border border-stone-200 space-y-1.5">
              <div class="text-3xl">🗄️</div>
              <p class="text-sm font-bold text-stone-800">해당 조건의 작품이 없습니다</p>
              <p class="text-xs text-stone-500">다른 분류 탭을 선택하거나 조리실에서 새 평가를 진행해 보세요.</p>
            </div>
            `
            : filteredWorks.map((w) => renderPantryCard(w)).join('')
        }
      `;
    }

    function renderPantryCard(work) {
      const m = work.michelin || {};
      return `
        <article class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-2.5">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <h3 class="text-sm font-extrabold text-stone-900">${escapeHTML(work.title)}</h3>
                ${getTierBadgeHTML(m.tier)}
              </div>
              <p class="text-[11px] text-stone-500 mt-0.5">
                ${escapeHTML(work.genre || '-')} · ${escapeHTML(work.author || '-')} · ${escapeHTML(getStarLabel(work.rating))}
              </p>
            </div>
            <button
              type="button"
              onclick="reopenInKitchen('${work.id}')"
              class="px-2.5 py-1 rounded-xl bg-orange-50 border border-orange-200 text-orange-800 text-[11px] font-bold shrink-0 active:scale-95"
            >
              조리실 재편집
            </button>
          </div>

          <div class="flex flex-wrap gap-1">
            ${(work.attributes || [])
              .map((a) => `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-orange-100 text-orange-800">${escapeHTML(getAttrLabel(a))}</span>`)
              .join('')}
            ${(work.tags || [])
              .map((t) => `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-stone-100 text-stone-700">#${escapeHTML(t)}</span>`)
              .join('')}
          </div>

          ${
            m.conversionValue || m.freeEndEpisode
              ? `<div class="text-[11px] text-stone-600 pt-1.5 border-t border-stone-100 flex gap-3">
                   ${m.conversionValue ? `<span>전환값: <b>${escapeHTML(m.conversionValue)}</b></span>` : ''}
                   ${m.freeEndEpisode ? `<span>무료 최종화: <b>${escapeHTML(m.freeEndEpisode)}화</b></span>` : ''}
                 </div>`
              : ''
          }
        </article>
      `;
    }

    function setPantryFilter(key) {
      state.ui.pantryFilter = key;
      saveState();
      renderApp();
    }

    function reopenInKitchen(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      work.stage = 'kitchen';
      state.ui.activeCategory = 'kitchen';
      saveState();
      renderApp();
      showToast(`"${work.title}"을(를) 조리실에서 다시 수정할 수 있습니다.`, 'info');
    }

    // =========================================================================
    // 11. 카테고리 7: 🧼 설거지 (달력 일별 인풋 수 · 월별 통계 · 백업 및 복구)
    // =========================================================================
    function renderDishwashView() {
      const year = state.ui.dishwashYear;
      const month = state.ui.dishwashMonth; // 0-indexed
      const selectedDate = state.ui.selectedCalendarDate || formatDateISO(new Date());

      // 날짜별 등록 건수 집계
      const countByDate = {};
      state.works.forEach((w) => {
        if (w.createdAt) {
          countByDate[w.createdAt] = (countByDate[w.createdAt] || 0) + 1;
        }
      });

      // 월별 통계 계산
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthWorks = state.works.filter((w) => (w.createdAt || '').startsWith(monthPrefix));
      const monthCookCount = monthWorks.filter(
        (w) => w.stage === 'cook' || w.stage === 'recipe' || (w.attributes || []).includes('cook')
      ).length;
      const monthTierCount = monthWorks.filter((w) =>
        ['전환 1티어', '전환 2티어', '전환 3티어', '전환 4티어'].includes(w.michelin?.tier)
      ).length;

      // 달력 셀 생성
      const firstDayWeek = new Date(year, month, 1).getDay(); // 0=Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDayWeek; i++) {
        cells.push({ empty: true });
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        cells.push({ empty: false, day, iso, count: countByDate[iso] || 0 });
      }

      const worksOnSelectedDate = state.works.filter((w) => w.createdAt === selectedDate);

      return `
        <!-- 월별 통계 요약 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-extrabold text-stone-900">🧼 설거지 · 등록 달력 & 통계</h2>
            <span class="text-[11px] font-bold text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full">자동 집계</span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200">
              <div class="text-[11px] text-stone-500 font-semibold">${month + 1}월 등록</div>
              <div class="text-lg font-extrabold text-stone-900 mt-0.5">${monthWorks.length}편</div>
            </div>
            <div class="p-3 rounded-2xl bg-orange-50 border border-orange-200">
              <div class="text-[11px] text-orange-700 font-semibold">요리풀 진입</div>
              <div class="text-lg font-extrabold text-orange-700 mt-0.5">${monthCookCount}편</div>
            </div>
            <div class="p-3 rounded-2xl bg-amber-50 border border-amber-200">
              <div class="text-[11px] text-amber-800 font-semibold">미슐랭 1~4티어</div>
              <div class="text-lg font-extrabold text-amber-800 mt-0.5">${monthTierCount}편</div>
            </div>
          </div>
        </section>

        <!-- 일별 등록 수 달력 -->
        <section class="bg-white rounded-3xl p-4 border border-stone-200 shadow-mobile space-y-3">
          <div class="flex items-center justify-between">
            <button type="button" onclick="shiftDishwashMonth(-1)" class="px-3 py-1.5 rounded-xl bg-stone-100 text-xs font-bold active:scale-95">◀ 이전</button>
            <div class="text-sm font-extrabold text-stone-900">${year}년 ${month + 1}월</div>
            <button type="button" onclick="shiftDishwashMonth(1)" class="px-3 py-1.5 rounded-xl bg-stone-100 text-xs font-bold active:scale-95">다음 ▶</button>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-stone-400">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
          </div>

          <div class="grid grid-cols-7 gap-1">
