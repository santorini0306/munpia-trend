      `;

      // 이벤트 바인딩: 필터 버튼
      container.querySelectorAll('button[data-reg-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.registerFilter = btn.dataset.regFilter;
          saveState();
          renderRegisterView(container);
        });
      });

      // 제목 입력 실시간 중복 검사
      const titleInput = document.getElementById('reg-title-input');
      const dupBox = document.getElementById('reg-duplicate-box');
      const checkDup = () => {
        const dup = findDuplicateNovel(titleInput.value);
        dupBox.innerHTML = dup ? renderCuteDuplicateCharacter(dup) : '';
      };
      titleInput.addEventListener('input', checkDup);

      // 입력폼 제목 복사 버튼
      document.getElementById('reg-copy-title-btn').addEventListener('click', () => {
        copyTitleForMunpia(titleInput.value);
      });

      // 폼 데이터 수집 헬퍼
      const collectFormNovel = (moveToKitchenIfLabeled) => {
        const title = (titleInput.value || '').trim();
        if (!title) {
          showToast('작품 제목을 입력해 주세요!', 'error');
          titleInput.focus();
          return null;
        }
        const dup = findDuplicateNovel(title);
        if (dup) {
          checkDup();
          showToast('이미 등록된 작품입니다!', 'error');
          return null;
        }

        const menuSources = Array.from(
          container.querySelectorAll('#reg-menu-checks input[type="checkbox"]:checked')
        ).map((cb) => cb.value);
        const genre = document.getElementById('reg-genre-select').value;
        const author = (document.getElementById('reg-author-input').value || '').trim();
        const tier = document.getElementById('reg-mich-tier').value || '분석 전';
        const conversionRate = document.getElementById('reg-mich-conv').value;
        const freeEndEpisode = document.getElementById('reg-mich-free').value;

        const maxOrder = state.novels.reduce((acc, n) => Math.max(acc, n.order || 0), 0);
        const labeled = Boolean(genre && author);

        let location = 'register';
        if (moveToKitchenIfLabeled) {
          if (!labeled) {
            showToast('조리실로 이동하려면 장르와 작가명을 모두 입력해 주세요.', 'error');
            return null;
          }
          location = 'kitchen';
        }

        return {
          id: `n_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          order: maxOrder + 1,
          createdAt: `${getTodayStr()} ${new Date().toTimeString().slice(0, 5)}`,
          menuSources,
          title,
          genre,
          author,
          michelin: {
            tier,
            conversionRate,
            freeEndEpisode,
          },
          location,
          rating: '☆☆☆☆ 미지정',
          specials: [],
          tags: [],
          recipe: createEmptyRecipe(),
          recipeCompleted: false,
        };
      };

      document.getElementById('btn-save-register-only').addEventListener('click', () => {
        const item = collectFormNovel(false);
        if (!item) return;
        state.novels.push(item);
        saveState();
        const isDraft = !isLabelingComplete(item);
        showToast(
          isDraft
            ? `"${item.title}" [임시등록]으로 저장되었습니다.`
            : `"${item.title}" 등록이 저장되었습니다.`,
          'success'
        );
        renderApp();
      });

      document.getElementById('btn-save-to-kitchen').addEventListener('click', () => {
        const item = collectFormNovel(true);
        if (!item) return;
        state.novels.push(item);
        saveState();
        showToast(`"${item.title}" 라벨링 완료! [조리실]로 이동했습니다.`, 'success');
        renderApp();
      });

      // 목록 버튼 이벤트 위임
      container.querySelectorAll('button[data-copy-title]').forEach((btn) => {
        btn.addEventListener('click', () => copyTitleForMunpia(btn.dataset.copyTitle));
      });

      container.querySelectorAll('button[data-edit-register]').forEach((btn) => {
        btn.addEventListener('click', () => openRegisterEditModal(btn.dataset.editRegister));
      });

      container.querySelectorAll('button[data-move-kitchen]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const novel = state.novels.find((n) => n.id === btn.dataset.moveKitchen);
          if (!novel) return;
          if (!isLabelingComplete(novel)) {
            showToast('장르와 작가명을 먼저 입력해 주세요.', 'error');
            openRegisterEditModal(novel.id);
            return;
          }
          novel.location = 'kitchen';
          saveState();
          showToast(`"${novel.title}"이(가) [조리실]로 이동했습니다.`, 'success');
          renderApp();
        });
      });

      container.querySelectorAll('button[data-del-register]').forEach((btn) => {
        btn.addEventListener('click', () => deleteNovel(btn.dataset.delRegister));
      });
    }

    // 제품 등록 항목 수정/라벨링/미슐랭 모달
    function openRegisterEditModal(novelId) {
      const novel = state.novels.find((n) => n.id === novelId);
      if (!novel) return;

      openModal(
        `제품 등록 수정 — ${novel.title}`,
        `
        <div class="space-y-3.5">
          <div>
            <label class="block text-xs font-extrabold text-ink mb-1">1) 메뉴 선정</label>
            <div class="grid grid-cols-3 gap-1.5" id="modal-menu-checks">
              ${MENU_SOURCES.map((src) => {
                const checked = (novel.menuSources || []).includes(src) ? 'checked' : '';
                return `
                  <label class="flex items-center gap-1.5 bg-stonebg border border-line rounded-xl px-2 py-2 text-xs font-semibold cursor-pointer">
                    <input type="checkbox" value="${escapeHtml(src)}" ${checked} class="accent-[#C85A32]" />
                    <span class="truncate">${escapeHtml(src)}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <label class="block text-xs font-extrabold text-ink mb-1">제목</label>
            <input id="modal-reg-title" type="text" value="${escapeHtml(novel.title)}" class="w-full px-3 py-2 rounded-xl bg-stonebg border border-line text-sm font-semibold" />
            <div id="modal-dup-warning"></div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-extrabold text-ink mb-1">2) 장르</label>
              <select id="modal-reg-genre" class="w-full px-2.5 py-2 rounded-xl bg-stonebg border border-line text-xs font-semibold">
                <option value="">미선택 (임시등록)</option>
                ${LABEL_GENRES.map(
                  (g) => `<option value="${escapeHtml(g)}" ${novel.genre === g ? 'selected' : ''}>${escapeHtml(g)}</option>`
                ).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-extrabold text-ink mb-1">작가명</label>
              <input id="modal-reg-author" type="text" value="${escapeHtml(novel.author || '')}" placeholder="작가명" class="w-full px-3 py-2 rounded-xl bg-stonebg border border-line text-xs font-medium" />
            </div>
          </div>

          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-2">
            <label class="block text-xs font-extrabold text-ink">3) 미슐랭 선정</label>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <span class="block text-[10px] font-bold text-muted mb-1">유료 도달</span>
                <select id="modal-reg-tier" class="w-full px-2 py-2 rounded-xl bg-white border border-line text-xs font-semibold">
                  ${MICHELIN_TIERS.map(
                    (t) => `<option value="${escapeHtml(t)}" ${(novel.michelin?.tier || '분석 전') === t ? 'selected' : ''}>${escapeHtml(t)}</option>`
                  ).join('')}
                </select>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-muted mb-1">전환값</span>
                <input id="modal-reg-conv" type="number" step="0.1" value="${escapeHtml(novel.michelin?.conversionRate ?? '')}" class="w-full px-2 py-2 rounded-xl bg-white border border-line text-xs" />
              </div>
              <div>
                <span class="block text-[10px] font-bold text-muted mb-1">무료 최종화</span>
                <input id="modal-reg-free" type="number" min="0" value="${escapeHtml(novel.michelin?.freeEndEpisode ?? '')}" class="w-full px-2 py-2 rounded-xl bg-white border border-line text-xs" />
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-2 pt-2">
            <button id="modal-reg-save" type="button" class="w-full py-2.5 rounded-2xl bg-stonebg hover:bg-line text-ink border border-line text-xs font-extrabold">
              저장하기
            </button>
            <button id="modal-reg-send-kitchen" type="button" class="w-full py-2.5 rounded-2xl bg-terracotta hover:bg-terracottaDark text-white text-xs font-extrabold">
              🍳 라벨 완료 & 조리실로 보내기
            </button>
            <button id="modal-reg-delete" type="button" class="w-full py-2.5 rounded-2xl bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-bold">
              🗑️ 해당 작품 삭제
            </button>
          </div>
        </div>
        `
      );

      const titleInput = document.getElementById('modal-reg-title');
      const dupBox = document.getElementById('modal-dup-warning');
      const checkModalDup = () => {
        const dup = findDuplicateNovel(titleInput.value, novel.id);
        dupBox.innerHTML = dup ? renderCuteDuplicateCharacter(dup) : '';
      };
      titleInput.addEventListener('input', checkModalDup);

      const applyModalChanges = (sendKitchen) => {
        const newTitle = (titleInput.value || '').trim();
        if (!newTitle) {
          showToast('제목을 입력해 주세요.', 'error');
          return;
        }
        const dup = findDuplicateNovel(newTitle, novel.id);
        if (dup) {
          checkModalDup();
          showToast('이미 등록된 작품입니다!', 'error');
          return;
        }

        const newGenre = document.getElementById('modal-reg-genre').value;
        const newAuthor = (document.getElementById('modal-reg-author').value || '').trim();

        if (sendKitchen && (!newGenre || !newAuthor)) {
          showToast('조리실로 이동하려면 장르와 작가명을 모두 입력해 주세요.', 'error');
          return;
        }

        novel.title = newTitle;
        novel.menuSources = Array.from(
          document.querySelectorAll('#modal-menu-checks input[type="checkbox"]:checked')
        ).map((cb) => cb.value);
        novel.genre = newGenre;
        novel.author = newAuthor;
        novel.michelin = {
          tier: document.getElementById('modal-reg-tier').value || '분석 전',
          conversionRate: document.getElementById('modal-reg-conv').value,
          freeEndEpisode: document.getElementById('modal-reg-free').value,
        };

        if (sendKitchen) {
          novel.location = 'kitchen';
        }

        saveState();
        closeModal();
        showToast(
          sendKitchen
            ? `"${novel.title}" 라벨링 완료! [조리실]로 이동했습니다.`
            : `"${novel.title}" 정보가 수정되었습니다.`,
          'success'
        );
        renderApp();
      };

      document.getElementById('modal-reg-save').addEventListener('click', () => applyModalChanges(false));
      document.getElementById('modal-reg-send-kitchen').addEventListener('click', () => applyModalChanges(true));
      document.getElementById('modal-reg-delete').addEventListener('click', () => deleteNovel(novel.id));
    }

    // =========================================================================
    // 2. 조리실 (🍳) : 별점 · 특별전 · 추가 태그 · 삭제 · 조리 완료
    // =========================================================================
    function renderKitchenView(container) {
      // 등록 순서(order)대로 정렬
      const kitchenNovels = state.novels
        .filter((n) => n.location === 'kitchen')
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      if (kitchenNovels.length === 0) {
        container.innerHTML = `
          <div class="bg-cardbg border border-line rounded-3xl p-8 text-center shadow-soft space-y-2">
            <p class="text-3xl">🍳</p>
            <h3 class="text-sm font-extrabold text-ink">조리실에 대기 중인 작품이 없습니다</h3>
            <p class="text-xs text-muted">[제품 등록]에서 라벨링을 마친 작품을 조리실로 보내 보세요.</p>
            <button
              type="button"
              id="go-reg-from-kitchen"
              class="mt-2 px-4 py-2 rounded-2xl bg-terracotta text-white text-xs font-extrabold"
            >
              🛒 제품 등록으로 가기
            </button>
          </div>
        `;
        document.getElementById('go-reg-from-kitchen')?.addEventListener('click', () => {
          state.activeCategory = 'register';
          saveState();
          renderApp();
        });
        return;
      }

      container.innerHTML = kitchenNovels
        .map((novel, idx) => {
          const currentRating = novel.rating || '☆☆☆☆ 미지정';
          const currentSpecials = novel.specials || [];
          const currentTags = novel.tags || [];
          const hasRecipeSpecial = currentSpecials.includes('recipe');

          return `
            <article class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3.5" data-kitchen-card="${novel.id}">
              <!-- 상단 헤더 & 문피아 제목 자동복사 -->
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap mb-1">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-stonebg border border-line text-muted">
                      #${idx + 1} 등록순
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-terracotta/10 text-terracottaDark">
                      ${escapeHtml(novel.genre || '미지정')}
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900">
                      ${escapeHtml(currentRating)}
                    </span>
                  </div>
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <h3 class="text-base font-extrabold text-ink break-all">${escapeHtml(novel.title)}</h3>
                    ${getMichelinMedalBadge(novel.michelin?.tier)}
                  </div>
                  <p class="text-xs text-muted mt-0.5">작가: ${escapeHtml(novel.author || '미상')}</p>
                </div>

                <button
                  type="button"
                  data-copy-title="${escapeHtml(novel.title)}"
                  class="px-2.5 py-2 rounded-xl bg-stonebg hover:bg-amber-50 border border-line text-xs font-bold text-ink shrink-0 transition active:scale-95"
                  title="문피아에서 검색할 수 있도록 제목 복사"
                >
                  📋 복사
                </button>
              </div>

              <!-- 1) 별점 선택 (4지선다, 기본값 [☆☆☆☆ 미지정], 언제든 수정 가능) -->
              <div class="p-3 rounded-2xl bg-stonebg/80 border border-line space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-ink">1) 별점 선택</span>
                  <span class="text-[11px] font-bold text-terracottaDark">${escapeHtml(currentRating)}</span>
                </div>
                <div class="grid grid-cols-1 gap-1.5">
                  ${STAR_RATINGS.slice(1)
                    .map((sr) => {
                      const active = currentRating === sr.value;
                      return `
                        <button
                          type="button"
                          data-set-rating="${novel.id}"
                          data-rating-val="${escapeHtml(sr.value)}"
                          class="w-full text-left px-3 py-2 rounded-xl border text-xs font-bold transition flex items-center justify-between ${
                            active
                              ? 'bg-terracotta text-white border-terracotta shadow-sm'
                              : 'bg-cardbg text-ink border-line hover:border-terracotta/50'
                          }"
                        >
                          <span>${escapeHtml(sr.value)}</span>
                          <span>${active ? '✓ 선택됨' : '선택'}</span>
                        </button>
                      `;
                    })
                    .join('')}
                  <button
                    type="button"
                    data-set-rating="${novel.id}"
                    data-rating-val="☆☆☆☆ 미지정"
                    class="w-full text-center py-1.5 rounded-xl border border-dashed border-line text-[11px] font-semibold text-muted hover:bg-cardbg transition"
                  >
                    [☆☆☆☆ 미지정]으로 초기화
                  </button>
                </div>
              </div>

              <!-- 2) 특별전 (중복 선택 가능, 언제든 수정 가능) -->
              <div class="p-3 rounded-2xl bg-stonebg/80 border border-line space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-ink">2) 특별전 (중복 선택 가능)</span>
                  ${
                    hasRecipeSpecial
                      ? `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-sage/15 text-sage">완료 시 레시피분석 이동</span>`
                      : `<span class="text-[10px] text-muted">완료 시 팬트리 보관</span>`
                  }
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                  ${SPECIAL_EXHIBITIONS.map((sp) => {
                    const checked = currentSpecials.includes(sp.id);
                    return `
                      <button
                        type="button"
                        data-toggle-special="${novel.id}"
                        data-special-id="${sp.id}"
                        class="px-2.5 py-2 rounded-xl border text-xs font-bold text-left transition flex items-center gap-1.5 ${
                          checked
                            ? 'bg-amberwarm/25 border-amber-500 text-ink'
                            : 'bg-cardbg border-line text-muted hover:text-ink'
                        }"
                      >
                        <span>${checked ? '☑' : '☐'}</span>
                        <span class="truncate">${escapeHtml(sp.label)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- 3) 추가 태그 (작품별 ~5개 입력, 저장된 태그 풀에서 편하게 선택) -->
              <div class="p-3 rounded-2xl bg-stonebg/80 border border-line space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-ink">3) 추가 태그 (최대 5개)</span>
                  <span class="text-[11px] font-bold text-muted">${currentTags.length} / 5</span>
                </div>

                <!-- 현재 작품 태그 -->
                <div class="flex flex-wrap gap-1.5 min-h-[26px]">
                  ${
                    currentTags.length === 0
                      ? `<span class="text-[11px] text-muted">아직 추가된 태그가 없습니다.</span>`
                      : currentTags
                          .map(
                            (tg) => `
                              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-terracotta/15 text-terracottaDark text-xs font-bold">
                                #${escapeHtml(tg)}
                                <button
                                  type="button"
                                  data-remove-tag="${novel.id}"
                                  data-tag-val="${escapeHtml(tg)}"
                                  class="hover:text-red-700 font-extrabold ml-0.5"
                                  title="태그 제거"
                                >✕</button>
                              </span>
                            `
                          )
                          .join('')
                  }
                </div>

                <!-- 태그 직접 입력 -->
                <div class="flex gap-1.5">
                  <input
                    type="text"
                    data-tag-input="${novel.id}"
                    placeholder="새 태그 입력 (예: 사이다, 영지물)"
                    class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-cardbg border border-line text-xs font-medium focus:outline-none focus:border-terracotta"
                  />
                  <button
                    type="button"
                    data-add-tag-btn="${novel.id}"
                    class="px-3 py-2 rounded-xl bg-ink text-white text-xs font-bold shrink-0 transition active:scale-95"
                  >
                    추가
                  </button>
                </div>

                <!-- 저장된 태그 풀 빠른 선택 -->
                ${
                  state.globalTags.length > 0
                    ? `
                      <div>
                        <p class="text-[10px] font-bold text-muted mb-1">저장된 태그에서 탭하여 선택:</p>
                        <div class="flex flex-wrap gap-1">
                          ${state.globalTags
                            .map((poolTag) => {
                              const already = currentTags.includes(poolTag);
                              return `
                                <button
                                  type="button"
                                  data-pick-pool-tag="${novel.id}"
                                  data-pool-tag="${escapeHtml(poolTag)}"
                                  class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition ${
                                    already
                                      ? 'bg-sage/20 border-sage text-sage'
                                      : 'bg-cardbg border-line text-muted hover:text-ink'
                                  }"
                                >
                                  ${already ? '✓ ' : '+ '}#${escapeHtml(poolTag)}
                                </button>
                              `;
                            })
                            .join('')}
                        </div>
                      </div>
                    `
                    : ''
                }
              </div>

              <!-- 하단 버튼: 삭제 & 조리 완료 -->
              <div class="grid grid-cols-3 gap-2 pt-1">
                <button
                  type="button"
                  data-kitchen-delete="${novel.id}"
                  class="col-span-1 py-3 px-2 rounded-2xl bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-extrabold transition active:scale-95"
                >
                  🗑️ 삭제
                </button>
                <button
                  type="button"
                  data-kitchen-complete="${novel.id}"
                  class="col-span-2 py-3 px-3 rounded-2xl bg-sage hover:bg-emerald-800 text-white text-xs font-extrabold shadow-soft transition active:scale-95"
                >
                  ✅ 조리 완료 (${hasRecipeSpecial ? '레시피분석 이동' : '팬트리 보관'})
                </button>
              </div>
            </article>
          `;
        })
        .join('');

      // 이벤트 바인딩
      container.querySelectorAll('button[data-copy-title]').forEach((btn) => {
        btn.addEventListener('click', () => copyTitleForMunpia(btn.dataset.copyTitle));
      });

      container.querySelectorAll('button[data-set-rating]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const novel = state.novels.find((n) => n.id === btn.dataset.setRating);
          if (!novel) return;
          novel.rating = btn.dataset.ratingVal;
          saveState();
          showToast(`별점이 [${novel.rating}]로 설정되었습니다.`);
          renderApp();
        });
      });

      container.querySelectorAll('button[data-toggle-special]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const novel = state.novels.find((n) => n.id === btn.dataset.toggleSpecial);
          if (!novel) return;
          const spId = btn.dataset.specialId;
          novel.specials = novel.specials || [];
          if (novel.specials.includes(spId)) {
            novel.specials = novel.specials.filter((x) => x !== spId);
          } else {
            novel.specials.push(spId);
          }
          saveState();
          renderApp();
        });
      });

      const addTagToNovel = (novelId, rawTag) => {
        const novel = state.novels.find((n) => n.id === novelId);
        if (!novel) return;
        const cleanTag = (rawTag || '').replace(/^#+/, '').trim();
        if (!cleanTag) return;
        novel.tags = novel.tags || [];
        if (novel.tags.includes(cleanTag)) {
          showToast('이미 해당 작품에 추가된 태그입니다.', 'info');
          return;
        }
        if (novel.tags.length >= 5) {
          showToast('작품별 추가 태그는 최대 5개까지 설정할 수 있습니다.', 'error');
          return;
        }
        novel.tags.push(cleanTag);
        if (!state.globalTags.includes(cleanTag)) {
          state.globalTags.unshift(cleanTag);
        }
        saveState();
        showToast(`#${cleanTag} 태그가 추가되었습니다.`, 'success');
        renderApp();
      };

      container.querySelectorAll('button[data-add-tag-btn]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const nid = btn.dataset.addTagBtn;
          const input = container.querySelector(`input[data-tag-input="${nid}"]`);
          if (input) addTagToNovel(nid, input.value);
        });
      });

      container.querySelectorAll('input[data-tag-input]').forEach((input) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            addTagToNovel(input.dataset.tagInput, input.value);
          }
        });
      });

      container.querySelectorAll('button[data-pick-pool-tag]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const nid = btn.dataset.pickPoolTag;
          const tagVal = btn.dataset.poolTag;
          const novel = state.novels.find((n) => n.id === nid);
          if (!novel) return;
          if ((novel.tags || []).includes(tagVal)) {
            novel.tags = novel.tags.filter((t) => t !== tagVal);
            saveState();
            renderApp();
          } else {
            addTagToNovel(nid, tagVal);
          }
        });
      });

      container.querySelectorAll('button[data-remove-tag]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const novel = state.novels.find((n) => n.id === btn.dataset.removeTag);
          if (!novel) return;
          novel.tags = (novel.tags || []).filter((t) => t !== btn.dataset.tagVal);
          saveState();
          renderApp();
        });
      });

      container.querySelectorAll('button[data-kitchen-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteNovel(btn.dataset.kitchenDelete));
      });

      // 조리 완료 버튼: 조리실에서 제거, '레시피분석 (좋은소스)' 선택 시 레시피분석 이동, 그 외 팬트리 이동, 설거지 일별 카운트 기록
      container.querySelectorAll('button[data-kitchen-complete]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const novel = state.novels.find((n) => n.id === btn.dataset.kitchenComplete);
          if (!novel) return;

          const hasRecipe = (novel.specials || []).includes('recipe');
          novel.location = hasRecipe ? 'recipe' : 'pantry';
          if (hasRecipe) {
            novel.recipeCompleted = false;
            state.selectedRecipeNovelId = novel.id;
          }

          // 설거지 달력 일별 완료 기록 추가
          const today = getTodayStr();
          state.dishwashLogs[today] = state.dishwashLogs[today] || [];
          state.dishwashLogs[today].push({
            novelId: novel.id,
            title: novel.title,
            genre: novel.genre || '미지정',
            rating: novel.rating || '☆☆☆☆ 미지정',
            specials: [...(novel.specials || [])],
            completedAt: new Date().toTimeString().slice(0, 5),
          });
          state.selectedDishDate = today;
          state.selectedDishMonth = today.slice(0, 7);

          saveState();
          showToast(
            hasRecipe
              ? `"${novel.title}" 조리 완료! [레시피분석]으로 이동했습니다.`
              : `"${novel.title}" 조리 완료! [팬트리]에 보관되었습니다.`,
            'success'
          );
          renderApp();
        });
      });
    }

    // =========================================================================
    // 3. 미슐랭 (🏅) : 티어별 그래프 & 클릭 필터링 & 메달 뱃지 & 수정/삭제
    // =========================================================================
    function renderMichelinView(container) {
      const michelinWorks = state.novels.filter((n) => hasMichelinInput(n));

      // 티어별 카운트 계산
      const countsByTier = {};
      MICHELIN_TIERS.forEach((t) => (countsByTier[t] = 0));
      michelinWorks.forEach((n) => {
        const t = n.michelin?.tier || '분석 전';
        countsByTier[t] = (countsByTier[t] || 0) + 1;
      });
      const maxCount = Math.max(1, ...Object.values(countsByTier));

      const filteredWorks = state.selectedMichelinTier
        ? michelinWorks.filter((n) => (n.michelin?.tier || '분석 전') === state.selectedMichelinTier)
        : michelinWorks;

      container.innerHTML = `
        <!-- 미슐랭 티어별 그래프 카드 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3.5">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-extrabold text-ink">유료 전환 티어별 현황 그래프</h3>
              <p class="text-[11px] text-muted">티어를 탭하면 해당 티어 작품만 모아볼 수 있어요</p>
            </div>
            ${
              state.selectedMichelinTier
                ? `<button id="clear-mich-tier" type="button" class="text-[11px] font-bold px-2.5 py-1 rounded-xl bg-terracotta/12 text-terracottaDark">전체보기</button>`
                : `<span class="text-[11px] font-bold text-muted">총 ${michelinWorks.length}편</span>`
            }
          </div>

          <div class="space-y-2.5 pt-1">
            ${MICHELIN_TIERS.map((tier) => {
              const cnt = countsByTier[tier] || 0;
              const widthPct = Math.round((cnt / maxCount) * 100);
              const isSelected = state.selectedMichelinTier === tier;
              const barColor =
                tier === '전환 1티어'
                  ? 'bg-amber-500'
                  : tier === '전환 2티어'
                  ? 'bg-slate-600'
                  : tier === '전환 3티어'
                  ? 'bg-orange-500'
                  : tier === '전환 4티어'
                  ? 'bg-emerald-600'
                  : tier === '폐사'
                  ? 'bg-red-400'
                  : 'bg-terracotta/70';

              return `
                <button
                  type="button"
                  data-mich-tier-btn="${escapeHtml(tier)}"
                  class="w-full text-left p-2 rounded-2xl border transition ${
                    isSelected
                      ? 'bg-amber-50 border-terracotta shadow-sm'
                      : 'bg-stonebg/65 border-line hover:border-terracotta/40'
                  }"
                >
                  <div class="flex items-center justify-between text-xs mb-1">
                    <span class="font-extrabold text-ink flex items-center gap-1">
                      ${escapeHtml(tier)}
                      ${getMichelinMedalBadge(tier)}
                    </span>
                    <span class="font-extrabold text-terracottaDark">${cnt}편</span>
                  </div>
                  <div class="w-full h-2.5 rounded-full bg-white overflow-hidden border border-line/60">
                    <div class="h-full ${barColor} rounded-full transition-all duration-300" style="width: ${cnt === 0 ? 0 : Math.max(8, widthPct)}%"></div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </section>

        <!-- 티어별 작품 리스트 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-ink">
              ${state.selectedMichelinTier ? `[${escapeHtml(state.selectedMichelinTier)}] 작품 목록` : '전체 미슐랭 작품 목록'}
            </h3>
            <span class="text-xs font-bold text-muted">${filteredWorks.length}편</span>
          </div>

          ${
            filteredWorks.length === 0
              ? `
                <div class="text-center py-7 rounded-2xl bg-stonebg/70 border border-dashed border-line">
                  <p class="text-2xl mb-1">🏅</p>
                  <p class="text-xs font-bold text-muted">해당 티어에 등록된 작품이 없습니다.</p>
                </div>
              `
              : filteredWorks
                  .map(
                    (novel) => `
                      <div class="p-3.5 rounded-2xl bg-stonebg/75 border border-line space-y-2">
                        <div class="flex items-start justify-between gap-2">
                          <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                              <h4 class="text-sm font-extrabold text-ink break-all">${escapeHtml(novel.title)}</h4>
                              ${getMichelinMedalBadge(novel.michelin?.tier)}
                            </div>
                            <p class="text-xs text-muted mt-0.5">
                              ${escapeHtml(novel.genre || '미지정')} · ${escapeHtml(novel.author || '작가 미상')}
                            </p>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                              <span class="px-2 py-0.5 rounded-lg bg-white border border-line text-[11px] font-bold text-ink">
                                유료도달: ${escapeHtml(novel.michelin?.tier || '분석 전')}
                              </span>
                              <span class="px-2 py-0.5 rounded-lg bg-white border border-line text-[11px] font-bold text-terracottaDark">
                                전환값: ${novel.michelin?.conversionRate !== '' && novel.michelin?.conversionRate !== undefined ? escapeHtml(novel.michelin.conversionRate) : '-'}
                              </span>
                              <span class="px-2 py-0.5 rounded-lg bg-white border border-line text-[11px] font-bold text-ink">
                                무료최종화: ${novel.michelin?.freeEndEpisode !== '' && novel.michelin?.freeEndEpisode !== undefined ? `${escapeHtml(novel.michelin.freeEndEpisode)}화` : '-'}
                              </span>
                            </div>
                          </div>
                          <button
                            type="button"
                            data-edit-michelin="${novel.id}"
                            class="px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-line text-xs font-extrabold text-ink shrink-0 transition active:scale-95"
                          >
                            ✏️ 수정하기
                          </button>
                        </div>
                      </div>
                    `
                  )
                  .join('')
          }
        </section>
      `;

      container.querySelectorAll('button[data-mich-tier-btn]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const t = btn.dataset.michTierBtn;
          state.selectedMichelinTier = state.selectedMichelinTier === t ? null : t;
          saveState();
          renderMichelinView(container);
        });
      });

      document.getElementById('clear-mich-tier')?.addEventListener('click', () => {
        state.selectedMichelinTier = null;
        saveState();
        renderMichelinView(container);
      });

      container.querySelectorAll('button[data-edit-michelin]').forEach((btn) => {
        btn.addEventListener('click', () => openFullEditModal(btn.dataset.editMichelin, 'michelin'));
      });
    }

    // =========================================================================
    // 4. 팬트리 (🗄️) : 최근순·별점순·레전드·슈퍼노멀·냉장고 & 수정/삭제 & 레시피분석 송출
    // =========================================================================
    function renderPantryView(container) {
      const pantryNovels = state.novels.filter((n) => n.location === 'pantry');

      const getScore = (ratingStr) => {
        const found = STAR_RATINGS.find((r) => r.value === ratingStr);
        return found ? found.score : 0;
      };

      let list = [...pantryNovels];
      switch (state.pantryFilter) {
        case 'rating':
          list.sort((a, b) => getScore(b.rating) - getScore(a.rating) || (b.order || 0) - (a.order || 0));
          break;
        case 'legend':
          list = list.filter((n) => (n.specials || []).includes('legend'));
          break;
        case 'supernormal':
          list = list.filter((n) => (n.specials || []).includes('supernormal'));
          break;
        case 'fridge':
          list = list.filter((n) => (n.specials || []).includes('fridge'));
          break;
        case 'recent':
        default:
          list.sort((a, b) => (b.order || 0) - (a.order || 0));
          break;
      }

      const filterButtons = [
        { id: 'recent', label: '최근순' },
        { id: 'rating', label: '별점순' },
        { id: 'legend', label: '레전드' },
        { id: 'supernormal', label: '슈퍼노멀' },
        { id: 'fridge', label: '냉장고' },
      ];

      container.innerHTML = `
        <!-- 분류/정렬 버튼 바 -->
        <section class="bg-cardbg border border-line rounded-3xl p-3.5 shadow-soft space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-ink">팬트리 분류 & 정렬</span>
            <span class="text-[11px] font-bold text-muted">${list.length}편 표시</span>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${filterButtons
              .map((fb) => {
                const active = state.pantryFilter === fb.id;
                return `
                  <button
                    type="button"
                    data-pantry-filter="${fb.id}"
                    class="px-3 py-2 rounded-2xl text-xs font-extrabold whitespace-nowrap transition active:scale-95 ${
                      active
                        ? 'bg-terracotta text-white shadow-sm'
                        : 'bg-stonebg text-muted hover:text-ink border border-line'
                    }"
                  >
                    ${fb.label}
                  </button>
                `;
              })
              .join('')}
          </div>
        </section>

        <!-- 팬트리 작품 리스트 -->
        <section class="space-y-3">
          ${
            list.length === 0
              ? `
                <div class="bg-cardbg border border-line rounded-3xl p-8 text-center shadow-soft">
                  <p class="text-3xl mb-1.5">🗄️</p>
                  <p class="text-xs font-extrabold text-muted">선택한 분류에 해당하는 작품이 없습니다.</p>
                </div>
              `
              : list
                  .map((novel) => {
                    const spLabels = (novel.specials || [])
                      .map((id) => SPECIAL_EXHIBITIONS.find((s) => s.id === id)?.badge)
                      .filter(Boolean);

                    return `
                      <article class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3">
                        <div class="flex items-start justify-between gap-2">
                          <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-stonebg border border-line text-ink">
                                ${escapeHtml(novel.genre || '미지정')}
                              </span>
                              <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 text-amber-900">
                                ${escapeHtml(novel.rating || '☆☆☆☆ 미지정')}
                              </span>
                              ${spLabels
                                .map(
                                  (sl) =>
                                    `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-terracotta/12 text-terracottaDark">${escapeHtml(sl)}</span>`
                                )
                                .join('')}
                            </div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                              <h3 class="text-base font-extrabold text-ink break-all">${escapeHtml(novel.title)}</h3>
                              ${getMichelinMedalBadge(novel.michelin?.tier)}
                            </div>
                            <p class="text-xs text-muted mt-0.5">작가: ${escapeHtml(novel.author || '미상')}</p>

                            ${
                              (novel.tags || []).length > 0
                                ? `<div class="flex flex-wrap gap-1 mt-2">
                                    ${novel.tags
                                      .map(
                                        (t) =>
                                          `<span class="px-2 py-0.5 rounded-lg bg-stonebg text-[11px] font-semibold text-muted">#${escapeHtml(t)}</span>`
                                      )
                                      .join('')}
                                   </div>`
                                : ''
                            }
                          </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-line/70">
                          <button
                            type="button"
                            data-pantry-edit="${novel.id}"
                            class="py-2.5 px-3 rounded-2xl bg-stonebg hover:bg-line/70 border border-line text-xs font-extrabold text-ink transition active:scale-95"
                          >
                            ✏️ 수정하기
                          </button>
                          <button
                            type="button"
                            data-pantry-to-recipe="${novel.id}"
                            class="py-2.5 px-3 rounded-2xl bg-sage hover:bg-emerald-800 text-white text-xs font-extrabold transition active:scale-95"
                          >
                            📖 레시피분석으로 다시 보내기
                          </button>
                        </div>
                      </article>
                    `;
                  })
                  .join('')
          }
        </section>
      `;

      container.querySelectorAll('button[data-pantry-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.pantryFilter = btn.dataset.pantryFilter;
          saveState();
          renderPantryView(container);
        });
      });

      container.querySelectorAll('button[data-pantry-edit]').forEach((btn) => {
        btn.addEventListener('click', () => openFullEditModal(btn.dataset.pantryEdit, 'pantry'));
      });

      container.querySelectorAll('button[data-pantry-to-recipe]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const novel = state.novels.find((n) => n.id === btn.dataset.pantryToRecipe);
          if (!novel) return;
          novel.location = 'recipe';
          novel.recipeCompleted = false;
          if (!(novel.specials || []).includes('recipe')) {
            novel.specials = [...(novel.specials || []), 'recipe'];
          }
          state.selectedRecipeNovelId = novel.id;
          state.activeCategory = 'recipe';
          saveState();
          showToast(`"${novel.title}"이(가) [레시피분석]으로 이동했습니다!`, 'success');
          renderApp();
        });
      });
    }

    // 전체 세부 수정 모달 (미슐랭 & 팬트리 공용 — 삭제 버튼 포함)
    function openFullEditModal(novelId, origin = 'pantry') {
      const novel = state.novels.find((n) => n.id === novelId);
      if (!novel) return;

      openModal(
        `세부 수정 — ${novel.title}`,
        `
        <div class="space-y-3.5">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-extrabold text-ink mb-1">제목</label>
              <input id="full-edit-title" type="text" value="${escapeHtml(novel.title)}" class="w-full px-3 py-2 rounded-xl bg-stonebg border border-line text-xs font-bold" />
            </div>
            <div>
              <label class="block text-xs font-extrabold text-ink mb-1">작가명</label>
              <input id="full-edit-author" type="text" value="${escapeHtml(novel.author || '')}" class="w-full px-3 py-2 rounded-xl bg-stonebg border border-line text-xs font-medium" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-extrabold text-ink mb-1">장르</label>
              <select id="full-edit-genre" class="w-full px-2.5 py-2 rounded-xl bg-stonebg border border-line text-xs font-semibold">
                <option value="">미선택</option>
                ${LABEL_GENRES.map(
                  (g) => `<option value="${escapeHtml(g)}" ${novel.genre === g ? 'selected' : ''}>${escapeHtml(g)}</option>`
                ).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-extrabold text-ink mb-1">별점</label>
              <select id="full-edit-rating" class="w-full px-2.5 py-2 rounded-xl bg-stonebg border border-line text-xs font-semibold">
                ${STAR_RATINGS.map(
                  (r) => `<option value="${escapeHtml(r.value)}" ${(novel.rating || '☆☆☆☆ 미지정') === r.value ? 'selected' : ''}>${escapeHtml(r.value)}</option>`
                ).join('')}
              </select>
            </div>
          </div>

          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-2">
            <span class="block text-xs font-extrabold text-ink">미슐랭 지표</span>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <span class="block text-[10px] font-bold text-muted mb-1">유료 도달</span>
                <select id="full-edit-tier" class="w-full px-2 py-2 rounded-xl bg-white border border-line text-xs font-semibold">
                  ${MICHELIN_TIERS.map(
                    (t) => `<option value="${escapeHtml(t)}" ${(novel.michelin?.tier || '분석 전') === t ? 'selected' : ''}>${escapeHtml(t)}</option>`
                  ).join('')}
                </select>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-muted mb-1">전환값</span>
                <input id="full-edit-conv" type="number" step="0.1" value="${escapeHtml(novel.michelin?.conversionRate ?? '')}" class="w-full px-2 py-2 rounded-xl bg-white border border-line text-xs" />
              </div>
              <div>
                <span class="block text-[10px] font-bold text-muted mb-1">무료 최종화</span>
                <input id="full-edit-free" type="number" min="0" value="${escapeHtml(novel.michelin?.freeEndEpisode ?? '')}" class="w-full px-2 py-2 rounded-xl bg-white border border-line text-xs" />
              </div>
            </div>
          </div>

          <div>
            <span class="block text-xs font-extrabold text-ink mb-1.5">특별전 (중복 선택)</span>
            <div class="grid grid-cols-2 gap-1.5" id="full-edit-specials">
              ${SPECIAL_EXHIBITIONS.map((sp) => {
                const checked = (novel.specials || []).includes(sp.id) ? 'checked' : '';
                return `
                  <label class="flex items-center gap-1.5 bg-stonebg border border-line rounded-xl px-2.5 py-2 text-xs font-semibold cursor-pointer">
                    <input type="checkbox" value="${sp.id}" ${checked} class="accent-[#C85A32]" />
                    <span class="truncate">${escapeHtml(sp.label)}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <label class="block text-xs font-extrabold text-ink mb-1">태그 (쉼표로 구분, 최대 5개)</label>
            <input
              id="full-edit-tags"
              type="text"
              value="${escapeHtml((novel.tags || []).join(', '))}"
              placeholder="예: 사이다, 영지경영, 회귀"
              class="w-full px-3 py-2 rounded-xl bg-stonebg border border-line text-xs font-medium"
            />
          </div>

          <div class="flex flex-col gap-2 pt-2">
            <button id="full-edit-save" type="button" class="w-full py-2.5 rounded-2xl bg-terracotta hover:bg-terracottaDark text-white text-xs font-extrabold">
              변경사항 저장
            </button>
            <button id="full-edit-delete" type="button" class="w-full py-2.5 rounded-2xl bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-extrabold">
              🗑️ 해당 작품 삭제
            </button>
          </div>
        </div>
        `
      );

      document.getElementById('full-edit-save').addEventListener('click', () => {
        const titleVal = (document.getElementById('full-edit-title').value || '').trim();
        if (!titleVal) {
          showToast('제목을 입력해 주세요.', 'error');
          return;
        }
        const dup = findDuplicateNovel(titleVal, novel.id);
        if (dup) {
          showToast('이미 등록된 작품 제목입니다.', 'error');
          return;
        }

        const parsedTags = (document.getElementById('full-edit-tags').value || '')
          .split(',')
          .map((t) => t.replace(/^#+/, '').trim())
          .filter(Boolean)
          .slice(0, 5);

        parsedTags.forEach((pt) => {
          if (!state.globalTags.includes(pt)) state.globalTags.unshift(pt);
        });

        novel.title = titleVal;
        novel.author = (document.getElementById('full-edit-author').value || '').trim();
        novel.genre = document.getElementById('full-edit-genre').value;
        novel.rating = document.getElementById('full-edit-rating').value;
        novel.michelin = {
          tier: document.getElementById('full-edit-tier').value || '분석 전',
          conversionRate: document.getElementById('full-edit-conv').value,
          freeEndEpisode: document.getElementById('full-edit-free').value,
        };
        novel.specials = Array.from(
          document.querySelectorAll('#full-edit-specials input[type="checkbox"]:checked')
        ).map((cb) => cb.value);
        novel.tags = parsedTags;

        saveState();
        closeModal();
        showToast(`"${novel.title}" 항목이 수정되었습니다.`, 'success');
        renderApp();
      });

      document.getElementById('full-edit-delete').addEventListener('click', () => deleteNovel(novel.id));
    }

    // =========================================================================
    // 5. 레시피분석 (📖) : 상단 [메타데이터] 취향 그래프 + 7대 레시피 계층 선택 + 분석완료
    // =========================================================================
    function hasAnyRecipeSelected(novel) {
      const r = novel.recipe || {};
      return Object.keys(RECIPE_DIMENSIONS).some((dimKey) => {
        const d = r[dimKey];
        return d && ((d.groups && d.groups.length > 0) || (d.subs && d.subs.length > 0));
      });
    }

    function renderRecipeView(container) {
      // 레시피가 등록된 작품들의 장르 분포 자동 집계 ([메타데이터])
      const worksWithRecipe = state.novels.filter((n) => hasAnyRecipeSelected(n));
      const genreCounts = {};
      worksWithRecipe.forEach((n) => {
        const g = n.genre || '기타';
        genreCounts[g] = (genreCounts[g] || 0) + 1;
      });
      const sortedGenres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);
      const maxGenreCnt = Math.max(1, ...sortedGenres.map(([, c]) => c));

      // 현재 레시피분석 대상 큐 (분석완료 누른 작품은 보이지 않음)
      const activeRecipeQueue = state.novels.filter(
        (n) => n.location === 'recipe' && !n.recipeCompleted
      );

      if (
        !state.selectedRecipeNovelId ||
        !activeRecipeQueue.some((n) => n.id === state.selectedRecipeNovelId)
      ) {
        state.selectedRecipeNovelId = activeRecipeQueue[0]?.id || null;
      }

      const selectedNovel = activeRecipeQueue.find((n) => n.id === state.selectedRecipeNovelId) || null;

      container.innerHTML = `
        <!-- 상단 [메타데이터] 취향 분석 그래프 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-sage/15 text-sage">메타데이터</span>
              <h3 class="text-sm font-extrabold text-ink mt-1">내 레시피 취향 장르 분석</h3>
            </div>
            <span class="text-[11px] font-bold text-muted">레시피 등록 ${worksWithRecipe.length}편</span>
          </div>

          ${
            sortedGenres.length === 0
              ? `<p class="text-xs text-muted bg-stonebg/70 p-3 rounded-2xl">아직 레시피가 등록된 작품이 없습니다. 아래에서 레시피를 선택해 보세요!</p>`
              : `
                <div class="space-y-2">
                  ${sortedGenres
                    .map(([gName, cnt]) => {
                      const pct = Math.round((cnt / worksWithRecipe.length) * 100);
                      const barW = Math.round((cnt / maxGenreCnt) * 100);
                      return `
                        <div>
                          <div class="flex justify-between text-xs mb-0.5">
                            <span class="font-bold text-ink">${escapeHtml(gName)}</span>
                            <span class="font-extrabold text-terracottaDark">${cnt}편 (${pct}%)</span>
                          </div>
                          <div class="w-full h-2 rounded-full bg-stonebg overflow-hidden">
                            <div class="h-full bg-terracotta rounded-full" style="width: ${Math.max(10, barW)}%"></div>
                          </div>
                        </div>
                      `;
                    })
                    .join('')}
                </div>
              `
          }
        </section>

        <!-- 분석 대상 작품 선택 및 7대 레시피 편집 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-ink">분석 대기 작품 선택 (${activeRecipeQueue.length}편)</h3>
            <span class="text-[11px] text-muted">큰 계열 필수 아님 · 중복 선택 가능</span>
          </div>

          ${
            activeRecipeQueue.length === 0
              ? `
                <div class="text-center py-7 px-3 rounded-2xl bg-stonebg/70 border border-dashed border-line space-y-1.5">
                  <p class="text-2xl">📖</p>
                  <p class="text-xs font-extrabold text-ink">현재 레시피분석 대기 중인 작품이 없습니다.</p>
                  <p class="text-[11px] text-muted">조리실에서 '레시피분석 (좋은소스)' 체크 후 조리 완료하거나, 팬트리에서 '레시피분석으로 다시 보내기'를 눌러 보세요.</p>
                </div>
              `
              : `
                <!-- 작품 선택 칩 -->
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  ${activeRecipeQueue.map((n) => {
                    const active = selectedNovel && selectedNovel.id === n.id;
                    return `
                      <button
                        type="button"
                        data-select-recipe-novel="${n.id}"
                        class="px-3 py-2 rounded-2xl text-xs font-extrabold whitespace-nowrap border transition active:scale-95 ${
                          active
                            ? 'bg-ink text-white border-ink shadow-sm'
                            : 'bg-stonebg text-ink border-line hover:border-terracotta/50'
                        }"
                      >
                        ${escapeHtml(n.title)}
                      </button>
                    `;
                  }).join('')}
                </div>

                ${selectedNovel ? renderSelectedNovelRecipeEditor(selectedNovel) : ''}
              `
          }
        </section>
      `;

      container.querySelectorAll('button[data-select-recipe-novel]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedRecipeNovelId = btn.dataset.selectRecipeNovel;
          saveState();
          renderRecipeView(container);
        });
      });

      if (selectedNovel) {
        bindRecipeEditorEvents(container, selectedNovel);
      }
    }

    function renderSelectedNovelRecipeEditor(novel) {
      novel.recipe = novel.recipe || createEmptyRecipe();

      const dimCardsHtml = Object.entries(RECIPE_DIMENSIONS)
        .map(([dimKey, dimData]) => {
          const picked = novel.recipe[dimKey] || { groups: [], subs: [] };
          const pickedGroups = picked.groups || [];
          const pickedSubs = picked.subs || [];

          return `
            <div class="p-3 rounded-2xl bg-stonebg/75 border border-line space-y-2.5">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-extrabold text-ink">${escapeHtml(dimData.label)}</h4>
                <span class="text-[10px] font-bold text-terracottaDark">
                  큰계열 ${pickedGroups.length} · 세부 ${pickedSubs.length}
                </span>
              </div>

              <div class="space-y-1.5">
                ${dimData.groups
                  .map((grp) => {
                    const isGroupSelected = pickedGroups.includes(grp.id);
                    const selectedSubsInGroup = grp.subs.filter((s) => pickedSubs.includes(s));

                    return `
                      <div class="rounded-xl bg-cardbg border border-line/90 overflow-hidden">
                        <div class="flex items-center justify-between px-2.5 py-2 gap-1.5">
                          <!-- 큰 계열 선택 버튼 (큰 계열만 선택해도 OK!) -->
                          <button
                            type="button"
                            data-recipe-group="${dimKey}"
                            data-group-id="${grp.id}"
                            class="flex-1 min-w-0 text-left flex items-center gap-1.5 text-xs font-bold transition ${
                              isGroupSelected ? 'text-terracottaDark font-extrabold' : 'text-ink'
                            }"
                          >
                            <span>${isGroupSelected ? '☑' : '☐'}</span>
                            <span class="truncate">${escapeHtml(grp.name)}</span>
                            ${
                              selectedSubsInGroup.length > 0
                                ? `<span class="px-1.5 py-0.2 rounded-full bg-sage/15 text-sage text-[10px] shrink-0">+${selectedSubsInGroup.length}</span>`
                                : ''
                            }
                          </button>

                          <!-- 세부 항목 펼치기/접기 토글 -->
                          <button
                            type="button"
                            data-toggle-subs="${dimKey}_${grp.id}"
                            class="px-2 py-1 rounded-lg bg-stonebg hover:bg-line text-[10px] font-bold text-muted shrink-0"
                          >
                            세부▾
                          </button>
                        </div>

                        <!-- 세부 항목 패널 (기본 접힘 or 선택된 세부 항목이 있으면 표시 가능하도록 토글) -->
                        <div
                          id="subs-panel-${dimKey}_${grp.id}"
                          class="${selectedSubsInGroup.length > 0 ? '' : 'hidden'} px-2.5 pb-2.5 pt-1 border-t border-line/60 bg-stonebg/40"
                        >
                          <p class="text-[10px] text-muted mb-1.5">세부 항목 (선택 시 자동 저장 · 중복 가능)</p>
                          <div class="flex flex-wrap gap-1">
                            ${grp.subs
                              .map((subName) => {
                                const subActive = pickedSubs.includes(subName);
                                return `
                                  <button
                                    type="button"
                                    data-recipe-sub="${dimKey}"
                                    data-group-id="${grp.id}"
                                    data-sub-name="${escapeHtml(subName)}"
                                    class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition ${
                                      subActive
                                        ? 'bg-terracotta text-white border-terracotta'
                                        : 'bg-white text-ink border-line hover:border-terracotta/50'
                                    }"
                                  >
                                    ${subActive ? '✓ ' : ''}${escapeHtml(subName)}
                                  </button>
                                `;
                              })
                              .join('')}
                          </div>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          `;
        })
        .join('');

      return `
        <div class="space-y-3 pt-1">
          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-200 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-xs font-extrabold text-ink truncate">선택작: ${escapeHtml(novel.title)}</p>
              <p class="text-[11px] text-muted">${escapeHtml(novel.genre || '미지정')} · ${escapeHtml(novel.author || '작가 미상')}</p>
            </div>
            <button
              type="button"
              id="btn-recipe-complete"
              class="px-3.5 py-2 rounded-2xl bg-sage hover:bg-emerald-800 text-white text-xs font-extrabold shrink-0 shadow-sm transition active:scale-95"
            >
              ✓ 분석완료
            </button>
          </div>

          ${dimCardsHtml}

          <button
            type="button"
            id="btn-recipe-complete-bottom"
            class="w-full py-3 rounded-2xl bg-sage hover:bg-emerald-800 text-white text-xs font-extrabold shadow-soft transition active:scale-95"
          >
            ✓ 분석완료 (레시피분석 목록에서 숨김)
          </button>
        </div>
      `;
    }

    function bindRecipeEditorEvents(container, novel) {
      novel.recipe = novel.recipe || createEmptyRecipe();

      // 큰 계열 토글
      container.querySelectorAll('button[data-recipe-group]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const dimKey = btn.dataset.recipeGroup;
          const groupId = btn.dataset.groupId;
          const dimObj = novel.recipe[dimKey] || { groups: [], subs: [] };
          if (dimObj.groups.includes(groupId)) {
            dimObj.groups = dimObj.groups.filter((g) => g !== groupId);
          } else {
            dimObj.groups.push(groupId);
          }
          novel.recipe[dimKey] = dimObj;
          saveState();
          renderRecipeView(container);
        });
      });

      // 세부 항목 패널 펼치기/접기
      container.querySelectorAll('button[data-toggle-subs]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const panel = document.getElementById(`subs-panel-${btn.dataset.toggleSubs}`);
          if (panel) panel.classList.toggle('hidden');
        });
      });

      // 세부 항목 토글 (세부 선택 시 해당 큰 계열도 자동으로 함께 체크해 주면 메타/계층 파악에 유리)
      container.querySelectorAll('button[data-recipe-sub]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const dimKey = btn.dataset.recipeSub;
          const groupId = btn.dataset.groupId;
          const subName = btn.dataset.subName;
          const dimObj = novel.recipe[dimKey] || { groups: [], subs: [] };

          if (dimObj.subs.includes(subName)) {
            dimObj.subs = dimObj.subs.filter((s) => s !== subName);
          } else {
            dimObj.subs.push(subName);
            if (!dimObj.groups.includes(groupId)) {
              dimObj.groups.push(groupId);
            }
          }
          novel.recipe[dimKey] = dimObj;
          saveState();
          renderRecipeView(container);
        });
      });

      // 분석완료 버튼: 레시피분석 항목에서 더 이상 보이지 않게 숨김
      const handleCompleteRecipe = () => {
        novel.recipeCompleted = true;
        saveState();
        showToast(`"${novel.title}" 레시피 분석완료! 목록에서 숨김 처리되었습니다.`, 'success');
        renderApp();
      };

      document.getElementById('btn-recipe-complete')?.addEventListener('click', handleCompleteRecipe);
      document.getElementById('btn-recipe-complete-bottom')?.addEventListener('click', handleCompleteRecipe);
    }

    // =========================================================================
    // 6. 설거지 (🧼) : 일별 조리 완료 달력 · 월별 통계 · 데이터 백업 및 복구
    // =========================================================================
    function getMonthlyDishwashCount(yearMonthStr) {
      if (!yearMonthStr) return 0;
      let total = 0;
      Object.entries(state.dishwashLogs || {}).forEach(([dateKey, arr]) => {
        if (dateKey.startsWith(yearMonthStr) && Array.isArray(arr)) {
          total += arr.length;
        }
      });
      return total;
    }

    function renderDishwashView(container) {
      const monthStr = state.selectedDishMonth || getCurrentMonthStr();
      const [yStr, mStr] = monthStr.split('-').map(Number);
      const year = yStr || new Date().getFullYear();
      const month = mStr || new Date().getMonth() + 1;

      const firstDayOfMonth = new Date(year, month - 1, 1);
      const startWeekday = firstDayOfMonth.getDay(); // 0(일)~6(토)
      const daysInMonth = new Date(year, month, 0).getDate();

      // 월별 통계 계산
      let monthTotal = 0;
      let peakDay = null;
      let peakCount = 0;
      const dayCounts = {};

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cnt = (state.dishwashLogs[key] || []).length;
        dayCounts[key] = cnt;
        monthTotal += cnt;
        if (cnt > peakCount) {
          peakCount = cnt;
          peakDay = `${month}/${d}`;
        }
      }
      const dailyAvg = (monthTotal / daysInMonth).toFixed(1);

      const selectedDate = state.selectedDishDate || getTodayStr();
      const selectedDateWorks = state.dishwashLogs[selectedDate] || [];

      const shiftMonth = (delta) => {
        const dt = new Date(year, month - 1 + delta, 1);
        const ny = dt.getFullYear();
        const nm = String(dt.getMonth() + 1).padStart(2, '0');
        state.selectedDishMonth = `${ny}-${nm}`;
        state.selectedDishDate = `${ny}-${nm}-01`;
        saveState();
        renderApp();
      };

      // 달력 셀 구성
      const calendarCells = [];
      for (let i = 0; i < startWeekday; i++) {
        calendarCells.push(`<div class="h-12 rounded-xl bg-stonebg/30"></div>`);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cnt = dayCounts[dateKey] || 0;
        const isSelected = dateKey === selectedDate;
        const isToday = dateKey === getTodayStr();

        calendarCells.push(`
          <button
            type="button"
            data-dish-date="${dateKey}"
            class="h-12 rounded-xl border flex flex-col items-center justify-center transition active:scale-95 ${
              isSelected
                ? 'bg-terracotta text-white border-terracotta shadow-sm'
                : isToday
                ? 'bg-amber-50 border-amber-400 text-ink'
                : 'bg-stonebg/75 border-line text-ink hover:border-terracotta/50'
            }"
          >
            <span class="text-[11px] font-bold leading-none">${d}</span>
            ${
              cnt > 0
                ? `<span class="mt-1 px-1.5 py-0.2 rounded-full text-[9px] font-extrabold ${
                    isSelected ? 'bg-white text-terracottaDark' : 'bg-sage/20 text-sage'
                  }">${cnt}편</span>`
                : `<span class="mt-1 text-[9px] opacity-40">-</span>`
            }
          </button>
        `);
      }

      container.innerHTML = `
        <!-- 월별 통계 요약 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3">
          <div class="flex items-center justify-between">
            <button
              type="button"
              id="prev-dish-month"
              class="px-2.5 py-1.5 rounded-xl bg-stonebg hover:bg-line border border-line text-xs font-extrabold"
            >
              ◀ 이전달
            </button>
            <h3 class="text-sm font-extrabold text-ink">${year}년 ${month}월 조리 완료 통계</h3>
            <button
              type="button"
              id="next-dish-month"
              class="px-2.5 py-1.5 rounded-xl bg-stonebg hover:bg-line border border-line text-xs font-extrabold"
            >
              다음달 ▶
            </button>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div class="p-2.5 rounded-2xl bg-stonebg border border-line text-center">
              <span class="block text-[10px] font-bold text-muted">월간 완료</span>
              <span class="text-base font-extrabold text-terracottaDark">${monthTotal}편</span>
            </div>
            <div class="p-2.5 rounded-2xl bg-stonebg border border-line text-center">
              <span class="block text-[10px] font-bold text-muted">일평균</span>
              <span class="text-base font-extrabold text-ink">${dailyAvg}편</span>
            </div>
            <div class="p-2.5 rounded-2xl bg-stonebg border border-line text-center">
              <span class="block text-[10px] font-bold text-muted">최다 완료일</span>
              <span class="text-sm font-extrabold text-sage">${peakCount > 0 ? `${peakDay} (${peakCount}편)` : '-'}</span>
            </div>
          </div>

          <!-- 달력 그리드 -->
          <div class="pt-1">
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-extrabold text-muted mb-1">
              <span class="text-red-600">일</span>
              <span>월</span>
              <span>화</span>
              <span>수</span>
              <span>목</span>
              <span>금</span>
              <span class="text-blue-600">토</span>
            </div>
            <div class="grid grid-cols-7 gap-1">
              ${calendarCells.join('')}
            </div>
          </div>
        </section>

        <!-- 선택한 날짜 완료 작품 상세 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-extrabold text-ink">📅 ${escapeHtml(selectedDate)} 조리 완료 내역</h3>
            <span class="text-[11px] font-bold text-terracottaDark">${selectedDateWorks.length}편</span>
          </div>

          ${
            selectedDateWorks.length === 0
              ? `<p class="text-xs text-muted bg-stonebg/70 p-3 rounded-2xl">해당 날짜에 조리 완료된 작품 기록이 없습니다.</p>`
              : selectedDateWorks
                  .map(
                    (w) => `
                      <div class="p-3 rounded-2xl bg-stonebg/75 border border-line flex items-center justify-between gap-2">
                        <div class="min-w-0">
                          <p class="text-xs font-extrabold text-ink truncate">${escapeHtml(w.title)}</p>
                          <p class="text-[11px] text-muted">${escapeHtml(w.genre)} · ${escapeHtml(w.rating)}</p>
                        </div>
                        <span class="text-[10px] font-bold text-muted shrink-0">${escapeHtml(w.completedAt || '')}</span>
                      </div>
                    `
                  )
                  .join('')
          }
        </section>

        <!-- 데이터 백업 및 복구 -->
        <section class="bg-cardbg border border-line rounded-3xl p-4 shadow-soft space-y-3">
          <div>
            <h3 class="text-sm font-extrabold text-ink">💾 데이터 백업 및 복구</h3>
            <p class="text-[11px] text-muted mt-0.5">전체 작품, 별점, 미슐랭, 팬트리, 레시피, 태그, 캘린더 기록을 저장하거나 복구합니다.</p>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button
              id="btn-backup-download"
              type="button"
              class="py-2.5 px-3 rounded-2xl bg-ink hover:bg-neutral-800 text-white text-xs font-extrabold transition active:scale-95"
            >
              ⬇️ JSON 백업 다운로드
            </button>
            <button
              id="btn-backup-copy"
              type="button"
              class="py-2.5 px-3 rounded-2xl bg-stonebg hover:bg-line border border-line text-ink text-xs font-extrabold transition active:scale-95"
            >
              📋 백업 JSON 복사
            </button>
          </div>

          <div class="space-y-2 pt-1 border-t border-line/70">
            <label class="block text-xs font-extrabold text-ink">데이터 복구 (JSON 파일 업로드 또는 붙여넣기)</label>
            <input
              id="restore-file-input"
              type="file"
              accept="application/json,.json"
              class="block w-full text-xs text-muted file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border file:border-line file:text-xs file:font-bold file:bg-stonebg file:text-ink hover:file:bg-line"
            />
            <textarea
              id="restore-json-textarea"
              rows="3"
              placeholder="백업된 JSON 문자열을 붙여넣고 아래 복구 버튼을 누르세요."
              class="w-full p-2.5 rounded-xl bg-stonebg border border-line text-[11px] font-mono focus:outline-none focus:border-terracotta"
            ></textarea>
            <button
              id="btn-restore-apply"
              type="button"
              class="w-full py-2.5 px-3 rounded-2xl bg-terracotta hover:bg-terracottaDark text-white text-xs font-extrabold transition active:scale-95"
            >
              ♻️ JSON 데이터 복구 실행
            </button>
          </div>
        </section>
      `;

      document.getElementById('prev-dish-month')?.addEventListener('click', () => shiftMonth(-1));
      document.getElementById('next-dish-month')?.addEventListener('click', () => shiftMonth(1));

      container.querySelectorAll('button[data-dish-date]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedDishDate = btn.dataset.dishDate;
          saveState();
          renderDishwashView(container);
        });
      });

      const getExportJson = () =>
        JSON.stringify(
          {
            app: '쉐프 노트',
            exportedAt: new Date().toISOString(),
            data: state,
          },
          null,
          2
        );

      document.getElementById('btn-backup-download')?.addEventListener('click', () => {
        try {
          const blob = new Blob([getExportJson()], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `chef-note-backup-${getTodayStr()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('백업 JSON 파일이 다운로드되었습니다!', 'success');
        } catch (e) {
          showToast('파일 다운로드 중 오류가 발생했습니다.', 'error');
        }
      });

      document.getElementById('btn-backup-copy')?.addEventListener('click', async () => {
        const jsonStr = getExportJson();
        const ta = document.getElementById('restore-json-textarea');
        if (ta) ta.value = jsonStr;
        try {
          await navigator.clipboard.writeText(jsonStr);
          showToast('백업 JSON이 클립보드에 복사되었습니다!', 'success');
        } catch {
          showToast('텍스트 영역에 백업 JSON이 채워졌습니다.', 'info');
        }
      });

      const applyRestoreFromText = (rawText) => {
        try {
          const parsed = JSON.parse(rawText);
          const incoming = parsed && parsed.data && Array.isArray(parsed.data.novels)
            ? parsed.data
            : parsed && Array.isArray(parsed.novels)
            ? parsed
            : null;
          if (!incoming) {
            showToast('유효한 쉐프 노트 백업 형식이 아닙니다.', 'error');
            return;
          }
          state = {
            ...createSampleState(),
            ...incoming,
          };
          saveState();
          showToast('데이터 복구가 완료되었습니다!', 'success');
          renderApp();
        } catch {
          showToast('JSON 형식을 읽을 수 없습니다. 올바른 백업 데이터인지 확인해 주세요.', 'error');
        }
      };

      document.getElementById('restore-file-input')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || '');
          const ta = document.getElementById('restore-json-textarea');
          if (ta) ta.value = text;
          applyRestoreFromText(text);
        };
        reader.readAsText(file);
      });

      document.getElementById('btn-restore-apply')?.addEventListener('click', () => {
        const text = document.getElementById('restore-json-textarea')?.value || '';
        if (!text.trim()) {
          showToast('복구할 JSON 데이터를 입력하거나 파일을 선택해 주세요.', 'error');
          return;
        }
        applyRestoreFromText(text);
      });
    }

    // 초기 실행
    renderApp();
  </script>
</body>
</html>
