          ${registeredWorks.length > 0 ? `
            <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-xs font-extrabold text-slate-700">🏆 등록 완료 작품 미슐랭(유료 전환) 빠른 수정</h3>
                <span class="text-[10px] text-slate-400">터치하여 지표 입력</span>
              </div>
              <div class="max-h-44 overflow-y-auto thin-scrollbar space-y-1.5 pr-1">
                ${registeredWorks.slice().reverse().map(w => `
                  <div onclick="openEditWorkModal('${w.id}', 'general')" class="flex items-center justify-between p-2 rounded-xl bg-slate-50 hover:bg-indigo-50/50 border border-slate-100 cursor-pointer transition">
                    <div class="min-w-0 flex-1 pr-2">
                      <div class="flex items-center gap-1">
                        <span class="text-xs font-bold text-slate-800 truncate">${escapeHtml(w.title)}</span>
                        ${getTierMedalBadge(w.paidStatus)}
                      </div>
                      <span class="text-[10px] text-slate-500">${w.genre} · ${escapeHtml(w.author)}</span>
                    </div>
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${w.paidStatus === '분석 전' ? 'bg-slate-200 text-slate-600' : 'bg-amber-100 text-amber-800'}">
                      ${w.paidStatus}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleRegSource(src) {
      const idx = appState.regForm.sources.indexOf(src);
      if (idx > -1) {
        if (appState.regForm.sources.length > 1) {
          appState.regForm.sources.splice(idx, 1);
        } else {
          showToast('최소 1개 이상의 유입 경로를 선택해 주세요.', '💡');
          return;
        }
      } else {
        appState.regForm.sources.push(src);
      }
      renderCurrentTab();
    }

    function handleRegisterWork() {
      const title = appState.regForm.title.trim();
      if (!title) {
        showToast('작품 제목을 입력해 주세요!', '✏️');
        return;
      }

      // 중복 제목 검사 (공백 제거 후 대소문자 무시 비교)
      const norm = normalizeTitle(title);
      const duplicate = appState.works.find(w => normalizeTitle(w.title) === norm);
      if (duplicate) {
        openDuplicateModal(duplicate);
        return;
      }

      const genre = appState.regForm.genre.trim();
      const author = appState.regForm.author.trim();
      const isLabelingComplete = Boolean(genre && author);

      const newWork = {
        id: 'work_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        createdAt: Date.now(),
        completedAt: null,
        stage: isLabelingComplete ? 'kitchen' : 'temp',
        // 일반정보
        sources: [...appState.regForm.sources],
        title: title,
        genre: genre,
        author: author,
        paidStatus: appState.regForm.paidStatus || '분석 전',
        conversionRate: appState.regForm.conversionRate !== '' ? Number(appState.regForm.conversionRate) : null,
        freeLastEp: appState.regForm.freeLastEp !== '' ? Number(appState.regForm.freeLastEp) : null,
        // 평가
        spoon: 0, // 0: 미지정, 1~4
        memos: [],
        tags: [],
        // 상세정보: { [subgroupId]: { groupSelected: boolean, items: string[] } }
        details: {}
      };

      appState.works.push(newWork);

      // 폼 초기화
      appState.regForm = {
        sources: ['투데이 베스트'],
        title: '',
        genre: '',
        author: '',
        paidStatus: '분석 전',
        conversionRate: '',
        freeLastEp: ''
      };

      saveState();
      if (isLabelingComplete) {
        appState.kitchenSelectedId = newWork.id;
        showToast('라벨링 완료! [조리실]로 이동되었습니다.', '🍳');
      } else {
        showToast('[임시등록]에 저장되었습니다. 라벨링을 완료해 주세요!', '📝');
      }
      renderCurrentTab();
    }

    /*************************************************************************
     * [카테고리 2] 조리실
     *************************************************************************/
    function renderKitchenTab() {
      // 등록 순서대로 정렬 (createdAt 오름차순)
      const kitchenWorks = appState.works
        .filter(w => w.stage === 'kitchen')
        .sort((a, b) => a.createdAt - b.createdAt);

      if (kitchenWorks.length === 0) {
        return `
          <div class="fade-in text-center py-16 px-4 bg-white rounded-3xl border border-slate-200/80 shadow-xs mt-4">
            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl">🍳</div>
            <h2 class="text-base font-extrabold text-slate-800 mb-1">조리실이 비어있습니다</h2>
            <p class="text-xs text-slate-500 mb-5 leading-relaxed">
              [제품 등록]에서 제목·장르·작가명 라벨링을 완료하면<br/>이곳 조리실로 작품이 자동 입고됩니다.
            </p>
            <button onclick="switchTab('register')" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-md shadow-indigo-200">
              + 새 작품 등록하러 가기
            </button>
          </div>
        `;
      }

      // 선택된 작품 유효성 체크
      if (!appState.kitchenSelectedId || !kitchenWorks.some(w => w.id === appState.kitchenSelectedId)) {
        appState.kitchenSelectedId = kitchenWorks[0].id;
      }

      const activeWork = kitchenWorks.find(w => w.id === appState.kitchenSelectedId);

      return `
        <div class="space-y-4 fade-in">
          <!-- 조리 대기 작품 리스트 (등록 순서대로) -->
          <div class="bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80">
            <div class="flex items-center justify-between mb-2.5">
              <h2 class="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                <span>🍳</span> 조리실 대기 목록 (${kitchenWorks.length}편)
              </h2>
              <span class="text-[11px] text-slate-400">등록순 정렬</span>
            </div>

            <div class="space-y-2 max-h-60 overflow-y-auto thin-scrollbar pr-1">
              ${kitchenWorks.map((w, idx) => {
                const isSelected = w.id === activeWork.id;
                return `
                  <div onclick="selectKitchenWork('${w.id}')"
                    class="p-3 rounded-xl border transition cursor-pointer flex items-center justify-between gap-2 ${isSelected ? 'bg-indigo-50/70 border-indigo-500 ring-1 ring-indigo-500' : 'bg-slate-50 border-slate-200/80 hover:bg-slate-100/70'}">
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-1.5 mb-0.5">
                        <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">#${idx + 1}</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">${w.genre}</span>
                        <span class="text-[11px] text-slate-500 truncate">${escapeHtml(w.author)}</span>
                        ${getTierMedalBadge(w.paidStatus)}
                      </div>
                      <p class="text-sm font-extrabold text-slate-900 truncate">${escapeHtml(w.title)}</p>
                    </div>
                    <!-- 문피아 검색용 제목 자동복사 버튼 -->
                    <button type="button" onclick="event.stopPropagation(); copyTextToClipboard('${escapeHtml(w.title).replace(/'/g, "\\'")}')"
                      class="shrink-0 px-2.5 py-2 rounded-xl bg-white hover:bg-indigo-600 text-slate-700 hover:text-white border border-slate-300 text-[11px] font-bold shadow-2xs transition flex items-center gap-1">
                      <span>📋</span>
                      <span>제목복사</span>
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 선택된 작품 집중 분석 & 평가 패널 -->
          ${activeWork ? renderKitchenEvaluationPanel(activeWork) : ''}
        </div>
      `;
    }

    function selectKitchenWork(id) {
      appState.kitchenSelectedId = id;
      renderCurrentTab();
    }

    function renderKitchenEvaluationPanel(work) {
      const detailSummaryHtml = renderDetailSummaryBadges(work.details);

      return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-indigo-100 space-y-5">
          <!-- 선택 작품 헤더 -->
          <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-3">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap mb-1">
                ${(work.sources || []).map(s => `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">${s}</span>`).join('')}
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">${work.genre}</span>
                ${getTierMedalBadge(work.paidStatus)}
              </div>
              <h3 class="text-base font-extrabold text-slate-900">${escapeHtml(work.title)}</h3>
              <p class="text-xs text-slate-500 mt-0.5">작가: <strong class="text-slate-700">${escapeHtml(work.author)}</strong></p>
            </div>
            <button onclick="openEditWorkModal('${work.id}', 'general')" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold shrink-0">
              일반정보 수정
            </button>
          </div>

          <!-- 1) 숟가락 평가 -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-extrabold text-slate-800">1) 숟가락 (정독 깊이 평가)</label>
              <span class="text-[11px] font-bold text-amber-600">${SPOON_OPTIONS.find(o => o.value === (work.spoon || 0))?.label || '미지정'}</span>
            </div>
            <div class="grid grid-cols-1 gap-1.5">
              ${SPOON_OPTIONS.map(opt => {
                const active = (work.spoon || 0) === opt.value;
                return `
                  <button type="button" onclick="setWorkSpoon('${work.id}', ${opt.value})"
                    class="w-full px-3.5 py-2.5 rounded-xl border text-left flex items-center justify-between transition ${active ? 'bg-amber-50 border-amber-500 text-amber-900 shadow-2xs' : 'bg-slate-50/70 border-slate-200 text-slate-700 hover:bg-slate-100'}">
                    <div class="flex items-center gap-2.5">
                      <span class="text-base w-20 text-center bg-white py-0.5 rounded-lg border border-slate-200/80">${opt.icons}</span>
                      <div>
                        <div class="text-xs font-extrabold">${opt.label}</div>
                        <div class="text-[11px] text-slate-500">${opt.desc}</div>
                      </div>
                    </div>
                    <span class="text-sm font-bold ${active ? 'text-amber-600' : 'text-slate-300'}">${active ? '●' : '○'}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 2) 메모 (중복 선택 가능) -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-2">2) 메모 (중복 선택 가능)</label>
            <div class="grid grid-cols-2 gap-2">
              ${MEMO_OPTIONS.map(m => {
                const checked = (work.memos || []).includes(m.id);
                return `
                  <button type="button" onclick="toggleWorkMemo('${work.id}', '${m.id}')"
                    class="p-2.5 rounded-xl border text-left transition flex items-center gap-2 ${checked ? 'bg-indigo-600 border-indigo-600 text-white shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}">
                    <span class="text-xs">${checked ? '☑' : '☐'}</span>
                    <span class="text-xs font-bold leading-tight">${m.label}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 3) 태그 (작품별 최대 5개 & 기존 태그 선택) -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-extrabold text-slate-800">3) 핵심 태그 (최대 5개)</label>
              <span class="text-[11px] font-bold text-indigo-600">${(work.tags || []).length} / 5개</span>
            </div>

            <!-- 현재 작품에 적용된 태그 -->
            <div class="flex flex-wrap gap-1.5 mb-2.5 min-h-[32px] p-2 rounded-xl bg-slate-50 border border-slate-200/80">
              ${(work.tags || []).length === 0 ? `<span class="text-[11px] text-slate-400">아래에서 선택하거나 직접 입력하세요</span>` : 
                work.tags.map(tag => `
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-indigo-600 text-white text-xs font-bold">
                    #${escapeHtml(tag)}
                    <button type="button" onclick="removeWorkTag('${work.id}', '${escapeHtml(tag).replace(/'/g, "\\'")}')" class="ml-0.5 text-indigo-200 hover:text-white">×</button>
                  </span>
                `).join('')
              }
            </div>

            <!-- 새 태그 직접 입력 -->
            <div class="flex gap-2 mb-2.5">
              <input type="text" id="kitchen-tag-input" placeholder="새 태그 입력 (예: 회귀물, 사이다)"
                onkeydown="if(event.key==='Enter'){ event.preventDefault(); addWorkTagFromInput('${work.id}'); }"
                class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-xs font-medium focus:outline-none focus:border-indigo-500" />
              <button type="button" onclick="addWorkTagFromInput('${work.id}')"
                class="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold shrink-0">
                추가
              </button>
            </div>

            <!-- 저장된 기존 태그 원클릭 선택 -->
            <div>
              <p class="text-[10px] font-bold text-slate-400 mb-1">저장된 태그 목록 (터치하여 선택/해제)</p>
              <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto thin-scrollbar">
                ${appState.savedTags.map(tag => {
                  const isSelected = (work.tags || []).includes(tag);
                  return `
                    <button type="button" onclick="toggleWorkTag('${work.id}', '${escapeHtml(tag).replace(/'/g, "\\'")}')"
                      class="px-2.5 py-1 rounded-full text-[11px] font-semibold border transition ${isSelected ? 'bg-indigo-100 border-indigo-400 text-indigo-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'}">
                      #${escapeHtml(tag)}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- 4) 상세정보 설정 및 요약 -->
          <div class="pt-1 border-t border-slate-100">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-extrabold text-slate-800">4) 작품 상세정보 분석 (11대 분류)</label>
              <button type="button" onclick="openDetailSelectorModal('${work.id}')"
                class="px-3.5 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-extrabold transition flex items-center gap-1">
                <span>🔍</span>
                <span>상세정보 설정</span>
              </button>
            </div>

            <!-- 설정된 상세정보 깔끔 요약 표시 -->
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/80">
              ${detailSummaryHtml || '<p class="text-[11px] text-slate-400 text-center py-1">선택된 상세정보가 없습니다. [상세정보] 버튼을 눌러 설정해 주세요.</p>'}
            </div>
          </div>

          <!-- 하단 액션: 작품 삭제 & 조리 완료 -->
          <div class="pt-3 border-t border-slate-200 flex items-center gap-2.5">
            <button type="button" onclick="confirmDeleteWork('${work.id}')"
              class="px-4 py-3.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-extrabold transition shrink-0">
              작품 삭제
            </button>
            <button type="button" onclick="completeCookingWork('${work.id}')"
              class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-sm font-extrabold shadow-md shadow-emerald-200 transition active:scale-[0.99]">
              ✅ 조리 완료 (팬트리 이동)
            </button>
          </div>
        </div>
      `;
    }

    function setWorkSpoon(workId, spoonVal) {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;
      work.spoon = spoonVal;
      saveState();
      renderCurrentTab();
    }

    function toggleWorkMemo(workId, memoId) {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;
      if (!Array.isArray(work.memos)) work.memos = [];
      const idx = work.memos.indexOf(memoId);
      if (idx > -1) work.memos.splice(idx, 1);
      else work.memos.push(memoId);
      saveState();
      renderCurrentTab();
    }

    function addWorkTagFromInput(workId) {
      const input = document.getElementById('kitchen-tag-input');
      if (!input) return;
      const raw = input.value.trim().replace(/^#/, '');
      if (!raw) return;
      toggleWorkTag(workId, raw, true);
      input.value = '';
    }

    function toggleWorkTag(workId, tag, forceAdd = false) {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;
      if (!Array.isArray(work.tags)) work.tags = [];

      // 전체 저장 태그 목록에 추가
      if (!appState.savedTags.includes(tag)) {
        appState.savedTags.unshift(tag);
      }

      const idx = work.tags.indexOf(tag);
      if (idx > -1) {
        if (!forceAdd) work.tags.splice(idx, 1);
      } else {
        if (work.tags.length >= 5) {
          showToast('작품별 태그는 최대 5개까지 등록 가능합니다!', '⚠️');
          return;
        }
        work.tags.push(tag);
      }
      saveState();
      renderCurrentTab();
    }

    function removeWorkTag(workId, tag) {
      const work = appState.works.find(w => w.id === workId);
      if (!work || !work.tags) return;
      work.tags = work.tags.filter(t => t !== tag);
      saveState();
      renderCurrentTab();
    }

    function completeCookingWork(workId) {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;
      work.stage = 'pantry';
      work.completedAt = Date.now();

      // 오늘 날짜 설거지 달력 카운트 +1 반영
      const todayKey = getTodayDateString();
      appState.dishwashHistory[todayKey] = (appState.dishwashHistory[todayKey] || 0) + 1;

      saveState();
      showToast(`"${work.title}" 조리 완료! 팬트리에 보관되었습니다.`, '🍽️');
      renderCurrentTab();
    }

    function renderDetailSummaryBadges(details) {
      if (!details || Object.keys(details).length === 0) return '';
      const rows = [];

      DETAIL_SCHEMA.forEach(cat => {
        const badges = [];
        cat.subgroups.forEach(sg => {
          const entry = details[sg.id];
          if (!entry) return;
          if (entry.groupSelected) {
            badges.push(`<span class="px-2 py-0.5 rounded-md bg-indigo-600 text-white text-[10px] font-bold">[계열] ${sg.name}</span>`);
          }
          if (Array.isArray(entry.items)) {
            entry.items.forEach(item => {
              badges.push(`<span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-700 text-[10px] font-semibold">${item}</span>`);
            });
          }
        });
        if (badges.length > 0) {
          rows.push(`
            <div class="mb-2 last:mb-0">
              <div class="text-[11px] font-extrabold text-indigo-800 mb-1">${cat.name}</div>
              <div class="flex flex-wrap gap-1">${badges.join('')}</div>
            </div>
          `);
        }
      });

      return rows.join('');
    }

    /*************************************************************************
     * 상세정보 선택 모달 (11개 대분류 -> 중분류(큰 계열) -> 소분류(세부 항목))
     *************************************************************************/
    let detailModalState = {
      workId: null,
      activeCatId: 'planning',
      searchQuery: '',
      tempDetails: {}
    };

    function openDetailSelectorModal(workId, onCompleteCallback = null) {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;
      detailModalState = {
        workId: workId,
        activeCatId: 'planning',
        searchQuery: '',
        tempDetails: JSON.parse(JSON.stringify(work.details || {})),
        onCompleteCallback
      };
      renderDetailModal();
    }

    function renderDetailModal() {
      const root = document.getElementById('modal-root');
      const activeCat = DETAIL_SCHEMA.find(c => c.id === detailModalState.activeCatId) || DETAIL_SCHEMA[0];
      const q = detailModalState.searchQuery.trim().toLowerCase();

      // 검색어가 있으면 전체 카테고리에서 필터링, 없으면 현재 선택 카테고리 표시
      let subgroupsToRender = [];
      if (q) {
        DETAIL_SCHEMA.forEach(cat => {
          cat.subgroups.forEach(sg => {
            const groupMatch = sg.name.toLowerCase().includes(q);
            const matchedItems = sg.items.filter(it => it.toLowerCase().includes(q));
            if (groupMatch || matchedItems.length > 0) {
              subgroupsToRender.push({
                catName: cat.name,
                subgroup: sg,
                items: groupMatch ? sg.items : matchedItems
              });
            }
          });
        });
      } else {
        subgroupsToRender = activeCat.subgroups.map(sg => ({
          catName: activeCat.name,
          subgroup: sg,
          items: sg.items
        }));
      }

      // 선택된 총 항목 수 계산
      let selectedCount = 0;
      Object.values(detailModalState.tempDetails).forEach(v => {
        if (v.groupSelected) selectedCount++;
        if (v.items) selectedCount += v.items.length;
      });

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-[480px] h-[90vh] sm:h-[85vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
            <!-- 모달 헤더 -->
            <div class="px-4 py-3.5 border-b border-slate-200 flex items-center justify-between bg-white shrink-0">
              <div>
                <h3 class="text-base font-extrabold text-slate-900">작품 상세정보 설정</h3>
                <p class="text-[11px] text-slate-500">큰 계열만 선택하거나 세부 항목까지 중복 선택 가능 (선택: <strong class="text-indigo-600">${selectedCount}개</strong>)</p>
              </div>
              <button onclick="closeModalRoot()" class="p-2 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800">✕</button>
            </div>

            <!-- 키워드 빠른 검색 -->
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 shrink-0">
              <div class="relative">
                <input type="text" value="${escapeHtml(detailModalState.searchQuery)}"
                  oninput="detailModalState.searchQuery = this.value; renderDetailModal();"
                  placeholder="키워드 빠른 검색 (예: 회귀, 아카데미, 영지, 먼치킨...)"
                  class="w-full rounded-xl border border-slate-300 bg-white pl-9 pr-8 py-2 text-xs font-medium focus:outline-none focus:border-indigo-500" />
                <span class="absolute left-3 top-2 text-slate-400 text-xs">🔍</span>
                ${q ? `<button onclick="detailModalState.searchQuery=''; renderDetailModal();" class="absolute right-2.5 top-1.5 text-slate-400 hover:text-slate-700 text-xs font-bold">✕</button>` : ''}
              </div>
            </div>

            <!-- 11개 대분류 가로 스크롤 탭 -->
            ${!q ? `
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar px-4 py-2.5 bg-white border-b border-slate-200 shrink-0">
                ${DETAIL_SCHEMA.map(cat => {
                  const isActive = cat.id === detailModalState.activeCatId;
                  // 해당 대분류 내 선택 개수 표시
                  let catCount = 0;
                  cat.subgroups.forEach(sg => {
                    const e = detailModalState.tempDetails[sg.id];
                    if (e) {
                      if (e.groupSelected) catCount++;
                      if (e.items) catCount += e.items.length;
                    }
                  });
                  return `
                    <button type="button" onclick="detailModalState.activeCatId='${cat.id}'; renderDetailModal();"
                      class="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition flex items-center gap-1 ${isActive ? 'bg-indigo-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                      <span>${cat.name}</span>
                      ${catCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] ${isActive ? 'bg-white text-indigo-700' : 'bg-indigo-600 text-white'}">${catCount}</span>` : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            ` : ''}

            <!-- 중분류(큰 계열) 및 소분류(세부 항목) 선택 영역 -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/60 thin-scrollbar">
              ${subgroupsToRender.length === 0 ? `
                <div class="text-center py-12 text-xs text-slate-400">검색 결과가 없습니다.</div>
              ` : subgroupsToRender.map(({ catName, subgroup, items }) => {
                const entry = detailModalState.tempDetails[subgroup.id] || { groupSelected: false, items: [] };
                return `
                  <div class="bg-white rounded-2xl p-3.5 border border-slate-200/90 shadow-2xs">
                    ${q ? `<div class="text-[10px] font-bold text-indigo-600 mb-0.5">${catName}</div>` : ''}
                    <!-- 큰 계열 선택 헤더 -->
                    <div class="flex items-center justify-between gap-2 pb-2.5 mb-2.5 border-b border-slate-100">
                      <span class="text-xs font-extrabold text-slate-800">${subgroup.name}</span>
                      <button type="button" onclick="toggleDetailGroup('${subgroup.id}')"
                        class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition shrink-0 ${entry.groupSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-indigo-50/70 border-indigo-200 text-indigo-700 hover:bg-indigo-100'}">
                        ${entry.groupSelected ? '✓ 큰 계열 선택됨' : '+ 큰 계열만 선택'}
                      </button>
                    </div>
                    <!-- 세부 항목 다중 선택 칩 -->
                    <div class="flex flex-wrap gap-1.5">
                      ${items.map(item => {
                        const checked = entry.items.includes(item);
                        return `
                          <button type="button" onclick="toggleDetailItem('${subgroup.id}', '${escapeHtml(item).replace(/'/g, "\\'")}')"
                            class="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold border transition ${checked ? 'bg-emerald-600 border-emerald-600 text-white shadow-2xs' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}">
                            ${item}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- 하단 [설정완료] 버튼 -->
            <div class="p-3.5 bg-white border-t border-slate-200 shrink-0">
              <button type="button" onclick="saveDetailModalSelection()"
                class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md shadow-indigo-200 transition">
                설정완료 (${selectedCount}개 선택됨)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleDetailGroup(subgroupId) {
      if (!detailModalState.tempDetails[subgroupId]) {
        detailModalState.tempDetails[subgroupId] = { groupSelected: false, items: [] };
      }
      detailModalState.tempDetails[subgroupId].groupSelected = !detailModalState.tempDetails[subgroupId].groupSelected;
      cleanupDetailEntry(subgroupId);
      renderDetailModal();
    }

    function toggleDetailItem(subgroupId, item) {
      if (!detailModalState.tempDetails[subgroupId]) {
        detailModalState.tempDetails[subgroupId] = { groupSelected: false, items: [] };
      }
      const list = detailModalState.tempDetails[subgroupId].items;
      const idx = list.indexOf(item);
      if (idx > -1) list.splice(idx, 1);
      else list.push(item);
      cleanupDetailEntry(subgroupId);
      renderDetailModal();
    }

    function cleanupDetailEntry(subgroupId) {
      const e = detailModalState.tempDetails[subgroupId];
      if (e && !e.groupSelected && (!e.items || e.items.length === 0)) {
        delete detailModalState.tempDetails[subgroupId];
      }
    }

    function saveDetailModalSelection() {
      const work = appState.works.find(w => w.id === detailModalState.workId);
      if (work) {
        work.details = detailModalState.tempDetails;
        saveState();
        showToast('상세정보 설정이 저장되었습니다.', '✅');
      }
      const cb = detailModalState.onCompleteCallback;
      closeModalRoot();
      if (cb) cb();
      else renderCurrentTab();
    }

    function closeModalRoot() {
      document.getElementById('modal-root').innerHTML = '';
    }

    /*************************************************************************
     * [카테고리 3] 미슐랭 (티어별 그래프 및 필터링, 메달 표시, 개별 수정)
     *************************************************************************/
    function renderMichelinTab() {
      // 미슐랭 선정이 입력된 작품들 ('분석 전'이 아니거나 전환값/무료최종화가 입력된 작품)
      const michelinWorks = appState.works.filter(w => 
        (w.paidStatus && w.paidStatus !== '분석 전') || 
        (w.conversionRate !== null && w.conversionRate !== undefined) || 
        (w.freeLastEp !== null && w.freeLastEp !== undefined)
      );

      const tierCategories = [
        { key: '전환 1티어', label: '1티어', medal: '🥇1', color: 'bg-yellow-400', badgeBg: 'bg-yellow-50 text-yellow-800 border-yellow-300' },
        { key: '전환 2티어', label: '2티어', medal: '🥈2', color: 'bg-slate-400', badgeBg: 'bg-slate-100 text-slate-800 border-slate-300' },
        { key: '전환 3티어', label: '3티어', medal: '🥉3', color: 'bg-orange-400', badgeBg: 'bg-orange-50 text-orange-800 border-orange-300' },
        { key: '전환 4티어', label: '4티어', medal: '🏅4', color: 'bg-indigo-500', badgeBg: 'bg-indigo-50 text-indigo-800 border-indigo-300' },
        { key: '전환 예정', label: '전환예정', medal: '⏳', color: 'bg-emerald-500', badgeBg: 'bg-emerald-50 text-emerald-800 border-emerald-300' },
        { key: '폐사', label: '폐사', medal: '💀', color: 'bg-rose-400', badgeBg: 'bg-rose-50 text-rose-800 border-rose-300' }
      ];

      const counts = {};
      tierCategories.forEach(t => counts[t.key] = 0);
      michelinWorks.forEach(w => {
        if (counts[w.paidStatus] !== undefined) counts[w.paidStatus]++;
      });
      const maxCount = Math.max(...Object.values(counts), 1);

      const filteredWorks = appState.michelinFilterTier === 'ALL'
        ? michelinWorks
        : michelinWorks.filter(w => w.paidStatus === appState.michelinFilterTier);

      return `
        <div class="space-y-4 fade-in">
          <!-- 상단 티어별 시각화 그래프 카드 -->
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
                  <span>🏆</span> 미슐랭 유료 전환 티어 현황
                </h2>
                <p class="text-[11px] text-slate-500">막대를 터치하면 해당 티어 작품만 모아볼 수 있어요</p>
              </div>
              <button onclick="appState.michelinFilterTier='ALL'; renderCurrentTab();"
                class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${appState.michelinFilterTier === 'ALL' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                전체 (${michelinWorks.length})
              </button>
            </div>

            <!-- 인터랙티브 세로 막대 그래프 -->
            <div class="grid grid-cols-6 gap-2 pt-4 pb-2 px-1 bg-slate-50 rounded-2xl border border-slate-100">
              ${tierCategories.map(t => {
                const cnt = counts[t.key] || 0;
                const heightPct = Math.round((cnt / maxCount) * 100);
                const isSelected = appState.michelinFilterTier === t.key;
                return `
                  <button type="button" onclick="appState.michelinFilterTier='${isSelected ? 'ALL' : t.key}'; renderCurrentTab();"
                    class="flex flex-col items-center group focus:outline-none">
                    <span class="text-xs font-extrabold mb-1 ${isSelected ? 'text-indigo-600 scale-110' : 'text-slate-700'} transition">${cnt}</span>
                    <div class="w-full h-28 bg-slate-200/60 rounded-xl flex items-end justify-center p-1 overflow-hidden ${isSelected ? 'ring-2 ring-indigo-500 bg-indigo-50' : ''}">
                      <div style="height: ${cnt === 0 ? 4 : Math.max(heightPct, 12)}%"
                        class="w-full rounded-lg ${t.color} transition-all duration-500"></div>
                    </div>
                    <span class="mt-1.5 text-[10px] font-extrabold ${isSelected ? 'text-indigo-700' : 'text-slate-600'}">${t.label}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 필터링된 작품 목록 -->
          <div class="space-y-3">
            <div class="flex items-center justify-between px-1">
              <h3 class="text-xs font-extrabold text-slate-700">
                ${appState.michelinFilterTier === 'ALL' ? '전체 미슐랭 작품' : `[${appState.michelinFilterTier}] 작품 목록`} (${filteredWorks.length}편)
              </h3>
            </div>

            ${filteredWorks.length === 0 ? `
              <div class="bg-white rounded-2xl p-8 text-center border border-slate-200/80">
                <p class="text-xs text-slate-400">해당 티어에 등록된 작품이 없습니다.</p>
              </div>
            ` : filteredWorks.slice().reverse().map(w => renderRichWorkCard(w)).join('')}
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * [카테고리 4] 팬트리
     *************************************************************************/
    function renderPantryTab() {
      const pantryWorks = appState.works.filter(w => w.stage === 'pantry');

      const filters = [
        { key: 'recent', label: '최근순' },
        { key: 'spoon', label: '숟가락순' },
        { key: '레전드', label: '레전드' },
        { key: '슈퍼노멀', label: '슈퍼노멀' },
        { key: '레시피분석', label: '레시피분석' },
        { key: '서랍장', label: '서랍장' }
      ];

      let list = [...pantryWorks];
      if (appState.pantryFilter === 'recent') {
        list.sort((a, b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt));
      } else if (appState.pantryFilter === 'spoon') {
        list.sort((a, b) => (b.spoon || 0) - (a.spoon || 0) || (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt));
      } else {
        list = list
          .filter(w => (w.memos || []).includes(appState.pantryFilter))
          .sort((a, b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt));
      }

      return `
        <div class="space-y-4 fade-in">
          <!-- 상단 필터 버튼 바 -->
          <div class="bg-white rounded-2xl p-3 shadow-xs border border-slate-200/80">
            <div class="flex items-center justify-between mb-2">
              <h2 class="text-sm font-extrabold text-slate-900">🥫 팬트리 영구 보관함</h2>
              <span class="text-[11px] font-bold text-slate-500">총 ${pantryWorks.length}편</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
              ${filters.map(f => {
                const active = appState.pantryFilter === f.key;
                return `
                  <button type="button" onclick="appState.pantryFilter='${f.key}'; renderCurrentTab();"
                    class="py-2 px-2 rounded-xl text-xs font-bold border transition ${active ? 'bg-indigo-600 border-indigo-600 text-white shadow-2xs' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
                    ${f.label}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 작품 목록 -->
          ${list.length === 0 ? `
            <div class="bg-white rounded-2xl p-10 text-center border border-slate-200/80">
              <div class="text-3xl mb-2">🥫</div>
              <p class="text-xs text-slate-500 font-medium">해당 조건의 보관 작품이 없습니다.</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${list.map(w => renderRichWorkCard(w)).join('')}
            </div>
          `}
        </div>
      `;
    }

    /*************************************************************************
     * [카테고리 5] 서랍장 (서랍장 체크 작품 + ★~★★★★ 누적 그래프 & 필터)
     *************************************************************************/
    function renderDrawerTab() {
      const drawerWorks = appState.works
        .filter(w => (w.memos || []).includes('서랍장'))
        .sort((a, b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt));

      const starLevels = [
        { star: 1, label: '★', desc: '1숟가락', color: 'bg-amber-300' },
        { star: 2, label: '★★', desc: '2숟가락', color: 'bg-amber-400' },
        { star: 3, label: '★★★', desc: '3숟가락', color: 'bg-amber-500' },
        { star: 4, label: '★★★★', desc: '4숟가락', color: 'bg-indigo-600' }
      ];

      const starCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
      drawerWorks.forEach(w => {
        if (w.spoon >= 1 && w.spoon <= 4) starCounts[w.spoon]++;
      });
      const maxStar = Math.max(...Object.values(starCounts), 1);

      const filtered = appState.drawerFilterStar === 'ALL'
        ? drawerWorks
        : drawerWorks.filter(w => w.spoon === Number(appState.drawerFilterStar));

      return `
        <div class="space-y-4 fade-in">
          <!-- 상단 별점 티어 누적 그래프 -->
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h2 class="text-sm font-extrabold text-slate-900">📚 독자 서랍장 컬렉션</h2>
                <p class="text-[11px] text-slate-500">별점 티어를 터치해 작품을 재분류할 수 있습니다</p>
              </div>
              <button onclick="appState.drawerFilterStar='ALL'; renderCurrentTab();"
                class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${appState.drawerFilterStar === 'ALL' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                전체 (${drawerWorks.length})
              </button>
            </div>

            <!-- 누적 막대 그래프 -->
            <div class="grid grid-cols-4 gap-2.5 pt-3 pb-2 px-2 bg-slate-50 rounded-2xl border border-slate-100">
              ${starLevels.map(s => {
                const cnt = starCounts[s.star];
                const pct = Math.round((cnt / maxStar) * 100);
                const isSelected = String(appState.drawerFilterStar) === String(s.star);
                return `
                  <button type="button" onclick="appState.drawerFilterStar='${isSelected ? 'ALL' : s.star}'; renderCurrentTab();"
                    class="flex flex-col items-center focus:outline-none">
                    <span class="text-xs font-extrabold mb-1 ${isSelected ? 'text-indigo-600' : 'text-slate-700'}">${cnt}편</span>
                    <div class="w-full h-24 bg-slate-200/60 rounded-xl flex items-end justify-center p-1 overflow-hidden ${isSelected ? 'ring-2 ring-indigo-500 bg-indigo-50' : ''}">
                      <div style="height: ${cnt === 0 ? 5 : Math.max(pct, 15)}%" class="w-full rounded-lg ${s.color} transition-all duration-500"></div>
                    </div>
                    <span class="mt-1.5 text-[11px] font-extrabold text-amber-500 tracking-tighter">${s.label}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 필터 버튼 행 -->
            <div class="grid grid-cols-5 gap-1.5 mt-3">
              <button onclick="appState.drawerFilterStar='ALL'; renderCurrentTab();"
                class="py-1.5 rounded-lg text-[11px] font-bold border ${appState.drawerFilterStar === 'ALL' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200'}">
                전체
              </button>
              ${starLevels.map(s => {
                const active = String(appState.drawerFilterStar) === String(s.star);
                return `
                  <button onclick="appState.drawerFilterStar='${s.star}'; renderCurrentTab();"
                    class="py-1.5 rounded-lg text-[11px] font-extrabold border ${active ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-600 border-slate-200'}">
                    ${s.label}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 서랍장 작품 리스트 -->
          ${filtered.length === 0 ? `
            <div class="bg-white rounded-2xl p-10 text-center border border-slate-200/80">
              <div class="text-3xl mb-2">📖</div>
              <p class="text-xs text-slate-500">서랍장에 보관된 해당 별점의 작품이 없습니다.</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${filtered.map(w => renderRichWorkCard(w)).join('')}
            </div>
          `}
        </div>
      `;
    }

    /*************************************************************************
     * 공용 리치 작품 카드 (미슐랭, 팬트리, 서랍장에서 사용 + 3종 수정 버튼 제공)
     *************************************************************************/
    function renderRichWorkCard(work) {
      const detailSummaryHtml = renderDetailSummaryBadges(work.details);
      return `
        <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-2.5">
          <!-- 상단 메타 & 메달 -->
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap mb-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200/70">${work.genre || '미지정'}</span>
                ${(work.sources || []).map(s => `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600">${s}</span>`).join('')}
                ${getSpoonDisplay(work.spoon)}
              </div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <h4 class="text-sm font-extrabold text-slate-900">${escapeHtml(work.title)}</h4>
                ${getTierMedalBadge(work.paidStatus)}
              </div>
              <p class="text-xs text-slate-500 mt-0.5">
                작가: <strong class="text-slate-700">${escapeHtml(work.author || '-')}</strong>
                ${work.conversionRate !== null && work.conversionRate !== undefined ? ` · 전환값: <strong class="text-indigo-600">${work.conversionRate}</strong>` : ''}
                ${work.freeLastEp !== null && work.freeLastEp !== undefined ? ` · 무료: <strong class="text-slate-700">${work.freeLastEp}화</strong>` : ''}
              </p>
            </div>
            <button type="button" onclick="copyTextToClipboard('${escapeHtml(work.title).replace(/'/g, "\\'")}')"
              class="p-2 rounded-xl bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 text-xs font-bold shrink-0" title="제목 복사">
              📋
            </button>
          </div>

          <!-- 메모 & 태그 뱃지 -->
          ${((work.memos && work.memos.length > 0) || (work.tags && work.tags.length > 0)) ? `
            <div class="flex flex-wrap gap-1 pt-0.5">
              ${(work.memos || []).map(mId => {
                const mObj = MEMO_OPTIONS.find(x => x.id === mId);
                return `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${mObj ? mObj.badge : 'bg-slate-100 text-slate-700'}">${mId}</span>`;
              }).join('')}
              ${(work.tags || []).map(t => `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">#${escapeHtml(t)}</span>`).join('')}
            </div>
          ` : ''}

          <!-- 상세정보 요약 (설정된 경우 표시) -->
          ${detailSummaryHtml ? `
            <details class="group bg-slate-50 rounded-xl border border-slate-200/70 px-3 py-2">
              <summary class="text-[11px] font-bold text-slate-600 cursor-pointer select-none flex items-center justify-between">
                <span>📑 상세정보 분석 요약 보기</span>
                <span class="text-[10px] text-indigo-600 group-open:rotate-180 transition-transform">▼</span>
              </summary>
              <div class="mt-2 pt-2 border-t border-slate-200/70">
                ${detailSummaryHtml}
              </div>
            </details>
          ` : ''}

          <!-- 하단 3개 수정 버튼: [일반정보], [평가], [상세정보] -->
          <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-slate-100">
            <button type="button" onclick="openEditWorkModal('${work.id}', 'general')"
              class="py-2 px-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold transition">
              일반정보 수정
            </button>
            <button type="button" onclick="openEditWorkModal('${work.id}', 'eval')"
              class="py-2 px-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold transition">
              평가 수정
            </button>
            <button type="button" onclick="openEditWorkModal('${work.id}', 'detail')"
              class="py-2 px-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-bold transition">
              상세정보 수정
            </button>
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * 작품 수정 모달 (일반정보 / 평가 / 상세정보 + 수정 모달 내 삭제 버튼)
     *************************************************************************/
    let editModalState = {
      workId: null,
      section: 'general', // 'general', 'eval', 'detail'
      draft: null
    };

    function openEditWorkModal(workId, section = 'general') {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;

      if (section === 'detail') {
        // 상세정보 수정은 상세정보 모달을 직접 띄우되, 하단에 삭제도 가능하도록 연동
        openDetailSelectorModal(workId, () => renderCurrentTab());
        return;
      }

      editModalState = {
        workId,
        section,
        draft: JSON.parse(JSON.stringify(work))
      };
      renderEditWorkModal();
    }

    function renderEditWorkModal() {
      const root = document.getElementById('modal-root');
      const d = editModalState.draft;
      const sec = editModalState.section;

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-[480px] max-h-[90vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
            <!-- 헤더 -->
            <div class="px-4 py-3.5 border-b border-slate-200 flex items-center justify-between bg-white">
              <div>
                <h3 class="text-base font-extrabold text-slate-900">작품 정보 수정</h3>
                <p class="text-[11px] text-slate-500 truncate max-w-[260px]">${escapeHtml(d.title)}</p>
              </div>
              <button onclick="closeModalRoot()" class="p-2 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800">✕</button>
            </div>

            <!-- 섹션 전환 탭 -->
            <div class="grid grid-cols-3 gap-1 p-2 bg-slate-100 border-b border-slate-200">
              <button onclick="editModalState.section='general'; renderEditWorkModal();"
                class="py-2 rounded-xl text-xs font-extrabold transition ${sec === 'general' ? 'bg-white text-indigo-600 shadow-2xs' : 'text-slate-600'}">
                일반정보
              </button>
              <button onclick="editModalState.section='eval'; renderEditWorkModal();"
                class="py-2 rounded-xl text-xs font-extrabold transition ${sec === 'eval' ? 'bg-white text-indigo-600 shadow-2xs' : 'text-slate-600'}">
                평가
              </button>
              <button onclick="saveEditWorkDraft(false); openDetailSelectorModal('${d.id}');"
                class="py-2 rounded-xl text-xs font-extrabold text-slate-600 hover:text-indigo-600 transition">
                상세정보 →
              </button>
            </div>

            <!-- 본문 -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 thin-scrollbar">
              ${sec === 'general' ? `
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">유입 경로</label>
                  <div class="grid grid-cols-3 gap-1.5">
                    ${SOURCE_OPTIONS.map(src => {
                      const active = (d.sources || []).includes(src);
                      return `
                        <button type="button" onclick="toggleEditDraftSource('${src}')"
                          class="py-2 rounded-xl text-xs font-bold border ${active ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-slate-50 border-slate-200 text-slate-600'}">
                          ${active ? '☑' : '☐'} ${src}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">작품 제목</label>
                  <input type="text" value="${escapeHtml(d.title)}" oninput="editModalState.draft.title = this.value"
                    class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm font-bold" />
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">장르</label>
                    <select onchange="editModalState.draft.genre = this.value"
                      class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-xs font-bold bg-white">
                      <option value="">-- 선택 --</option>
                      ${GENRES.map(g => `<option value="${g}" ${d.genre === g ? 'selected' : ''}>${g}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">작가명</label>
                    <input type="text" value="${escapeHtml(d.author || '')}" oninput="editModalState.draft.author = this.value"
                      class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-xs font-bold" />
                  </div>
                </div>

                <div class="p-3.5 rounded-2xl bg-amber-50/60 border border-amber-200/80 space-y-2.5">
                  <div class="text-xs font-extrabold text-amber-900">🏆 미슐랭 선정 정보</div>
                  <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">유료 도달</label>
                    <select onchange="editModalState.draft.paidStatus = this.value"
                      class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-bold bg-white">
                      ${PAID_TIERS.map(t => `<option value="${t}" ${d.paidStatus === t ? 'selected' : ''}>${t}</option>`).join('')}
                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">전환값 (숫자)</label>
                      <input type="number" step="any" value="${d.conversionRate ?? ''}" oninput="editModalState.draft.conversionRate = this.value === '' ? null : Number(this.value)"
                        class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-bold bg-white" />
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">무료 최종화 (숫자)</label>
                      <input type="number" value="${d.freeLastEp ?? ''}" oninput="editModalState.draft.freeLastEp = this.value === '' ? null : Number(this.value)"
                        class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-bold bg-white" />
                    </div>
                  </div>
                </div>
              ` : `
                <!-- 평가 수정 탭 -->
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">숟가락 선택</label>
                  <div class="space-y-1.5">
                    ${SPOON_OPTIONS.map(opt => {
                      const active = (d.spoon || 0) === opt.value;
                      return `
                        <button type="button" onclick="editModalState.draft.spoon = ${opt.value}; renderEditWorkModal();"
                          class="w-full px-3 py-2 rounded-xl border text-left flex items-center justify-between ${active ? 'bg-amber-50 border-amber-500 text-amber-900' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                          <span class="text-xs font-bold">${opt.icons} ${opt.label} (${opt.desc})</span>
                          <span>${active ? '●' : '○'}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">메모 (다중 선택)</label>
                  <div class="grid grid-cols-2 gap-1.5">
                    ${MEMO_OPTIONS.map(m => {
                      const checked = (d.memos || []).includes(m.id);
                      return `
                        <button type="button" onclick="toggleEditDraftMemo('${m.id}')"
                          class="p-2.5 rounded-xl border text-left text-xs font-bold ${checked ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                          ${checked ? '☑' : '☐'} ${m.label}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">태그 관리 (최대 5개)</label>
                  <div class="flex flex-wrap gap-1.5 mb-2 min-h-[30px] p-2 rounded-xl bg-slate-50 border border-slate-200">
                    ${(d.tags || []).map(tag => `
                      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-indigo-600 text-white text-xs font-bold">
                        #${escapeHtml(tag)}
                        <button type="button" onclick="editModalState.draft.tags = editModalState.draft.tags.filter(t => t !== '${escapeHtml(tag).replace(/'/g, "\\'")}'); renderEditWorkModal();">×</button>
                      </span>
                    `).join('')}
                  </div>
                  <div class="flex gap-1.5 mb-2">
                    <input type="text" id="edit-modal-tag-input" placeholder="새 태그 입력"
                      onkeydown="if(event.key==='Enter'){ event.preventDefault(); addEditDraftTag(); }"
                      class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                    <button type="button" onclick="addEditDraftTag()" class="px-3 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">추가</button>
                  </div>
                  <div class="flex flex-wrap gap-1 max-h-20 overflow-y-auto thin-scrollbar">
                    ${appState.savedTags.map(tag => {
                      const sel = (d.tags || []).includes(tag);
                      return `
                        <button type="button" onclick="toggleEditDraftTag('${escapeHtml(tag).replace(/'/g, "\\'")}')"
                          class="px-2 py-0.5 rounded-full text-[11px] border ${sel ? 'bg-indigo-100 border-indigo-400 text-indigo-800 font-bold' : 'bg-white border-slate-200 text-slate-600'}">
                          #${escapeHtml(tag)}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `}

              <!-- 수정하기 항목 내 작품 삭제 버튼 -->
              <div class="pt-3 border-t border-slate-200">
                <button type="button" onclick="confirmDeleteWork('${d.id}')"
                  class="w-full py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-extrabold transition">
                  🗑️ 이 작품 영구 삭제하기
                </button>
              </div>
            </div>

            <!-- 하단 저장 버튼 -->
            <div class="p-3.5 bg-white border-t border-slate-200 flex gap-2">
              <button type="button" onclick="closeModalRoot()" class="px-4 py-3 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">
                취소
              </button>
              <button type="button" onclick="saveEditWorkDraft(true)"
                class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-extrabold shadow-md shadow-indigo-200">
                수정 내용 저장
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleEditDraftSource(src) {
      const list = editModalState.draft.sources || [];
      const idx = list.indexOf(src);
      if (idx > -1) {
        if (list.length > 1) list.splice(idx, 1);
      } else {
        list.push(src);
      }
      editModalState.draft.sources = list;
      renderEditWorkModal();
    }

    function toggleEditDraftMemo(memoId) {
      const list = editModalState.draft.memos || [];
      const idx = list.indexOf(memoId);
      if (idx > -1) list.splice(idx, 1);
      else list.push(memoId);
      editModalState.draft.memos = list;
      renderEditWorkModal();
    }

    function addEditDraftTag() {
      const inp = document.getElementById('edit-modal-tag-input');
      if (!inp) return;
      const val = inp.value.trim().replace(/^#/, '');
      if (!val) return;
      if (!appState.savedTags.includes(val)) appState.savedTags.unshift(val);
      toggleEditDraftTag(val, true);
      inp.value = '';
    }

    function toggleEditDraftTag(tag, forceAdd = false) {
      const list = editModalState.draft.tags || [];
      const idx = list.indexOf(tag);
      if (idx > -1) {
        if (!forceAdd) list.splice(idx, 1);
      } else {
        if (list.length >= 5) {
          showToast('태그는 최대 5개까지 선택 가능합니다.', '⚠️');
          return;
        }
        list.push(tag);
      }
      editModalState.draft.tags = list;
      renderEditWorkModal();
    }

    function saveEditWorkDraft(closeAfter = true) {
      const idx = appState.works.findIndex(w => w.id === editModalState.workId);
      if (idx === -1) return;
      const d = editModalState.draft;
      if (!d.title.trim()) {
        showToast('작품 제목은 비워둘 수 없습니다.', '⚠️');
        return;
      }

      // 임시등록 상태였던 작품이 장르 & 작가명이 모두 채워지면 조리실로 자동 이동!
      if (d.stage === 'temp' && d.genre && d.author && d.author.trim()) {
        d.stage = 'kitchen';
        showToast('라벨링이 완료되어 [조리실]로 이동되었습니다!', '🍳');
      } else if (closeAfter) {
        showToast('작품 정보가 수정되었습니다.', '✅');
      }

      appState.works[idx] = d;
      saveState();
      if (closeAfter) {
        closeModalRoot();
        renderCurrentTab();
      }
    }

    function confirmDeleteWork(workId) {
      const work = appState.works.find(w => w.id === workId);
      if (!work) return;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-[330px] w-full p-5 text-center shadow-2xl fade-in">
            <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl">🗑️</div>
            <h3 class="text-base font-extrabold text-slate-900 mb-1">작품을 삭제할까요?</h3>
            <p class="text-xs text-slate-500 mb-4 leading-relaxed">
              <strong class="text-slate-800">"${escapeHtml(work.title)}"</strong>의 모든 평가와 상세분석 데이터가 영구 삭제됩니다.
            </p>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="closeModalRoot()" class="py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">취소</button>
              <button onclick="executeDeleteWork('${workId}')" class="py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold shadow-sm">삭제하기</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeDeleteWork(workId) {
      appState.works = appState.works.filter(w => w.id !== workId);
      saveState();
      closeModalRoot();
      showToast('작품이 삭제되었습니다.', '🗑️');
      renderCurrentTab();
    }

    /*************************************************************************
     * [카테고리 6] 설거지 (조리 완료 달력 + 월별 통계 + 백업/복구 + 레시피분석 통계)
     *************************************************************************/
    function renderDishwashTab() {
      const year = appState.calendarYear;
      const month = appState.calendarMonth; // 0 ~ 11
      const firstDay = new Date(year, month, 1).getDay(); // 0(일) ~ 6(토)
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      let monthTotal = 0;
      let activeDays = 0;
      let maxDayCount = 0;

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const c = appState.dishwashHistory[key] || 0;
        monthTotal += c;
        if (c > 0) activeDays++;
        if (c > maxDayCount) maxDayCount = c;
      }

      const avgPerDay = activeDays > 0 ? (monthTotal / activeDays).toFixed(1) : '0.0';
      const todayStr = getTodayDateString();

      // 달력 셀 생성
      const calendarCells = [];
      for (let i = 0; i < firstDay; i++) {
        calendarCells.push(`<div class="h-12 rounded-xl bg-slate-50/40"></div>`);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const count = appState.dishwashHistory[dateKey] || 0;
        const isToday = dateKey === todayStr;
        calendarCells.push(`
          <div class="h-12 rounded-xl border flex flex-col items-center justify-between p-1 transition ${isToday ? 'border-indigo-500 bg-indigo-50/60' : count > 0 ? 'border-emerald-200 bg-emerald-50/60' : 'border-slate-100 bg-white'}">
            <span class="text-[10px] font-bold ${isToday ? 'text-indigo-700' : 'text-slate-500'}">${d}</span>
            ${count > 0 ? `
              <span class="px-1.5 py-0.2 rounded-full bg-emerald-600 text-white text-[10px] font-extrabold leading-tight">
                ${count}편
              </span>
            ` : `<span class="text-[10px] text-slate-200">-</span>`}
          </div>
        `);
      }

      return `
        <div class="space-y-4 fade-in">
          <!-- 1. 월별 조리 완료 통계 & 달력 카드 -->
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-extrabold text-slate-900">📅 조리 완료 트래커</h2>
              <div class="flex items-center gap-1.5">
                <button onclick="changeCalendarMonth(-1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">◀</button>
                <span class="text-xs font-extrabold text-slate-800 px-1">${year}년 ${month + 1}월</span>
                <button onclick="changeCalendarMonth(1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">▶</button>
              </div>
            </div>

            <!-- 월별 통계 요약 박스 -->
            <div class="grid grid-cols-3 gap-2 mb-3.5">
              <div class="p-2.5 rounded-xl bg-indigo-50/80 border border-indigo-100 text-center">
                <div class="text-[10px] font-bold text-indigo-600">월간 조리 완료</div>
                <div class="text-base font-extrabold text-indigo-900 mt-0.5">${monthTotal}편</div>
              </div>
              <div class="p-2.5 rounded-xl bg-emerald-50/80 border border-emerald-100 text-center">
                <div class="text-[10px] font-bold text-emerald-600">분석일 평균</div>
                <div class="text-base font-extrabold text-emerald-900 mt-0.5">${avgPerDay}편</div>
              </div>
              <div class="p-2.5 rounded-xl bg-amber-50/80 border border-amber-100 text-center">
                <div class="text-[10px] font-bold text-amber-600">일일 최고 기록</div>
                <div class="text-base font-extrabold text-amber-900 mt-0.5">${maxDayCount}편</div>
              </div>
            </div>

            <!-- 요일 헤더 -->
            <div class="grid grid-cols-7 gap-1 text-center mb-1">
              <span class="text-[10px] font-extrabold text-rose-500">일</span>
              <span class="text-[10px] font-bold text-slate-500">월</span>
              <span class="text-[10px] font-bold text-slate-500">화</span>
              <span class="text-[10px] font-bold text-slate-500">수</span>
              <span class="text-[10px] font-bold text-slate-500">목</span>
              <span class="text-[10px] font-bold text-slate-500">금</span>
              <span class="text-[10px] font-extrabold text-indigo-500">토</span>
            </div>

            <!-- 달력 그리드 -->
            <div class="grid grid-cols-7 gap-1">
              ${calendarCells.join('')}
            </div>
          </div>

          <!-- 2. [레시피분석] 트렌드 통계 섹션 -->
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-emerald-200/80">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-sm font-extrabold text-slate-900">🧪 레시피분석 (좋은소스 트렌드 통계)</h3>
                <p class="text-[11px] text-slate-500">메모에 [레시피분석]이 체크된 작품들의 상세정보 집계</p>
              </div>
              ${!appState.showRecipeAnalysis ? `
                <button type="button" onclick="appState.showRecipeAnalysis = true; renderCurrentTab();"
                  class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm transition shrink-0">
                  레시피분석
                </button>
              ` : ''}
            </div>

            ${appState.showRecipeAnalysis ? renderRecipeAnalysisStatsView() : ''}
          </div>

          <!-- 3. 데이터 백업 및 복구 -->
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-3">
            <div>
              <h3 class="text-sm font-extrabold text-slate-900">💾 데이터 백업 및 복구</h3>
              <p class="text-[11px] text-slate-500">모든 작품 평가, 상세분석, 달력 기록을 JSON 파일로 안전하게 보관하세요.</p>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" onclick="exportBackupJson()"
                class="py-3 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center gap-1.5 shadow-xs transition">
                <span>📤</span>
                <span>데이터 백업 (내보내기)</span>
              </button>
              <label class="py-3 px-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-extrabold flex items-center justify-center gap-1.5 cursor-pointer transition">
                <span>📥</span>
                <span>데이터 복구 (불러오기)</span>
                <input type="file" accept=".json" onchange="importBackupJson(event)" class="hidden" />
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function changeCalendarMonth(delta) {
      let m = appState.calendarMonth + delta;
      let y = appState.calendarYear;
      if (m < 0) {
        m = 11;
        y--;
      } else if (m > 11) {
        m = 0;
        y++;
      }
      appState.calendarMonth = m;
      appState.calendarYear = y;
      renderCurrentTab();
    }

    function renderRecipeAnalysisStatsView() {
      const recipeWorks = appState.works.filter(w => (w.memos || []).includes('레시피분석'));

      if (recipeWorks.length === 0) {
        return `
          <div class="mt-4 pt-4 border-t border-slate-100 text-center space-y-3">
            <p class="text-xs text-slate-500 py-4 bg-slate-50 rounded-xl">
              [레시피분석]이 체크된 작품이 아직 없습니다.<br/>조리실이나 팬트리에서 좋은소스 작품에 체크해 주세요!
            </p>
            <button type="button" onclick="appState.showRecipeAnalysis = false; renderCurrentTab();"
              class="w-full py-2.5 rounded-xl bg-slate-800 text-white text-xs font-extrabold">
              분석완료
            </button>
          </div>
        `;
      }

      // 11개 대분류별 세부 키워드/계열 빈도 집계
      const categoryStats = DETAIL_SCHEMA.map(cat => {
        const freqMap = {};
        recipeWorks.forEach(w => {
          if (!w.details) return;
          cat.subgroups.forEach(sg => {
            const entry = w.details[sg.id];
            if (!entry) return;
            if (entry.groupSelected) {
              const label = `[계열] ${sg.name}`;
              freqMap[label] = (freqMap[label] || 0) + 1;
            }
            if (Array.isArray(entry.items)) {
              entry.items.forEach(item => {
                freqMap[item] = (freqMap[item] || 0) + 1;
              });
            }
          });
        });
        const sorted = Object.entries(freqMap).sort((a, b) => b[1] - a[1]);
        return {
          catName: cat.name,
          entries: sorted
        };
      }).filter(c => c.entries.length > 0);

      return `
        <div class="mt-4 pt-4 border-t border-slate-200 space-y-4 fade-in">
          <div class="flex items-center justify-between bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-200">
            <span class="text-xs font-extrabold text-emerald-900">분석 대상 작품 수</span>
            <span class="text-xs font-extrabold text-emerald-700">총 ${recipeWorks.length}편</span>
          </div>

          ${categoryStats.length === 0 ? `
            <p class="text-xs text-slate-400 text-center py-4">레시피분석 작품들에 입력된 상세정보 항목이 없습니다.</p>
          ` : `
            <div class="space-y-3 max-h-96 overflow-y-auto thin-scrollbar pr-1">
              ${categoryStats.map(cs => {
                const maxVal = cs.entries[0][1] || 1;
                return `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/80">
                    <h4 class="text-xs font-extrabold text-indigo-800 mb-2">${cs.catName}</h4>
                    <div class="space-y-2">
                      ${cs.entries.map(([label, count]) => {
                        const pct = Math.round((count / recipeWorks.length) * 100);
                        const barWidth = Math.round((count / maxVal) * 100);
                        return `
                          <div>
                            <div class="flex justify-between text-[11px] font-bold mb-0.5">
                              <span class="text-slate-700 truncate pr-2">${escapeHtml(label)}</span>
                              <span class="text-emerald-700 shrink-0">${count}편 (${pct}%)</span>
                            </div>
                            <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                              <div style="width: ${barWidth}%" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 rounded-full"></div>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}

          <!-- [분석완료] 버튼 -->
          <button type="button" onclick="appState.showRecipeAnalysis = false; renderCurrentTab();"
            class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold shadow-md transition">
            분석완료 (통계 닫기)
          </button>
        </div>
      `;
    }

    function exportBackupJson() {
      const backupObj = {
        appName: '문피아 전략 노트',
        exportedAt: new Date().toISOString(),
        works: appState.works,
        savedTags: appState.savedTags,
        dishwashHistory: appState.dishwashHistory
      };
      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `문피아전략노트_백업_${getTodayDateString()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('백업 JSON 파일이 다운로드되었습니다!', '📤');
    }

    function importBackupJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed.works)) {
            throw new Error('올바른 백업 파일 형식이 아닙니다.');
          }
          appState.works = parsed.works;
          if (Array.isArray(parsed.savedTags)) appState.savedTags = parsed.savedTags;
          if (parsed.dishwashHistory && typeof parsed.dishwashHistory === 'object') {
            appState.dishwashHistory = parsed.dishwashHistory;
          }
          saveState();
          renderCurrentTab();
          showToast(`총 ${appState.works.length}편의 데이터가 성공적으로 복구되었습니다!`, '📥');
        } catch (err) {
          showToast('백업 파일 복구에 실패했습니다. 파일을 확인해 주세요.', '❌');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    /*************************************************************************
     * 앱 초기화
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderCurrentTab();
    });
  </script>
</body>
</html>
