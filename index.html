      }
      100% {

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function shiftDateKey(offsetDays) {
      const now = new Date();
      return formatDateKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetDays));
    }

    function normalizeTitle(str) {
      return String(str || '').replace(/[^가-힣a-zA-Z0-9]/g, '').toLowerCase().trim();
    }

    function isLabeled(work) {
      return Boolean(work && String(work.genre || '').trim() && String(work.author || '').trim());
    }

    function isTempRegistered(work) {
      return !isLabeled(work);
    }

    function hasCompletedCooking(work) {
      if (!work || !Array.isArray(work.badges) || !work.badges.includes('cooking')) return false;
      const c = work.cooking || {};
      return RECIPE_AXES.some((ax) => Array.isArray(c[ax.key]) && c[ax.key].length > 0);
    }

    function loadState() {

        const rawTags = localStorage.getItem(STORAGE_KEYS.TAG_POOL);
        const rawRecipes = localStorage.getItem(STORAGE_KEYS.SAVED_RECIPES);

        state.works = rawWorks ? JSON.parse(rawWorks) : createSeedWorks();
        state.tagPool = rawTags ? JSON.parse(rawTags) : [...DEFAULT_TAGS];
        state.savedRecipes = rawRecipes ? JSON.parse(rawRecipes) : [];
      } catch (err) {
        console.error('스토리지 로드 실패:', err);
        state.works = createSeedWorks();
        state.tagPool = [...DEFAULT_TAGS];
        state.savedRecipes = [];
      }

      syncRecipeFromCompletedWorks(true);
    }

        localStorage.setItem(STORAGE_KEYS.TAG_POOL, JSON.stringify(state.tagPool));
        localStorage.setItem(STORAGE_KEYS.SAVED_RECIPES, JSON.stringify(state.savedRecipes));
      } catch (err) {
        console.error('스토리지 저장 실패:', err);
        showToast('로컬 저장 중 오류가 발생했습니다.', 'error');
      }
    }

    // =========================================================================
    // 4. 유틸리티 (토스트, 클립보드, HTML 이스케이프)
    // =========================================================================
    function showToast(msg, variant = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-950 text-emerald-100 border-emerald-500',
        warning: 'bg-amber-950 text-amber-100 border-amber-400',
        error: 'bg-rose-950 text-rose-100 border-rose-500',
      };
      el.className = `pointer-events-auto border rounded-2xl px-3.5 py-2.5 text-xs font-bold shadow-xl animate-pop ${styles[variant] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 200);
      }, 2500);
    }

    function copyTextToClipboard(text, successMsg) {
      if (!text) return;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg || '클립보드에 복사되었습니다!', 'success');
      } catch (e) {
        showToast('복사에 실패했습니다.', 'error');
      } finally {
        ta.remove();
      }
    }

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    // 5. 요리하기 & 레시피분석 로직
    // =========================================================================
    function getCompletedCookingWorks() {
      return state.works.filter(hasCompletedCooking);
    }

    function pickRandomSubFromAxis(axisKey, excludeValue = '') {
      const tax = COOKING_TAXONOMY[axisKey];
      const allSubs = [];
      (tax?.groups || []).forEach((g) => {
        (g.subs || []).forEach((s) => allSubs.push(s));
      });
      if (!allSubs.length) return '미선택';
      const candidates = allSubs.filter((x) => x !== excludeValue);
      const pool = candidates.length ? candidates : allSubs;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function buildBaseComboFromWork(work) {
      const next = {};
      RECIPE_AXES.forEach((ax) => {
        const list = work?.cooking?.[ax.key] || [];
        const chosen = list.length ? list[Math.floor(Math.random() * list.length)] : '미선택';
        next[ax.key] = { value: chosen, mutated: false };
      });
      return next;
    }

    function syncRecipeFromCompletedWorks(resetCombo = false) {
      const completed = getCompletedCookingWorks();
      if (!completed.length) {
        state.recipeLab.selectedWorkId = null;
        return;
      }
      const exists = completed.some((w) => w.id === state.recipeLab.selectedWorkId);
      if (!exists) {
        state.recipeLab.selectedWorkId = completed[0].id;
        resetCombo = true;
      }
      const baseWork = completed.find((w) => w.id === state.recipeLab.selectedWorkId) || completed[0];
      if (resetCombo || !state.recipeLab.currentCombo.genre?.value) {
        state.recipeLab.currentCombo = buildBaseComboFromWork(baseWork);
      }
    }

    function mutateSelectedRecipeAxes() {
      const targets = state.recipeLab.selectedAxesToMutate;
      if (!targets.length) {
        showToast('변형할 항목을 1개 이상 선택해주세요.', 'warning');
        return;
      }
      targets.forEach((axisKey) => {
        const curVal = state.recipeLab.currentCombo[axisKey]?.value || '';
        const rolled = pickRandomSubFromAxis(axisKey, curVal);
        state.recipeLab.currentCombo[axisKey] = {
          value: rolled,
          mutated: true,
        };
      });
      showToast(`${targets.length}개 항목을 랜덤 변형했습니다!`, 'success');
    }

    function formatRecipeMemoText(baseWork) {
      const lines = [
        `[차기작 레시피 분석] 기준작: ${baseWork ? baseWork.title : '미지정'}`,
        ...RECIPE_AXES.map((ax) => {
          const item = state.recipeLab.currentCombo[ax.key] || { value: '미선택', mutated: false };
          return `- ${ax.label}: ${item.value}${item.mutated ? ' (랜덤 변형)' : ''}`;
        }),
      ];
      return lines.join('\n');
    }

            <button type="button" data-bucket="all" class="btn-select-bucket ${chipCls(cv.bucket === 'all')}">📚 전체 (${state.works.length})</button>
            <button type="button" data-bucket="temp" class="btn-select-bucket ${chipCls(cv.bucket === 'temp')}">📝 [임시등록] (${tempCount})</button>
            <button type="button" data-bucket="cooking" class="btn-select-bucket ${chipCls(cv.bucket === 'cooking')}">🍳 요리하기 (${cookingWorks.length})</button>

    // =========================================================================
    // 10. 탭 4: 메타·달력·백업 (메타데이터 그래프 & 슈퍼노멀 · 달력 · 백업/복구)
    // =========================================================================
    function renderInsightsTab() {
      const sub = state.insightsSubTab;

      const subBtn = (id, label) =>
        sub === id
          ? `<button type="button" data-insights-sub="${id}" class="btn-insights-sub flex-1 py-2 rounded-xl bg-brand-600 text-white text-xs font-extrabold cursor-pointer">${label}</button>`
          : `<button type="button" data-insights-sub="${id}" class="btn-insights-sub flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold cursor-pointer">${label}</button>`;

      let contentHtml = '';

      if (sub === 'metadata') {
        const cookingWorks = state.works.filter((w) => w.badges?.includes('cooking'));
        const basisPool = cookingWorks.length ? cookingWorks : state.works;

        const genreCounts = {};
        const tagCounts = {};
        basisPool.forEach((w) => {
          const g = w.genre || '미입력';
          genreCounts[g] = (genreCounts[g] || 0) + 1;
          (w.tags || []).forEach((t) => {
            tagCounts[t] = (tagCounts[t] || 0) + 1;
          });
        });

        const topGenres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]).slice(0, 6);
        const maxGenre = topGenres.length ? topGenres[0][1] : 1;
        const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 6);
        const maxTag = topTags.length ? topTags[0][1] : 1;

        // 슈퍼노멀(일반연재) 분석
        const superWorks = state.works.filter((w) => w.badges?.includes('supernormal'));
        const superRead16 = superWorks.filter((w) => w.rating === 'read_16_plus').length;
        const superGenres = {};
        const superTags = {};
        superWorks.forEach((w) => {
          if (w.genre) superGenres[w.genre] = (superGenres[w.genre] || 0) + 1;
          (w.tags || []).forEach((t) => { superTags[t] = (superTags[t] || 0) + 1; });
        });
        const topSuperG = Object.entries(superGenres).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const topSuperT = Object.entries(superTags).sort((a, b) => b[1] - a[1]).slice(0, 4);

        contentHtml = `
          <section class="bg-white rounded-3xl p-4 border border-slate-200/80 space-y-4 animate-pop">
            <div>
              <span class="text-[10px] font-extrabold text-brand-600 uppercase">TASTE METADATA</span>
              <h2 class="text-sm font-black text-slate-900">📈 요리하기 취향 메타데이터 그래프</h2>
              <p class="text-[11px] text-slate-500">
                ${cookingWorks.length ? `요리하기 ${cookingWorks.length}편 기준 분석` : `요리하기 작품이 없어 전체 ${basisPool.length}편 기준`}
              </p>
            </div>

            <div class="space-y-2">
              <div class="text-xs font-extrabold text-slate-800">선호 장르 빈도</div>
              ${topGenres.length ? topGenres.map(([g, cnt]) => {
                const pct = Math.max(14, Math.round((cnt / maxGenre) * 100));
                return `
                  <div class="space-y-1">
                    <div class="flex justify-between text-[11px]">
                      <span class="font-bold text-slate-700">${esc(g)}</span>
                      <span class="font-extrabold text-brand-700">${cnt}편</span>
                    </div>
                    <div class="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                      <div class="h-full rounded-full bg-brand-600" style="width:${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('') : `<p class="text-xs text-slate-400">장르 데이터가 없습니다.</p>`}
            </div>

            <div class="space-y-2 pt-2 border-t border-slate-100">
              <div class="text-xs font-extrabold text-slate-800">핵심 태그 빈도</div>
              ${topTags.length ? topTags.map(([t, cnt]) => {
                const pct = Math.max(14, Math.round((cnt / maxTag) * 100));
                return `
                  <div class="space-y-1">
                    <div class="flex justify-between text-[11px]">
                      <span class="font-bold text-slate-700">#${esc(t)}</span>
                      <span class="font-extrabold text-amber-700">${cnt}회</span>
                    </div>
                    <div class="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                      <div class="h-full rounded-full bg-amber-500" style="width:${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('') : `<p class="text-xs text-slate-400">태그 데이터가 없습니다.</p>`}
            </div>
          </section>

          <!-- 슈퍼노멀 (일반연재) 특징 분석 -->
          <section class="bg-white rounded-3xl p-4 border border-cyan-200 space-y-3 animate-pop">
            <div>
              <span class="text-[10px] font-extrabold text-cyan-700 uppercase">SUPERNORMAL ANALYSIS</span>
              <h3 class="text-sm font-black text-slate-900">📰 슈퍼노멀 (일반연재) 특징 분석</h3>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="p-3 rounded-2xl bg-cyan-50 border border-cyan-200">
                <div class="text-[10px] font-bold text-cyan-800">슈퍼노멀 편수</div>
                <div class="text-lg font-black text-slate-900 mt-0.5">${superWorks.length}편</div>
              </div>
              <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                <div class="text-[10px] font-bold text-emerald-800">16화+ 정독 비율</div>
                <div class="text-lg font-black text-slate-900 mt-0.5">
                  ${superWorks.length ? Math.round((superRead16 / superWorks.length) * 100) : 0}%
                </div>
              </div>
            </div>

            <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-1 text-xs text-slate-700">
              <div>· 주력 장르: <strong>${topSuperG.length ? topSuperG.map(([k, v]) => `${esc(k)}(${v})`).join(', ') : '없음'}</strong></div>
              <div>· 주요 태그: <strong>${topSuperT.length ? topSuperT.map(([k, v]) => `#${esc(k)}(${v})`).join(' ') : '없음'}</strong></div>
            </div>
          </section>
        `;
      } else if (sub === 'calendar') {
        const { year, month, selectedDate } = state.calendar;
        const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
        const monthWorks = state.works.filter((w) => (w.createdAt || '').startsWith(prefix));

        const srcBreakdown = { today_best: 0, new_best: 0, etc: 0 };
        const dayCounts = {};
        monthWorks.forEach((w) => {
          if (w.createdAt) dayCounts[w.createdAt] = (dayCounts[w.createdAt] || 0) + 1;
          (w.sources || []).forEach((s) => {
            if (srcBreakdown[s] !== undefined) srcBreakdown[s] += 1;
          });
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayKey = formatDateKey(new Date());
        const cells = [];

        for (let i = 0; i < firstDay; i++) {
          cells.push(`<div class="h-14 rounded-xl bg-slate-50/50"></div>`);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const cnt = dayCounts[key] || 0;
          const active = key === selectedDate;
          const isToday = key === todayKey;

          cells.push(`
            <button
              type="button"
              data-cal-date="${key}"
              class="btn-cal-date h-14 rounded-xl border p-1 flex flex-col items-center justify-between transition cursor-pointer ${
                active
                  ? 'bg-brand-600 text-white border-brand-600'
                  : cnt > 0
                    ? 'bg-blue-50/70 border-blue-200 text-slate-900'
                    : 'bg-white border-slate-100 text-slate-600'
              }"
            >
              <span class="text-[11px] font-bold ${isToday && !active ? 'text-brand-600 underline' : ''}">${d}</span>
              ${cnt > 0 ? `
                <span class="px-1.5 py-0.5 rounded-full text-[10px] font-black ${
                  active ? 'bg-amber-400 text-slate-950' : 'bg-brand-600 text-white'
                }">${cnt}편</span>
              ` : `
                <span class="text-[10px] ${active ? 'text-blue-200' : 'text-slate-300'}">-</span>
              `}
            </button>
          `);
        }

        const dayWorks = state.works.filter((w) => w.createdAt === selectedDate);

        contentHtml = `
          <section class="bg-white rounded-3xl p-4 border border-slate-200/80 space-y-3 animate-pop">
            <div class="flex items-center justify-between">
              <button type="button" id="btn-prev-month" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold cursor-pointer">◀ 이전</button>
              <div class="text-sm font-black text-slate-900">${year}년 ${month + 1}월 · ${monthWorks.length}편 등록</div>
              <button type="button" id="btn-next-month" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold cursor-pointer">다음 ▶</button>
            </div>

            <div class="grid grid-cols-3 gap-1.5 text-center text-[11px]">
              <div class="p-2 rounded-xl bg-blue-50 text-blue-900 font-bold">투데이 ${srcBreakdown.today_best}</div>
              <div class="p-2 rounded-xl bg-indigo-50 text-indigo-900 font-bold">신규베스트 ${srcBreakdown.new_best}</div>
              <div class="p-2 rounded-xl bg-slate-100 text-slate-700 font-bold">기타 ${srcBreakdown.etc}</div>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
              <span class="text-rose-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-500">토</span>
            </div>
            <div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
          </section>

          <section class="space-y-2.5">
            <div class="text-xs font-black text-slate-700 px-1">${selectedDate} 인풋 작품 (${dayWorks.length}편)</div>
            ${dayWorks.length
              ? dayWorks.map(renderWorkCard).join('')
              : `<div class="bg-white rounded-2xl p-5 text-center text-xs text-slate-400 border border-slate-200">선택한 날짜에 등록된 작품이 없습니다.</div>`
            }
          </section>
        `;
      } else {
        contentHtml = `
          <section class="bg-white rounded-3xl p-4 border border-slate-200/80 space-y-3 animate-pop">
            <div>
              <span class="text-[10px] font-extrabold text-brand-600 uppercase">BACKUP & RESTORE</span>
              <h2 class="text-sm font-black text-slate-900">💾 JSON 데이터 백업 및 복구</h2>
              <p class="text-[11px] text-slate-500">작품, 태그 풀, 보관 레시피를 JSON 파일 또는 텍스트로 백업/복구합니다.</p>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btn-export-backup" class="py-2.5 px-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold cursor-pointer">
                ⬇️ 백업 JSON 다운로드
              </button>
              <label for="file-import-backup" class="py-2.5 px-3 rounded-2xl bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 text-xs font-extrabold text-center cursor-pointer">
                ⬆️ 백업 파일 불러오기
              </label>
              <input id="file-import-backup" type="file" accept="application/json,.json" class="hidden" />
            </div>

            <textarea
              id="backup-json-box"
              rows="5"
              placeholder="백업 JSON 데이터가 여기에 표시됩니다. 복구할 JSON을 붙여넣어도 됩니다."
              class="w-full p-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-[11px] font-mono"
            ></textarea>

            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btn-import-overwrite" class="py-2.5 px-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold cursor-pointer">
                덮어쓰기 복구
              </button>
              <button type="button" id="btn-import-merge" class="py-2.5 px-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">
                기존 데이터와 병합
              </button>
            </div>

            <div class="pt-2 border-t border-slate-100 flex justify-end">
              <button type="button" id="btn-reset-samples" class="px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-[11px] font-extrabold cursor-pointer">
                샘플 데이터 초기화
              </button>
            </div>
          </section>
        `;
      }

      return `
        <div class="bg-white rounded-2xl p-1.5 border border-slate-200/80 grid grid-cols-3 gap-1">
          ${subBtn('metadata', '📈 메타·슈퍼노멀')}
          ${subBtn('calendar', '📅 달력·통계')}
          ${subBtn('backup', '💾 백업·복구')}
        </div>
        ${contentHtml}
      `;
    }

    // =========================================================================
    // 11. 수정 모달 (1·2·3단계 수정 + 요리하기 6대 영역 2단 계층 선택기)
    // =========================================================================
    function openEditModal(workId) {
      const work = state.works.find((w) => w.id === workId);
      if (!work) return;
      state.editingWorkId = workId;
      state.expandedMajorKey = null;
      renderEditModalContent();
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function renderEditModalContent() {
      const work = state.works.find((w) => w.id === state.editingWorkId);
      if (!work) return;

      const labeledNow = isLabeled(work);
      const cooking = work.cooking || createEmptyCooking();

      const panel = document.getElementById('edit-modal-panel');
      panel.innerHTML = `
        <div class="flex items-center justify-between pb-2.5 border-b border-slate-100">
          <div>
            <span class="text-[10px] font-extrabold text-brand-600">언제든 수정·삭제 가능</span>
            <h3 class="text-base font-black text-slate-900">작품 정보 & 요리하기 계층</h3>
          </div>
          <button type="button" id="btn-close-edit-modal" class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">
            ✕
          </button>
        </div>

        <form id="modal-edit-form" class="mt-3 space-y-3.5">
          <!-- 1단계 -->
          <div class="space-y-1.5">
            <div class="text-xs font-black text-slate-800">1단계 · 메뉴 선정 및 제목</div>
            <div class="grid grid-cols-3 gap-1.5">
              ${MENU_SOURCES.map((s) => {
                const checked = (work.sources || []).includes(s.id);
                return `
                  <label class="flex items-center justify-center gap-1 p-2 rounded-xl border text-[11px] font-bold cursor-pointer ${
                    checked ? 'bg-brand-50 border-brand-300 text-brand-900' : 'bg-slate-50 border-slate-200 text-slate-600'
                  }">
                    <input type="checkbox" name="mSources" value="${s.id}" ${checked ? 'checked' : ''} class="sr-only" />
                    <span>${checked ? '☑' : '☐'} ${s.label}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <input type="text" name="mTitle" value="${esc(work.title)}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold" />
          </div>

          <!-- 2단계 -->
          <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-slate-800">2단계 · 라벨링</span>
              <span class="text-[10px] font-bold ${labeledNow ? 'text-emerald-700' : 'text-rose-600'}">
                ${labeledNow ? '라벨 완료 → 3단계 가능' : '[임시등록] 상태'}
              </span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="mGenre" value="${esc(work.genre || '')}" placeholder="장르" class="px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs font-bold" />
              <input type="text" name="mAuthor" value="${esc(work.author || '')}" placeholder="작가명" class="px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs" />
            </div>
          </div>

          <!-- 3단계 -->
          <div class="p-3 rounded-2xl bg-brand-50/40 border border-brand-200/80 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-slate-800">3단계 · 조리실</span>
              <span class="text-[10px] font-bold text-slate-500">${labeledNow ? '평가 가능' : '라벨링 완료 후 반영'}</span>
            </div>

            <div>
              <div class="text-[10px] font-bold text-slate-600 mb-1">별점 (5가지 중 1개)</div>
              <div class="grid grid-cols-1 gap-1">
                ${RATING_OPTIONS.map((r) => `
                  <label class="flex items-center justify-between px-2.5 py-1.5 rounded-xl bg-white border text-xs font-bold cursor-pointer ${
                    work.rating === r.id ? 'border-brand-500 text-brand-900' : 'border-slate-200 text-slate-700'
                  }">
                    <span>${r.label}</span>
                    <input type="radio" name="mRating" value="${r.id}" ${work.rating === r.id ? 'checked' : ''} class="accent-brand-600" />
                  </label>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="text-[10px] font-bold text-slate-600 mb-1">추가 표시 (중복 선택 가능)</div>
              <div class="grid grid-cols-2 gap-1.5">
                ${EXTRA_BADGES.map((bdg) => {
                  const checked = (work.badges || []).includes(bdg.id);
                  return `
                    <label class="flex items-center gap-1.5 p-2 rounded-xl border text-[11px] font-extrabold cursor-pointer ${
                      checked ? bdg.cls : 'bg-white border-slate-200 text-slate-600'
                    }">
                      <input type="checkbox" name="mBadges" value="${bdg.id}" ${checked ? 'checked' : ''} class="sr-only" />
                      <span>${bdg.icon} ${checked ? '✓ ' : ''}${bdg.label}</span>
                    </label>
                  `;
                }).join('')}
              </div>
            </div>

            <div>
              <div class="text-[10px] font-bold text-slate-600 mb-1">태그 (최대 ~5개, 쉼표 구분)</div>
              <input type="text" name="mTags" value="${esc((work.tags || []).join(', '))}" placeholder="예: 회귀, 상태창, 영지경영" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs" />
            </div>
          </div>

          <!-- 요리하기 6대 영역 2단 계층 선택기 (선택 필수 아님, 중복 선택 가능) -->
          <div class="p-3 rounded-2xl bg-amber-50/70 border border-amber-300 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-amber-950">🍳 요리하기 세부 항목 선택 (선택형)</span>
              <span class="text-[10px] font-bold text-amber-800">대분류 → 세부 항목</span>
            </div>
            <p class="text-[10px] text-slate-600">큰 계열을 눌러 세부 항목을 펼친 뒤 중복 선택할 수 있습니다. 미선택 저장 가능.</p>

            ${RECIPE_AXES.map((ax) => {
              const tax = COOKING_TAXONOMY[ax.key];
              const pickedList = cooking[ax.key] || [];
              return `
                <div class="bg-white rounded-xl p-2.5 border border-amber-200/80 space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold text-slate-900">${tax.label}</span>
                    <span class="text-[10px] font-bold text-amber-800">${pickedList.length}개 선택</span>
                  </div>

                  ${pickedList.length ? `
                    <div class="flex flex-wrap gap-1">
                      ${pickedList.map((itemName) => `
                        <button
                          type="button"
                          data-cook-axis="${ax.key}"
                          data-cook-sub="${esc(itemName)}"
                          class="btn-toggle-cook-sub px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-extrabold cursor-pointer"
                        >
                          ${esc(itemName)} ✕
                        </button>
                      `).join('')}
                    </div>
                  ` : ''}

                  <div class="space-y-1 pt-0.5">
                    ${tax.groups.map((grp, idx) => {
                      const majorKey = `${ax.key}-${idx}`;
                      const isOpen = state.expandedMajorKey === majorKey;
                      const grpPicked = grp.subs.filter((s) => pickedList.includes(s)).length;
                      return `
                        <div class="rounded-lg border border-slate-100 overflow-hidden">
                          <button
                            type="button"
                            data-major-key="${majorKey}"
                            class="btn-toggle-major w-full px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-left text-[11px] font-bold text-slate-800 cursor-pointer"
                          >
                            <span class="truncate pr-2">${esc(grp.major)}</span>
                            <span class="shrink-0 text-[10px] text-amber-800 font-extrabold">
                              ${grpPicked ? `(${grpPicked}) ` : ''}${isOpen ? '▲' : '▼'}
                            </span>
                          </button>
                          ${isOpen ? `
                            <div class="p-2 bg-white flex flex-wrap gap-1 border-t border-slate-100 max-h-40 overflow-y-auto">
                              ${grp.subs.map((subName) => {
                                const isSel = pickedList.includes(subName);
                                return `
                                  <button
                                    type="button"
                                    data-cook-axis="${ax.key}"
                                    data-cook-sub="${esc(subName)}"
                                    class="btn-toggle-cook-sub px-2 py-1 rounded-lg border text-[10px] font-bold cursor-pointer ${
                                      isSel
                                        ? 'bg-amber-500 text-slate-950 border-amber-500 font-extrabold'
                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                    }"
                                  >
                                    ${isSel ? '✓ ' : ''}${esc(subName)}
                                  </button>
                                `;
                              }).join('')}
                            </div>
                          ` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex items-center gap-2 pt-1">
            <button type="button" id="btn-modal-delete" class="px-3.5 py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-extrabold cursor-pointer">
              삭제
            </button>
            <button type="submit" class="flex-1 py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-black cursor-pointer">
              저장하기
            </button>
          </div>
        </form>
      `;

      document.getElementById('btn-close-edit-modal')?.addEventListener('click', closeEditModal);

      document.getElementById('btn-modal-delete')?.addEventListener('click', () => {
        state.works = state.works.filter((w) => w.id !== work.id);
        persistState();
        syncRecipeFromCompletedWorks(true);
        closeEditModal();
        renderApp();
        showToast('작품이 삭제되었습니다.', 'info');
      });

      panel.querySelectorAll('input[name="mSources"], input[name="mBadges"], input[name="mRating"]').forEach((inp) => {
        inp.addEventListener('change', () => {
          collectModalFormIntoWork(work, false);
          renderEditModalContent();
        });
      });

      panel.querySelectorAll('.btn-toggle-major').forEach((btn) => {
        btn.addEventListener('click', () => {
          collectModalFormIntoWork(work, false);
          const key = btn.getAttribute('data-major-key');
          state.expandedMajorKey = state.expandedMajorKey === key ? null : key;
          renderEditModalContent();
        });
      });

      panel.querySelectorAll('.btn-toggle-cook-sub').forEach((btn) => {
        btn.addEventListener('click', () => {
          collectModalFormIntoWork(work, false);
          const axKey = btn.getAttribute('data-cook-axis');
          const subVal = btn.getAttribute('data-cook-sub');
          if (!work.cooking) work.cooking = createEmptyCooking();
          const curArr = work.cooking[axKey] || [];
          if (curArr.includes(subVal)) {
            work.cooking[axKey] = curArr.filter((x) => x !== subVal);
          } else {
            work.cooking[axKey] = [...curArr, subVal];
          }
          if (!work.badges.includes('cooking')) {
            work.badges = [...work.badges, 'cooking'];
          }
          renderEditModalContent();
        });
      });

      document.getElementById('modal-edit-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const valid = collectModalFormIntoWork(work, true);
        if (!valid) return;
        persistState();
        syncRecipeFromCompletedWorks(false);
        closeEditModal();
        renderApp();
        showToast('수정 내용이 저장되었습니다.', 'success');
      });
    }

    function collectModalFormIntoWork(work, checkDuplicate) {
      const formEl = document.getElementById('modal-edit-form');
      if (!formEl) return true;
      const fd = new FormData(formEl);

      const nextTitle = String(fd.get('mTitle') || '').trim();
      if (!nextTitle) {
        showToast('작품 제목을 입력해주세요.', 'error');
        return false;
      }

      if (checkDuplicate) {
        const dup = state.works.find(
          (other) => other.id !== work.id && normalizeTitle(other.title) === normalizeTitle(nextTitle)
        );
        if (dup) {
          showToast('이미 등록된 다른 작품과 제목이 중복됩니다.', 'warning');
          return false;
        }
      }

      const sources = fd.getAll('mSources').map(String);
      const badges = fd.getAll('mBadges').map(String);
      const rating = fd.get('mRating') ? String(fd.get('mRating')) : (work.rating || 'read_16_plus');
      const rawTags = String(fd.get('mTags') || '')
        .split(',')
        .map((t) => t.replace(/^#+/, '').trim())
        .filter(Boolean)
        .slice(0, 5);

      rawTags.forEach((t) => {
        if (!state.tagPool.includes(t)) state.tagPool.unshift(t);
      });

      work.title = nextTitle;
      work.sources = sources.length ? sources : ['today_best'];
      work.genre = String(fd.get('mGenre') || '').trim();
      work.author = String(fd.get('mAuthor') || '').trim();
      work.rating = rating;
      work.badges = badges;
      work.tags = rawTags;
      return true;
    }

    function closeEditModal() {
      state.editingWorkId = null;
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function openDuplicateModal(existingWork) {
      state.duplicateWorkId = existingWork.id;
      document.getElementById('duplicate-modal-text').textContent =
        `"${existingWork.title}" 작품은 이미 등록되어 있습니다. 기존 기록을 확인하거나 수정해보세요.`;
      document.getElementById('duplicate-modal').classList.remove('hidden');
    }

    function closeDuplicateModal() {
      state.duplicateWorkId = null;
      document.getElementById('duplicate-modal').classList.add('hidden');
    }

    // =========================================================================
    // 12. 렌더링 및 이벤트 바인딩
    // =========================================================================
    function syncRegisterInputs() {
      const t = document.getElementById('input-title');
      const g = document.getElementById('input-genre');
      const a = document.getElementById('input-author');
      const tagInp = document.getElementById('input-tag');

      if (t) state.form.title = t.value;
      if (g) state.form.genre = g.value;
      if (a) state.form.author = a.value;
      if (tagInp) state.form.tagInput = tagInp.value;
    }

    function bindDynamicEvents() {
      // 공통 제목 복사
      document.querySelectorAll('.btn-copy-title').forEach((btn) => {
        btn.addEventListener('click', () => {
          const title = btn.getAttribute('data-copy-title') || '';
          copyTextToClipboard(title, `"${title}" 제목이 복사되었습니다!`);
        });
      });

      // 공통 수정 모달 열기
      document.querySelectorAll('.btn-open-edit').forEach((btn) => {
        btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-edit-id')));
      });

      // 공통 삭제
      document.querySelectorAll('.btn-delete-work').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-id');
          state.works = state.works.filter((w) => w.id !== id);
          persistState();
          syncRecipeFromCompletedWorks(true);
          renderApp();
          showToast('작품이 삭제되었습니다.', 'info');
        });
      });

      // --- 등록·조리 탭 ---
      document.querySelectorAll('.btn-toggle-source').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncRegisterInputs();
          const sId = btn.getAttribute('data-source-id');
          const cur = state.form.sources;
          if (cur.includes(sId)) {
            if (cur.length > 1) {
              state.form.sources = cur.filter((x) => x !== sId);
            } else {
              showToast('최소 1개 출처를 선택해주세요.', 'warning');
              return;
            }
          } else {
            state.form.sources = [...cur, sId];
          }
          renderApp();
        });
      });

      document.getElementById('btn-toggle-quick-label')?.addEventListener('click', () => {
        syncRegisterInputs();
        state.form.quickLabelOpen = !state.form.quickLabelOpen;
        renderApp();
      });

      ['input-genre', 'input-author'].forEach((id) => {
        document.getElementById(id)?.addEventListener('input', () => {
          syncRegisterInputs();
          renderApp();
          const el = document.getElementById(id);
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        });
      });

      document.querySelectorAll('.btn-select-rating').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncRegisterInputs();
          state.form.rating = btn.getAttribute('data-rating-id');
          renderApp();
        });
      });

      document.querySelectorAll('.btn-toggle-badge').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncRegisterInputs();
          const bId = btn.getAttribute('data-badge-id');
          if (state.form.badges.includes(bId)) {
            state.form.badges = state.form.badges.filter((x) => x !== bId);
          } else {
            state.form.badges = [...state.form.badges, bId];
          }
          renderApp();
        });
      });

      document.getElementById('btn-add-tag')?.addEventListener('click', () => {
        syncRegisterInputs();
        const tag = state.form.tagInput.replace(/^#+/, '').trim();
        if (!tag) return;
        if (state.form.tags.length >= 5) {
          showToast('태그는 최대 5개까지 추가할 수 있습니다.', 'warning');
          return;
        }
        if (!state.form.tags.includes(tag)) {
          state.form.tags = [...state.form.tags, tag];
        }
        if (!state.tagPool.includes(tag)) {
          state.tagPool.unshift(tag);
        }
        state.form.tagInput = '';
        persistState();
        renderApp();
      });

      document.querySelectorAll('.btn-remove-tag').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncRegisterInputs();
          const rm = btn.getAttribute('data-remove-tag');
          state.form.tags = state.form.tags.filter((x) => x !== rm);
          renderApp();
        });
      });

      document.querySelectorAll('.btn-pool-tag').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncRegisterInputs();
          const pt = btn.getAttribute('data-pool-tag');
          if (state.form.tags.includes(pt)) {
            state.form.tags = state.form.tags.filter((x) => x !== pt);
          } else {
            if (state.form.tags.length >= 5) {
              showToast('태그는 최대 5개까지 선택할 수 있습니다.', 'warning');
              return;
            }
            state.form.tags = [...state.form.tags, pt];
          }
          renderApp();
        });
      });

      document.getElementById('btn-submit-work')?.addEventListener('click', () => {
        syncRegisterInputs();
        const title = state.form.title.trim();
        if (!title) {
          showToast('작품 제목을 입력해주세요.', 'error');
          return;
        }

        const dup = state.works.find((w) => normalizeTitle(w.title) === normalizeTitle(title));
        if (dup) {
          openDuplicateModal(dup);
          return;
        }

        const genre = state.form.genre.trim();
        const author = state.form.author.trim();
        const completedLabel = Boolean(genre && author);

        const newWork = {
          id: 'w-' + Date.now(),
          title,
          sources: [...state.form.sources],
          genre,
          author,
          rating: completedLabel ? state.form.rating : null,
          badges: completedLabel ? [...state.form.badges] : [],
          tags: completedLabel ? [...state.form.tags] : [],
          cooking: createEmptyCooking(),
          michelin: createEmptyMichelin(),
          createdAt: formatDateKey(new Date()),
        };

        state.works = [newWork, ...state.works];
        state.form.title = '';
        state.form.genre = '';
        state.form.author = '';
        state.form.badges = [];
        state.form.tags = [];
        state.form.tagInput = '';

        persistState();
        renderApp();

        if (!completedLabel) {
          showToast(`"${newWork.title}"이(가) [임시등록]으로 저장되었습니다.`, 'warning');
        } else {
          showToast(`"${newWork.title}" 등록 및 조리실 저장 완료!`, 'success');
        }
      });

      // --- 카테고리·미슐랭 탭 ---
      document.querySelectorAll('.btn-submode').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.categoryView.subMode = btn.getAttribute('data-submode');
          renderApp();
        });
      });

      document.getElementById('btn-jump-recipe-tab')?.addEventListener('click', () => {
        state.activeTab = 'recipe';
        renderApp();
      });

      document.getElementById('cat-search-input')?.addEventListener('input', (e) => {
        state.categoryView.query = e.target.value;
        renderApp();
        const el = document.getElementById('cat-search-input');
        if (el) {
          el.focus();
          el.setSelectionRange(el.value.length, el.value.length);
        }
      });

      document.querySelectorAll('.btn-select-bucket').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.categoryView.bucket = btn.getAttribute('data-bucket');
          renderApp();
        });
      });

      document.querySelectorAll('.btn-filter-rating').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.categoryView.ratingId = btn.getAttribute('data-filter-rating');
          renderApp();
        });
      });

      document.querySelectorAll('.btn-save-michelin').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wId = btn.getAttribute('data-save-michelin');
          const card = btn.closest('[data-michelin-card]');
          const work = state.works.find((w) => w.id === wId);
          if (!work || !card) return;

          const paidStatus = card.querySelector('.m-paid-status')?.value || '분석 전';
          const conversionValue = card.querySelector('.m-conversion-val')?.value ?? '';
          const freeFinalEpisode = card.querySelector('.m-free-final')?.value ?? '';

          work.michelin = {
            paidStatus,
            conversionValue: String(conversionValue).trim(),
            freeFinalEpisode: String(freeFinalEpisode).trim(),
          };
          persistState();
          renderApp();
          showToast(`"${work.title}" 미슐랭 지표가 저장되었습니다.`, 'success');
        });
      });

      // --- 요리하기·레시피 탭 ---
      document.getElementById('recipe-base-select')?.addEventListener('change', (e) => {
        state.recipeLab.selectedWorkId = e.target.value;
        syncRecipeFromCompletedWorks(true);
        renderApp();
      });

      document.querySelectorAll('.btn-toggle-mutate-axis').forEach((btn) => {
        btn.addEventListener('click', () => {
          const axKey = btn.getAttribute('data-toggle-mutate-axis');
          const list = state.recipeLab.selectedAxesToMutate;
          if (list.includes(axKey)) {
            state.recipeLab.selectedAxesToMutate = list.filter((x) => x !== axKey);
          } else {
            state.recipeLab.selectedAxesToMutate = [...list, axKey];
          }
          renderApp();
        });
      });

      document.querySelectorAll('.btn-single-reroll').forEach((btn) => {
        btn.addEventListener('click', () => {
          const axKey = btn.getAttribute('data-single-reroll');
          const curVal = state.recipeLab.currentCombo[axKey]?.value || '';
          state.recipeLab.currentCombo[axKey] = {
            value: pickRandomSubFromAxis(axKey, curVal),
            mutated: true,
          };
          renderApp();
          showToast('항목이 랜덤 변형되었습니다.', 'success');
        });
      });

      document.getElementById('btn-mutate-selected-axes')?.addEventListener('click', () => {
        mutateSelectedRecipeAxes();
        renderApp();
      });

      document.getElementById('btn-reset-recipe-original')?.addEventListener('click', () => {
        syncRecipeFromCompletedWorks(true);
        renderApp();
        showToast('기준 작품의 원본 항목으로 되돌렸습니다.', 'info');
      });

      document.getElementById('btn-copy-recipe-memo')?.addEventListener('click', () => {
        const completed = getCompletedCookingWorks();
        const baseWork = completed.find((w) => w.id === state.recipeLab.selectedWorkId) || completed[0];
        if (!baseWork) return;
        const text = formatRecipeMemoText(baseWork);
        state.recipeLab.lastCopiedText = text;
        copyTextToClipboard(text, '레시피 분석 내용이 메모장용으로 복사되었습니다!');
      });

      // --- 메타·달력·백업 탭 ---
      document.querySelectorAll('.btn-insights-sub').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.insightsSubTab = btn.getAttribute('data-insights-sub');
          renderApp();
        });
      });

      document.getElementById('btn-prev-month')?.addEventListener('click', () => {
        if (state.calendar.month === 0) {
          state.calendar.year -= 1;
          state.calendar.month = 11;
        } else {
          state.calendar.month -= 1;
        }
        renderApp();
      });

      document.getElementById('btn-next-month')?.addEventListener('click', () => {
        if (state.calendar.month === 11) {
          state.calendar.year += 1;
          state.calendar.month = 0;
        } else {
          state.calendar.month += 1;
        }
        renderApp();
      });

      document.querySelectorAll('.btn-cal-date').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.calendar.selectedDate = btn.getAttribute('data-cal-date');
          renderApp();
        });
      });

      document.getElementById('btn-export-backup')?.addEventListener('click', () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          works: state.works,
          tagPool: state.tagPool,
          savedRecipes: state.savedRecipes,
        };
        const jsonStr = JSON.stringify(payload, null, 2);
        const box = document.getElementById('backup-json-box');
        if (box) box.value = jsonStr;

        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `munpia-trend-backup-${formatDateKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('백업 JSON 파일이 생성되었습니다.', 'success');
      });

      document.getElementById('file-import-backup')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const box = document.getElementById('backup-json-box');
          if (box) box.value = String(reader.result || '');
          showToast('백업 파일을 불러왔습니다. 덮어쓰기 또는 병합을 선택하세요.', 'info');
        };
        reader.readAsText(file);
      });

      document.getElementById('btn-import-overwrite')?.addEventListener('click', () => restoreBackup('overwrite'));
      document.getElementById('btn-import-merge')?.addEventListener('click', () => restoreBackup('merge'));

      document.getElementById('btn-reset-samples')?.addEventListener('click', () => {
        state.works = createSeedWorks();
        state.tagPool = [...DEFAULT_TAGS];
        state.savedRecipes = [];
        persistState();
        syncRecipeFromCompletedWorks(true);
        renderApp();
        showToast('초기 샘플 데이터로 복원되었습니다.', 'info');
      });
    }

    function restoreBackup(mode) {
      const raw = String(document.getElementById('backup-json-box')?.value || '').trim();
      if (!raw) {
        showToast('복구할 JSON 데이터를 입력하거나 파일을 불러오세요.', 'warning');
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        const worksArr = Array.isArray(parsed) ? parsed : parsed.works;
        if (!Array.isArray(worksArr)) {
          throw new Error('유효한 works 배열이 없습니다.');
        }

        const tagsArr = Array.isArray(parsed.tagPool) ? parsed.tagPool : [];
        const recipesArr = Array.isArray(parsed.savedRecipes) ? parsed.savedRecipes : [];

        if (mode === 'overwrite') {
          state.works = worksArr;
          state.tagPool = [...new Set([...tagsArr, ...DEFAULT_TAGS])];
          state.savedRecipes = recipesArr;
        } else {
          const existingNorms = new Set(state.works.map((w) => normalizeTitle(w.title)));
          const newItems = worksArr.filter((w) => w.title && !existingNorms.has(normalizeTitle(w.title)));
          state.works = [...newItems, ...state.works];
          state.tagPool = [...new Set([...state.tagPool, ...tagsArr])];
          state.savedRecipes = [...recipesArr, ...state.savedRecipes];
        }

        persistState();
        syncRecipeFromCompletedWorks(true);
        renderApp();
        showToast(mode === 'overwrite' ? '덮어쓰기 복구가 완료되었습니다.' : '기존 데이터와 병합되었습니다.', 'success');
      } catch (err) {
        console.error('백구 복구 실패:', err);
        showToast('JSON 형식을 확인해주세요.', 'error');
      }
    }

    function renderApp() {
      renderHeaderAndNav();

      const main = document.getElementById('main-content');
      if (state.activeTab === 'register') {
        main.innerHTML = renderRegisterTab();
      } else if (state.activeTab === 'categories') {
        main.innerHTML = renderCategoriesAndMichelinTab();
      } else if (state.activeTab === 'recipe') {
        syncRecipeFromCompletedWorks(false);
        main.innerHTML = renderRecipeTab();
      } else if (state.activeTab === 'insights') {
        main.innerHTML = renderInsightsTab();
      }

      bindDynamicEvents();
    }

    // =========================================================================
    // 13. 정적 초기화
    // =========================================================================
    document.querySelectorAll('.nav-tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.getAttribute('data-tab');
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    document.getElementById('btn-quick-cooking')?.addEventListener('click', () => {
      state.activeTab = 'categories';
      state.categoryView.subMode = 'categories';
      state.categoryView.bucket = 'cooking';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('btn-dup-close')?.addEventListener('click', closeDuplicateModal);
    document.getElementById('btn-dup-go-edit')?.addEventListener('click', () => {
      const targetId = state.duplicateWorkId;
      closeDuplicateModal();
      if (targetId) openEditModal(targetId);
    });

    document.getElementById('duplicate-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'duplicate-modal') closeDuplicateModal();
    });

    document.getElementById('edit-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'edit-modal') closeEditModal();
    });

    loadState();
    renderApp();
  </script>
</body>
</html>
